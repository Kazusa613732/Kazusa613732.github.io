<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隨機練習卷 A（125題）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #00e5ff;
    --accent2: #ff6b6b;
    --success: #3fb950;
    --warn: #f78166;
    --text: #e6edf3;
    --muted: #7d8590;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    display: flex;
    gap: 0;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 120px;
    max-width: 600px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-resize {
    position: absolute;
    right: 0;
    top: 0;
    width: 5px;
    height: 100%;
    cursor: col-resize;
    background: transparent;
    z-index: 20;
    transition: background 0.15s;
  }
  #sidebar-resize:hover, #sidebar-resize.dragging {
    background: var(--accent);
    opacity: 0.5;
  }

  #sidebar-header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--border);
  }

  #reset-btn {
    margin: 8px 14px 0;
    padding: 6px 10px;
    width: calc(100% - 28px);
    background: transparent;
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: var(--radius);
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.15s, background 0.15s;
  }
  #reset-btn:hover { opacity: 1; background: rgba(255,80,80,0.08); }

  #sidebar-header h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  #sidebar-header p {
    font-size: 12px;
    color: var(--muted);
  }

  #wrong-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
  }

  #wrong-list::-webkit-scrollbar { width: 4px; }
  #wrong-list::-webkit-scrollbar-track { background: transparent; }
  #wrong-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .wrong-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }

  .wrong-item:hover { background: var(--surface2); }

  .wrong-item .qnum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    min-width: 50px;
  }

  .wrong-item .wrong-ans {
    font-size: 11px;
    color: var(--warn);
    font-family: 'JetBrains Mono', monospace;
  }

  .wrong-item .right-ans {
    font-size: 11px;
    color: var(--success);
    font-family: 'JetBrains Mono', monospace;
    margin-left: auto;
  }

  #empty-msg {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 30px 10px;
    line-height: 1.8;
  }

  #stats-bar {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  #stats-bar span { color: var(--text); }

  /* ── Main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 100vh;
  }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #topbar h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  #topbar h1 span { color: var(--accent); }

  #page-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  #progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.4s ease;
  }

  #quiz-area {
    flex: 1;
    padding: 32px 32px 20px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 24px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .question-card.answered { border-color: var(--border); }
  .question-card.correct { border-color: var(--success); }
  .question-card.wrong { border-color: var(--warn); }

  .q-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
    background: rgba(0,229,255,0.08);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(0,229,255,0.2);
  }

  .q-status-icon {
    margin-left: auto;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .question-card.correct .q-status-icon { opacity: 1; }
  .question-card.wrong .q-status-icon { opacity: 1; }

  .q-text {
    padding: 18px 20px 16px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
  }

  .options {
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    line-height: 1.5;
    user-select: text;
    -webkit-user-select: text;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.04);
    border-color: rgba(0,229,255,0.4);
    transform: translateX(2px);
  }

  .option-btn:disabled { cursor: default; }
  .option-btn.submitted-state { cursor: default; }

  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    min-width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: var(--border);
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option-btn.selected .opt-letter {
    background: rgba(0,229,255,0.2);
    color: var(--accent);
  }

  .option-btn.correct-ans .opt-letter {
    background: rgba(63,185,80,0.25);
    color: var(--success);
  }

  .option-btn.wrong-ans .opt-letter {
    background: rgba(247,129,102,0.25);
    color: var(--warn);
  }

  .option-btn.correct-ans {
    background: rgba(63,185,80,0.06);
    border-color: rgba(63,185,80,0.4);
  }

  .option-btn.wrong-ans {
    background: rgba(247,129,102,0.06);
    border-color: rgba(247,129,102,0.4);
  }

  .submit-row {
    padding: 0 16px 16px;
  }

  .submit-btn {
    padding: 9px 22px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .submit-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
  .submit-btn.submitted { background: var(--border); color: var(--muted); }

  .answer-reveal {
    margin: 0 16px 16px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    display: none;
    font-family: 'JetBrains Mono', monospace;
  }

  .answer-reveal.show { display: block; }
  .answer-reveal.ok { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
  .answer-reveal.no { background: rgba(247,129,102,0.1); color: var(--warn); border: 1px solid rgba(247,129,102,0.3); }

  /* ── Pagination ── */
  #pagination {
    padding: 24px 32px 40px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .page-btn {
    padding: 10px 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 1px;
  }

  .page-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .page-btn:disabled { opacity: 0.3; cursor: default; }

  #page-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }

  .page-dot {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-dot:hover { border-color: var(--accent); color: var(--accent); }
  .page-dot.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .page-dot.has-wrong { border-color: var(--warn); color: var(--warn); }
  .page-dot.active.has-wrong { background: var(--warn); color: #000; }
  .page-dot.all-correct { border-color: var(--success); color: var(--success); }
  .page-dot.active.all-correct { background: var(--success); color: #000; }

  /* scrollbar main */
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: transparent; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 700px) {
    #sidebar { display: none; }
    #quiz-area { padding: 16px; }
    #pagination { padding: 16px 16px 32px; }
    #topbar { padding: 12px 16px; }
    #page-dots { max-width: 260px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-resize"></div>
  <div id="sidebar-header">
    <h2>錯題紀錄</h2>

  </div>
  <button id="reset-btn" onclick="resetProgress()">🔄 重置所有進度</button>

    <div id="empty-msg">尚無錯題<br>繼續加油！✓</div>

    已答 <span id="stat-answered">0</span> / 125 &nbsp;|&nbsp; 正確 <span id="stat-correct">0</span>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <h1>CEH 312-50v13 &nbsp;<span>隨機練習卷 A（125題）</span></h1>
    <span id="page-info">第 1 頁 / 13 頁</span>
  </div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

    <button class="page-btn" id="btn-prev" onclick="changePage(-1)" disabled>← 上一頁</button>

  </div>
</div>

<script>
const QUESTIONS = [{"num": 333, "text": "Bob, a seasoned security analyst at XYZ Aerospace, was investigating a series of\nmisaligned transaction timestamps coming from one of the data archival\nsystems. Suspecting that the server might be syncing with an unstable time\nsource, Bob decided to extract a detailed list of all peer servers associated with\nthe target machine, including metrics such as delay, offset, and jitter, to\ndetermine whether the issue stemmed from time synchronization drift.\n\nWhich of the following commands should Bob use to retrieve this information?", "options": {"A": "ntptrace [-n] [-m maxhosts] [servername/IP_address]", "B": "ntpq -p [host]", "C": "ntpdc [-ilnps] [-c command] [host] [...]", "D": "ntpq [-inp] [-c command] [host] [...]"}, "answer": "B"}, {"num": 473, "text": "During an external assessment of a healthcare insurance company in Houston, a\npenetration tester identifies a service running on TCP port 389. When queried,\nthe service accepts anonymous binds and reveals directory data. By structuring\nhis search filter, the tester is able to obtain usernames, departmental details,\nand organizational units. This information could potentially be used for\ntargeted password attacks or privilege escalation.\n\nWhich classification best describes this enumeration activity?", "options": {"A": "NTP Enumeration", "B": "DNS Enumeration", "C": "LDAP Enumeration", "D": "SMTP Enumeration"}, "answer": "C"}, {"num": 248, "text": "As an IT technician in a small software development company, you are tasked\nwith providing security against different kinds of cyber threats. You learn about\nvarious methods hackers might use to bypass your company’s firewalls.\n\nWhich of the following is a common technique used by attackers to evade\nfirewall detection?", "options": {"A": "Using encrypted communication channels to evade network monitoring tools.", "B": "Implementing an open-source operating system to bypass proprietary software restrictions.", "C": "Utilizing social engineering techniques to trick employees into revealing sensitive\ninformation.", "D": "Changing the source IP address of packets to appear as if the traffic is coming from a\ntrusted source."}, "answer": "D"}, {"num": 334, "text": "During a quarterly security audit at a multinational logistics firm, network\nsecurity manager Priya initiates a scheduled vulnerability assessment across\nthe organization’s hybrid infrastructure. Her team begins by identifying all\nactive IT assets and assigning them risk scores based on business criticality. The\nfollowing week, they deploy scanning tools to detect security weaknesses,\nvalidate the findings manually, and classify vulnerabilities based on severity\nand exploitability.\nAfter coordinating with the IT operations team, they develop a structured\ntimeline to address the confirmed vulnerabilities, giving priority to high-risk\nfindings affecting mission-critical systems. Finally, after the vulnerabilities are\naddressed, Priya ensures that the affected systems are rescanned to confirm\nresolution and generates a compliance report for executive review.\n\nBased on this workflow, which phase of the Vulnerability-Management Life Cycle\nis Priya executing?", "options": {"A": "Remediation", "B": "Vulnerability Analysis", "C": "Verification", "D": "Risk Assessment"}, "answer": "A"}, {"num": 294, "text": "On July 25, 2025, during a penetration test at Horizon Financial Services in\nChicago, Illinois, cybersecurity specialist Laura Bennett is analyzing an attack\nsimulation targeting the company’s online banking portal. The system logs\nreveal a coordinated barrage of traffic from multiple compromised systems,\norchestrated through a central command-and-control server, flooding the\nportal and rendering it unavailable to legitimate users. The attack leverages a\nnetwork of infected devices, likely recruited via malicious links on social media.\n\nWhat is the structure or concept most likely used to launch this coordinated\nattack?", "options": {"A": "Smurf Attack", "B": "Distributed Reflection Denial-of-Service (DRDoS)", "C": "Botnet", "D": "Central Source Propagation"}, "answer": "C"}, {"num": 486, "text": "At a fast-growing startup in Austin, Texas, an ethical hacker is asked to simulate\nhow attackers might gather information to gain initial access. During the\nassessment, she poses as a recruiter on a professional networking site and\nconvinces several employees to share details about the company’s internal\nsoftware and VPN setup.\n\nWhich type of threat best represents this adversary’s method of information\ngathering?", "options": {"A": "Information Leakage", "B": "System and Network Attacks", "C": "Corporate Espionage", "D": "Social Engineering"}, "answer": "D"}, {"num": 129, "text": "During an internal security assessment of a medium-sized enterprise network, a\nsecurity analyst notices an unusual spike in ARP traffic. Closer inspection\nreveals that one particular MAC address is associated with multiple IP\naddresses across different subnets. The ARP packets were unsolicited replies\nrather than requests, and several employees from different departments have\nreported intermittent connection drops, failed logins, and broken intranet\nsessions. The analyst suspects an intentional interference on the local network\nsegment.\n\nWhat is the most likely cause of this abnormal behavior?", "options": {"A": "ARP poisoning causing routing inconsistencies", "B": "DHCP snooping improperly configured", "C": "Port security restricting all outbound MAC responses", "D": "Legitimate ARP table refresh on all clients"}, "answer": "A"}, {"num": 404, "text": "You are an ethical hacker at Apex Cyber Defense contracted to audit Coastal\nHealthcare’s wireless estate in Miami, Florida. During a network sweep, your\nlogs show a previously unknown access point physically connected to the\nhospital’s internal switch and issuing IP addresses to devices on the corporate\nVLAN – it was neither provisioned by IT nor listed in the asset inventory. The\ndevice is relaying internal traffic and providing remote connectivity back to an\nexternal host. Based on the observed behavior, which wireless threat has the\nattacker most likely introduced?", "options": {"A": "Misconfigured AP", "B": "Honeypot AP", "C": "Rogue AP", "D": "Evil Twin AP"}, "answer": "C"}, {"num": 441, "text": "During a penetration test at Cascade Biotech in Portland, Oregon, ethical hacker\nOlivia Harper installs a monitoring agent on a single test workstation inside the\nresearch subnet. The system records local events such as file access,\nconfiguration changes, and unauthorized process execution. Olivia explains to\nthe security team that attackers often attempt to disable or evade this type of\nmonitoring to avoid being detected at the host level.\n\nWhich security system is Olivia most likely demonstrating?", "options": {"A": "Network-Based Intrusion Detection System", "B": "Network-Based Firewall", "C": "Host-Based Intrusion Detection System", "D": "Host-Based Firewall"}, "answer": "C"}, {"num": 209, "text": "A penetration tester evaluates a company’s secure web application, which uses\nHTTPS, secure cookie flags, and strict session management to prevent session\nhijacking.\n\nTo bypass these protections and hijack a legitimate user’s session without\ndetection, which advanced technique should the tester employ?", "options": {"A": "Utilize a session fixation attack by forcing a known session ID during login", "B": "Implement a Man-in-the-Middle (MitM) attack by compromising a trusted certificate\nauthority", "C": "Exploit a timing side-channel vulnerability to predict session tokens", "D": "Perform a Cross-Site Scripting (XSS) attack to steal the session token"}, "answer": "D"}, {"num": 317, "text": "At RedCore Motors, the IT security lead, Priya, is tasked with selecting a\nvulnerability management solution for their expanding hybrid infrastructure.\nDuring the evaluation, she prioritizes tools that support agent-based detection\nacross endpoints, offer constant monitoring and alerting capabilities, and\nprovide comprehensive visibility into both on-premises and cloud-based\nsystems.\n\nAfter thorough testing, she selects a platform that promises to scan for\nvulnerabilities everywhere accurately and efficiently, aligning with her\norganization’s need for centralized visibility and real-time risk assessment.\n\nWhich vulnerability assessment tool did Priya MOST LIKELY select?", "options": {"A": "Nessus", "B": "Nikto", "C": "Qualys VM", "D": "OpenVAS"}, "answer": "C"}, {"num": 378, "text": "During a red team engagement at a healthcare provider in Miami, ethical hacker\nRachel suspects that a compromised workstation is running a sniffer in\npromiscuous mode. To confirm her suspicion, she sends specially crafted ICMP\npackets with a mismatched MAC address but a correct IP destination. Minutes\nlater, the suspected machine responds to the probe even though ordinary\nsystems would ignore it.\n\nWhich detection technique is Rachel most likely using to validate the presence\nof a sniffer?", "options": {"A": "DNS Method", "B": "Nmap sniffer-detect (NSE)", "C": "Ping Method", "D": "ARP Method"}, "answer": "C"}, {"num": 480, "text": "At a power distribution facility in Phoenix, Arizona, ethical hacker Sameer Das is\nperforming an OT security assessment. He demonstrates that a programmable\ncontroller accepts modifications delivered over the network without checking\nthe origin or cryptographic validity of the package. By uploading altered\ninstructions, he changes how the controller processes commands during\noperations. Which IoT/OT threat best represents this technique?", "options": {"A": "Remote access using backdoor", "B": "Firmware update attack", "C": "Exploit kits", "D": "Forged malicious device"}, "answer": "B"}, {"num": 298, "text": "During a cybersecurity awareness drill at Quantum Analytics in San Francisco,\nCalifornia, the ethical hacking team tests the company’s defenses against social\nmedia-based threats. Nadia creates a fake LinkedIn profile posing as a senior\nHR manager from Quantum Analytics, using a stolen company logo and publicly\navailable employee details. Nadia sends connection requests to several\nemployees, including data analyst Priya Sharma, inviting them to join a private\ngroup called “Quantum Analytics Innovation Hub.” The group’s page prompts\nmembers to share their work email and department role for “exclusive project\nupdates.”\n\nWhat social engineering threat to corporate networks is Nadia’s exercise\nprimarily simulating?", "options": {"A": "Loss of Productivity", "B": "Involuntary Data Leakage", "C": "Spam and Phishing", "D": "Network Vulnerability Exploitation"}, "answer": "B"}, {"num": 454, "text": "You are Alex, a forensic responder at HarborHealth in Seattle, Washington.\nDuring a live incident response you must secure an enterprise Windows server’s\nsystem partition and attached data volumes without rebooting user machines\nor disrupting domain authentication. The IT team prefers a solution that\nintegrates with Windows platform features (including hardware-backed startup\nprotection and centralized key escrow via Active Directory/management\npolicies) and provides transparent full-disk protection for the OS volume. Which\ndisk-encryption solution should you deploy?", "options": {"A": "FileVault", "B": "VeraCrypt", "C": "BitLocker Drive Encryption", "D": "Rohos Disk Encryption"}, "answer": "C"}, {"num": 66, "text": "A major financial institution is experiencing persistent Denial-of-Service (DoS\nattacks targeting its online banking services, causing significant disruption to\ncustomer transactions and eroding trust in the institution. The security team is\nunder immense pressure to identify and mitigate the sophisticated tactics\nemployed by the attackers to ensure uninterrupted access to banking services.\n\nConsidering the scenario described, which sophisticated Denial-of-Service (DoS\ntechnique, resembling a scenario-based attack, poses the greatest challenge for\nthe security team to detect and mitigate effectively, potentially jeopardizing the\navailability of online banking services?", "options": {"A": "A synchronized Layer 3 Smurf attack targeting the institution's internet-facing routers,\nflooding their interfaces with ICMP echo requests to exhaust bandwidth and disrupt network\nconnectivity.", "B": "A coordinated UDP flood attack exploiting vulnerabilities in the institution’s DNS\ninfrastructure, flooding authoritative DNS servers to disrupt domain resolution services.", "C": "A distributed SQL injection attack targeting the institution’s online banking database servers,\ncausing resource exhaustion and database downtime.", "D": "A zero-day exploit targeting the institution’s web server software, causing buffer overflow\nand service unavailability through remote code execution."}, "answer": "D"}, {"num": 188, "text": "A penetration tester has completed a vulnerability scan on a company’s internal\nnetwork. The scan reveals multiple low-risk vulnerabilities, but one high-risk\nvulnerability is associated with outdated server software.\n\nWhat should the tester prioritize as the next step?", "options": {"A": "Perform a brute-force attack on the server to gain access", "B": "Focus on exploiting the low-risk vulnerabilities first", "C": "Verify if the high-risk vulnerability is exploitable by checking for known exploits", "D": "Ignore the high-risk vulnerability and proceed with testing other systems"}, "answer": "C"}, {"num": 283, "text": "In Boston, Massachusetts, network administrator Daniel Carter is monitoring the\nIT infrastructure of New England Insurance, a prominent firm, after receiving\nalerts about sluggish system performance. While reviewing traffic patterns,\nDaniel observes an unusual volume of concurrent requests overwhelming\ncritical servers. To validate his suspicion of a session hijacking attempt, he\nbegins capturing and reviewing live network traffic to identify unauthorized\nsession behaviors before escalating to the security team.\n\nWhat detection method should Daniel use to confirm the session hijacking\nattack in this scenario?", "options": {"A": "Use an intrusion detection system (IDS)", "B": "Check for predictable session tokens", "C": "Monitor for ACK storms", "D": "Perform manual packet analysis using packet sniffing tools"}, "answer": "D"}, {"num": 273, "text": "In a high-stakes cybersecurity exercise in Boston, Emily, an ethical hacker, is\ntasked with tracing a mock phishing email sent to a healthcare provider’s staff.\nUsing the email header, she identifies a series of IP addresses and server\ndetails, including multiple timestamps and server names. Her objective is to\npinpoint the exact moment the email was processed by the sender’s system. As\npart of her reconnaissance, what specific detail from the email header should\nEmily examine to determine this information?", "options": {"A": "Date and time of message sent", "B": "Sender’s mail server", "C": "Date and time received by the originator’s email servers", "D": "Authentication system used by sender’s mail server"}, "answer": "C"}, {"num": 191, "text": "A penetration tester suspects that a web application’s user profile page is\nvulnerable to SQL injection, as it uses the userID parameter in SQL queries\nwithout proper sanitization.\n\nWhich technique should the tester use to confirm the vulnerability?", "options": {"A": "Attempt a directory traversal attack using the userID parameter", "B": "Modify the userID parameter in the URL to ‘ OR ‘1’=’1 and check if it returns multiple profiles", "C": "Inject HTML code into the userID parameter to test for Cross-Site Scripting (XSS)", "D": "Use the userID parameter to perform a brute-force attack on the admin login page"}, "answer": "B"}, {"num": 493, "text": "During a red team exercise at a financial institution in New York, penetration\ntester Bob investigates irregularities in time synchronization across critical\nservers. While probing one server, he decides to use a diagnostic command that\nallows him to directly interact with the NTP daemon and query its internal state.\nThis command enables him to perform monitoring and retrieve statistics, but it\nis primarily focused on controlling and checking the operation of the NTP\nservice rather than listing peers with delay, offset, and jitter values.\n\nWhich command should Bob use to accomplish this?", "options": {"A": "ntptrace [-n] [-m maxhosts] [servername/IP_address]", "B": "ntpq [-inp] [-c command] [host] [...]", "C": "ntpdc [-ilnps] [-c command] [host] [...]", "D": "ntpq -p [host]"}, "answer": "C"}, {"num": 81, "text": "A senior executive receives a personalized email with a subject line that reads\n“Annual Performance Review 2024”. The email contains a downloadable PDF that\ninstalls a backdoor when opened. The email appears to come from the CEO and\nincludes company branding.\n\nWhich phishing method does this best illustrate?", "options": {"A": "Pharming using DNS poisoning", "B": "Email clone attack with altered attachments", "C": "Broad phishing sent to all employees", "D": "Whaling attack aimed at high-ranking personnel"}, "answer": "D"}, {"num": 322, "text": "Michael, an ethical hacker at a San Francisco-based fintech startup, is\nconducting a security assessment of the company’s cloud-based payment\nprocessing platform, which uses Kubernetes, an open-source system for\nautomating the deployment, scaling, and management of containerized\napplications. During his review, Michael identifies a feature that automatically\nreplaces and reschedules containers from failed nodes to ensure high\navailability of services – a critical requirement for uninterrupted payment\noperations. Based on his study of cloud container technology principles, which\nKubernetes feature should Michael highlight as responsible for this capability?\n\nWhich Kubernetes feature should Michael highlight to ensure automatic\nrestarting of failed containers for the payment processing platform?", "options": {"A": "Container vulnerabilities", "B": "Kube-controller-manager", "C": "Container orchestration", "D": "Self-healing"}, "answer": "D"}, {"num": 128, "text": "A penetration tester is assessing a web application that uses dynamic SQL\nqueries for searching users in the database. The tester suspects the search\ninput field is vulnerable to SQL injection.\n\nWhat is the best approach to confirm this vulnerability?", "options": {"A": "Use a directory traversal attack to access server configuration files", "B": "Inject JavaScript into the search field to test for Cross-Site Scripting (XSS)", "C": "Perform a brute-force attack on the user login page to guess weak passwords", "D": "Input ‘; DROP TABLE users; -- into the search field to test if the database query can be\naltered"}, "answer": "D"}, {"num": 20, "text": "As the newly appointed head of IT security at a growing startup, you have been\ntasked with improving the company’s security posture. Given the rise in social\nengineering attacks, you decide to set up training sessions for employees to\nhelp them identify these threats. During a session, you ask the team to identify\nthe type of social engineering attack where an attacker impersonates a co-\nworker or an authority figure to extract confidential information.\n\nWhich option correctly identifies this type of attack?", "options": {"A": "Baiting", "B": "Phishing", "C": "Quid pro quo", "D": "Pretexting"}, "answer": "D"}, {"num": 319, "text": "In the hushed offices of Pinecrest Solutions in Denver, network security analyst\nLisa Nguyen began a covert review of a recent spike in network access issues\nreported by the sales team. The trouble surfaced during a low-traffic period\nwhen agents couldn’t reach their CRM system, prompting Lisa to examine the\nsubnet logs. She spotted irregular IP assignment attempts linked to an\nunfamiliar device. Acting quickly, Lisa entered a series of commands on the\nCisco switches and later confirmed that connectivity issues had ceased without\nany new devices appearing in the logs.\n\nWhich command did Lisa most likely use to address the issue?", "options": {"A": "Switch(config)# ip dhcp snooping vlan 10", "B": "Switch(config)# ip arp inspection vlan 10", "C": "Switch(config)# ip dhcp snooping", "D": "Switch(config-if)# switchport port-security"}, "answer": "A"}, {"num": 360, "text": "In the bustling tech hub of Boston, Massachusetts, ethical hacker Zara Nguyen\ndives into the digital fortifications of CloudCrafter, a US-based platform hosting\nweb applications for small businesses. Tasked with probing the application’s\ninput processing, Zara submits specially crafted inputs to a server\nadministration panel. Her tests uncover a severe vulnerability: the system\nperforms unintended operations at the system level, enabling access to\nrestricted server resources. Further scrutiny reveals the flaw lies in the\napplication’s failure to sanitize user input passed to system-level execution, not\nin altering directory service queries, injecting newline characters, or targeting\nshell-specific environments. Dedicated to strengthening the platform, Zara\ndrafts a precise report to guide CloudCrafter’s security team toward urgent fixes.\n\nWhich injection attack type is Zara most likely exploiting in CloudCrafter’s web\napplication?", "options": {"A": "Shell Injection", "B": "CRLF Injection", "C": "LDAP Injection", "D": "Command Injection"}, "answer": "D"}, {"num": 308, "text": "You are an ethical hacker at SecureNet Solutions, conducting a penetration test\nfor BlueRidge Manufacturing in Denver, Colorado. While auditing their wireless\nnetwork, you observe that the access point uses a security protocol that\nemploys the RC4 algorithm with a 24-bit initialization vector (IV) to encrypt data\nbetween network clients. Based on the observed encryption characteristics,\nwhich wireless encryption protocol is the access point using?", "options": {"A": "WPA", "B": "WPA2", "C": "WEP", "D": "WPA3"}, "answer": "C"}, {"num": 444, "text": "A financial institution in San Francisco suffers a breach where attackers install\nmalware that captures customer account credentials. The stolen data is then\nsold on underground forums for profit. No political or social statements are\nmade, and the attackers remain anonymous while continuing to target similar\norganizations for financial gain. Based on this activity, what category of hacker\nis most likely responsible?", "options": {"A": "Black Hat hackers", "B": "Hacktivists", "C": "Script Kiddies", "D": "White Hat hackers"}, "answer": "A"}, {"num": 452, "text": "During a simulated attack against a university’s IT network in California, ethical\nhacker Sophia deploys custom malicious code onto one lab workstation.\nWithout requiring further user interaction, she observes the malware\nautomatically copying itself into shared folders and spreading through weak\nadmin credentials. Within a short time, dozens of computers across multiple\ndepartments are infected with the same payload, even though only one\nmachine was initially targeted. Which type of malware is Sophia most likely\ndemonstrating?", "options": {"A": "Logic Bomb", "B": "Worm", "C": "Backdoor", "D": "Fileless Malware"}, "answer": "B"}, {"num": 271, "text": "During a security compliance audit at Nexus Tech Solutions in Boston,\nMassachusetts, the ethical hacking team launches a controlled social\nengineering exercise to assess help desk vulnerabilities. Ethical hacker Rachel\nKim calls the company’s help desk, posing as a stressed employee named Laura\nBennett from the marketing department. Rachel claims her laptop is running\nslowly and offers to share her login credentials if the help desk can provide a\nquick fix to meet a tight project deadline. The call is designed to test whether\nhelp desk staff follow proper verification protocols or fall for the offer of\ncredentials in exchange for assistance.\n\nWhat social engineering technique is Rachel employing in this exercise?", "options": {"A": "Shoulder Surfing", "B": "Vishing", "C": "Impersonation", "D": "Quid Pro Quo"}, "answer": "D"}, {"num": 166, "text": "During a comprehensive internal penetration test, a tester attempts to\nenumerate open services using a UDP scan across a wide range of ports on a\ntarget system. After transmitting multiple UDP probes, the tester observes that\nsome ports generate immediate ICMP “Destination Unreachable – Port\nUnreachable” (Type 3, Code 3 responses. However, the majority of the ports\nremain silent, providing no reply or error message. No firewall rules or IDS\nalerts have been triggered at this stage. The tester suspects that the scan\nresults are inconclusive for several of the probed ports.\n\nBased on the observed behavior, what can the tester reasonably conclude\nabout the non-responsive ports?", "options": {"A": "The system blocked all probes after rate-limiting was detected.", "B": "They may be open or filtered, requiring retransmission.", "C": "The ports are likely closed because no ICMP response was received.", "D": "They may correspond to some services requiring three-way handshakes."}, "answer": "B"}, {"num": 58, "text": "A corporation has transitioned to a public cloud service. The security team\nfound a critical flaw in the API of the cloud service provider.\n\nWhat is the potential threat they are most likely to face?", "options": {"A": "DDoS attack on cloud servers", "B": "Compromise of encrypted data at rest", "C": "Unauthorized access to cloud resources", "D": "Vulnerability to physical security breaches"}, "answer": "C"}, {"num": 435, "text": "During a penetration test for a U.S.-based retail company, John gains access to a\nsecondary server that responds unusually to structured queries. By sending a\nspecially crafted request, he receives a full list of subdomains, MX records, and\naliases belonging to the target organization. The response exposes sensitive\ninternal mappings that could be leveraged for further attacks.\n\nWhich tool was MOST likely used to perform this enumeration?", "options": {"A": "dig @ axfr", "B": "nbtstat -A", "C": "ldapsearch -h -x", "D": "smtp-user-enum.pl -u user -t host"}, "answer": "A"}, {"num": 489, "text": "During a forensic investigation of an attack on a media company in New York,\nanalysts discovered that a non-privileged process loaded a malicious library\ninstead of the intended library because the attacker placed the rogue file in a\ndirectory Windows searched before the legitimate location. When the trusted\napplication started, the attacker’s code executed with the application’s\nprivileges. No registry changes or kernel exploits were involved. Which\ntechnique most likely enabled the privilege escalation?", "options": {"A": "Privilege Escalation by Exploiting Vulnerabilities", "B": "Privilege Escalation Using DLL Hijacking", "C": "Privilege Escalation by Bypassing User Account Control", "D": "Access Token Manipulation"}, "answer": "B"}, {"num": 477, "text": "During a red team exercise at Orion Tech Systems in San Jose, ethical hacker\nNadia creates a campaign of fraudulent messages targeting employees. She\nuses compromised social media accounts to distribute bulk invitations that\ncontain links to a fake cloud collaboration site. Several employees click the\nlinks and are prompted to log in with their corporate credentials, which Nadia\ncaptures. Although the lure appears to be a professional networking\nopportunity, the tactic relies on unsolicited deceptive messages delivered at\nscale.\n\nWhich social engineering threat is Nadia simulating in this campaign?", "options": {"A": "Angler Phishing", "B": "Spam and Phishing", "C": "Catfishing", "D": "Involuntary Data Leakage"}, "answer": "B"}, {"num": 277, "text": "Joe, a cybersecurity analyst at XYZ-FinTech, has been assigned to perform a\nquarterly vulnerability assessment across the organization’s Windows-based\nservers and employee workstations. His objective is to detect issues such as\nsoftware configuration errors, incorrect registry or file permissions, native\nconfiguration table problems, and other system-level misconfigurations. He is\ninstructed to log into each system using valid credentials to ensure\ncomprehensive data collection. Based on this assignment, which type of\nvulnerability scanning should Joe perform?", "options": {"A": "External Scanning", "B": "Application Scanning", "C": "Host-based Scanning", "D": "Network-based Scanning"}, "answer": "C"}, {"num": 326, "text": "In the heart of Silicon Valley, ethical hacker Sophia Nguyen is hired by InnoVate\nSolutions, a San Francisco-based startup, to secure their cloud-based task\nmanagement platform. On March 15, 2025, Sophia begins testing a feature that\nallows users to upload custom workflow templates to streamline project\nassignments. By carefully crafting a template file, she manipulates the\nplatform’s data processing, triggering unexpected behavior that grants her\nadministrative access to restricted project dashboards. The issue arises from\nthe platform’s handling of user-supplied data during object reconstruction, not\nfrom database queries, client-side code execution, or session manipulation.\nSophia documents her findings to help InnoVate’s developers strengthen their\napplication.\n\nWhich web application vulnerability is Sophia most likely exploiting in InnoVate\nSolutions’ task management platform?", "options": {"A": "Session Hijacking", "B": "Local File Inclusion", "C": "Verbose Error Messages", "D": "Insecure Deserialization"}, "answer": "D"}, {"num": 183, "text": "A security analyst is tasked with gathering detailed information about an\norganization’s network infrastructure without making any direct contact that\ncould be logged or trigger alarms.\n\nWhich method should the analyst use to obtain this information covertly?", "options": {"A": "Initiate social engineering attacks to elicit information from employees", "B": "Perform a DNS brute-force attack to discover subdomains", "C": "Use network mapping tools to scan the organization’s IP range", "D": "Examine leaked documents or data dumps related to the organization"}, "answer": "D"}, {"num": 105, "text": "A multinational corporation recently survived a severe Distributed Denial-of-\nService (DDoS attack, which caused significant downtime and resulted in\nsubstantial financial losses. After implementing enhanced security measures,\nthe company contracted you as a cybersecurity consultant to assess their new\ninfrastructure. During the audit, you discovered that the organization uses both\nhardware and cloud-based solutions to distribute incoming traffic. The primary\npurpose of these solutions is to absorb and mitigate the effects of a DDoS\nattack, ensuring that legitimate requests are not affected during such an event.\n\nWhat type of DDoS mitigation strategy is the company utilizing?", "options": {"A": "Sinkholing: This technique reroutes traffic to a “sinkhole”, a designated IP address where\ntraffic can be analyzed. However, this doesn’t align with the company’s strategy of distributing\nincoming traffic.", "B": "Black Hole Routing: This approach directs all traffic into a non-existent interface (the “black\nhole”), which wouldn’t distribute traffic but would drop it, making it inconsistent with the\ncompany’s strategy.", "C": "Rate Limiting: This technique controls the traffic rate using bandwidth management. It\ndoesn’t distribute the traffic but rather restricts it, making it inconsistent with the company’s\nstrategy.", "D": "Load Balancing: This approach distributes network or application traffic across many\nresources to optimize resource use, minimize latency, and maximize throughput. This is\nconsistent with the company’s strategy of distributing incoming traffic."}, "answer": "D"}, {"num": 26, "text": "A red team simulation reveals a malware strain that adapts its behavior based\non observed user activity and evades detection by altering its code dynamically.\nThe malware exfiltrates data only when the system is idle and uses encrypted\nchannels for communication.\n\nBased on these traits, what is the most probable nature of this malware?", "options": {"A": "AI-powered malware using machine learning to tailor its execution.", "B": "Polymorphic virus that changes its signature during replication.", "C": "A worm that exploits known OS vulnerabilities to propagate.", "D": "Rootkit that hides files and processes from detection."}, "answer": "A"}, {"num": 356, "text": "You are Sofia Patel, an ethical hacker at Nexus Security Labs, hired to test the\nmobile device security of Bayview University in San Francisco, California. During\nyour assessment, you are given an Android 11-based Samsung Galaxy Tab S6\nwith USB debugging disabled and OEM unlock restrictions in place. To simulate\nan attacker attempting to gain privileged access, you install a mobile\napplication that exploits a system vulnerability to gain root access directly on\nthe device – without requiring a PC. This allows you to bypass OS restrictions\nand retrieve sensitive research data. Based on this method, which Android\nrooting tool are you using?", "options": {"A": "Magisk Manager", "B": "One Click Root", "C": "KingoRoot", "D": "RootMaster"}, "answer": "C"}, {"num": 27, "text": "As a cybersecurity consultant, you have been hired by a multinational\ncorporation to identify potential security risks in their network. During the\nenumeration phase, you utilize LDAP to gather information about the network\ninfrastructure. However, you observe that some critical information isn’t\nretrievable.\n\nWhat could be the primary reason for this?", "options": {"A": "The LDAP service is running on a non-standard port.", "B": "The hosts are located in a different subnet.", "C": "The company network is currently experiencing heavy traffic, leading to dropped\nrequests.", "D": "The LDAP directory data is protected by Access Control Lists (ACLs)."}, "answer": "D"}, {"num": 418, "text": "During a physical penetration test at Sterling Electronics in Cleveland, ethical\nhacker Priya waits near the employee entrance during a shift change. When a\ngroup of staff enters the building using their access cards, Priya closely follows\nbehind without swiping her own badge. None of the employees confront her,\nassuming she belongs there. Once inside, Priya proceeds to the break area\nwhere she documents the success of the exercise.\n\nWhich social engineering technique is Priya demonstrating?", "options": {"A": "Dumpster Diving", "B": "Tailgating", "C": "Shoulder Surfing", "D": "Piggybacking"}, "answer": "B"}, {"num": 185, "text": "A penetration tester is mapping a Windows-based internal network. The tester\nnotices that TCP port 139 and UDP port 137 are open on multiple systems. File\nand printer sharing is enabled.\n\nTo retrieve hostnames, user details, and domain roles without triggering alerts,\nwhich tool and method would be most effective?", "options": {"A": "Perform LDAP enumeration via anonymous bind.", "B": "Use pspasswd to change remote passwords.", "C": "Run nbtstat -A to query the NetBIOS name table.", "D": "Use psloggedon to retrieve remote login sessions."}, "answer": "C"}, {"num": 177, "text": "A red team operator wants to obtain credentials from a Windows machine\nwithout touching the LSASS process memory, as security controls and Credential\nGuard are active. Instead, they leverage a method that uses the Security\nSupport Provider Interface (SSPI to generate NetNTLM responses within the\ncontext of the logged-in user and collect those responses for offline cracking.\n\nWhich attack technique is being used in this scenario?", "options": {"A": "Internal Monologue attack technique executed through OS authentication protocol\nmanipulations.", "B": "Replay attack attempt by reusing captured authentication traffic sequences.", "C": "Hash injection approach using credential hashes for authentication purposes.", "D": "Pass-the-ticket attack method involving forged tickets for network access."}, "answer": "A"}, {"num": 46, "text": "As a Certified Ethical Hacker, you have been approached by a leading\ninternational corporation to assess and enhance their cloud-based security\nframework. The corporation recently transitioned to a serverless computing\narchitecture for its e-commerce application and experienced significant\nimprovements in scalability and cost efficiency. However, they fell victim to an\nintricate attack where an unauthorized user manipulated their cloud service’s\nfunction-as-a-service (FaaS component to execute malicious commands. Your\ninvestigation revealed that the attack originated from an insecure third-party\nAPI used within one of the serverless functions.\n\nGiven the attack’s complexity, what would be your recommended\ncountermeasure for strengthening the security posture?", "options": {"A": "Using a cloud access security broker (CASB) to enforce security policies for third-party cloud\nservices.", "B": "Deploying a cloud-native security platform (CNSP) that provides comprehensive protection\nacross all cloud resources.", "C": "Regularly update the serverless functions to patch vulnerabilities and reduce the attack\nsurface.", "D": "Implementing a function-level permission model and enforcing the principle of least\nprivilege."}, "answer": "D"}, {"num": 207, "text": "An attacker places a malicious VM on the same physical server as a target VM in\na multi-tenant cloud environment. The attacker then extracts cryptographic\nkeys using CPU timing analysis.\n\nWhat type of attack was conducted?", "options": {"A": "Side-channel attack", "B": "Cache poisoned denial of service (CPDoS)", "C": "Cloud cryptojacking", "D": "Metadata spoofing"}, "answer": "A"}, {"num": 529, "text": "A cloud storage provider discovers that an unauthorized party obtained a\ncomplete backup of encrypted database files containing archived client\ncommunications. The attacker did not compromise the encryption keys, nor is\nthere evidence that any original plaintext records were exposed. A forensic\ncryptography specialist reviewing the breach considers the possibility that the\nadversary is attempting to analyze the encrypted data in isolation, searching for\nstatistical irregularities or structural repetition within the encrypted output to\ninfer meaningful information. To properly assess the organization's exposure,\nthe specialist must determine which cryptanalytic approach best matches an\nattack conducted using only the intercepted encrypted data.", "options": {"A": "Ciphertext-only attack", "B": "Chosen-ciphertext attack", "C": "Chosen-plaintext attack", "D": "Known-plaintext attack"}, "answer": "A"}, {"num": 19, "text": "The web application security team of a global firm detected a sophisticated\ninjection attack that exploited a flaw in the application’s input validation. The\nattack was carried out using a custom script that used obfuscation and evasion\ntechniques to bypass security measures. To counter such attacks in the future,\nthe security team is considering implementing additional security measures.\n\nWhich of the following would be the most effective?", "options": {"A": "Deploy a Web Application Firewall (WAF) with built-in evasion detection features.", "B": "Enforce Two-Factor Authentication (2FA) for all user-level application access.", "C": "Implement continuous security code review and penetration testing.", "D": "Configure Security Information and Event Management (SIEM) to monitor user activity in real\ntime."}, "answer": "A"}, {"num": 450, "text": "At a Los Angeles-based online gaming company, penetration tester John\ninvestigates a recent cloud breach that caused downtime and delayed alerts. He\nfinds that the root issue was management’s lack of defined responsibilities for\nmonitoring, auditing, and securing serverless services, which left critical\nfunctions unmanaged. Which cloud computing threat does this scenario best\nillustrate?", "options": {"A": "Privilege escalation", "B": "Insufficient logging and monitoring", "C": "Side-channel attacks", "D": "Loss of governance"}, "answer": "D"}, {"num": 6, "text": "A prominent healthcare organization relies on mobile platforms to access\nelectronic health records (EHR and facilitate communication among healthcare\nprofessionals. Recently, the security team detected suspicious activities\nindicating potential vulnerabilities in the mobile platforms, raising concerns\nabout unauthorized access to sensitive patient data and potential breaches of\nmedical privacy laws. The team is tasked with identifying advanced hacking\ntechniques targeting mobile platforms and implementing robust measures to\nenhance mobile security and protect patient confidentiality.\n\nGiven the scenario described, which sophisticated hacking technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nsecurity of the healthcare organization’s mobile platforms?", "options": {"A": "Bluejacking Exploiting Bluetooth Connections to Send Unsolicited Messages or Malicious\nLinks to Nearby Mobile Devices, Potentially Compromising Device Security and Data Integrity", "B": "Zero-Day Exploits Leveraging Previously Unknown Vulnerabilities in Mobile Operating\nSystems or Applications to Gain Unauthorized Access to Healthcare Data and Patient Records", "C": "Side-Channel Attack Exploiting Physical Characteristics of Mobile Devices, such as Power\nConsumption or Electromagnetic Emissions, to Extract Sensitive Data, Such as Encryption Keys", "D": "App Spoofing Impersonating Legitimate Healthcare Apps to Trick Users into Providing\nSensitive Information, Such as Medical History or Insurance Details"}, "answer": "B"}, {"num": 297, "text": "In Dallas, Texas, ethical hacker Ethan Brooks is hired by Lone Star Credit Union\nto assess the security of their online banking portal, which processes customer\ntransactions. During his penetration test, Ethan probes the web server hosting\nthe portal, experimenting with crafted URL requests. He notices that by altering\nthe URL parameters in a specific way, the server returns data from areas of the\nsystem that should be restricted, revealing configuration files not intended for\npublic access. Suspecting this behavior indicates a vulnerability, Ethan\ndocuments the issue to help the security team strengthen their defenses\nagainst potential unauthorized access.\n\nWhich technique is Ethan most likely using to uncover the vulnerability in Lone\nStar Credit Union’s web server?", "options": {"A": "Password Cracking", "B": "Web Cache Poisoning", "C": "HTTP Response Splitting", "D": "Directory Traversal"}, "answer": "D"}, {"num": 163, "text": "A penetration tester is conducting an external assessment of a corporate web\nserver. They start by accessing and\nobserve multiple Disallow entries that reference directories such as /admin-\npanel/, /backup/, and /confidential_docs/. When the tester directly visits these\npaths via browser, they find that access is not restricted by authentication and\ngain access to sensitive files, including server configuration and unprotected\ncredentials.\n\nWhich stage of the web server attack methodology is demonstrated in this\nscenario?", "options": {"A": "Performing a cross-site request forgery (CSRF) attack to manipulate user actions.", "B": "Gathering information through exposed indexing instructions.", "C": "Injecting malicious SQL queries to access sensitive database records.", "D": "Leveraging the directory traversal flaw to access critical server files."}, "answer": "B"}, {"num": 411, "text": "During a red team engagement at a retail company in Atlanta, ethical hacker\nJames crafts a session with the company’s shopping portal and deliberately\nshares that session ID with an unsuspecting employee by embedding it in a link.\nWhen the employee clicks and logs in, their activity is bound to the attacker’s\npre-assigned session. Later, James retrieves the employee’s input from that\nsame session to demonstrate the flaw to management.\n\nWhich session hijacking technique is James most likely using?", "options": {"A": "Session Prediction", "B": "Session Fixation Attack", "C": "Session Replay Attack", "D": "Session Donation Attack"}, "answer": "B"}, {"num": 519, "text": "A regional law firm authorizes a wireless resilience evaluation after employees\nreport intermittent connectivity disruptions in conference rooms. An ethical\nhacker assigned to the assessment analyses client behaviour while transmitting\ncarefully crafted 802.11 management frames toward the organization's primary\naccess point. Each transmission immediately causes several connected laptops\nto lose association with the network, requiring users to reconnect manually.\nConnectivity interruptions occur only when the crafted frames are sent. Identify\nthe wireless attack illustrated by this activity.", "options": {"A": "Jamming Attack", "B": "Evil Twin Attack", "C": "Deauthentication Attack", "D": "Eavesdropping Attack"}, "answer": "C"}, {"num": 30, "text": "A cybersecurity team is assessing an organization’s network for\nmisconfigurations. During the enumeration process, they use a tool that sends a\nrequest to UDP port 161 and receives a large list of software names installed on\nremote devices. The operation is successful due to the use of a publicly known\ncommunity string.\n\nWhat enabled this enumeration technique to work so effectively?", "options": {"A": "The SNMP agent was misconfigured to log trap messages in plain text.", "B": "The SNMP agent allowed anonymous bulk data queries due to default settings.", "C": "The SNMP manager had access to encrypted Windows registry keys remotely.", "D": "The organization was using unencrypted FTP services to store software data."}, "answer": "B"}, {"num": 537, "text": "Upon completing a vulnerability evaluation for a financial services firm in\nCincinnati, Ohio, the security team finalized its formal report for executive\nreview. One portion of the document grouped identified weaknesses into\nseverity tiers and highlighted systems with elevated exposure levels across the\nenvironment. This part of the report emphasized the relative impact and\nprioritization of identified weaknesses across affected assets. Which component\nof the vulnerability assessment report is represented in this scenario?", "options": {"A": "Recommendations", "B": "Risk Assessment", "C": "Findings", "D": "Assessment Overview"}, "answer": "B"}, {"num": 266, "text": "Dr. Evelyn Reed, a cybersecurity expert, was called in to investigate a series of\nunusual activities at “Global Innovations Inc.” The first red flag was a surge in\nspear-phishing emails targeting senior management, disguised as urgent\ninternal memos. Soon after, the company’s web server showed unexpected\noutbound traffic to unfamiliar IP addresses. A network audit revealed that\nmultiple underutilized printers and routers had unauthorized firmware\ninstalled. Further review uncovered inconsistencies in file access logs linked to\nthe R&D department, including unusually large data transfers occurring during\nnon-business hours. Dr. Reed also noted the attackers appeared to have\nintimate knowledge of the organization’s internal data structure.\n\nWhich phase of the Advanced Persistent Threat (APT) lifecycle is Global\nInnovations Inc. most likely experiencing, given the combination of these\nincidents?", "options": {"A": "Initial Intrusion", "B": "Expansion", "C": "Search and Exfiltration", "D": "Persistence"}, "answer": "C"}, {"num": 536, "text": "A digital publishing firm in Charlotte, North Carolina, noticed suspicious probing\nactivity against its public website. To proactively assess exposure, the security\nteam initiated a focused scan of the company's HTTP servers. The chosen tool\nexamined server headers, identified installed web server software through file\nsignatures and favicon analysis, checked for outdated components, and\nsearched for potentially dangerous files and misconfigurations. The scan also\nsupported SSL connections and generated exportable reports in multiple\nformats for documentation. Which vulnerability assessment tool most closely\naligns with the capabilities described?", "options": {"A": "Nikto", "B": "Nessus", "C": "Qualys VM", "D": "OpenVAS"}, "answer": "A"}, {"num": 429, "text": "In the sunlit tech oasis of Phoenix, Arizona, ethical hacker Nadia Patel explores\nthe security posture of LearnSphere, a U.S.-based e-learning platform serving\nthousands of students. During her testing, Nadia intentionally submits invalid\ninputs to the platform’s content delivery system. Instead of returning a generic\nfailure notice, the application responds with detailed system information,\nincluding database query strings and directory paths. Such responses provide\nattackers with valuable insights into the application’s internal workings, which\ncould be used to craft more precise and damaging attacks.", "options": {"A": "Verbose Error Messages", "B": "CORS Misconfiguration", "C": "Directory Traversal", "D": "Improper Error Handling"}, "answer": "A"}, {"num": 224, "text": "While evaluating a smart card implementation, a security analyst observes that\nan attacker is measuring fluctuations in power consumption and timing\nvariations during encryption operations on the chip. The attacker uses this\ninformation to infer secret keys used within the device.\n\nWhat type of exploitation is being carried out?", "options": {"A": "Disrupt control flow to modify instructions", "B": "Force session resets through input flooding", "C": "Observe hardware signals to deduce secrets", "D": "Crack hashes using statistical collisions"}, "answer": "C"}, {"num": 109, "text": "A cybersecurity team identifies suspicious outbound network traffic.\nInvestigation reveals malware utilizing Background Intelligent Transfer Service\n(BITS to evade firewall detection.\n\nWhy would attackers use this particular service to hide malicious activities?", "options": {"A": "Because BITS traffic uses encrypted DNS packets.", "B": "Because BITS packets appear identical to normal Windows update traffic.", "C": "Because BITS operates exclusively through HTTP tunneling.", "D": "Because BITS utilizes IP fragmentation to evade IDS."}, "answer": "B"}, {"num": 40, "text": "As a Certified Ethical Hacker, you have been contracted by a leading technology\ncompany to test the vulnerabilities in its web application. The application\nintegrates various third-party services and employs multiple APIs. During your\nadvanced testing, you discover a particularly robust Web API that is designed to\nwork with several webhooks. Additionally, you find that the server has a web\nshell planted for legitimate administrative tasks. Your objective is to exploit\nvulnerabilities related to the Web API, webhooks, and web shell.\n\nWhat technique would best allow you to compromise the system effectively\nwhile leaving minimal traces?", "options": {"A": "Exploit the web shell by uploading malicious scripts disguised as routine administrative\ntasks.", "B": "Manipulate the webhook to trigger an unintended data transfer between the application and\nthird-party services.", "C": "Execute Insecure Direct Object Reference (IDOR) on the Web API to access unauthorized\nresources.", "D": "Utilize SSRF (Server-Side Request Forgery) to make unauthorized API calls from the server\nitself."}, "answer": "D"}, {"num": 245, "text": "A penetration tester discovers that a web application is vulnerable to Local File\nInclusion (LFI due to improper input validation in a URL parameter.\n\nWhich approach should the tester take to exploit this vulnerability?", "options": {"A": "Inject SQL commands into the URL parameter to test for database vulnerabilities", "B": "Perform a Cross-Site Scripting (XSS) attack by injecting malicious scripts into the URL", "C": "Conduct a brute-force attack on the admin login page to gain access", "D": "Use directory traversal to access sensitive files on the server, such as/etc/passwd"}, "answer": "D"}, {"num": 370, "text": "You are an ethical hacker at SecurePath Technologies, hired to conduct a\npenetration test for Horizon Financial, a U.S.-based credit union in Denver,\nColorado. While testing their online banking portal, you enter a crafted input\ninto the login form’s username field. The application unexpectedly returns a full\nlist of customer account details, including names and account numbers,\nappended to the intended login response. The behavior suggests that your\ninput was used to append a malicious query to the requested query, altering\nthe original SQL statement to retrieve additional data beyond the expected\nresult. Based on the observed behavior, which type of SQL injection attack are\nyou exploiting?", "options": {"A": "UNION SQL Injection", "B": "Error-Based SQL Injection", "C": "Second-Order SQL Injection", "D": "Blind SQL Injection"}, "answer": "A"}, {"num": 48, "text": "You work as a network security officer for a large corporation. Recently, you’ve\nnoticed that certain confidential files are being accessed by unauthorized users\nwithin the network. You suspect that a Man-in-the- Middle (MitM attack is\nbeing carried out.\n\nWhich of the following network activities would help you confirm this?", "options": {"A": "A sudden increase in network traffic.", "B": "Multiple login attempts from the same IP address.", "C": "Detection of abnormal amounts of DNS requests.", "D": "IP addresses being resolved to multiple MAC addresses."}, "answer": "D"}, {"num": 528, "text": "A competing technology firm begins releasing products that closely mirror the\ndesign, pricing strategy, and feature roadmap of ApexDynamics Inc. An internal\nreview reveals that detailed information about ApexDynamics's upcoming\ninitiatives had been gradually collected through publicly available sources and\nexternal disclosures before product launch. Which footprinting-related threat\ndoes this scenario best represent?", "options": {"A": "Corporate Espionage", "B": "Business Loss", "C": "Information Leakage", "D": "Social Engineering"}, "answer": "B"}, {"num": 343, "text": "In the industrial heart of Detroit, Michigan, a steel plant’s production line halts\nunder mysterious circumstances, prompting an urgent cybersecurity\ninvestigation. As Marcus Reed, an ethical hacker, you audit the system and\nnotice the plant’s control process uses a feedback mechanism to continuously\nadjust operations based on output conditions. Your review reveals that this\nself-regulating behavior is central to the plant’s automation design. Based on\nyour findings, which OT system concept is being employed?", "options": {"A": "Distributed Control System (DCS)", "B": "Open loop", "C": "Manual loop", "D": "Closed loop"}, "answer": "D"}, {"num": 193, "text": "During a physical penetration test simulating a social engineering attack, a\nthreat actor walks into the lobby of a target organization dressed as a field\ntechnician from a known external vendor. Carrying a fake ID badge and\nreferencing a known company name, the attacker confidently claims they’ve\nbeen dispatched to perform a routine server room upgrade. Using internal-\nsounding terminology and referencing real employee names gathered via\nOSINT, the individual conveys urgency. The receptionist, recognizing the vendor\nname and the convincing language, allows access without verifying the\ncredentials.", "options": {"A": "Trust in physical security logs used by security teams.", "B": "Perceived authority and reliance on third-party familiarity.", "C": "Leaked credentials on public networks and forums.", "D": "Misconfigured network segmentation allowing unauthorized access."}, "answer": "B"}, {"num": 107, "text": "During an internal penetration test, a security analyst assesses a web\napplication that interfaces with a backend Oracle database. Initial attempts\nusing standard SQL injection payloads such as ‘ OR ‘1’=’l and UNION SELECT\nreturn no useful output and do not affect application behavior. Suspecting input\nsanitization and error suppression, the analyst crafts a new payload:\n\n1 AND 1 < (SELECT COUNT(* FROM all_users A, all_users B, all_users C\n\nUpon submitting this payload, the page takes significantly longer to respond\ncompared to previous inputs, even though no visible output is returned.\n\nWhat type of SQL injection technique is most likely being used here?", "options": {"A": "Time-based SQL injection using WAITFOR DELAY", "B": "Union-based SQL injection", "C": "Out-of-band SQL injection", "D": "Heavy query-based SQL injection"}, "answer": "D"}, {"num": 296, "text": "During a security penetration test at ABC Financial Services in Miami, Florida, on\nJuly 9, 2025, ethical hacker Javier Morales targets the company’s online banking\nportal to assess its resilience. Over several hours, the portal’s web server begins\nto falter, with legitimate users reporting inability to log in or complete\ntransactions. The IT team notices the server is struggling to accept new\nconnections, as its maximum connection limit is nearly reached, despite no\nsignificant spike in overall network traffic. Javier’s controlled test, run from a\nsecure system, logs interactions to simulate a real attack, aiming to evaluate\nthe IT team’s ability to identify the threat. What DoS/DDoS attack technique is\nJavier’s exercise primarily simulating?", "options": {"A": "Slowloris Attack", "B": "UDP Flood Attack", "C": "Peer-to-Peer Attack", "D": "SYN Flood Attack"}, "answer": "A"}, {"num": 484, "text": "During an authorized penetration test of an organization’s Operational\nTechnology (OT) environment, the tester has already identified exposed\nindustrial assets and now begins actively probing controllers, services, and\ninterfaces to identify exploitable weaknesses. No exploitation attempts or\npersistence mechanisms have been performed yet. According to the OT hacking\nmethodology, which phase is currently being carried out?", "options": {"A": "Gain Remote Access", "B": "Information Gathering", "C": "Launch Attacks", "D": "Vulnerability Scanning"}, "answer": "D"}, {"num": 293, "text": "On 10th of July this year, during a security penetration test at IntelliCore\nSystems in Raleigh, North Carolina, the ethical hacking team evaluates the\nstability of the company’s file-sharing server. Sofia crafts and transmits a\nsequence of oversized, malformed packets designed to test how the server\nhandles unexpected input. Shortly after, the system begins crashing\nintermittently due to processing failures triggered by these anomalous network\nrequests. The security team onsite is tasked with identifying the root cause\nbehind the packet-induced instability and attributing it to a known DoS tactic.\n\nWhich of the following best explains the technique Sofia used to trigger the\nserver crashes?", "options": {"A": "ICMP Flood Attack", "B": "Ping of Death (PoD)", "C": "Smurf Attack", "D": "ACK Flood Attack"}, "answer": "B"}, {"num": 218, "text": "While conducting a covert penetration test on a UNIX-based infrastructure, the\ntester decides to bypass intrusion detection systems by sending specially\ncrafted TCP packets with an unusual set of flags enabled. These packets do not\ninitiate or complete any TCP handshake. During the scan, the tester notices that\nwhen certain ports are probed, there is no response from the target, but for\nothers, a TCP RST (reset packet is received. The tester notes that this behavior\nconsistently aligns with open and closed ports, respectively, without triggering\ndetection systems configured to monitor connection-based scans.\n\nBased on these observations, which scanning technique is most likely being\nused?", "options": {"A": "Xmas scan leveraging RFC 793 quirks", "B": "ACK flag scan to evaluate firewall behavior", "C": "FIN scan using stealthy flag combinations", "D": "TCP Connect scan to complete the three-way handshake"}, "answer": "C"}, {"num": 220, "text": "A penetration tester finds malware that spreads across a network without user\ninteraction, replicating itself from one machine to another.\n\nWhat type of malware is this?", "options": {"A": "Virus", "B": "Ransomware", "C": "Keylogger", "D": "Worm"}, "answer": "D"}, {"num": 145, "text": "A penetration tester targets a company’s executive assistants by referencing\nupcoming board meetings in an email requesting access to confidential\nagendas.\n\nWhat is the most effective social engineering technique to obtain the necessary\ncredentials without raising suspicion?", "options": {"A": "Send a mass phishing email with a fake meeting link", "B": "Create a personalized email referencing specific meetings and request access", "C": "Develop a fake LinkedIn profile to connect and request information", "D": "Call posing as a trusted IT support to verify credentials"}, "answer": "B"}, {"num": 216, "text": "A penetration tester is tasked with compromising a company's wireless network,\nwhich uses WPA2-PSK encryption. The tester wants to capture the WPA2\nhandshake and crack the pre-shared key.\n\nWhat is the most appropriate approach to achieve this?", "options": {"A": "Perform a brute-force attack directly on the WPA2 encryption", "B": "Execute a Cross-Site Scripting (XSS) attack on the router’s admin panel", "C": "Conduct a Man-in-the-Middle attack by spoofing the router’s MAC address", "D": "Use a de-authentication attack to force a client to reconnect, capturing the WPA2"}, "answer": "D"}, {"num": 150, "text": "A penetration tester is running a vulnerability scan on a company’s network.\nThe scan identifies an open port with a high-severity vulnerability linked to\noutdated software.\n\nWhat is the most appropriate next step for the tester?", "options": {"A": "Perform a brute-force attack on the service running on the open port", "B": "Research the vulnerability and determine if it has a publicly available exploit", "C": "Ignore the vulnerability and focus on finding more vulnerabilities", "D": "Execute a denial-of-service (DoS) attack on the open port"}, "answer": "B"}, {"num": 75, "text": "You are tasked with assessing wireless network security for a corporation using\nWPA2 encryption. During the assessment, you identify vulnerabilities that could\nallow attackers to intercept and replay previously captured packets.\n\nWhich WPA2 vulnerability is likely being exploited?", "options": {"A": "Hole196 vulnerability due to shared GTK.", "B": "Insecure WPS PIN recovery method.", "C": "KRACK vulnerabilities through key reinstallation.", "D": "Weak random number generator (RNG) affecting GTK."}, "answer": "C"}, {"num": 135, "text": "A penetration tester is assessing the security of a corporate wireless network\nthat uses WPA2-Enterprise encryption with RADIUS authentication. The tester\nwants to perform a man-in-the-middle attack by tricking wireless clients into\nconnecting to a rogue access point.\n\nWhat is the most effective method to achieve this?", "options": {"A": "Perform a dictionary attack on the RADIUS server to retrieve credentials", "B": "Execute a Cross-Site Scripting (XSS) attack on the wireless controller’s login page", "C": "Set up a fake access point with the same SSID and use a de-authentication attack", "D": "Use a brute-force attack to crack the WPA2 encryption directly"}, "answer": "C"}, {"num": 96, "text": "During a red team engagement targeting a custom web application, a tester\nobserves that the app takes a numeric id parameter from the URL and\ndynamically builds SQL queries. Suspecting SQL injection, the tester sends a\ncrafted HTTP GET request like:\n\nhttp://vulnerableapp.local/view.php?id=l; DROP TABLE users; --\n\nShortly after, the application throws database errors, and the team confirms\nthat the users table has been removed from the backend database.\n\nBased on this behavior, which SQL injection method was most likely used?", "options": {"A": "The attacker appended a UNION clause to retrieve additional data.", "B": "The attacker triggered errors to extract database information.", "C": "The attacker used Boolean logic to infer true/false responses.", "D": "The attacker executed a second malicious query alongside the first."}, "answer": "D"}, {"num": 159, "text": "A system administrator observes that several machines in the network are\nrepeatedly sending out traffic to unknown IP addresses. Upon inspection, these\nmachines were part of a coordinated spam campaign.\n\nWhat is the most probable cause?", "options": {"A": "Keyloggers were harvesting user credentials", "B": "Devices were enslaved into a botnet network", "C": "Worms exploited zero-day vulnerabilities", "D": "Browsers were redirected to adware-injected sites"}, "answer": "B"}, {"num": 137, "text": "A penetration tester suspects that a web application’s login form is vulnerable\nto SQL injection due to improper sanitization of user input.\n\nWhat is the most appropriate approach to test for SQL injection in the login\nform?", "options": {"A": "Perform a directory traversal attack to access sensitive files", "B": "Enter ‘ OR ‘1’=’1 in the username and password fields to bypass authentication", "C": "Use a brute-force attack on the login page to guess valid credentials", "D": "Inject JavaScript into the input fields to test for Cross-Site Scripting (XSS)"}, "answer": "B"}, {"num": 509, "text": "During a compliance audit at a logistics company in Columbus, Ohio, the mobile\nsecurity team discovers that several field-issued Android devices are\nresponding to remote commands from an unknown external system. The\naffected devices are not connected via USB, and no enterprise mobility policies\nwere recently modified. Network monitoring reveals that the devices have\nremote debugging enabled and are accepting connections over the wireless\nnetwork on a specific high-numbered port commonly associated with remote\ndevice communication. Investigators determine that the external system was\nable to capture screenshots, list installed applications, forward ports, and\ninstall additional packages without requiring physical access to the devices.\nWhich attack technique most accurately explains this compromise?", "options": {"A": "Android Rooting", "B": "FRP Bypass", "C": "ADB Exploitation via TCP 5555", "D": "Device Administration API Abuse"}, "answer": "C"}, {"num": 115, "text": "You are a Certified Ethical Hacker and have been hired by a financial institution\nto assess the security of its newly developed web application. The application\nemploys a multifaceted authentication system with JavaScript-based client-side\ncontrols. During your testing, you discover that client-side controls enforce\npassword strength and ensure CAPTCHA validation. The application also uses a\nproprietary encryption algorithm for client-side data. Your goal is to bypass\nthese client-side controls to assess how robust they really are.\n\nWhat method would be the most effective for bypassing these controls without\ntriggering server-side alarms?", "options": {"A": "Inject malicious JavaScript code into the login form to overwrite the client-side validation\nrules.", "B": "Disable JavaScript in the browser and proceed to submit weaker passwords and invalid\nCAPTCHAs.", "C": "Utilize a proxy tool to intercept and modify the client-side controls before they reach the\nserver.", "D": "Reverse-engineer the proprietary encryption algorithm and manipulate the encrypted data\nbefore submission."}, "answer": "B"}, {"num": 36, "text": "As part of a security audit, your team evaluates a system flagged by your\nautomated scanner. The tool outputs a vector string with a numerical range of\n9.8, indicating a critical severity. However, the client is unsure about the real-\nworld implications of this score
