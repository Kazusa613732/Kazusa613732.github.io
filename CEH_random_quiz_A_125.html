. You are tasked with explaining what this score\nconveys and how it was derived.\n\nWhich of the following best explains the purpose and benefit of this type of\nrating in prioritizing remediation efforts?", "options": {"A": "It provides a qualitative baseline that supports public exploit classification based on\nbehavior.", "B": "It simplifies attack replication by generating matching exploit payloads from live memory\ndumps.", "C": "It quantifies technical impact and ease of exploitation, guiding structured risk response\nbased on impact and environment.", "D": "It measures authentication errors in binary protocols to align patching with service\nconfiguration."}, "answer": "C"}, {"num": 154, "text": "A penetration tester needs to identify open ports and services on a target\nnetwork without triggering the organization’s intrusion detection systems,\nwhich are configured to detect high-volume traffic and common scanning\ntechniques. To achieve stealth, the tester decides to use a method that spreads\nout the scan over an extended period.\n\nWhich scanning technique should the tester employ to minimize the risk of\ndetection?", "options": {"A": "Conduct a TCP Xmas scan sending packets with all flags set", "B": "Use a Stealth scan by adjusting the scan timing options to be slow and random", "C": "Perform a TCP SYN scan using a fast scan rate", "D": "Execute a UDP scan targeting all ports simultaneously"}, "answer": "B"}, {"num": 354, "text": "While conducting a security review for a public healthcare data center, Jason, a\nsenior penetration tester, is asked to gather system descriptions, contact\ndetails, and interface metrics from a set of legacy network devices running\nSNMPv2. These devices respond on UDP port 161 and use default community\nstrings. Jason must retrieve this structured SNMP data in a format that can be\nfed into a reporting script without requiring GUI-based tools or raw packet\ncaptures.\n\nWhich of the following methods should Jason use?", "options": {"A": "Use Nmap to identify SNMP ports and collect basic SNMP service banners", "B": "Use SoftPerfect Network Scanner to scan for SNMP-enabled systems", "C": "Use SnmpWalk to query and retrieve structured SNMP data from the devices", "D": "Use Wireshark to inspect SNMP packets on the wire for useful fields"}, "answer": "C"}, {"num": 116, "text": "A large media-streaming company begins receiving complaints from users that\ntheir web application is timing out or failing to load. The security team observes\nthat the web server is overwhelmed with a high number of open HTTP\nconnections, most of which appear to be legitimate but are transmitting data at\nan abnormally slow rate. These connections are never fully completed, causing\nthe server’s resources to remain occupied and unable to process new incoming\nclient requests. The incident response team rules out bandwidth exhaustion\nand malformed packet-based attacks and suspects an application-layer DoS\ntechnique is responsible.\n\nGiven the scenario, which specific type of attack is most likely being executed\non the company’s web application?", "options": {"A": "The attacker uses a flooding attack on the server with random UDP packets to random ports\nto consume available bandwidth.", "B": "The attacker sends fragmented packets with overlapping offset values to destabilize the\ntarget system.", "C": "The attacker uses a Slowloris attack to keep many open connections alive, slowly\nexhausting the server’s connection pool.", "D": "The attacker floods the server with continuous ICMP Echo Request packets, overwhelming its\nnetwork stack."}, "answer": "C"}, {"num": 491, "text": "During a red team exercise at a financial services firm in Phoenix, Arizona, an\nethical hacker sends a phishing email with a disguised attachment to\nemployees. The purpose is to transmit the payload into the environment so\nlater attack steps can proceed. In the cyber kill chain model, which phase does\nthis represent?", "options": {"A": "Exploitation", "B": "Reconnaissance", "C": "Delivery", "D": "Weaponization"}, "answer": "C"}, {"num": 302, "text": "In the humid air of Houston, Texas, a chemical plant is preparing to deploy a\nnew production automation module. As part of a red team engagement, you\nEthan Brooks, a cybersecurity specialist are tasked with identifying industrial\ncontrol devices that communicate with SCADA systems. To proactively uncover\ndevices that may expose critical functions, you launch a focused Nmap sweep\ntargeting TCP port 102, known to be associated with industrial controllers used\nin critical infrastructure. Your scan detects specific PLC models used in the\nautomation process. Which OT reconnaissance step are you performing?", "options": {"A": "Scanning Omron PLC devices", "B": "Scanning Modbus devices", "C": "Capturing Modbus/TCP traffic using Wireshark", "D": "Scanning Siemens SIMATIC S7 PLCs"}, "answer": "D"}, {"num": 416, "text": "You are an ethical hacker at Titan Cyber Defense, hired by BrightWave\nPublishing in New York City to assess the security of their content management\nsystem (CMS). While testing the article search function, you input malformed\nstrings such as multiple single quotes. The application responds with system\nfeedback that unexpectedly reveals the database type and internal query\nstructure, including table and column information. You use these disclosures to\nbetter understand how the backend query is built.\n\nWhich of the following methods to detect SQL injection are you employing?", "options": {"A": "Fuzz Testing", "B": "Testing String", "C": "Dynamic Testing", "D": "Function Testing"}, "answer": "B"}, {"num": 485, "text": "During a controlled red team engagement at a financial institution in New\nJersey, ethical hacker Ryan tests the bank’s resilience against stealth-based\nmalware. He plants a custom malicious program on an employee workstation.\nAfter execution, he observes that the infected files continue to function\nnormally, but his malware conceals its modifications by intercepting operating\nsystem calls. Antivirus scans repeatedly return “no threats detected,” even\nthough the malicious code remains active and hidden on the system.\n\nWhich type of virus did Ryan most likely deploy in this assessment?", "options": {"A": "Cavity Virus", "B": "Macro Virus", "C": "Stealth Virus", "D": "Polymorphic Virus"}, "answer": "C"}, {"num": 249, "text": "A penetration tester is assessing a company’s vulnerability to advanced social\nengineering attacks targeting its legal department. Using comprehensive\nknowledge of recent mergers and internal legal proceedings, the tester crafts a\nhighly credible pretext to deceive legal employees into sharing confidential\ncase documents.\n\nWhat is the most effective social engineering technique the tester should\nemploy to obtain confidential documents without raising suspicion?", "options": {"A": "Visit the office in person posing as a new legal intern to request document access", "B": "Send a spear-phishing email referencing specific merger details and requesting document\naccess", "C": "Create a fake LinkedIn profile to connect with legal employees and request document\nsharing", "D": "Conduct a mass phishing campaign with generic legal templates attached"}, "answer": "B"}, {"num": 151, "text": "A penetration tester is tasked with assessing the security of a smart home IoT\ndevice that communicates with a mobile app over an unencrypted connection.\nThe tester wants to intercept the communication and extract sensitive\ninformation.\n\nWhat is the most effective approach to exploit this vulnerability?", "options": {"A": "Perform a brute-force attack on the device’s Wi-Fi credentials", "B": "Use a dictionary attack to guess the admin login credentials of the device", "C": "Use a man-in-the-middle (MitM) attack to intercept and analyze the unencrypted traffic", "D": "Execute a SQL injection attack on the IoT device’s cloud management portal"}, "answer": "C"}, {"num": 357, "text": "During a stealth penetration test for a multinational shipping company, ethical\nhacker Daniel Reyes gains local access to an engineering workstation and\ndeploys a specialized payload that installs below the operating system. On\nsubsequent reboots, the payload executes before any system-level drivers or\nservices are active, giving Daniel covert control over the machine without\ntriggering antivirus or endpoint detection tools. Weeks later, system\nadministrators report suspicious network activity, but repeated forensic scans\nfail to locate any malicious processes or user-level traces.\n\nWhich type of rootkit did Daniel most likely use to maintain this level of stealth\nand persistence?", "options": {"A": "Hypervisor Rootkit", "B": "Firmware Rootkit", "C": "Kernel-mode Rootkit", "D": "Bootkit"}, "answer": "D"}, {"num": 467, "text": "During a red team assessment at a university in Chicago, Jake, a penetration\ntester, scans a group of older Windows workstations in the administration\ndepartment. On several hosts, he notices traffic on UDP ports 137 and 138 as\nwell as an open TCP port 139. Curious, he uses a utility to query the name table\nand session services. Within moments, he collects information including\nmachine names, logged-in usernames, and available shared folders without\nauthentication.\n\nWhich enumeration method is being demonstrated in this scenario?", "options": {"A": "SMB Enumeration", "B": "NetBIOS Enumeration", "C": "NFS Enumeration", "D": "SNMP Enumeration"}, "answer": "B"}, {"num": 214, "text": "A penetration tester submits altered ciphertexts to a web server and pays close\nattention to how the server responds. When the server produces different error\nmessages for certain inputs, the tester starts to infer which inputs result in valid\ninternal processing.\n\nWhich cryptanalytic method is being used in this scenario?", "options": {"A": "Compare traffic timing to deduce the key", "B": "Exploit padding error feedback to recover data", "C": "Flip bits randomly to scramble the decryption", "D": "Inspect randomness across multiple sessions"}, "answer": "B"}, {"num": 346, "text": "Noah, a security analyst at a Seattle-based healthcare provider, is responding to\na real-time data breach where attackers accessed patient records stored on a\ncompromised server. During incident response, he must quickly secure sensitive\nfiles located on the system’s primary storage to prevent further exfiltration. The\ndata resides in a mounted partition that needs full-volume encryption, but\nstandard file encryption isn’t sufficient. Noah selects a solution that supports\nencrypted containers, strong key lengths like 256-bit AES, and can conceal\nsecure volumes within standard ones to reduce detection. His goal is to ensure\nconfidentiality while forensic operations continue without disrupting system\nfunctionality.\n\nWhich disk encryption tool should Noah deploy to meet these objectives?", "options": {"A": "BitLocker Drive Encryption", "B": "FileVault", "C": "Rohos Disk Encryption", "D": "VeraCrypt"}, "answer": "D"}, {"num": 424, "text": "During a reconnaissance engagement at a law firm in Houston, Texas, you are\ntasked with analyzing the physical movement of employees through their\npublicly shared media. By examining geotagged images and mapping them to\nspecific locations, you aim to evaluate whether staff are unintentionally\ndisclosing sensitive information about office routines. Which tool from the\nreconnaissance toolkit would best support this task?", "options": {"A": "Social Searcher", "B": "Sherlock", "C": "Creepy", "D": "Maltego"}, "answer": "C"}, {"num": 428, "text": "During a security assessment for an e-commerce company in Boston,\nMassachusetts, your team conducts a reconnaissance phase to identify\npotential entry points into the organization’s communication infrastructure. You\nfocus on gathering details about the systems responsible for handling incoming\nemail traffic, avoiding active network probing, and relying on passive DNS data\ncollection. Given this objective, which DNS record type should you query to\nextract information about the target’s mail server configuration?", "options": {"A": "TXT", "B": "MX", "C": "NS", "D": "SOA"}, "answer": "B"}, {"num": 363, "text": "As part of a quarterly security review at EvoTrans Logistics, a global freight\noptimization firm, you’ve been brought in as a senior cybersecurity analyst to\naudit perimeter firewall configurations across cloud-hosted application\nclusters. During your investigation, you notice that TCP port 1433 is open on a\nvirtual machine tagged as svc-node-east-14, which was provisioned by a now-\ndefunct third-party vendor.\nThe node is not referenced in any current infrastructure diagrams, yet live traffic\nlogs suggest it’s still handling requests during peak hours. No documentation\nexists regarding its service role, but you’re tasked with flagging\nmisconfigurations that may violate policy or expose critical services\nunnecessarily. Based on your understanding of standardized port assignments,\nyou must determine what service this port likely represents and whether its\nexposure warrants escalation.\n\nWhich of the following services is most likely running on this port and requires\nimmediate review?", "options": {"A": "sqlsrv", "B": "sql*net", "C": "ms-sql-s", "D": "ms-sql-m"}, "answer": "C"}, {"num": 239, "text": "During a high-stakes engagement on a secure corporate network, a penetration\ntester discovers an opportunity to attack the domain controller. By abusing an\nAPI call from Microsoft’s Encrypting File System Remote Protocol (MS-EFSRPC,\nthe tester forces the domain controller to initiate NTLM authentication to a\nserver controlled by the tester. The tester then captures the resulting NTLM\nhash and relays it to the Active Directory Certificate Services (AD CS, ultimately\nobtaining a certificate that confers administrative privileges over the network.\nThis sophisticated method allows the tester to compromise the network without\nrequiring direct access to the domain controller.\n\nWhich network-level hijacking technique is illustrated in this scenario?", "options": {"A": "Exploiting vulnerabilities in TLS compression via a CRIME attack", "B": "Employing a session donation method to transfer tokens", "C": "Stealing session tokens using browser-based exploits", "D": "Hijacking sessions using a PetitPotam relay attack"}, "answer": "D"}, {"num": 372, "text": "During a red team operation for XYZ Financial Services, security analyst Lily\nJensen is assigned to scan a critical subnet that is protected by an IDS. Her\ninitial scan attempt is immediately flagged and blocked. To evade detection\nwhile continuing reconnaissance, she adjusts the scanning configuration to\ninclude multiple spoofed IP addresses alongside her own. This makes it difficult\nfor network defenses to isolate her real scanning activity, while still allowing\nher to receive accurate results.\n\nWhich scanning technique is Lily using?", "options": {"A": "SYN/FIN Scanning", "B": "Source Routing", "C": "IP Spoofing", "D": "Decoy Scanning"}, "answer": "D"}, {"num": 175, "text": "During a comprehensive security audit of a financial institution’s online\ninfrastructure, a penetration tester observes abnormal traffic redirection\npatterns affecting the institution’s primary domain. Customers who attempt to\naccess the legitimate website are seamlessly redirected to a visually identical\nphishing page, hosted on a suspicious IP address. After tracing the DNS\nresolution path, the tester discovers that the authoritative DNS server has been\ncompromised, and its records have been altered to point to the attacker’s\nserver. The redirection affects all DNS queries for the domain, indicating\nunauthorized control over name resolution infrastructure, rather than local\ncache poisoning or client-side manipulation. The tester confirms that this\nredirection was achieved by tampering with the DNS zone records themselves.\n\nWhich technique is being used in this scenario?", "options": {"A": "Carry out DNS server hijacking by tampering with the legitimate name resolution\ninfrastructure.", "B": "Perform DNS rebinding in the import functionality to manipulate browser-origin\ninteractions.", "C": "Establish covert communication using DNS tunneling over standard DNS queries.", "D": "Initiate a DNS amplification attack by leveraging recursive servers to flood the target."}, "answer": "A"}, {"num": 243, "text": "During a security assessment of a metropolitan public transportation terminal,\na penetration tester examines a network-connected IoT surveillance camera\nsystem that is used for 24/7 video monitoring of high-traffic areas. Upon\nanalyzing the camera’s network traffic, the tester observes that it uses an\noutdated encryption protocol (SSLv2 to transmit video data to the control\ncenter. The tester uses a network packet sniffer to intercept this traffic and\neasily decrypts the stream, successfully reconstructing full video footage in real\ntime without authentication.\n\nFurther analysis reveals that the camera does not enforce TLS or any modern\nencryption standard and lacks support for mutual authentication or secure key\nexchange. Additionally, no integrity checks are performed, leaving the data\nopen to manipulation.\n\nWhat IoT vulnerability is most likely being exploited in this scenario?", "options": {"A": "Jamming attack on RF communication", "B": "Replay attack on wireless signals", "C": "Insecure data transfer and storage", "D": "Credential theft via web application"}, "answer": "C"}, {"num": 449, "text": "During a red team engagement at a manufacturing company in Dallas,\npenetration tester Tyler gains access to a Windows workstation. Later in the\nexercise, he reviews his exfiltrated logs and finds detailed records of employee\nlogins, email drafts, and sensitive data entered into desktop applications. The\ncollection occurred without requiring browser injection or physical device\naccess, and no kernel drivers were installed. Which type of keylogger did Tyler\nmost likely deploy?", "options": {"A": "JavaScript Keylogger", "B": "Hardware Keylogger", "C": "Kernel Keylogger", "D": "Application Keylogger"}, "answer": "D"}, {"num": 140, "text": "A financial institution’s online banking platform is experiencing intermittent\ndowntime caused by a sophisticated DDoS attack that combines SYN floods and\nHTTP GET floods from a distributed botnet. Standard firewalls and load\nbalancers are unable to mitigate the attack without affecting legitimate users.\n\nTo protect their infrastructure and maintain service availability, which advanced\nmitigation strategy should the institution implement?", "options": {"A": "Utilize a cloud-based DDoS protection service that offers multi-layer traffic scrubbing\nand auto-scaling", "B": "Configure firewalls to block all incoming SYN and HTTP requests from external IPs", "C": "Increase server bandwidth and apply basic rate limiting on incoming traffic", "D": "Deploy an Intrusion Prevention System (IPS) with deep packet inspection capabilities"}, "answer": "A"}, {"num": 238, "text": "A penetration tester is investigating a web server that allows for unrestricted\nfile uploads. The server accepts files without proper validation or sanitization of\nfile types.\n\nWhich technique should the tester use to exploit this vulnerability and gain\npotentially control of the server?", "options": {"A": "Perform a SQL injection attack to extract sensitive database information", "B": "Use a Cross-Site Scripting (XSS) attack to steal user session cookies", "C": "Conduct a brute-force attack on the server’s FTP service to gain access", "D": "Upload a shell script disguised as an image file to execute commands on the server"}, "answer": "D"}, {"num": 155, "text": "A penetration tester identifies malware on a system that hides its presence and\ngives an attacker access to administrative functions without being detected.\n\nWhat type of malware is this?", "options": {"A": "Rootkit", "B": "Ransomware", "C": "Keylogger", "D": "Virus"}, "answer": "A"}, {"num": 9, "text": "You are a security analyst investigating a network compromise. The infected\nsystems are receiving external instructions, masking the control traffic using\nwidely allowed protocols like HTTP and DNS. The payloads are stealthy and\nmodify system components without saving files to disk.\n\nWhat would be the most effective action to detect and disrupt this kind of\nmalware communication?", "options": {"A": "Focus on updating antivirus signatures regularly to catch known malware variants.", "B": "Configure proxy servers to allow only encrypted traffic and block all plain HTTP\nrequests.", "C": "Use behavioral analytics to monitor for irregular outbound requests and abnormal\napplication behavior.", "D": "Implement port blocking for common malware-associated ports like 6667 and 12345."}, "answer": "C"}, {"num": 161, "text": "A penetration tester is assessing a web application that does not properly\nsanitize user input in the search field. The tester suspects the application is\nvulnerable to a SQL injection attack.\n\nWhich approach should the tester take to confirm the vulnerability?", "options": {"A": "Perform a brute-force attack on the login page to identify weak passwords", "B": "Input a SQL query such as ‘ OR 1=1 -- into the search field to check for SQL injection", "C": "Use directory traversal in the search field to access sensitive files on the server", "D": "Inject JavaScript into the search field to perform a Cross-Site Scripting (XSS) attack"}, "answer": "B"}, {"num": 510, "text": "A technology consulting firm in Portland, Oregon began experiencing repeated\ntopology recalculations across its switching infrastructure. Shortly after a newly\nconnected device came online in a conference room, spanning-tree\nconvergence events were triggered across multiple distribution switches.\nEngineers determined that the access-layer interface connected to that device\nwas influencing path-selection decisions, introducing a more favorable bridge\npriority value into the environment and affecting the established hierarchy. To\npreserve the intended switching structure and prevent unauthorized devices\nfrom altering root selection decisions, which control should be employed?", "options": {"A": "Configuring Loop Guard on non-designated ports", "B": "Activating UDLD (Unidirectional Link Detection) on uplinks", "C": "Enabling BPDU Guard on edge ports", "D": "Applying Root Guard on designated interfaces"}, "answer": "D"}, {"num": 49, "text": "A leading online retailer has been experiencing a series of security incidents\ninvolving unauthorized access to customer accounts and fraudulent\ntransactions. Upon investigation, it is suspected that attackers are employing\nsophisticated session-hijacking techniques to compromise user sessions and\ncarry out illicit activities. The security team is tasked with implementing robust\nmeasures to prevent further breaches and protect customer trust.\n\nGiven the scenario described, which advanced session hijacking technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nsecurity of online transactions on the retailer’s website?", "options": {"A": "Clickjacking Attack Embedding Malicious Iframes to Trick Users into Performing Unintended\nActions on the Retailer’s Website", "B": "Credential Stuffing Attack Using Stolen Credentials to Hijack Active User Sessions and\nPerform Fraudulent Activities", "C": "Cross-Site Request Forgery (CSRF) Attack Manipulating User Requests to Initiate Unauthorized\nTransactions", "D": "Session Replay Attack Capturing and Replaying Encrypted Session Tokens to Gain\nUnauthorized Access"}, "answer": "D"}, {"num": 436, "text": "You are a wireless auditor at SeaFront Labs in San Diego, California, engaged to\nreview the radio-layer protections used by a biotech research facility. While\ncapturing traffic in monitor mode, you observe frames that include a CCMP-like\nheader and AES-based encryption, and you note the use of a four-way\nhandshake with a packet number (PN) for replay protection – features that were\nintroduced to replace older TKIP/RC4 approaches. Based on these observed\ncharacteristics, which wireless encryption protocol is the access point most\nlikely using?", "options": {"A": "WPA2", "B": "WPA", "C": "WEP", "D": "WPA3"}, "answer": "A"}, {"num": 341, "text": "During a red team assessment at Alpine Manufacturing Corp., network security\nconsultant Marcus Lee is instructed to evaluate the security of internal\ncommunications within their switched LAN environment. Without altering any\nswitch configurations, Marcus manages to intercept credentials being\ntransmitted between a payroll administrator’s workstation and the backend\nauthentication server. His setup reroutes the communication path through his\ntesting machine, though no proxy or VPN was involved. Analysis shows the\nredirection was achieved by injecting crafted messages that silently altered how\nthe two hosts identified each other on the local network.\n\nWhich sniffing technique did Marcus most likely use?", "options": {"A": "DNS Spoofing", "B": "Switch Port Stealing", "C": "ARP Spoofing", "D": "MAC Flooding"}, "answer": "C"}, {"num": 181, "text": "An ethical hacker is conducting a penetration test on a company’s network with\nfull knowledge and permission from the organization.\n\nWhat is this type of hacking called?", "options": {"A": "Grey Hat Hacking", "B": "White Hat Hacking", "C": "Blue Hat Hacking", "D": "Black Hat Hacking"}, "answer": "B"}, {"num": 158, "text": "During a network analysis at a mid-sized enterprise, a security engineer detects\nirregular DHCP behavior. Multiple endpoints are being assigned incorrect\ngateway and DNS settings, causing loss of connectivity and redirection to\nunauthorized servers. Packet captures show that clients are receiving IP address\noffers from more than one DHCP source. Upon further investigation, the logs\nconfirm that the access switch is forwarding DHCP responses from all connected\nports without filtering. This indicates that an unauthorized (rogue DHCP server\nhas been introduced into the network, impersonating the legitimate server and\nresponding to client DHCPDISCOVER messages.\n\nTo prevent this type of attack from occurring in the future, what security feature\nshould the administrator enable?", "options": {"A": "DHCP snooping on trusted interfaces", "B": "ARP inspection across VLANs", "C": "Static DHCP reservations for clients", "D": "Port security on all trunk ports"}, "answer": "A"}, {"num": 190, "text": "A penetration tester is hired to legally assess the security of a company’s\nnetwork by identifying vulnerabilities and attempting to exploit them.\n\nWhat type of hacker is this?", "options": {"A": "White Hat", "B": "Script Kiddie", "C": "Black Hat", "D": "Grey Hat"}, "answer": "A"}, {"num": 104, "text": "During a penetration test, a security analyst encounters a web page that returns\nidentical generic error messages regardless of input. To test for SQL injection,\nthey submit a query that includes AND 1=1 and later AND 1=2, observing a\nchange in the page content.\n\nWhat type of injection is being tested?", "options": {"A": "The analyst is measuring response delays to infer true/false outcomes.", "B": "The analyst is appending a UNION clause to extract data from additional tables.", "C": "The analyst is triggering visible database errors to gain structural insights.", "D": "The analyst is using conditional logic to infer database behavior from page\nresponses."}, "answer": "D"}, {"num": 4, "text": "A cybersecurity team at a multinational company notices unusual network\ntraffic on their Bluetooth devices. It is suspected to be a Bluesnarfing attack,\naimed at accessing unauthorized information from Bluetooth-enabled devices.\n\nWhich of the following would be the most effective countermeasure to prevent\nfurther unauthorized access?", "options": {"A": "Increase the complexity and length of the PIN codes on Bluetooth devices.", "B": "Implement network-level encryption on all data transmission over Bluetooth.", "C": "Disable “Discoverable Mode” and activate “Non-discoverable Mode” on all Bluetooth\ndevices.", "D": "Regularly update Bluetooth devices to the latest firmware versions."}, "answer": "C"}, {"num": 295, "text": "Emily, a security engineer at a Chicago-based healthcare provider, is auditing\nthe organization’s new cloud environment after a breach where sensitive\npatient records were exposed. Her investigation reveals that the root cause was\nthe lack of encryption during data transmission between end-user devices and\ncloud storage. To mitigate this issue and align with HIPAA compliance\nrequirements, Emily must prioritize addressing the correct cloud computing\nsecurity risk.\n\nWhich cloud computing threat should Emily address to mitigate the risk of\nsensitive data being exposed during transmission?", "options": {"A": "Multi-Tenancy and Physical Security", "B": "Incidence Analysis and Forensic Support", "C": "Service and Data Integration", "D": "Infrastructure Security"}, "answer": "D"}, {"num": 392, "text": "Maya Patel from SecureHorizon Consulting is investigating a breach at Dallas\nGeneral Hospital in Texas after a nurse misplaced a smartphone containing\npatient management software. Although the device remained active on the\nnetwork, administrators had no way to identify its physical whereabouts,\ndelaying incident response and allowing sensitive medical records to be\nexposed for hours. Which mobile security guideline would have most directly\nreduced the impact of this incident?", "options": {"A": "Install device tracking software that allows the device to be located remotely", "B": "Use anti-virus and data loss prevention (DLP) solutions", "C": "Utilize a secure VPN connection while accessing public Wi-Fi networks", "D": "Register devices with a remote locate and wipe facility"}, "answer": "D"}, {"num": 192, "text": "A global fintech company that processes millions of online payments daily\nbegins receiving alarming emails from an unknown threat actor claiming to\nrepresent a notorious hacktivist group. The email includes a demand for 20 BTC\nin cryptocurrency, warning that a large-scale DDoS attack will cripple their\ninfrastructure if the ransom is not paid within 72 hours. To prove their\nseriousness, the attacker initiates a short-lived HTTP flood targeting the\ncompany’s checkout service. Within minutes, legitimate users report long delays\nand service timeouts during payment processing. The incident response team\nobserves a significant spike in POST requests with incomplete payloads,\noverwhelming the application layer and causing partial service disruptions. The\nattack ceases after 15 minutes, followed by a second email reinforcing the\nransom demand and threatening a more severe attack.\n\nWhat type of DDoS attack is being carried out in this scenario?", "options": {"A": "Recursive GET flood disguised as crawling", "B": "Pulse wave attack with burst patterns", "C": "DDoS attack combining threat and extortion", "D": "DRDoS attack using intermediaries"}, "answer": "C"}];
const PER_PAGE = 10;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PER_PAGE);

let currentPage = 0;
// State: { [qIndex]: { selected: 'A'|null, submitted: bool } }
const state = {};

(function() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('ceh_quiz_state_random_125_A')); } catch(e) {}
  for (let i = 0; i < QUESTIONS.length; i++) {
    state[i] = (saved && saved[i]) ? saved[i] : { selected: null, submitted: false };
  }
})();

function saveState() {
  try { localStorage.setItem('ceh_quiz_state_random_125_A', JSON.stringify(state)); } catch(e) {}
}

function getPageQuestions(page) {
  const start = page * PER_PAGE;
  return QUESTIONS.slice(start, Math.min(start + PER_PAGE, QUESTIONS.length));
}

function render() {
  const qs = getPageQuestions(currentPage);
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';

  qs.forEach((q, localIdx) => {
    const globalIdx = currentPage * PER_PAGE + localIdx;
    const s = state[globalIdx];
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + globalIdx;

    if (s.submitted) {
      if (s.selected === q.answer) card.classList.add('correct');
      else card.classList.add('wrong');
    }

    const optLetters = Object.keys(q.options);

    let optionsHtml = '';
    optLetters.forEach(letter => {
      let cls = 'option-btn';
      if (s.submitted) {
        if (letter === q.answer) cls += ' correct-ans';
        else if (letter === s.selected && s.selected !== q.answer) cls += ' wrong-ans';
      } else if (letter === s.selected) {
        cls += ' selected';
      }
      const clickHandler = s.submitted ? '' : `onclick="selectOption(${globalIdx}, '${letter}')"`;
      const pointerStyle = s.submitted ? 'style="cursor:default"' : '';
      optionsHtml += `<div class="${cls}" ${clickHandler} ${pointerStyle}>
        <span class="opt-letter">${letter}</span>
        <span>${escHtml(q.options[letter])}</span>
      </div>`;
    });

    const isCorrect = s.submitted && s.selected === q.answer;
    const isWrong = s.submitted && s.selected !== q.answer;
    const revealCls = s.submitted ? (isCorrect ? 'answer-reveal ok show' : 'answer-reveal no show') : 'answer-reveal';
    const revealMsg = isCorrect
      ? '✓ 正確！'
      : isWrong
        ? `✗ 錯誤，正確答案是 ${q.answer}`
        : '';

    const statusIcon = isCorrect ? '✅' : isWrong ? '❌' : '';
    const submitDisabled = (!s.selected && !s.submitted) ? 'disabled' : '';
    const submitCls = s.submitted ? 'submit-btn submitted' : 'submit-btn';
    const submitLabel = s.submitted ? '已提交' : '提交';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q #${q.num}</span>
        <span class="q-status-icon">${statusIcon}</span>
      </div>
      <div class="q-text">${escHtml(q.text)}</div>
      <div class="options">${optionsHtml}</div>
      <div class="${revealCls}">${revealMsg}</div>
      <div class="submit-row">
        <button class="${submitCls}" id="sub-${globalIdx}" onclick="submitQuestion(${globalIdx})" ${s.submitted ? 'disabled' : submitDisabled}>${submitLabel}</button>
      </div>
    `;

    area.appendChild(card);
  });

  // Update pagination
  document.getElementById('page-info').textContent = `第 ${currentPage + 1} 頁 / ${TOTAL_PAGES} 頁`;
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage === TOTAL_PAGES - 1;

  renderPageDots();
  updateStats();
  updateSidebar();
  updateProgress();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g, '<br>');
}

function selectOption(globalIdx, letter) {
  if (state[globalIdx].submitted) return;
  state[globalIdx].selected = letter;
  saveState();
  render();
}

function submitQuestion(globalIdx) {
  if (!state[globalIdx].selected) return;
  if (state[globalIdx].submitted) return;
  state[globalIdx].submitted = true;
  saveState();
  render();
}

function changePage(dir) {
  const newPage = currentPage + dir;
  if (newPage < 0 || newPage >= TOTAL_PAGES) return;
  currentPage = newPage;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToPage(page) {
  currentPage = page;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToQuestionPage(globalIdx) {
  const page = Math.floor(globalIdx / PER_PAGE);
  currentPage = page;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
  requestAnimationFrame(() => {
    const card = document.getElementById('card-' + globalIdx);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
}
function renderPageDots() {
  const container = document.getElementById('page-dots');
  container.innerHTML = '';
  for (let p = 0; p < TOTAL_PAGES; p++) {
    const start = p * PER_PAGE;
    const end = Math.min(start + PER_PAGE, QUESTIONS.length);
    let hasWrong = false, hasAnswered = false, allCorrect = true;
    for (let i = start; i < end; i++) {
      if (state[i].submitted) {
        hasAnswered = true;
        if (state[i].selected !== QUESTIONS[i].answer) { hasWrong = true; allCorrect = false; }
      } else {
        allCorrect = false;
      }
    }
    const dot = document.createElement('button');
    dot.className = 'page-dot';
    if (p === currentPage) dot.classList.add('active');
    if (hasWrong) dot.classList.add('has-wrong');
    else if (hasAnswered && allCorrect) dot.classList.add('all-correct');
    dot.textContent = p + 1;
    dot.onclick = () => goToPage(p);
    container.appendChild(dot);
  }
}

function updateStats() {
  let answered = 0, correct = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) {
      answered++;
      if (state[i].selected === QUESTIONS[i].answer) correct++;
    }
  }
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
}

function updateProgress() {
  let answered = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) answered++;
  }
  const pct = (answered / QUESTIONS.length * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSidebar() {
  const list = document.getElementById('wrong-list');
  const wrongItems = [];
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted && state[i].selected !== QUESTIONS[i].answer) {
      wrongItems.push({ i, q: QUESTIONS[i], selected: state[i].selected });
    }
  }

  if (wrongItems.length === 0) {
    list.innerHTML = '<div id="empty-msg">尚無錯題<br>繼續加油！✓</div>';
  } else {
    list.innerHTML = wrongItems.map(({ i, q, selected }) => `
      <div class="wrong-item" onclick="goToQuestionPage(${i})">
        <span class="qnum">Q #${q.num}</span>
        <span class="wrong-ans">答 ${selected || '—'}</span>
        <span class="right-ans">正 ${q.answer}</span>
      </div>
    `).join('');
  }
}

// Sidebar resize
(function() {
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebar-resize');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const newW = Math.max(120, Math.min(600, startW + (e.clientX - startX)));
    sidebar.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

function resetProgress() {
  if (!confirm('確定要清除所有答題紀錄，重新開始嗎？')) return;
  try { localStorage.removeItem('ceh_quiz_state_random_125_A'); } catch(e) {}
  location.reload();
}

// Initial render
render();
</script>
</body>
</html>
