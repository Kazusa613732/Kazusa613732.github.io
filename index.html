<!doctype html>
<html lang="zh-TW" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Poi Blog</title>
    <meta name="description" content="資訊安全與網路安全、滲透測試部落格，涵蓋 web、CTF writeup、滲透測試、HTB等主題。" />
    <meta name="keywords" content="Information security and cybersecurity, penetration testing blog, covering web, CTF write-ups, penetration testing, HTB." />
    <meta name="author" content="Poi Blog" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Poi Blog" />
    <meta property="og:description" content="Poi's Blog" />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663502338621/R9CiYMd9vUY86Cv4sPQyZp/og-card-NPyfH3rLoZBKVqio3cHyww.webp" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍💻</text></svg>" />

    <!-- IBM Plex Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Theme initialization script (prevent flash) -->
    <script>
      (function() {
        const stored = localStorage.getItem('cyberblog-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.className = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const endpoint = '%VITE_ANALYTICS_ENDPOINT%';
      const websiteId = '%VITE_ANALYTICS_WEBSITE_ID%';

      if (
        endpoint &&
        websiteId &&
        !endpoint.startsWith('%VITE_') &&
        !websiteId.startsWith('%VITE_')
      ) {
        const analytics = document.createElement('script');
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\/$/, '')}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.body.appendChild(analytics);
      }
    </script>
  </body>
</html>
