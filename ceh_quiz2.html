 name resolution to capture password hashes."}, "answer": "D"}, {"num": 166, "text": "During a comprehensive internal penetration test, a tester attempts to\nenumerate open services using a UDP scan across a wide range of ports on a\ntarget system. After transmitting multiple UDP probes, the tester observes that\nsome ports generate immediate ICMP “Destination Unreachable – Port\nUnreachable” (Type 3, Code 3 responses. However, the majority of the ports\nremain silent, providing no reply or error message. No firewall rules or IDS\nalerts have been triggered at this stage. The tester suspects that the scan\nresults are inconclusive for several of the probed ports.\nBased on the observed behavior, what can the tester reasonably conclude\nabout the non-responsive ports?", "options": {"A": "The system blocked all probes after rate-limiting was detected.", "B": "They may be open or filtered, requiring retransmission.", "C": "The ports are likely closed because no ICMP response was received.", "D": "They may correspond to some services requiring three-way handshakes."}, "answer": "B"}, {"num": 167, "text": "During a targeted phishing campaign, an attacker gains access to a trusted\ninternal system within a corporate network protected by advanced firewalls,\nIDS, and email security gateways. To maintain persistence and evade content\ninspection, the attacker crafts a malicious HTML email attachment containing\nobfuscated JavaScript code. When the user opens the attachment in a browser,\na hidden JavaScript blob dynamically reconstructs a malware payload and\ntriggers an automatic file download on the client side. No external connections\nare initiated during this process, making it difficult for network security tools to\ndetect or block the attack.\nWhich evasion technique is being employed to bypass the firewall and IDS\nprotections?", "options": {"A": "HTTP header spoofing", "B": "Port forwarding", "C": "HTML smuggling", "D": "Cross-site scripting"}, "answer": "C"}, {"num": 168, "text": "During a red team simulation, an attacker attempts to deliver a payload to a\nweb server hosted within a segmented enterprise network. The target\nenvironment uses a Network-based Intrusion Detection System (NIDS that\nperforms deep packet inspection and pattern matching against known attack\nsignatures. To avoid triggering alarms, the attacker decides to manipulate the\nstructure of the packets rather than the actual attack code. The approach\ninvolves crafting packets with intentionally malformed checksums and\nmodifying specific fields so that the packets are accepted by the IDS but\ndiscarded by the destination system. This leads the IDS to process and log a\ndifferent set of data than what the actual target receives, effectively bypassing\nsignature detection.\nWhich evasion technique is the attacker employing to deceive the IDS into\nmisinterpreting the attack traffic while the payload remains unchanged on the\ntarget system?", "options": {"A": "Session splicing", "B": "Polymorphic shellcode", "C": "Fragmentation attack", "D": "Insertion attack"}, "answer": "D"}, {"num": 169, "text": "A penetration tester is evaluating a secure web application that uses HTTPS,\nsecure cookie flags, and regenerates session IDs only during specific user\nactions.\nTo hijack a legitimate user’s session without triggering security alerts, which\nadvanced session hijacking technique should the tester employ?", "options": {"A": "Perform a man-in-the-middle attack by exploiting certificate vulnerabilities.", "B": "Conduct a session token prediction attack by analyzing session ID patterns.", "C": "Implement a Cross-Site Scripting (XSS) attack to steal session tokens.", "D": "Use a session fixation attack by setting a known session ID before the user logs in."}, "answer": "D"}, {"num": 170, "text": "A penetration tester is trying to attack a wireless network that uses WPA3\nencryption. The tester wants to exploit the handshake to obtain the passwordbut realizes WPA3 has stronger protections.\nWhat would be the most effective approach to compromise the network?", "options": {"A": "Perform a brute-force attack directly on the WPA3 handshake", "B": "Execute a dictionary attack on the WPA3 handshake using common passwords", "C": "Perform a SQL injection attack on the router’s login page", "D": "Downgrade the connection to WPA2 and capture the handshake to crack the key"}, "answer": "D"}, {"num": 171, "text": "A company hires a hacker to test its network security by simulating real-world\nattacks. The hacker has permission and operates within legal boundaries.\nWhat is this type of hacker called?", "options": {"A": "Grey Hat Hacker", "B": "White Hat Hacker", "C": "Black Hat Hacker", "D": "Script Kiddie"}, "answer": "B"}, {"num": 172, "text": "A multinational organization is implementing a security upgrade for its\ncorporate wireless infrastructure. The current WPA2-Personal configuration\nrelies on a shared passphrase, which the IT team finds difficult to rotate and\nmanage securely across hundreds of employee devices. To enhance security\nand scalability, the organization decides to migrate to WPA2-Enterprise. The new\nsetup must allow for centralized control of user authentication, support\ncertificate-based identity verification, and ensure that each authenticated client\nis assigned a unique session encryption key to prevent key reuse and limit the\nblast radius of potential breaches.\nWhich component is essential for enabling this centralized, certificate-based\nauthentication with unique key generation per session in a WPA2-Enterprise\nenvironment?", "options": {"A": "Temporal Key Integrity Protocol (TKIP)", "B": "Opportunistic Wireless Encryption (OWE)", "C": "Pre-Shared Key (PSK)", "D": "RADIUS with Extensible Authentication Protocol (EAP)"}, "answer": "D"}, {"num": 173, "text": "A penetration tester gains access to a target system through a vulnerability in a\nthird-party software application.\nWhat is the most effective next step to take to gain full control over the system?", "options": {"A": "Execute a Cross-Site Request Forgery (CSRF) attack to steal session data", "B": "Conduct a denial-of-service (DoS) attack to disrupt the system’s services", "C": "Perform a brute-force attack on the system’s root password", "D": "Use a privilege escalation exploit to gain administrative privileges on the system"}, "answer": "D"}, {"num": 174, "text": "During a black-box security assessment of a large enterprise network, the\npenetration tester scans the internal environment and identifies that TCP port\n389 is open on a domain controller. Upon further investigation, the tester runs\nthe ldapsearch utility without providing any authentication credentials and\nsuccessfully retrieves a list of usernames, email addresses, and departmental\n affiliations from the LDAP directory. The tester notes that this sensitive\ninformation was disclosed without triggering any access control mechanisms or\nrequiring login credentials.\nBased on this behavior, what type of LDAP access mechanism is most likely\nbeing exploited?", "options": {"A": "LDAP via RADIUS relay binding", "B": "Anonymous LDAP", "C": "Authenticated LDAP with Kerberos", "D": "LDAP over SSL (LDAPS)"}, "answer": "B"}, {"num": 175, "text": "During a comprehensive security audit of a financial institution’s online\ninfrastructure, a penetration tester observes abnormal traffic redirection\npatterns affecting the institution’s primary domain. Customers who attempt to\naccess the legitimate website are seamlessly redirected to a visually identical\nphishing page, hosted on a suspicious IP address. After tracing the DNS\nresolution path, the tester discovers that the authoritative DNS server has been\ncompromised, and its records have been altered to point to the attacker’s\nserver. The redirection affects all DNS queries for the domain, indicating\nunauthorized control over name resolution infrastructure, rather than local\ncache poisoning or client-side manipulation. The tester confirms that this\nredirection was achieved by tampering with the DNS zone records themselves.\nWhich technique is being used in this scenario?", "options": {"A": "Carry out DNS server hijacking by tampering with the legitimate name resolution\ninfrastructure.", "B": "Perform DNS rebinding in the import functionality to manipulate browser-origin\ninteractions.", "C": "Establish covert communication using DNS tunneling over standard DNS queries.", "D": "Initiate a DNS amplification attack by leveraging recursive servers to flood the target."}, "answer": "A"}, {"num": 176, "text": "During a cryptographic audit of a legacy system, a security analyst observes that\nan outdated block cipher is leaking key-related information when analyzing\nlarge sets of plaintext-ciphertext pairs.\nWhat approach might an attacker exploit here?", "options": {"A": "Modify the padding to obtain plaintext", "B": "Use linear approximations to infer secret bits", "C": "Launch a key replay through IV duplication", "D": "Attack the hash algorithm for collisions"}, "answer": "B"}, {"num": 177, "text": "A red team operator wants to obtain credentials from a Windows machine\nwithout touching the LSASS process memory, as security controls and Credential\nGuard are active. Instead, they leverage a method that uses the Security\nSupport Provider Interface (SSPI to generate NetNTLM responses within the context of the logged-in user and collect those responses for offline cracking.\nWhich attack technique is being used in this scenario?", "options": {"A": "Internal Monologue attack technique executed through OS authentication protocol\nmanipulations.", "B": "Replay attack attempt by reusing captured authentication traffic sequences.", "C": "Hash injection approach using credential hashes for authentication purposes.", "D": "Pass-the-ticket attack method involving forged tickets for network access."}, "answer": "A"}, {"num": 178, "text": "A penetration tester discovers that a web application is using outdated SSL/TLS\nprotocols (TLS 1.0 to secure communication.\nWhat is the most effective way to exploit this vulnerability?", "options": {"A": "Conduct a Cross-Site Scripting (XSS) attack on the application", "B": "Use a man-in-the-middle (MitM) attack to intercept and decrypt traffic", "C": "Execute a SQL injection attack on the application’s backend", "D": "Perform a brute-force attack on the SSL/TLS handshake"}, "answer": "B"}, {"num": 179, "text": "Which of the following best describes the role of a penetration tester?", "options": {"A": "A hacker who spreads malware to compromise systems", "B": "A security professional hired to identify and exploit vulnerabilities with permission", "C": "A hacker who gains unauthorized access to systems for malicious purposes", "D": "A developer who writes malicious code for cyberattacks"}, "answer": "B"}, {"num": 180, "text": "Upon analyzing anomalies in your network’s traffic, you discover traces of an\ninsidious malware strain named “ShadowFlee”. This malware operates without\nwriting files to disk, harnessing system utilities and scripts like PowerShell to\nstealthily execute tasks, effectively evading traditional detection mechanisms.\nFurther, it exploits legitimate processes to propagate internally.\nGiven “ShadowFlee’s” elusive attributes, which strategy would offer the most\nfocused countermeasure?", "options": {"A": "Regularly clean up temporary folders and enforce stricter permissions on system directories.", "B": "Schedule frequent system reboots to clear memory and apply patches to all networked\ndevices.", "C": "Isolate affected systems, deploy deep packet inspection on network traffic, and block\ncommunications to blacklisted IPs.", "D": "Restrict and monitor the execution of scripts and system tools, especially those invoked by\nunsanctioned processes."}, "answer": "D"}, {"num": 181, "text": "An ethical hacker is conducting a penetration test on a company’s network with\nfull knowledge and permission from the organization.\nWhat is this type of hacking called?", "options": {"A": "Grey Hat Hacking", "B": "White Hat Hacking", "C": "Blue Hat Hacking", "D": "Black Hat Hacking"}, "answer": "B"}, {"num": 182, "text": "What is the main difference between ethical hacking and malicious hacking?", "options": {"A": "Ethical hackers use different tools than malicious hackers", "B": "Ethical hacking is illegal, while malicious hacking is legal", "C": "Ethical hacking is performed with permission, while malicious hacking is unauthorized", "D": "Ethical hackers always work alone, while malicious hackers work in teams"}, "answer": "C"}, {"num": 183, "text": "A security analyst is tasked with gathering detailed information about an\norganization’s network infrastructure without making any direct contact that\ncould be logged or trigger alarms.\nWhich method should the analyst use to obtain this information covertly?", "options": {"A": "Initiate social engineering attacks to elicit information from employees", "B": "Perform a DNS brute-force attack to discover subdomains", "C": "Use network mapping tools to scan the organization’s IP range", "D": "Examine leaked documents or data dumps related to the organization"}, "answer": "D"}, {"num": 184, "text": "A penetration tester is assessing a company’s HR department for vulnerability\nto social engineering attacks using knowledge of recruitment and onboarding\nprocesses. What is the most effective technique to obtain network access credentials\nwithout raising suspicion?", "options": {"A": "Conduct a phone call posing as a new employee to request password resets", "B": "Create a convincing fake onboarding portal that mimics the company’s internal systems", "C": "Develop a fake social media profile to connect with HR employees and request sensitive\ninformation", "D": "Send a generic phishing email with a link to a fake HR policy document"}, "answer": "B"}, {"num": 185, "text": "A penetration tester is mapping a Windows-based internal network. The tester\nnotices that TCP port 139 and UDP port 137 are open on multiple systems. File\nand printer sharing is enabled.\nTo retrieve hostnames, user details, and domain roles without triggering alerts,\nwhich tool and method would be most effective?", "options": {"A": "Perform LDAP enumeration via anonymous bind.", "B": "Use pspasswd to change remote passwords.", "C": "Run nbtstat -A to query the NetBIOS name table.", "D": "Use psloggedon to retrieve remote login sessions."}, "answer": "C"}, {"num": 186, "text": "A penetration tester is attempting to gain access to a wireless network that is\nsecured with WPA2 encryption. The tester successfully captures the WPA2\nhandshake but now needs to crack the pre-shared key.\nWhat is the most effective method to proceed?", "options": {"A": "Conduct a de-authentication attack to disconnect all clients from the network", "B": "Execute a SQL injection attack on the router’s login page", "C": "Use a dictionary attack against the captured WPA2 handshake to crack the key", "D": "Perform a brute-force attack using common passwords against the captured handshake"}, "answer": "C"}, {"num": 187, "text": "During a security evaluation of a smart agriculture setup, an analyst\ninvestigates a cloud-managed irrigation controller. The device is found to\ntransmit operational commands and receive firmware updates overunencrypted HTTP. Additionally, it lacks mechanisms to verify the integrity or\nauthenticity of those updates. This vulnerability could allow an adversary to\nintercept communications or inject malicious firmware, leading to unauthorized\ncontrol over the device’s behavior or denial of essential functionality.\nWhich IoT threat category does this situation best illustrate?", "options": {"A": "Insecure network services", "B": "Insecure ecosystem interfaces", "C": "Insecure default settings", "D": "Insufficient privacy protection"}, "answer": "B"}, {"num": 188, "text": "A penetration tester has completed a vulnerability scan on a company’s internal\nnetwork. The scan reveals multiple low-risk vulnerabilities, but one high-risk\nvulnerability is associated with outdated server software.\nWhat should the tester prioritize as the next step?", "options": {"A": "Perform a brute-force attack on the server to gain access", "B": "Focus on exploiting the low-risk vulnerabilities first", "C": "Verify if the high-risk vulnerability is exploitable by checking for known exploits", "D": "Ignore the high-risk vulnerability and proceed with testing other systems"}, "answer": "C"}, {"num": 189, "text": "A penetration tester suspects that a web application’s product search feature is\nvulnerable to SQL injection. The tester needs to confirm this by manipulating\nthe SQL query.\nWhat is the best technique to test for SQL injection?", "options": {"A": "Inject a malicious script into the search field to test for Cross-Site Scripting (XSS)", "B": "Use directory traversal syntax in the search field to access server files", "C": "Insert admin ‘-- in the search field to attempt bypassing authentication", "D": "Input 1 OR 1=1 in the search field to retrieve all products from the database"}, "answer": "D"}, {"num": 190, "text": "A penetration tester is hired to legally assess the security of a company’s\nnetwork by identifying vulnerabilities and attempting to exploit them.What type of hacker is this?", "options": {"A": "White Hat", "B": "Script Kiddie", "C": "Black Hat", "D": "Grey Hat"}, "answer": "A"}, {"num": 191, "text": "A penetration tester suspects that a web application’s user profile page is\nvulnerable to SQL injection, as it uses the userID parameter in SQL queries\nwithout proper sanitization.\nWhich technique should the tester use to confirm the vulnerability?", "options": {"A": "Attempt a directory traversal attack using the userID parameter", "B": "Modify the userID parameter in the URL to ‘ OR ‘1’=’1 and check if it returns multiple profiles", "C": "Inject HTML code into the userID parameter to test for Cross-Site Scripting (XSS)", "D": "Use the userID parameter to perform a brute-force attack on the admin login page"}, "answer": "B"}, {"num": 192, "text": "A global fintech company that processes millions of online payments daily\nbegins receiving alarming emails from an unknown threat actor claiming to\nrepresent a notorious hacktivist group. The email includes a demand for 20 BTC\nin cryptocurrency, warning that a large-scale DDoS attack will cripple their\ninfrastructure if the ransom is not paid within 72 hours. To prove their\nseriousness, the attacker initiates a short-lived HTTP flood targeting the\ncompany’s checkout service. Within minutes, legitimate users report long delays\nand service timeouts during payment processing. The incident response team\nobserves a significant spike in POST requests with incomplete payloads,\noverwhelming the application layer and causing partial service disruptions. The\nattack ceases after 15 minutes, followed by a second email reinforcing the\nransom demand and threatening a more severe attack.\nWhat type of DDoS attack is being carried out in this scenario?", "options": {"A": "Recursive GET flood disguised as crawling", "B": "Pulse wave attack with burst patterns", "C": "DDoS attack combining threat and extortion", "D": "DRDoS attack using intermediaries"}, "answer": "C"}, {"num": 193, "text": "During a physical penetration test simulating a social engineering attack, a\nthreat actor walks into the lobby of a target organization dressed as a field\ntechnician from a known external vendor. Carrying a fake ID badge and\nreferencing a known company name, the attacker confidently claims they’ve\nbeen dispatched to perform a routine server room upgrade. Using internalsounding terminology and referencing real employee names gathered via\nOSINT, the individual conveys urgency. The receptionist, recognizing the vendor\nname and the convincing language, allows access without verifying the\ncredentials.", "options": {"A": "Trust in physical security logs used by security teams.", "B": "Perceived authority and reliance on third-party familiarity.", "C": "Leaked credentials on public networks and forums.", "D": "Misconfigured network segmentation allowing unauthorized access."}, "answer": "B"}, {"num": 194, "text": "A penetration tester evaluates the security of an iOS mobile application that\nhandles sensitive user information. The tester discovers that the application is\nvulnerable to insecure data transmission.\nWhat is the most effective method to exploit this vulnerability?", "options": {"A": "Perform a man-in-the-middle attack to intercept unencrypted data transmitted over the\nnetwork", "B": "Use a Cross-Site Request Forgery (CSRF) attack to steal user session tokens", "C": "Execute a SQL injection attack to retrieve data from the backend server", "D": "Conduct a brute-force attack on the app’s authentication system"}, "answer": "A"}, {"num": 195, "text": "A penetration tester needs to map open ports on a target network without\ntriggering the organization’s intrusion detection systems (IDS, which are\nconfigured to detect standard scanning patterns and abnormal traffic volumes.\nTo achieve this, the tester decides to use a method that leverages a third-party\nhost to obscure the origin of the scan.\nWhich scanning technique should be employed to accomplish this stealthily?", "options": {"A": "Perform a TCP SYN scan using slow-timing options", "B": "Use an Idle scan by exploiting a “zombie” host", "C": "Conduct a TCP FIN scan with randomized port sequences", "D": "Execute a UDP scan with packet fragmentation"}, "answer": "B"}, {"num": 196, "text": "A penetration tester discovers that a web application uses unsanitized user\ninput to dynamically generate file paths. The tester identifies that the\napplication is vulnerable to Remote File Inclusion (RFI.\nWhich action should the tester take to exploit this vulnerability?", "options": {"A": "Use directory traversal to access sensitive system files on the server", "B": "Inject a SQL query into the input field to perform SQL injection", "C": "Provide a URL pointing to a remote malicious script to include it in the web application", "D": "Upload a malicious shell to the server and execute commands remotely"}, "answer": "C"}, {"num": 197, "text": "During an internal penetration test within a large corporate environment, the\nred team gains access to an unrestricted network port in a public-facing\nmeeting room. Upon connecting a laptop, the tester deploys an automated toolconfigured to continuously send DHCPDISCOVER requests using thousands of\nrandomly generated spoofed MAC addresses. Within minutes, several\nemployees report that their devices are unable to access the internal network\nor obtain valid IP configurations. The IT team observes that the DHCP server’s IP\nlease pool is completely depleted, even though few devices are actually\nconnected at the time.\nWhat type of attack did the penetration tester perform?", "options": {"A": "Rogue DHCP relay injection", "B": "DHCP starvation", "C": "DNS cache poisoning", "D": "ARP spoofing"}, "answer": "B"}, {"num": 198, "text": "A penetration tester performs a vulnerability scan on a company’s web server\nand identifies several medium-risk vulnerabilities related to misconfigured\nsettings.\nWhat should the tester do to verify the vulnerabilities?", "options": {"A": "Conduct a denial-of-service (DoS) attack to test the server’s resilience", "B": "Ignore the vulnerabilities since they are medium-risk", "C": "Perform a brute-force attack on the web server’s login page", "D": "Use publicly available tools to exploit the vulnerabilities and confirm their impact"}, "answer": "D"}, {"num": 199, "text": "A cyber adversary is performing external reconnaissance on a large enterprise\nnetwork with multiple perimeter defenses in place, including packet-filtering\nfirewalls and intrusion detection systems (IDS. The goal is to enumerate the\nfirewall's rule set to identify which TCP and UDP ports are permitted for inbound\ntraffic to internal systems. To minimize noise and avoid immediate detection,\nthe attacker wants to use a method that mimics normal traffic flows while\nproviding insight into how the firewall handles packets based on port and\nprotocol combinations.\nWhich reconnaissance technique should the attacker choose to effectively map\nthe firewall’s filtering behavior without raising alerts?", "options": {"A": "Conducting full SYN scans on all ports for each discovered IP", "B": "Firewalking with manipulated TTL values to analyze ACL responses", "C": "Sending ICMP Echo requests to the network’s broadcast address", "D": "Passive DNS monitoring to observe domain-to-IP relationships"}, "answer": "B"}, {"num": 200, "text": "During a security assessment, an attacker identifies a flaw in a multi-user file\nsystem. The system first verifies access rights to a temporary file created by a\nuser. However, immediately after this verification, and before the file is\nprocessed, the attacker manages to swap the original file with a malicious\nversion. This manipulation happens in the brief interval between the system's\naccess verification and the moment it handles the file, resulting in the malicious\nfile being treated as legitimate.\nWhich vulnerability is the attacker exploiting?", "options": {"A": "Integer overflow during arithmetic computations with limited memory bounds.", "B": "Null pointer dereference leading to unexpected application behavior.", "C": "Time-of-validation/time-of-execution issue in resource management logic.", "D": "Improper certificate validation in trusted communication channels."}, "answer": "C"}, {"num": 201, "text": "A penetration tester is conducting a security assessment for a client and needs\nto capture sensitive information transmitted across multiple VLANs without\nbeing detected by the organization's security monitoring systems. The network\nemploys strict VLAN segmentation and port security measures to restrict\nunauthorized access.\nWhich advanced sniffing technique should the tester use to discreetly intercept\nand analyze traffic across all VLANs?", "options": {"A": "Deploy a rogue DHCP server to redirect network traffic", "B": "Use ARP poisoning to perform a man-in-the-middle attack", "C": "Exploit a VLAN hopping vulnerability to access multiple VLANs", "D": "Implement switch port mirroring on all VLANs"}, "answer": "C"}, {"num": 202, "text": "During a penetration test against a network defended by a signature-based\nIntrusion Detection System (IDS, the tester initiates a port scan but notices that\ntraditional scanning methods like full SYN or TCP Connect scans are being\nflagged and blocked. To evade detection, the tester modifies their approach:\nthey split the TCP headers into multiple smaller IP segments before sending\nthem across the network. This ensures that the IDS sees only incomplete\nsegments of the packet. Once these segments reach the target, the destination\nhost reassembles them and processes the scan as a normal SYN request. No\nalerts are raised on the IDS, yet the scan reveals open ports on the target.\nWhich evasion technique has the tester most likely employed to avoid\ntriggering IDS alerts?", "options": {"A": "IP decoying with randomized address positions", "B": "Packet crafting with randomized window size", "C": "Packet fragmentation to bypass filtering logic", "D": "SYN scan with spoofed MAC address"}, "answer": "C"}, {"num": 203, "text": "During a security assessment of an organization’s internal network, a\npenetration tester discovers that UDP port 123 is open on a critical host,\nindicating that the Network Time Protocol (NTP service is active. The tester\nsuspects the NTP server could reveal insights into how the internal network\nsynchronizes time, which could assist in lateral movement or correlating\ntimestamps in logs. To gather more information, the tester decides to\nenumerate the list of NTP peers and determine their synchronization status,\noffset, and stratum levels to understand the hierarchy and redundancy in the\ntime synchronization infrastructure.\nWhich command should the tester use to retrieve this specific information?", "options": {"A": "ntpq", "B": "ntpdc", "C": "ntpdate", "D": "ntptrace"}, "answer": "A"}, {"num": 204, "text": "An e-commerce platform hosted on a public cloud infrastructure begins to\nexperience significant latency and timeout issues during its peak sales hours.\nSecurity logs indicate thousands of incoming HTTP connections, each of which\nstarts sending headers extremely slowly and never completes the full request.\nOver time, the number of open connections rises beyond the server’s handling\ncapacity, leading to system instability and service unavailability. The network\nteam verifies that these connections are not transmitting malformed packets or\nhigh volumes of traffic and appear to originate from legitimate IPs.\nWhich specific DoS technique is most likely responsible for the degradation of\nservice?", "options": {"A": "UDP application-layer flooding", "B": "Fragmentation flood attack", "C": "Slowloris holding web server connections", "D": "SYN flood with spoofed source IPs"}, "answer": "C"}, {"num": 205, "text": "A penetration tester is evaluating the security of a mobile application and\ndiscovers that it lacks proper input validation. The tester suspects that the\napplication is vulnerable to a malicious code injection attack.\nWhat is the most effective way to confirm and exploit this vulnerability?", "options": {"A": "Execute a dictionary attack on the mobile app’s encryption algorithm", "B": "Perform a brute-force attack on the application’s login page to guess weak credentials", "C": "Inject a malicious JavaScript code into the input fields and observe the application’s\nbehavior", "D": "Use directory traversal to access sensitive files stored in the application’s internal\nstorage"}, "answer": "C"}, {"num": 206, "text": "A penetration tester is assessing an IoT thermostat used in a smart home\nsystem. The device communicates with a cloud server for updates and\ncommands. The tester discovers that communication between the device and\nthe cloud server is not encrypted.\nWhat is the most effective way to exploit this vulnerability?", "options": {"A": "Use a man-in-the-middle (MitM) attack to intercept and manipulate unencrypted\ncommunication", "B": "Conduct a Cross-Site Scripting (XSS) attack on the thermostat’s web interface", "C": "Perform a brute-force attack on the thermostat’s local admin login", "D": "Execute a SQL injection attack on the cloud server’s login page"}, "answer": "A"}, {"num": 207, "text": "An attacker places a malicious VM on the same physical server as a target VM in\na multi-tenant cloud environment. The attacker then extracts cryptographic\nkeys using CPU timing analysis.\nWhat type of attack was conducted?", "options": {"A": "Side-channel attack", "B": "Cache poisoned denial of service (CPDoS)", "C": "Cloud cryptojacking", "D": "Metadata spoofing"}, "answer": "A"}, {"num": 208, "text": "A penetration tester identifies that a web application’s login form is not using\nsecure password hashing mechanisms, allowing attackers to steal passwords if\nthe database is compromised. What is the best approach to exploit this vulnerability?", "options": {"A": "Capture the login request using a proxy tool and attempt to decrypt the passwords", "B": "Conduct a brute-force attack on the login form to guess weak passwords", "C": "Perform a dictionary attack using a list of commonly used passwords against the stolen\nhash values", "D": "Input a SQL query to check for SQL injection vulnerabilities in the login form"}, "answer": "C"}, {"num": 209, "text": "A penetration tester evaluates a company’s secure web application, which uses\nHTTPS, secure cookie flags, and strict session management to prevent session\nhijacking.\nTo bypass these protections and hijack a legitimate user’s session without\ndetection, which advanced technique should the tester employ?", "options": {"A": "Utilize a session fixation attack by forcing a known session ID during login", "B": "Implement a Man-in-the-Middle (MitM) attack by compromising a trusted certificate\nauthority", "C": "Exploit a timing side-channel vulnerability to predict session tokens", "D": "Perform a Cross-Site Scripting (XSS) attack to steal the session token"}, "answer": "D"}, {"num": 210, "text": "A penetration tester is assessing a company’s executive team for vulnerability\nto sophisticated social engineering attacks by impersonating a trusted vendor\nand leveraging internal communications.\nWhat is the most effective social engineering technique to obtain sensitive\nexecutive credentials without being detected?", "options": {"A": "Create a targeted spear-phishing email that references recent internal projects and\nrequests credential verification", "B": "Develop a fake social media profile to connect with executives and request private\ninformation", "C": "Conduct a phone call posing as the CEO to request immediate password changes from\nexecutives", "D": "Send a mass phishing email with a malicious link disguised as a company-wide update"}, "answer": "A"}, {"num": 211, "text": "A penetration tester is evaluating a web application that does not properly\nvalidate the authenticity of HTTP requests. The tester suspects the application\nis vulnerable to Cross-Site Request Forgery (CSRF.\nWhich approach should the tester use to exploit this vulnerability?", "options": {"A": "Inject a SQL query into the input fields to perform SQL injection", "B": "Perform a brute-force attack on the application’s login page to guess weak credentials", "C": "Create a malicious website that sends a crafted request on behalf of the user when visited", "D": "Execute a directory traversal attack to access restricted server files"}, "answer": "C"}, {"num": 212, "text": "An attacker extracts the initial bytes from an encrypted file container and uses a\ntool to iterate through numeric combinations.\nWhat type of cryptanalytic technique is being utilized?", "options": {"A": "Force encryption key through quantum solving", "B": "Seek identical digests across hash outputs", "C": "Test every possible password through automation", "D": "Analyze output length to spot anomalies"}, "answer": "C"}, {"num": 213, "text": "During an internal red team engagement, a penetration tester is tasked with\nmapping the network topology of an organization with multiple segmented\nsubnets. The tester initiates a series of traceroutes from a compromised host to\nvarious internal devices across these segments. Upon analyzing the output, the\ntester observes that a specific IP address, 10.10.10.1, consistently appears as the second-to-last hop before reaching several target systems located in different\nIP ranges. Despite varying final destination IPs, this intermediate address\nremains constant. No signs of DNS spoofing, ICMP anomalies, or host-level\nmisconfigurations are present.\nWhat does this repeated hop pattern most likely indicate in the context of\nnetwork architecture?", "options": {"A": "A core router facilitating communication across multiple internal subnets.", "B": "Presence of a transparent proxy device acting as a forwarder.", "C": "Loopback misconfiguration at the destination endpoints.", "D": "DNS poisoning at the local resolver used by the compromised host."}, "answer": "A"}, {"num": 214, "text": "A penetration tester submits altered ciphertexts to a web server and pays close\nattention to how the server responds. When the server produces different error\nmessages for certain inputs, the tester starts to infer which inputs result in valid\ninternal processing.\nWhich cryptanalytic method is being used in this scenario?", "options": {"A": "Compare traffic timing to deduce the key", "B": "Exploit padding error feedback to recover data", "C": "Flip bits randomly to scramble the decryption", "D": "Inspect randomness across multiple sessions"}, "answer": "B"}, {"num": 215, "text": "A penetration tester is tasked with uncovering historical content from a\ncompany’s website, including previously exposed login portals or sensitive\ninternal pages. Direct interaction with the live site is prohibited due to strict\nmonitoring policies. To stay undetected, the tester decides to explore\npreviously indexed snapshots of the organization’s web content saved by\nexternal sources.\nWhich approach would most effectively support this passive informationgathering objective?", "options": {"A": "Apply the cache: operator to view Google’s stored versions of target pages.", "B": "Use the intitle: login operator to list current login pages.", "C": "Search with intext: “login” site:target.com to retrieve login data.", "D": "Use the link: operator to find backlinks to login portals."}, "answer": "A"}, {"num": 216, "text": "A penetration tester is tasked with compromising a company's wireless network,\nwhich uses WPA2-PSK encryption. The tester wants to capture the WPA2\nhandshake and crack the pre-shared key.\nWhat is the most appropriate approach to achieve this?", "options": {"A": "Perform a brute-force attack directly on the WPA2 encryption", "B": "Execute a Cross-Site Scripting (XSS) attack on the router’s admin panel", "C": "Conduct a Man-in-the-Middle attack by spoofing the router’s MAC address", "D": "Use a de-authentication attack to force a client to reconnect, capturing the WPA2"}, "answer": "D"}, {"num": 217, "text": "A penetration tester evaluates a company’s susceptibility to advanced social\nengineering attacks targeting its executive team. Using detailed knowledge of\nrecent financial audits and ongoing projects, the tester crafts a highly credible\npretext to deceive executives into revealing their network credentials.\nWhat is the most effective social engineering technique the tester should\nemploy to obtain the necessary credentials without raising suspicion?", "options": {"A": "Send a mass phishing email with a link to a fake financial report", "B": "Conduct a phone call posing as an external auditor requesting access to financial systems", "C": "Create a convincing fake email from the CFO asking for immediate credential verification", "D": "Develop a spear-phishing email that references specific financial audit details and requests\nlogin confirmation"}, "answer": "D"}, {"num": 218, "text": "While conducting a covert penetration test on a UNIX-based infrastructure, the\ntester decides to bypass intrusion detection systems by sending specially\ncrafted TCP packets with an unusual set of flags enabled. These packets do not\ninitiate or complete any TCP handshake. During the scan, the tester notices that\nwhen certain ports are probed, there is no response from the target, but for\nothers, a TCP RST (reset packet is received. The tester notes that this behavior\nconsistently aligns with open and closed ports, respectively, without triggering\ndetection systems configured to monitor connection-based scans.\nBased on these observations, which scanning technique is most likely being\nused?", "options": {"A": "Xmas scan leveraging RFC 793 quirks", "B": "ACK flag scan to evaluate firewall behavior", "C": "FIN scan using stealthy flag combinations", "D": "TCP Connect scan to complete the three-way handshake"}, "answer": "C"}, {"num": 219, "text": "An ethical hacker needs to gather sensitive information about a company’s\ninternal network without engaging directly with the organization's systems to\navoid detection.\nWhich method should be employed to obtain this information discreetly?", "options": {"A": "Exploit a public vulnerability in the company’s web server", "B": "Analyze the organization’s job postings for technical details", "C": "Perform a WHOIS lookup on the company’s domain registrar", "D": "Use port scanning tools to probe the company’s firewall"}, "answer": "B"}, {"num": 220, "text": "A penetration tester finds malware that spreads across a network without user\ninteraction, replicating itself from one machine to another.\nWhat type of malware is this?", "options": {"A": "Virus", "B": "Ransomware", "C": "Keylogger", "D": "Worm"}, "answer": "D"}, {"num": 221, "text": "A penetration tester is assessing a web application that employs secure, HTTPonly cookies, regenerates session IDs upon login and uses strict session\ntimeout policies.\nTo hijack a user’s session without triggering the application's security defenses,\nwhich advanced technique should the tester utilize?", "options": {"A": "Execute a Cross-Site Request Forgery (CSRF) attack to manipulate session states", "B": "Implement a session fixation strategy by pre-setting a session ID before user\nauthentication", "C": "Conduct a network-level man-in-the-middle attack to intercept and reuse session tokens", "D": "Perform a session token prediction by analyzing session ID entropy and patterns"}, "answer": "C"}, {"num": 222, "text": "A university’s online registration system is experiencing disruptions due to a\nDDoS attack that combines DNS reflection and HTTP slowloris techniques.Standard firewalls and load balancers are unable to mitigate the attack without\nimpacting legitimate users.\nTo ensure uninterrupted registration services, which advanced mitigation\nstrategy should the university implement?", "options": {"A": "Utilize a hybrid DDoS mitigation service that offers both on-premises and cloud-based\nprotection", "B": "Deploy an Intrusion Prevention System (IPS) with deep packet inspection capabilities", "C": "Configure the firewall to block all incoming DNS and HTTP requests from external IPs", "D": "Increase server bandwidth and implement basic rate limiting on all incoming traffic"}, "answer": "A"}, {"num": 223, "text": "In a vertical privilege escalation scenario, the attacker attempts to gain access\nto a user account with higher privileges than their current level.\nWhich of the following examples describes vertical privilege escalation?", "options": {"A": "An attacker escalates from a regular user to an administrator by exploiting administrative\nfunctions.", "B": "An attacker uses an unquoted service path vulnerability to gain unauthorized access to\nanother user’s data with equivalent privileges.", "C": "An attacker exploits weak access controls to access and steal sensitive information from\nanother user’s account with alike privileges.", "D": "An attacker leverages a lack of session management controls to switch accounts and access\nresources assigned to another user with the same permissions."}, "answer": "A"}, {"num": 224, "text": "While evaluating a smart card implementation, a security analyst observes that\nan attacker is measuring fluctuations in power consumption and timing\nvariations during encryption operations on the chip. The attacker uses this\ninformation to infer secret keys used within the device.\nWhat type of exploitation is being carried out?", "options": {"A": "Disrupt control flow to modify instructions", "B": "Force session resets through input flooding", "C": "Observe hardware signals to deduce secrets", "D": "Crack hashes using statistical collisions"}, "answer": "C"}, {"num": 225, "text": "A penetration tester finds that a web application does not properly validate\nuser input and is vulnerable to reflected Cross-Site Scripting (XSS. What is the most appropriate approach to exploit this vulnerability?", "options": {"A": "Embed a malicious script in a URL and tricked a user into clicking the link", "B": "Use directory traversal to access sensitive files on the server", "C": "Perform a brute-force attack on the user login form to steal credentials", "D": "Inject a SQL query into the search form to attempt SQL injection"}, "answer": "A"}, {"num": 226, "text": "During a red team assessment, an ethical hacker is assigned the task of\nmapping a large multinational enterprise’s external attack surfaces. The target\norganization operates multiple regional websites and cloud-hosted\nenvironments under different subdomains. Due to strict rules of engagement,\nthe hacker must avoid any active scans or probes that could alert the\norganization’s security monitoring systems. The goal is to uncover as many\npublicly exposed subdomains as possible to identify potential unpatched or\nmisconfigured services that may exist under obscure or forgotten subdomains.\nWhich method should the ethical hacker use to passively enumerate the\norganization’s subdomains?", "options": {"A": "Conduct a brute-force DNS subdomain enumeration.", "B": "Leverage tools like Netcraft or DNSdumpster to gather subdomain information.", "C": "Request internal DNS records using spoofed credentials.", "D": "Attempt to guess admin credentials and access the company’s DNS portal."}, "answer": "B"}, {"num": 227, "text": "During a stealth assessment of a corporate internal network, an attacker gains\naccess to a subnet where host communications are switched and protected\nagainst common ARP poisoning techniques. While passively sniffing traffic, the\nattacker observes that the target system (Host B intermittently delays its\nresponse to ARP requests. Recognizing a potential opportunity, the attacker\ncrafts and injects a fake ARP reply that maps the target’s IP address to their own\nMAC address and sends it before the legitimate reply arrives. Over time, the\nattacker notices that packets originally intended for Host B occasionally arrive\nat their own system, especially during these ARP response delays. The switch’s\nCAM table seems to temporarily associate the target's IP with the attacker’s MAC\nand port, before reverting back once the legitimate host reasserts itself.\nWhat type of sniffing attack is the attacker performing?", "options": {"A": "Switch port stealing via timing-based ARP spoofing", "B": "ARP poisoning for MiTM interception", "C": "Passive sniffing on a switched network", "D": "Duplicate IP conflict resolution attack"}, "answer": "A"}, {"num": 228, "text": "A security researcher is analyzing a target organization’s publicly accessible\ncloud infrastructure. While reviewing the website’s HTML source code, the\nresearcher discovers direct references to files hosted on Amazon S3.\nWhat is the most effective way to identify additional publicly accessible bucket\nURLs used by the target?", "options": {"A": "Use SQL injection to extract internal file paths from the database.", "B": "Exploit XSS to force the page to reveal the S3 links.", "C": "Perform packet sniffing to intercept internal S3 bucket names.", "D": "Use Google advanced search operators to enumerate S3 bucket URLs."}, "answer": "D"}, {"num": 229, "text": "During a security assessment, a consultant investigates how the application\nhandles requests from authenticated users. They discover that once a user logs\nin, the application does not verify the origin of subsequent requests. To exploit this, the consultant creates a web page containing a malicious form that\nsubmits a funds transfer request to the application. A logged-in user, believing\nthe page is part of a promotional campaign, fills out the form and submits it.\nThe application processes the request successfully without any\nreauthentication or user confirmation, completing the transaction under the\nvictim’s session.\nWhich session hijacking technique is being used in this scenario?", "options": {"A": "Hijacking a user session using a session fixation attack", "B": "Hijacking a user session using a cross-site script attack", "C": "Hijacking a user session using a cross-site request forgery attack", "D": "Hijacking a user session using a session replay attack"}, "answer": "C"}, {"num": 230, "text": "A penetration tester is testing a web application’s product search feature, which\ntakes user input and queries the database. The tester suspects the input is not\nproperly sanitized.\nWhat is the best approach to confirm the presence of SQL injection?", "options": {"A": "Input ‘; DROP TABLE products; -- to see if the table is deleted", "B": "Inject a script like to test for Cross-Site Scripting (XSS)", "C": "Enter 1’ OR ‘1’=‘1 to check if all products are returned", "D": "Use directory traversal syntax to access restricted files on the server"}, "answer": "C"}, {"num": 231, "text": "A penetration tester is tasked with mapping an organization’s network while\navoiding detection by sophisticated intrusion detection systems (IDS. The\norganization employs advanced IDS capable of recognizing common scanning\npatterns.\nWhich scanning technique should the tester use to effectively discover live\nhosts and open ports without triggering the IDS?", "options": {"A": "Use an Idle scan leveraging a third-party zombie host", "B": "Conduct a TCP Connect scan using randomized port sequences", "C": "Perform an ICMP Echo scan to ping all network devices", "D": "Execute a FIN scan by sending TCP packets with the FIN flag set"}, "answer": "A"}, {"num": 232, "text": "During a black-box internal penetration test, a security analyst is tasked with\nidentifying potentially exploitable services running on an SNMP-enabled Linux server. The target organization uses SNMPv2, and the default community string\n“public” has not been changed. The analyst confirms that UDP port 161 is open\nand accessible. To gather service-related intelligence for privilege escalation or\nlateral movement, the analyst decides to enumerate all running processes on\nthe host.\nWhich Nmap command would most effectively retrieve the required\ninformation?", "options": {"A": "nmap -sU -p 161 --script snmp-processes", "B": "nmap -sU -p l61 --script snmp-win32-services", "C": "nmap -sU -p 161 --script snmp-interfaces", "D": "nmap -sU -p 161 --script snmp-sysdescr"}, "answer": "A"}, {"num": 233, "text": "A penetration tester is tasked with scanning a network protected by an IDS and\nfirewall that actively blocks connection attempts on non-standard ports. The\ntester needs to gather information on the target system without triggering\nalarms.\nWhich technique should the tester use to evade detection?", "options": {"A": "Conduct a full TCP Connect scan to confirm open ports", "B": "Execute a TCP ACK scan to map firewall rules and bypass the IDS", "C": "Perform a SYN flood attack to overwhelm the firewall", "D": "Use a low-and-slow scan to reduce detection by the IDS"}, "answer": "B"}, {"num": 234, "text": "During a red team engagement simulating a targeted attack on a smart office\nenvironment, an ethical hacker identifies a thermostat used for regulating\ntemperature across multiple floors. While analyzing its firmware management\nprocess, the tester discovers that the device accepts older versions without\nverifying their integrity or authenticity. The attacker successfully loads a\npreviously deprecated firmware that contains known vulnerabilities and gains\nunauthorized access to the broader network by exploiting reintroduced flaws.\nNo mechanisms are in place to prevent version rollback or verify firmware\ntrustworthiness.\nWhich IoT security issue is most accurately demonstrated in this scenario?", "options": {"A": "Lack of secure update mechanisms", "B": "Denial-of-service through physical tampering", "C": "Insecure network service exposure", "D": "Use of insecure third-party components"}, "answer": "A"}, {"num": 235, "text": "During a security assessment of a company’s internal web application, a\npenetration tester examines how the application processes input values passed\nin the web address query string. The application includes a feature that\ndynamically fetches documents based on a filename value provided in the web\naddress (e.g., https://intranet.example.com/view?file=report.txt. By altering this\ninput to include sequences like ../../../../etc/passwd, the tester successfully\nnavigates beyond the intended storage location and accesses restricted files.\nFurther manipulation reveals access to sensitive configuration files, source\ncode, and internal scripts, confirming that the application lacks proper input\nsanitization and isolation of file access paths.\nWhich attack method does this scenario illustrate?", "options": {"A": "Conduct a brute-force attack to obtain administrative credentials.", "B": "Exploit buffer overflow issues by injecting oversized data in HTTP request headers.", "C": "Inject malicious scripts into web pages to manipulate content via XSS vulnerabilities.", "D": "Use directory traversal sequences in URL parameters to retrieve unauthorized system\ncontent."}, "answer": "D"}, {"num": 236, "text": "A penetration tester has gained access to a target system using default\ncredentials.\nWhat is the most effective next step to escalate privileges on the system?", "options": {"A": "Perform a denial-of-service (DoS) attack to crash the system", "B": "Use a dictionary attack to brute-force the root password", "C": "Use a known local privilege escalation vulnerability to gain admin access", "D": "Execute a Cross-Site Scripting (XSS) attack on the system’s login page"}, "answer": "C"}, {"num": 237, "text": "While assessing a web server’s behavior, a tester sends malformed HTTP GET\nrequests using unusual methods like “DELETE” and “OPTIONS” combined with\nlong URI strings and observes varying status codes and response headers. The\ntester uses a tool that matches these responses against known patterns to\ndeduce the server’s software and version.\nWhich technique is the tester employing?", "options": {"A": "Injecting scripts into headers for persistent XSS attacks on the server-side.", "B": "Sending phishing emails to extract web server login credentials.", "C": "Fingerprinting server identity using banner-grabbing techniques.", "D": "Conducting session fixation using malformed cookie headers targeting the web\n server."}, "answer": "C"}, {"num": 238, "text": "A penetration tester is investigating a web server that allows for unrestricted\nfile uploads. The server accepts files without proper validation or sanitization of\nfile types.\nWhich technique should the tester use to exploit this vulnerability and gain\npotentially control of the server?", "options": {"A": "Perform a SQL injection attack to extract sensitive database information", "B": "Use a Cross-Site Scripting (XSS) attack to steal user session cookies", "C": "Conduct a brute-force attack on the server’s FTP service to gain access", "D": "Upload a shell script disguised as an image file to execute commands on the server"}, "answer": "D"}, {"num": 239, "text": "During a high-stakes engagement on a secure corporate network, a penetration\ntester discovers an opportunity to attack the domain controller. By abusing anAPI call from Microsoft’s Encrypting File System Remote Protocol (MS-EFSRPC,\nthe tester forces the domain controller to initiate NTLM authentication to a\nserver controlled by the tester. The tester then captures the resulting NTLM\nhash and relays it to the Active Directory Certificate Services (AD CS, ultimately\nobtaining a certificate that confers administrative privileges over the network.\nThis sophisticated method allows the tester to compromise the network without\nrequiring direct access to the domain controller.\nWhich network-level hijacking technique is illustrated in this scenario?", "options": {"A": "Exploiting vulnerabilities in TLS compression via a CRIME attack", "B": "Employing a session donation method to transfer tokens", "C": "Stealing session tokens using browser-based exploits", "D": "Hijacking sessions using a PetitPotam relay attack"}, "answer": "D"}, {"num": 240, "text": "An AWS security operations team receives an alert regarding abnormal\noutbound traffic from an EC2 instance. The instance, which previously handled\nbackend microservices, begins transmitting encrypted data packets to an\nexternal domain. Upon deeper investigation, it is discovered that the external\ndomain resolves to a Dropbox account not associated with the organization.\nNetwork flow logs confirm a consistent pattern of data transfers to this\ndestination during off-peak hours. Further forensic analysis reveals that a\nmalicious executable was silently installed on the instance, which modifies the\nsync configuration of the Dropbox client to use the attacker's access token. This\nenables the compromised EC2 instance to automatically sync selected data\nfolders with the attacker’s Dropbox storage, bypassing traditional perimeter\ndefenses. What type of attack has likely occurred?", "options": {"A": "Cloud Snooper attack leveraging port\n masquerading", "B": "Cryptojacking using CoinHive scripts", "C": "Man-in-the-Cloud (MITC) attack", "D": "Side-channel attack exploiting CPU cache"}, "answer": "C"}, {"num": 241, "text": "Which of the following is the primary goal of ethical hacking?", "options": {"A": "To identify and fix security vulnerabilities in a system", "B": "To steal sensitive information from a company’s network", "C": "To spread malware to compromise multiple systems", "D": "To disrupt services by launching denial-of-service attacks"}, "answer": "A"}, {"num": 242, "text": "During an internal red team engagement, an operator discovers that TCP port\n389 is open on a target system identified as a domain controller. To assess the\nextent of LDAP exposure, the operator runs the command ldapsearch -h -x -s\nbase namingcontexts and receives a response revealing the base distinguished \nname (DN: DC=internal,DC=corp. This naming context indicates the root of the\nLDAP directory structure used by the organization’s Active Directory. With this\ndiscovery, the operator plans the next step to continue LDAP enumeration and\nexpand visibility into users and objects in the domain.\nWhat is the most logical next action?", "options": {"A": "Attempt an RDP login to the domain controller", "B": "Conduct an ARP scan on the local subnet", "C": "Use the base DN in a filter to enumerate directory objects", "D": "Launch a brute-force attack against user passwords via SMB"}, "answer": "C"}, {"num": 243, "text": "During a security assessment of a metropolitan public transportation terminal,\na penetration tester examines a network-connected IoT surveillance camera\nsystem that is used for 24/7 video monitoring of high-traffic areas. Upon\nanalyzing the camera’s network traffic, the tester observes that it uses an\noutdated encryption protocol (SSLv2 to transmit video data to the control\ncenter. The tester uses a network packet sniffer to intercept this traffic and\neasily decrypts the stream, successfully reconstructing full video footage in real\ntime without authentication.\nFurther analysis reveals that the camera does not enforce TLS or any modern\nencryption standard and lacks support for mutual authentication or secure key\nexchange. Additionally, no integrity checks are performed, leaving the data\nopen to manipulation.\nWhat IoT vulnerability is most likely being exploited in this scenario?", "options": {"A": "Jamming attack on RF communication", "B": "Replay attack on wireless signals", "C": "Insecure data transfer and storage", "D": "Credential theft via web application"}, "answer": "C"}, {"num": 244, "text": "A security analyst investigates unusual east-west traffic on a corporate network.\nA previously unknown MAC address is found actively communicating from a port\nconnected to a trusted desktop. On closer inspection, a small computing device\n(Raspberry Pi was physically inserted between the switch and the legitimate\nmachine. This setup allows the rogue device to piggyback onto the network\nusing the identity and privileges of the authenticated workstation without\ntriggering any authentication processes or alarms.\nWhich evasion technique is being used to blend unauthorized traffic with\nlegitimate access?", "options": {"A": "Exploiting a wireless rogue access point to tunnel through the firewall", "B": "VLAN double tagging to shift between network segments", "C": "NAC bypass using a pre-authenticated device for network bridging", "D": "Spoofing ARP responses from a dynamic IP allocation pool"}, "answer": "C"}, {"num": 245, "text": "A penetration tester discovers that a web application is vulnerable to Local File\nInclusion (LFI due to improper input validation in a URL parameter.\nWhich approach should the tester take to exploit this vulnerability?", "options": {"A": "Inject SQL commands into the URL parameter to test for database vulnerabilities", "B": "Perform a Cross-Site Scripting (XSS) attack by injecting malicious scripts into the URL", "C": "Conduct a brute-force attack on the admin login page to gain access", "D": "Use directory traversal to access sensitive files on the server, such as/etc/passwd"}, "answer": "D"}, {"num": 246, "text": "A penetration tester is tasked with assessing the security of an Android mobile\napplication that stores sensitive user data. The tester finds that the application\ndoes not use proper encryption to secure data at rest.\nWhat is the most effective way to exploit this vulnerability?", "options": {"A": "Access the local storage to retrieve sensitive data directly from the device", "B": "Use SQL injection to retrieve sensitive data from the backend server", "C": "Perform a brute-force attack on the application’s login credentials", "D": "Execute a Cross-Site Scripting (XSS) attack to steal session cookies"}, "answer": "A"}, {"num": 247, "text": "A Certified Ethical Hacker (CEH is auditing a company’s web server that employs\nvirtual hosting. The server hosts multiple domains and uses a web proxy to\nmaintain anonymity and prevent IP blocking. The CEH discovers that the\nserver’s document root directory, which stores critical HTML files, is named\n“certroot” and is stored in the directory /admin/web. The server root, which\nstores the server’s configuration, error, executable, and log files, is also\nidentified. The CEH also notes that the server uses a virtual document tree for\nadditional storage.\nGiven this scenario which of the following actions would most likely increase\nthe security of the web server?", "options": {"A": "Regularly updating and patching the server software", "B": "Implementing an open-source web server architecture such as LAMP", "C": "Changing the server’s IP address regularly", "D": "Moving the document root directory to a different disk"}, "answer": "A"}, {"num": 248, "text": "As an IT technician in a small software development company, you are tasked\nwith providing security against different kinds of cyber threats. You learn about\nvarious methods hackers might use to bypass your company’s firewalls.\nWhich of the following is a common technique used by attackers to evade\nfirewall detection?", "options": {"A": "Using encrypted communication channels to evade network monitoring tools.", "B": "Implementing an open-source operating system to bypass proprietary software restrictions.", "C": "Utilizing social engineering techniques to trick employees into revealing sensitive\n information.", "D": "Changing the source IP address of packets to appear as if the traffic is coming from a\ntrusted source."}, "answer": "D"}, {"num": 249, "text": "A penetration tester is assessing a company’s vulnerability to advanced social\nengineering attacks targeting its legal department. Using comprehensive\nknowledge of recent mergers and internal legal proceedings, the tester crafts a\nhighly credible pretext to deceive legal employees into sharing confidential\ncase documents.\nWhat is the most effective social engineering technique the tester should\nemploy to obtain confidential documents without raising suspicion?", "options": {"A": "Visit the office in person posing as a new legal intern to request document access", "B": "Send a spear-phishing email referencing specific merger details and requesting document\naccess", "C": "Create a fake LinkedIn profile to connect with legal employees and request document \n sharing", "D": "Conduct a mass phishing campaign with generic legal templates attached"}, "answer": "B"}];
const PER_PAGE = 10;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PER_PAGE);

let currentPage = 0;
// State: { [qIndex]: { selected: 'A'|null, submitted: bool } }
const state = {};

(function() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('ceh_quiz_state_q1_249')); } catch(e) {}
  for (let i = 0; i < QUESTIONS.length; i++) {
    state[i] = (saved && saved[i]) ? saved[i] : { selected: null, submitted: false };
  }
})();

function saveState() {
  try { localStorage.setItem('ceh_quiz_state_q1_249', JSON.stringify(state)); } catch(e) {}
}

function getPageQuestions(page) {
  const start = page * PER_PAGE;
  return QUESTIONS.slice(start, Math.min(start + PER_PAGE, QUESTIONS.length));
}

function render() {
  const qs = getPageQuestions(currentPage);
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';

  qs.forEach((q, localIdx) => {
    const globalIdx = currentPage * PER_PAGE + localIdx;
    const s = state[globalIdx];
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + globalIdx;

    if (s.submitted) {
      if (s.selected === q.answer) card.classList.add('correct');
      else card.classList.add('wrong');
    }

    const optLetters = Object.keys(q.options);

    let optionsHtml = '';
    optLetters.forEach(letter => {
      let cls = 'option-btn';
      if (s.submitted) {
        if (letter === q.answer) cls += ' correct-ans';
        else if (letter === s.selected && s.selected !== q.answer) cls += ' wrong-ans';
      } else if (letter === s.selected) {
        cls += ' selected';
      }
      const clickHandler = s.submitted ? '' : `onclick="selectOption(${globalIdx}, '${letter}')"`;
      const pointerStyle = s.submitted ? 'style="cursor:default"' : '';
      optionsHtml += `<div class="${cls}" ${clickHandler} ${pointerStyle}>
        <span class="opt-letter">${letter}</span>
        <span>${escHtml(q.options[letter])}</span>
      </div>`;
    });

    const isCorrect = s.submitted && s.selected === q.answer;
    const isWrong = s.submitted && s.selected !== q.answer;
    const revealCls = s.submitted ? (isCorrect ? 'answer-reveal ok show' : 'answer-reveal no show') : 'answer-reveal';
    const revealMsg = isCorrect
      ? '✓ 正確！'
      : isWrong
        ? `✗ 錯誤，正確答案是 ${q.answer}`
        : '';

    const statusIcon = isCorrect ? '✅' : isWrong ? '❌' : '';
    const submitDisabled = (!s.selected && !s.submitted) ? 'disabled' : '';
    const submitCls = s.submitted ? 'submit-btn submitted' : 'submit-btn';
    const submitLabel = s.submitted ? '已提交' : '提交';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q #${q.num}</span>
        <span class="q-status-icon">${statusIcon}</span>
      </div>
      <div class="q-text">${escHtml(q.text)}</div>
      <div class="options">${optionsHtml}</div>
      <div class="${revealCls}">${revealMsg}</div>
      <div class="submit-row">
        <button class="${submitCls}" id="sub-${globalIdx}" onclick="submitQuestion(${globalIdx})" ${s.submitted ? 'disabled' : submitDisabled}>${submitLabel}</button>
      </div>
    `;

    area.appendChild(card);
  });

  // Update pagination
  document.getElementById('page-info').textContent = `第 ${currentPage + 1} 頁 / ${TOTAL_PAGES} 頁`;
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage === TOTAL_PAGES - 1;

  renderPageDots();
  updateStats();
  updateSidebar();
  updateProgress();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g, '<br>');
}

function selectOption(globalIdx, letter) {
  if (state[globalIdx].submitted) return;
  state[globalIdx].selected = letter;
  saveState();
  render();
}

function submitQuestion(globalIdx) {
  if (!state[globalIdx].selected) return;
  if (state[globalIdx].submitted) return;
  state[globalIdx].submitted = true;
  saveState();
  render();
}

function changePage(dir) {
  const newPage = currentPage + dir;
  if (newPage < 0 || newPage >= TOTAL_PAGES) return;
  currentPage = newPage;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToPage(page) {
  currentPage = page;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToQuestionPage(globalIdx) {
  const page = Math.floor(globalIdx / PER_PAGE);
  currentPage = page;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
  requestAnimationFrame(() => {
    const card = document.getElementById('card-' + globalIdx);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
}
function renderPageDots() {
  const container = document.getElementById('page-dots');
  container.innerHTML = '';
  for (let p = 0; p < TOTAL_PAGES; p++) {
    const start = p * PER_PAGE;
    const end = Math.min(start + PER_PAGE, QUESTIONS.length);
    let hasWrong = false, hasAnswered = false, allCorrect = true;
    for (let i = start; i < end; i++) {
      if (state[i].submitted) {
        hasAnswered = true;
        if (state[i].selected !== QUESTIONS[i].answer) { hasWrong = true; allCorrect = false; }
      } else {
        allCorrect = false;
      }
    }
    const dot = document.createElement('button');
    dot.className = 'page-dot';
    if (p === currentPage) dot.classList.add('active');
    if (hasWrong) dot.classList.add('has-wrong');
    else if (hasAnswered && allCorrect) dot.classList.add('all-correct');
    dot.textContent = p + 1;
    dot.onclick = () => goToPage(p);
    container.appendChild(dot);
  }
}

function updateStats() {
  let answered = 0, correct = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) {
      answered++;
      if (state[i].selected === QUESTIONS[i].answer) correct++;
    }
  }
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
}

function updateProgress() {
  let answered = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) answered++;
  }
  const pct = (answered / QUESTIONS.length * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSidebar() {
  const list = document.getElementById('wrong-list');
  const wrongItems = [];
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted && state[i].selected !== QUESTIONS[i].answer) {
      wrongItems.push({ i, q: QUESTIONS[i], selected: state[i].selected });
    }
  }

  if (wrongItems.length === 0) {
    list.innerHTML = '<div id="empty-msg">尚無錯題<br>繼續加油！✓</div>';
  } else {
    list.innerHTML = wrongItems.map(({ i, q, selected }) => `
      <div class="wrong-item" onclick="goToQuestionPage(${i})">
        <span class="qnum">Q #${q.num}</span>
        <span class="wrong-ans">答 ${selected || '—'}</span>
        <span class="right-ans">正 ${q.answer}</span>
      </div>
    `).join('');
  }
}

// Sidebar resize
(function() {
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebar-resize');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const newW = Math.max(120, Math.min(600, startW + (e.clientX - startX)));
    sidebar.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

function resetProgress() {
  if (!confirm('確定要清除所有答題紀錄，重新開始嗎？')) return;
  try { localStorage.removeItem('ceh_quiz_state_q1_249'); } catch(e) {}
  location.reload();
}

// Initial render
render();
</script>
</body>
</html>
