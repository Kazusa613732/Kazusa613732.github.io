 you are\nparticularly focused on exploiting vulnerabilities related to session\nmanagement mechanisms. The web application uses multi-factor\nauthentication, encrypted cookies, and has well-configured web application\nfirewalls. During your assessment, you identify several possibilities to\ncompromise session management.\nWhich of the following techniques would most effectively exploit a session\nmanagement vulnerability while bypassing the application’s sophisticated\nsecurity measures?", "options": {"A": "Conduct Session Sidejacking by intercepting and using valid session tokens.", "B": "Exploit insecure deserialization vulnerabilities in the session management code to achieve\narbitrary code execution.", "C": "Execute a Cross-Site Request Forgery (CSRF) attack by tricking authenticated users into\nexecuting malicious actions.", "D": "Utilize Session Fixation to manipulate a user into utilizing a session ID that an attacker\nalready has access to."}, "answer": "D"}, {"num": 72, "text": "You’ve recently been hired as a cybersecurity intern for a growing tech startup.\nDuring your onboarding, the company’s chief information security officer (CISO\nexplains the various types of hackers you need to be aware of as part of your\nrole. The term “script kiddie” comes up during this discussion.\nBased on your CEH v12 study material, which of the following descriptions best\ndefines a script kiddie?", "options": {"A": "A hacker who writes their own complex scripts and exploits them to carry out attacks.", "B": "A hacker who uses pre-existing scripts and tools to carry out attacks without fully\nunderstanding how they work.", "C": "A young hacker who is still learning the basics of ethical hacking and cybersecurity.", "D": "A hacker who only targets systems that use JavaScript and similar scripting languages."}, "answer": "B"}, {"num": 73, "text": "A future-focused security audit discusses risks where attackers collectencrypted data now, anticipating that they can decrypt it later with quantum\ncomputers.\nWhat is this threat known as?", "options": {"A": "Breaking RSA using quantum algorithms", "B": "Saving data today for future quantum decryption", "C": "Replaying intercepted quantum messages", "D": "Flipping qubit values to corrupt the output"}, "answer": "B"}, {"num": 74, "text": "Your role as a cybersecurity analyst at XYZ Corporation requires you to perform\na thorough security assessment of the company’s online presence. You initiate\nthe process with a passive reconnaissance phase, trying to gather as much\ninformation as possible without interacting directly with the target system.\nWhich of the following techniques or tools is least likely to assist you in this\nendeavor?", "options": {"A": "Using a tool like Nmap to scan the company’s public IP range.", "B": "Inspecting the WHOIS database for domain registration details.", "C": "Utilizing search engines and associated services (Google, Bing, Google Earth, etc.).", "D": "Monitoring public posts and profiles on social media platforms and professional networking\nsites."}, "answer": "A"}, {"num": 75, "text": "You are tasked with assessing wireless network security for a corporation using\nWPA2 encryption. During the assessment, you identify vulnerabilities that could\nallow attackers to intercept and replay previously captured packets.\nWhich WPA2 vulnerability is likely being exploited?", "options": {"A": "Hole196 vulnerability due to shared GTK.", "B": "Insecure WPS PIN recovery method.", "C": "KRACK vulnerabilities through key reinstallation.", "D": "Weak random number generator (RNG) affecting GTK."}, "answer": "C"}, {"num": 76, "text": "During a cloud security assessment, your team discovered that a former\nemployee still had access to critical resources despite leaving the organization\nmonths ago. Which of the following practices could have most effectively prevented this\nissue?", "options": {"A": "Using multi-cloud deployment models", "B": "Enforcing timely user de-provisioning", "C": "Conducting regular penetration tests", "D": "Implementing real-time traffic analysis"}, "answer": "B"}, {"num": 77, "text": "Working as an Information Security Analyst at a technology firm, you’ve been\nasked to design training material for employees about the potential dangers of\nsession hijacking. As part of the training, you want to explain how attackers\ncould use side jacking to compromise their accounts.\nWhich of the following scenarios would most accurately describe a side jacking\nattack?", "options": {"A": "An attacker convinces an employee to visit a malicious site, which then injects a harmful\nscript into their browser.", "B": "An attacker exploits a vulnerability in the company’s network firewall to gain unauthorized\naccess to internal systems.", "C": "An attacker intercepts network traffic, captures unencrypted session cookies, and uses\nthese to impersonate the user.", "D": "An attacker uses social engineering techniques to trick an employee into revealing their\npassword."}, "answer": "C"}, {"num": 78, "text": "As a senior cybersecurity professional at a multinational bank, you are\ninvestigating an incident where multiple systems have been infected with\nmalware. On the affected systems, the malware remains dormant until a specific\naction triggers its malicious activity. The malware has also shown signs of being\nable to avoid detection by changing its code or encryption each time it infects a\nnew.\nBased on these characteristics, which type of malware is likely causing this\nproblem, and what is the best method to mitigate its impact?", "options": {"A": "Adware: Use a reputable anti-adware tool to detect and remove the adware, and instruct\nemployees not to click on suspicious advertisements.", "B": "Polymorphic Malware: Employ advanced threat detection tools that use behavior-based\ndetection techniques and ensure all systems are patched.", "C": "Rootkit: Use an anti-rootkit tool for detection and removal, and ensure all systems are\npatched with the latest security updates.", "D": "Worm: Isolate the infected systems, and scan the entire network using up-to-date anti-virus\nsoftware."}, "answer": "B"}, {"num": 79, "text": "An attacker examines differences in ciphertext outputs resulting from small\nchanges in the input to deduce key patterns in a symmetric algorithm.\nWhat method is being employed?", "options": {"A": "Timing attack to infer key bits based on processing time", "B": "Chosen-ciphertext attack to decrypt arbitrary ciphertexts", "C": "Differential cryptanalysis on input-output differences", "D": "Brute-force attack to try every possible key"}, "answer": "C"}, {"num": 80, "text": "You’re a security analyst conducting a foot printing exercise for a new client to\nuncover as much information as possible without direct interaction. Your\npreliminary investigation using search engines and public databases has\nprovided a significant amount of data about the organization's online presence.\nYou are now considering using Google Hacking techniques to find further\nvulnerabilities.\nWhich of the following could best justify this decision?", "options": {"A": "Google Hacking can assist in mapping out the client’s internal network structure.", "B": "Google Hacking can help identify weaknesses in the client’s website code.", "C": "Google Hacking can help locate potential phishing sites that mimic the client’s website.", "D": "Google Hacking can help discover hidden organizational data from the Deep Web."}, "answer": "B"}, {"num": 81, "text": "A senior executive receives a personalized email with a subject line that reads\n“Annual Performance Review 2024”. The email contains a downloadable PDF that\ninstalls a backdoor when opened. The email appears to come from the CEO and\nincludes company branding.\nWhich phishing method does this best illustrate?", "options": {"A": "Pharming using DNS poisoning", "B": "Email clone attack with altered attachments", "C": "Broad phishing sent to all employees", "D": "Whaling attack aimed at high-ranking personnel"}, "answer": "D"}, {"num": 82, "text": "You’re an IT security analyst at a fast-growing fintech startup. Recently, you’ve\nnoticed an uptick in network traffic anomalies. You decide to perform a more\nthorough network scan using the ICMP Echo Request method. During the scan, you notice that a certain set of IPs in your network are not returning any Echo\nReply, but other network functionalities seem to be operating normally.\nHow would you interpret this situation?", "options": {"A": "The non-responsive IPs indicate severe network congestion that needs immediate\naddressing.", "B": "The firewall or another security control is probably blocking the ICMP Echo\nRequests.", "C": "The lack of an Echo Reply is a clear sign of a major breach in progress.", "D": "The scanned IPs are likely unused and can be considered for future expansion."}, "answer": "B"}, {"num": 83, "text": "In a highly secure online banking environment, customers have reported\nunauthorized access to their accounts despite robust authentication measures\nin place. Upon investigation, it is discovered that attackers are employing\nsophisticated session hijacking techniques to compromise user sessions and\nconduct fraudulent transactions. The security team is tasked with implementing\neffective countermeasures to prevent further unauthorized access and protect\ncustomer accounts.\nConsidering the scenario described, which advanced session-hijacking\ntechnique, resembling a scenario-based attack, poses the greatest challenge for\nthe security team to detect and mitigate effectively, potentially compromising\nthe security of online banking transactions?", "options": {"A": "Passive Sniffing Attack Capturing Encrypted Session Tokens on Unsecured Wi-Fi Networks", "B": "Session Fixation Attack Manipulating Session Identifiers in HTTP Cookies", "C": "Man-in-the-Browser (MitB) Attack Installing Malicious Browser Extensions to Intercept User\nSessions", "D": "Covert Cross-Site Scripting (XSS) Attack Injecting Malicious Code into Online Banking Web\nPages"}, "answer": "C"}, {"num": 84, "text": "A multinational corporation relies heavily on remote access for its employees to\nconnect to internal systems and resources. Recently, there have been reports of\nunauthorized access to sensitive company data, leading to concerns about\npotential session hijacking attacks. The security team is tasked with identifying\nthe specific techniques used by attackers and implementing measures to\nenhance session security.\nConsidering the scenario described, which advanced session hijacking\ntechnique, resembling a scenario-based attack, poses the greatest challenge for\nthe security team to detect and mitigate effectively, potentially compromising\nthe confidentiality of corporate data?", "options": {"A": "Brute-Force Session Guessing Exploiting Weak Session ID Generation Algorithms", "B": "ARP Spoofing Attack Redirecting Traffic to Capture Session Data on Local Networks", "C": "Cookie Poisoning Attack Manipulating Session Cookies to Impersonate Authorized Users", "D": "Session Sidejacking Intercepting Unencrypted Session Tokens over Public Wi-Fi Networks"}, "answer": "B"}, {"num": 85, "text": "After a recent breach, your team discovers that attackers used modified\nversions of legitimate system utilities and a Windows service to persist\nundetected for weeks, accessing internal credentials.\nWhat key step can be taken to better protect against similar future threats?", "options": {"A": "Ensure all systems run the latest antivirus and firewall software.", "B": "Conduct weekly backups and store them off-site.", "C": "Monitor file hashes of sensitive executables for unauthorized changes.", "D": "Disable unused ports and limit outbound traffic via firewall rules."}, "answer": "C"}, {"num": 86, "text": "A tester evaluates a login form that constructs SQL queries using unsanitized\nuser input. By submitting ‘ OR ‘1’=’1’;--, the tester gains unauthorized access to\nthe application.\nWhat type of SQL injection has occurred?", "options": {"A": "Tautology-based SQL injection", "B": "Union-based SQL injection", "C": "Error-based SQL injection", "D": "Time-based blind SQL injection"}, "answer": "A"}, {"num": 87, "text": "A system analyst wants to implement an encryption solution that allows safe\nkey distribution.\nWhich encryption method should the analyst consider?", "options": {"A": "Asymmetric encryption", "B": "Hash functions", "C": "Disk encryption", "D": "Symmetric encryption"}, "answer": "A"}, {"num": 88, "text": "In your role as a cybersecurity analyst at a large e-commerce company, you\nhave been tasked with reinforcing the firm’s defenses against potential Denialof-Service (DoS attacks. During a recent review, you noticed several IP\naddresses generating excessive traffic, causing an unnaturally high load on the\nserver. An inspection of these packets revealed that the TCP three-way handshake was never completed, leaving multiple connections in a\nSYN_RECEIVED state. The intent appears to be the saturation of server resources\nwithout any genuine intent to establish a full connection.\nGiven these details, what type of DoS attack is most likely being executed\nagainst the company’s servers?", "options": {"A": "Smurf Attack: In this type of attack, a perpetrator uses a network’s broadcast addressing to\namplify the ICMP echo-request packets. However, this doesn't align with the incomplete TCP\nhandshakes noted.", "B": "SYN Flood: This attack floods a target with SYN requests in an attempt to consume enough\nserver resources to make the system unresponsive, aligning with the high volume of\nincomplete TCP handshakes.", "C": "UDP Flood: This attack overwhelms random ports on a remote host with IP packets\ncontaining UDP datagrams, but this doesn't explain the high volume of incomplete TCP\nhandshakes observed.", "D": "Ping of Death: This attack sends malformed or oversized ping packets to crash, freeze, or\nreboot the targeted system, which isn't consistent with the incomplete TCP handshake\nobserved."}, "answer": "B"}, {"num": 89, "text": "A city’s power management utilizes SCADA systems to oversee operations.\nRecently, the infrastructure has shown unexplained anomalies such as\ninconsistent sensor values and intermittent outages. Security experts suspect a\nside-channel attack aiming to discreetly extract sensitive information from\nSCADA devices.\nWhich investigative technique would best confirm if attackers employed this\nspecific side-channel method?", "options": {"A": "Measure unusual fluctuations during device operations at the hardware level.", "B": "Review SCADA user interfaces for signs of unauthorized user actions.", "C": "Identify weak cryptographic settings in device communications.", "D": "Assess network latency between SCADA devices for irregular delays."}, "answer": "A"}, {"num": 90, "text": "You are a Certified Ethical Hacker contracted by a technology company to\nperform a security assessment on Bluetooth-enabled devices. These devices\nhave Secure Simple Pairing (SSP enabled, which generally offers strong\nsecurity. During your assessment, you identify an attacker trying to exploit a\nvulnerability in the SSP implementation by employing sophisticated brute-force\ntechniques. The attacker has partial access to the Diffie-Hellman key exchange.\nYour mission is to identify the most effective method to counteract this attack.\nWhich of the following countermeasures is most likely to be effective?", "options": {"A": "Implement device whitelisting to ensure only approved devices can connect.", "B": "Impose rate-limiting to slow down the brute-force attack.", "C": "Strengthen SSP by increasing the encryption key length for the Diffie-Hellman exchange.", "D": "Use Bluetooth Low Energy (BLE) for all Bluetooth connections to avoid traditional Bluetooth\nvulnerabilities."}, "answer": "B"}, {"num": 91, "text": "During a black-box assessment, an attacker executes the Nmap command nmap\n-p25 --script smtp-enum-users --script-args smtp-enum-users.methods={VRFY,\nEXPN, RCPT . The script successfully returns multiple valid usernames.\nWhat server misconfiguration is being exploited?", "options": {"A": "SMTP server has disabled STARTTLS, enabling plaintext enumeration.", "B": "SMTP user verification commands are exposed without restrictions.", "C": "DNS is misconfigured to point MX records to an internal relay.", "D": "The SMTP server allows authentication without credentials."}, "answer": "B"}, {"num": 92, "text": "As a security analyst, you are testing your company’s network for potential\nvulnerabilities. During your investigation, you suspect that an attacker might be\nusing MAC flooding to compromise the switches and sniff network traffic.\nWhich of the following indicators would most likely confirm your suspicions?", "options": {"A": "The existence of multiple MAC addresses assigned to a single IP address.", "B": "The presence of multiple IP addresses assigned to a single MAC address.", "C": "An increased number of ARP requests in the network traffic.", "D": "Numerous MAC addresses that correspond to a single switch port."}, "answer": "D"}, {"num": 93, "text": "You have recently been hired as an entry-level IT technician in a large\ncorporation. In a meeting with the IT team, the terms “ethical hacking” and\n“penetration testing” are mentioned frequently. Later, a colleague explains to\nyou that the main difference between the two is based on their goals.\nWhat is the primary goal of an ethical hacker in comparison to a penetration\ntester?", "options": {"A": "An ethical hacker is focused on exploiting system vulnerabilities, while a penetration tester\naims to secure the system.", "B": "An ethical hacker is primarily focused on securing the system, while a penetration tester\ntries to exploit the system's vulnerabilities.", "C": "An ethical hacker seeks to bring the system down, while a penetration tester is focused on\nimproving system security.", "D": "An ethical hacker aims to improve system security, while a penetration tester seeks to bring\nthe system down."}, "answer": "B"}, {"num": 94, "text": "During a penetration test on a legacy Windows network, you use the nbtstat -A\ncommand on a target system and retrieve several NetBIOS names, including\nentries ending with <20> and <03>. However, attempts to list shared folders fail.\nWhich of the following best explains this behavior?", "options": {"A": "The target system’s NetBIOS service is bound to a non-standard port.", "B": "File and printer sharing is disabled on the target system.", "C": "The host is not part of any Active Directory domain.", "D": "The nbtstat utility cannot enumerate shares from NetBIOS names."}, "answer": "B"}, {"num": 95, "text": "You are a cybersecurity consultant at a large healthcare organization. As part of\nyour responsibilities, you are tasked with making sure the company’s systems\nare secure from various attacks. Recently, you’ve noticed some unusual traffic\npatterns that suggest someone might be trying to evade the company’s\nIntrusion Detection System (IDS.\nWhich of the following techniques would most likely be used by an attacker in\nan attempt to evade detection by the IDS?", "options": {"A": "The attacker splits malicious data packets into smaller segments to avoid detection.", "B": "The attacker repeatedly pings the IDS to overwhelm it with traffic and cause a denial of\nservice.", "C": "The attacker uses advanced malware that can self-replicate and spread throughout the\nnetwork.", "D": "The attacker sends phishing emails to employees, hoping to trick them into revealing their \nlogin credentials."}, "answer": "A"}, {"num": 96, "text": "During a red team engagement targeting a custom web application, a tester\nobserves that the app takes a numeric id parameter from the URL and\ndynamically builds SQL queries. Suspecting SQL injection, the tester sends a\ncrafted HTTP GET request like:\nhttp://vulnerableapp.local/view.php?id=l; DROP TABLE users; --\nShortly after, the application throws database errors, and the team confirms\nthat the users table has been removed from the backend database.\nBased on this behavior, which SQL injection method was most likely used?", "options": {"A": "The attacker appended a UNION clause to retrieve additional data.", "B": "The attacker triggered errors to extract database information.", "C": "The attacker used Boolean logic to infer true/false responses.", "D": "The attacker executed a second malicious query alongside the first."}, "answer": "D"}, {"num": 97, "text": "As a newly appointed network security analyst at a mid-tier company, you have\nbeen tasked with assessing the security of the network. As part of this, you\nneed to ensure that your company’s network can detect and prevent evasion\ntechniques. You know that one popular evasion technique used by attackers is\nusing ‘packet fragmentation’.\nWhich of the following IDS configurations should you implement to counteract\nthis particular technique?", "options": {"A": "Configuring the IDS to reject all fragmented packets to eliminate the risk.", "B": "Implementing an anomaly-based IDS that can recognize the irregular traffic patterns\ncaused by packet fragmentation.", "C": "Adjusting the IDS to recognize the regular intervals at which fragmented packets are\nsent.", "D": "Employing a signature-based IDS that recognizes the specific signature of fragmented\npackets."}, "answer": "B"}, {"num": 98, "text": "A malware analyst is tasked with evaluating a suspicious PDF file suspected of\nlaunching attacks through embedded JavaScript. Initial scans using pdfid show\nthe presence of JavaScript and /OpenAction keywords.\nWhat should the analyst do next to understand the potential impact?", "options": {"A": "Compute file hashes using HashMyFiles for signature matching.", "B": "Extract and analyze stream objects using PDFStreamDumper.", "C": "Disassemble the PDF using PE Explorer.", "D": "Upload the file to VirusTotal and rely on engine consensus."}, "answer": "B"}, {"num": 99, "text": "A cybersecurity company wants to prevent attackers from gaining information\nabout its encrypted traffic patterns.\nWhich of the following encryption algorithms should they utilize?", "options": {"A": "DES", "B": "RSA", "C": "AES", "D": "HMAC"}, "answer": "C"}, {"num": 100, "text": "A company’s customer data stored in a cloud environment has been exposed\ndue to an unknown vulnerability.\nWhich of the following types of attack most likely led to this incident?", "options": {"A": "Brute force attack on user passwords", "B": "Denial of Service (DoS) attack on cloud servers", "C": "Side-channel attack on the hypervisor", "D": "Exploitation of misconfigured security groups"}, "answer": "C"}, {"num": 101, "text": "You are a cybersecurity analyst at a tech startup that provides cloud-based\nservices to its clients. Recently, your team detected suspicious activity on one\nof your critical servers. After further investigation, you discovered an\nunauthorized user gained escalated privileges and is attempting to perform\nmalicious actions. Your task is to thwart the attack and secure the system from\nfuture exploits.\nConsidering the potential consequences and complex nature of the situation,\nwhich of the following actions would you take first to immediately contain the\nthreat without causing significant disruption to your services?", "options": {"A": "Analyze and document the activities of the unauthorized user in real-time, then use this\ndata to implement immediate countermeasures and isolate the affected server from the\nnetwork.", "B": "Initiate a comprehensive vulnerability scan on all servers to detect any possible exploits thatthe attacker might use.", "C": "Power down the affected server immediately to stop all ongoing malicious activities, then\nisolate it from the network for further analysis.", "D": "Engage with a digital forensics team to collect all necessary evidence for legal proceedings."}, "answer": "A"}, {"num": 102, "text": "You are a security administrator for a medium-sized company. Your manager\nhas asked you to conduct an audit of the organization’s security infrastructure.\nWhile reviewing the logs from the Intrusion Detection System (IDS, you notice\nthat there have been several instances of alerts being triggered by regular user\nactivities.\nWhich of the following is the most likely reason for this?", "options": {"A": "The company’s firewall is failing to filter out malicious traffic.", "B": "The IDS is outdated and needs to be updated with the latest patches.", "C": "The IDS is configured with very high sensitivity settings, leading to many false\npositives.", "D": "Regular users are unintentionally triggering security protocols."}, "answer": "C"}, {"num": 103, "text": "Your role as a network administrator in a mid-sized company involves\nprotecting the company's web servers from potential security threats. Recently,\nyour company’s web server experienced a Distributed Denial of Service (DDoS\nattack. In explaining the situation to your team, you mention the attack\nspecifically targeted the web server's application layer.\nWhich type of DDoS attack was most likely used against your company’s web\nserver?", "options": {"A": "HTTP flood attack", "B": "SYN flood attack", "C": "ICMP flood attack", "D": "UDP flood attack"}, "answer": "A"}, {"num": 104, "text": "During a penetration test, a security analyst encounters a web page that returns identical generic error messages regardless of input. To test for SQL injection,\nthey submit a query that includes AND 1=1 and later AND 1=2, observing a\nchange in the page content.\nWhat type of injection is being tested?", "options": {"A": "The analyst is measuring response delays to infer true/false outcomes.", "B": "The analyst is appending a UNION clause to extract data from additional tables.", "C": "The analyst is triggering visible database errors to gain structural insights.", "D": "The analyst is using conditional logic to infer database behavior from page\nresponses."}, "answer": "D"}, {"num": 105, "text": "A multinational corporation recently survived a severe Distributed Denial-ofService (DDoS attack, which caused significant downtime and resulted in\nsubstantial financial losses. After implementing enhanced security measures,\nthe company contracted you as a cybersecurity consultant to assess their new\ninfrastructure. During the audit, you discovered that the organization uses both\nhardware and cloud-based solutions to distribute incoming traffic. The primary\npurpose of these solutions is to absorb and mitigate the effects of a DDoS\nattack, ensuring that legitimate requests are not affected during such an event.\nWhat type of DDoS mitigation strategy is the company utilizing?", "options": {"A": "Sinkholing: This technique reroutes traffic to a “sinkhole”, a designated IP address where\n traffic can be analyzed. However, this doesn’t align with the company’s strategy of distributing\nincoming traffic.", "B": "Black Hole Routing: This approach directs all traffic into a non-existent interface (the “black\nhole”), which wouldn’t distribute traffic but would drop it, making it inconsistent with the\ncompany’s strategy.", "C": "Rate Limiting: This technique controls the traffic rate using bandwidth management. It\ndoesn’t distribute the traffic but rather restricts it, making it inconsistent with the company’s\nstrategy.", "D": "Load Balancing: This approach distributes network or application traffic across many\nresources to optimize resource use, minimize latency, and maximize throughput. This is\nconsistent with the company’s strategy of distributing incoming traffic."}, "answer": "D"}, {"num": 106, "text": "A cloud provider faced a situation where one customer’s malicious activity\naffected the organization’s reputation and service delivery.\nWhich security control would have most effectively prevented this issue?", "options": {"A": "Assessing multi-tenant isolation techniques", "B": "Implementing secure log management", "C": "Using strong encryption algorithms", "D": "Enforcing robust authentication methods"}, "answer": "A"}, {"num": 107, "text": "During an internal penetration test, a security analyst assesses a web\napplication that interfaces with a backend Oracle database. Initial attempts\nusing standard SQL injection payloads such as ‘ OR ‘1’=’l and UNION SELECT\nreturn no useful output and do not affect application behavior. Suspecting input\nsanitization and error suppression, the analyst crafts a new payload:\n1 AND 1 < (SELECT COUNT(* FROM all_users A, all_users B, all_users C\nUpon submitting this payload, the page takes significantly longer to respond\ncompared to previous inputs, even though no visible output is returned.\nWhat type of SQL injection technique is most likely being used here?", "options": {"A": "Time-based SQL injection using WAITFOR DELAY", "B": "Union-based SQL injection", "C": "Out-of-band SQL injection", "D": "Heavy query-based SQL injection"}, "answer": "D"}, {"num": 108, "text": "You’ve been hired as a Certified Ethical Hacker (CEH) by a large multinational\ncorporation to investigate the unauthorized access of sensitive data from their\nweb application. You discover that the web application uses a custom\nauthorization scheme involving token-based authentication. The system issues\ntokens, which expire after 30 minutes. In the server logs, you notice multiple\nfailed login attempts using expired tokens within a 3-minute window, followed\nby successful access with a valid token. You suspect that an attacker exploited\nthe authorization scheme.\nWhat could be the most likely attack scenario?", "options": {"A": "The attacker took advantage of a race condition, where the system validates expired\ntokens.", "B": "The attacker brute-forced the token generation algorithm to produce a valid token.", "C": "The attacker captured a valid token before its expiry and used it to gain access.", "D": "The attacker utilized a token replay attack, confusing the server to accept an expired token."}, "answer": "C"}, {"num": 109, "text": "A cybersecurity team identifies suspicious outbound network traffic.\nInvestigation reveals malware utilizing Background Intelligent Transfer Service\n(BITS to evade firewall detection.\nWhy would attackers use this particular service to hide malicious activities?", "options": {"A": "Because BITS traffic uses encrypted DNS packets.", "B": "Because BITS packets appear identical to normal Windows update traffic.", "C": "Because BITS operates exclusively through HTTP tunneling.", "D": "Because BITS utilizes IP fragmentation to evade IDS."}, "answer": "B"}, {"num": 110, "text": "You are a new member of your company’s IT team, and you've been assigned to\nunderstand and implement ethical hacking principles to improve the company’s\ncybersecurity posture. Your supervisor highlights the importance of following\nthe five phases of ethical hacking.\nWhat is the correct order of these phases?", "options": {"A": "Reconnaissance, Scanning, Gaining Access, Maintaining Access, Covering Tracks", "B": "Gaining Access, Maintaining Access, Covering Tracks, Reconnaissance, Scanning", "C": "Maintaining Access, Covering Tracks, Reconnaissance, Scanning, Gaining Access", "D": "Scanning, Reconnaissance, Gaining Access, Covering Tracks, Maintaining Access"}, "answer": "A"}, {"num": 111, "text": "As a certified ethical hacker, you have been engaged to evaluate the security\nprotocols of a smart city project. This cutting-edge venture incorporates an\ninterconnected system featuring intelligent traffic lights, public Wi-Fi points,\nand advanced water management facilities. Upon evaluating the IoT network’s\nlogs, you stumble upon anomalous traffic patterns, signifying a high volume of\ndata exchange between a particular traffic light and an external IP address. Your\nfurther investigation reveals that this traffic light has an inexplicably open port.\nGiven the gravity of these revelations, what would be your subsequent course\nof action?", "options": {"A": "Thoroughly analyze and amend the IoT network’s firewall rules to prevent any further\ninteraction with the suspicious external IP.", "B": "Conduct an exhaustive penetration test across the network infrastructure to uncover any\nconcealed vulnerabilities.", "C": "Attempt to orchestrate a reverse connection from the traffic light to the external IP, aiming to\ncomprehend the type and purpose of the data being transferred.", "D": "Isolate the implicated traffic light from the overarching network for a detailed\ninvestigation into its firmware to identify any possible security breaches."}, "answer": "D"}, {"num": 112, "text": "During a routine security audit, administrators found that cloud storage\nbackups were illegally accessed and modified.\nWhat countermeasure would most directly mitigate such incidents in the future?", "options": {"A": "Adopting the 3-2-1 backup model.", "B": "Deploying biometric entry systems.", "C": "Regularly conducting SQL injection testing.", "D": "Implementing resource auto-scaling."}, "answer": "A"}, {"num": 113, "text": "You have recently joined as a cybersecurity analyst at a multinational\ncorporation. Your role includes regular vulnerability assessments of the\ncompany’s wide-ranging IT infrastructure. During one of these assessments, you\nemploy the Nessus scanner. The scanner flags a severe vulnerability marked as\nCVE-2023-12456. This vulnerability specifically targets the SSH (Secure Shell\nservice running on one of the company’s Linux servers. With a CVSS (Common\nVulnerability Scoring System score of 9.0, the vulnerability poses a substantial\nrisk. Most concerning is its ability to allow potential remote code execution.\nGiven the high-risk nature of the vulnerability, as depicted by the CVSS score,\nand its potential impact, what course of action should be immediately\nprioritized from the following choices?", "options": {"A": "Commence a manual inspection of the discovered SSH service vulnerability. If it cannot be verified, mark it as a false positive and move on to the next task.", "B": "Without delay, apply the patch recommended by the vendor. Subsequently, initiate a\nsystem-wide reboot during the next downtime scheduled for system maintenance.", "C": "Establish a backup SSH service on an unaffected server and reroute all SSH traffic to this\nserver until the vulnerability on the original server is completely resolved.", "D": "Temporarily isolate the affected server from the broader network, perform an in-depth\nsystem audit, and then apply patches as required based on the findings."}, "answer": "B"}, {"num": 114, "text": "A large chemical plant uses operational technology (OT networks to control its\nindustrial processes. Recently, security personnel noticed abnormal behavior\nfrom critical Programmable Logic Controllers (PLCs, suspecting a stealthy\ncompromise via malicious firmware.\nWhich action should the team take first to effectively verify and neutralize this\nissue?", "options": {"A": "Implement enhanced intrusion detection rules to flag unusual traffic patterns.", "B": "Immediately isolate suspicious devices within separate network segments.", "C": "Perform detailed inspections of device software for hidden, unauthorized\nmodifications.", "D": "Restrict remote administrative access to essential industrial equipment."}, "answer": "C"}, {"num": 115, "text": "You are a Certified Ethical Hacker and have been hired by a financial institution\nto assess the security of its newly developed web application. The application\nemploys a multifaceted authentication system with JavaScript-based client-side\ncontrols. During your testing, you discover that client-side controls enforce\npassword strength and ensure CAPTCHA validation. The application also uses a\nproprietary encryption algorithm for client-side data. Your goal is to bypass\nthese client-side controls to assess how robust they really are.\nWhat method would be the most effective for bypassing these controls without\ntriggering server-side alarms?", "options": {"A": "Inject malicious JavaScript code into the login form to overwrite the client-side validation\nrules.", "B": "Disable JavaScript in the browser and proceed to submit weaker passwords and invalid\nCAPTCHAs.", "C": "Utilize a proxy tool to intercept and modify the client-side controls before they reach the\nserver.", "D": "Reverse-engineer the proprietary encryption algorithm and manipulate the encrypted data\nbefore submission."}, "answer": "B"}, {"num": 116, "text": "A large media-streaming company begins receiving complaints from users that\ntheir web application is timing out or failing to load. The security team observes\nthat the web server is overwhelmed with a high number of open HTTP\nconnections, most of which appear to be legitimate but are transmitting data at\nan abnormally slow rate. These connections are never fully completed, causing\nthe server’s resources to remain occupied and unable to process new incoming\nclient requests. The incident response team rules out bandwidth exhaustion\nand malformed packet-based attacks and suspects an application-layer DoS\ntechnique is responsible.\nGiven the scenario, which specific type of attack is most likely being executed\non the company’s web application?", "options": {"A": "The attacker uses a flooding attack on the server with random UDP packets to random ports\nto consume available bandwidth.", "B": "The attacker sends fragmented packets with overlapping offset values to destabilize the\ntarget system.", "C": "The attacker uses a Slowloris attack to keep many open connections alive, slowly\nexhausting the server’s connection pool.", "D": "The attacker floods the server with continuous ICMP Echo Request packets, overwhelming its\nnetwork stack."}, "answer": "C"}, {"num": 117, "text": "During sophisticated nature of this potential security breach,\nwhat should be your initial course of action to manage this situation effectively?", "options": {"A": "Immediately alter the credentials of the server and notify all users to change their\npasswords.", "B": "Immediately disconnect the suspicious server from the network to prevent further data\nexfiltration.", "C": "Conduct real-time monitoring of the server, scrutinize the logs for unusual patterns, and\nidentify the nature of the activities to devise an immediate countermeasure.", "D": "Conduct a thorough audit of all outbound traffic and scrutinize the destination IPs to gain\ninsights into the attacker’s network."}, "answer": "C"}, {"num": 120, "text": "A critical infrastructure facility has an extensive network of IoT devices\nintegrated with its OT systems. Following a recent surge in cyberattacks on\nsimilar facilities globally, the security team received an anonymous email\ndetailing a possible attack on their systems. The attacker allegedly plans to\ncompromise the IoT devices and use them as a gateway to the OT systems.\nWhat should be the immediate action of the security team to mitigate this\nthreat?", "options": {"A": "Initiate a full-scale penetration testing exercise on IoT devices to identify and patch\nvulnerabilities.", "B": "Deploy a machine-learning-based security solution to monitor and predict potential\nthreats.", "C": "Establish a secure communication protocol between IoT and OT systems with proper\nencryption and authentication.", "D": "Employ an intrusion prevention system (IPS) on the network to detect and block any\nmalicious activities."}, "answer": "C"}, {"num": 121, "text": "In an enterprise environment, the network security team is alerted to unusual\nnetwork behavior suggestive of advanced sniffing techniques being employed\nby a potential attacker. Upon closer examination, it is discovered that the\nadversary is exploiting vulnerabilities in legacy protocols to intercept sensitive\ncommunications. The security team must identify the specific sniffing technique\nbeing utilized and deploy effective countermeasures to protect critical assets.\nAmidst the advanced sniffing activities observed in the enterprise network,\nwhich intricate technique poses the most formidable challenge for the security\nteam to detect and neutralize effectively, potentially compromising the\nconfidentiality of proprietary information?", "options": {"A": "Covert Channel Establishment through Modbus Protocol Manipulation", "B": "Covert Data Interception via X.25 Packet Fragmentation", "C": "Encrypted Data Extraction via HTTP Header Field Overflows", "D": "Steganographic Payload Embedding within SMTP Email Headers"}, "answer": "A"}, {"num": 122, "text": "In your role as a cybersecurity specialist for a growing tech company, you are\ntasked with performing a regular network scan to check for any potential\nvulnerabilities. Your manager has specifically asked you to use a NULL scan for\nthis round.\nIn the context of TCP NULL scanning, what response (or lack thereof would\nindicate that a particular port on a target machine is closed?", "options": {"A": "The target machine does not send any response.", "B": "The target machine responds with a TCP RST packet.", "C": "The target machine responds with an ICMP error message.", "D": "The target machine responds with a TCP SYN/ACK packet."}, "answer": "B"}, {"num": 123, "text": "A penetration tester is evaluating a web application that uses HTTPS, secure\ncookies, and implements multi factor authentication to prevent session\nhijacking.\nTo hijack a legitimate user’s session without triggering security alerts, which\nadvanced technique should the tester employ?", "options": {"A": "Perform a Cross-Site Request Forgery (CSRF) attack to manipulate session tokens", "B": "Exploit a browser zero-day vulnerability to inject malicious scripts", "C": "Utilize a session token replay attack by capturing encrypted tokens", "D": "Impleme ernment agency trains a group of cybersecurity experts to carry out covert\ncyber missions against foreign threats and gather intelligence without being\ndetected. These experts work exclusively for national interests.\nWhat classification best describes them?", "options": {"A": "State-sponsored hackers", "B": "Organized hackers", "C": "Gray hat hackers", "D": "Hacktivists"}, "answer": "A"}, {"num": 127, "text": "During a red team assessment of an enterprise LAN environment, the tester\ndiscovers an access switch that connects multiple internal workstations. The\nswitch has no port security measures in place. To silently intercept\ncommunication between different hosts without deploying ARP poisoning or\nmodifying the routing table, the tester launches a MAC flooding attack using the\nmacof utility from the dsniff suite. This command sends thousands of Ethernet\nframes per minute, each with a random, spoofed source MAC addresses. Soon\nafter the flooding begins, the tester puts their network interface into\npromiscuous mode and starts capturing packets. They observe unicast traffic\nbetween different internal machines appearing in their packet sniffer – traffic\nthat should have only reached specific destinations on the network.\nWhat internal switch behavior is responsible for this sudden exposure of\nisolated traffic?", "options": {"A": "The interface performed DHCP starvation to capture broadcasts.", "B": "The switch disabled MAC filtering due to duplicate address conflicts.", "C": "The switch performed ARP spoofing to misroute packets.", "D": "The switch entered hub-like behavior due to a full CAM table."}, "answer": "D"}, {"num": 128, "text": "A penetration tester is assessing a web application that uses dynamic SQL\nqueries for searching users in the database. The tester suspects the search\ninput field is vulnerable to SQL injection.\nWhat is the best approach to confirm this vulnerability?", "options": {"A": "Use a directory traversal attack to access server configuration files", "B": "Inject JavaScript into the search field to test for Cross-Site Scripting (XSS)", "C": "Perform a brute-force attack on the user login page to guess weak passwords", "D": "Input ‘; DROP TABLE users; -- into the search field to test if the database query can be\naltered"}, "answer": "D"}, {"num": 129, "text": "During an internal security assessment of a medium-sized enterprise network, a\nsecurity analyst notices an unusual spike in ARP traffic. Closer inspection\nreveals that one particular MAC address is associated with multiple IPaddresses across different subnets. The ARP packets were unsolicited replies\nrather than requests, and several employees from different departments have\nreported intermittent connection drops, failed logins, and broken intranet\nsessions. The analyst suspects an intentional interference on the local network\nsegment.\nWhat is the most likely cause of this abnormal behavior?", "options": {"A": "ARP poisoning causing routing inconsistencies", "B": "DHCP snooping improperly configured", "C": "Port security restricting all outbound MAC responses", "D": "Legitimate ARP table refresh on all clients"}, "answer": "A"}, {"num": 130, "text": "A company’s online service is under a multi-vector DoS attack using both SYN\nfloods and HTTP GET floods from a botnet. Standard firewalls and IDS are\nunable to prevent the outages.\nTo mitigate the attack without disrupting legitimate traffic, which advanced\ndefense should the company implement?", "options": {"A": "Increase server bandwidth and apply basic rate limiting", "B": "Configure the firewall to block all incoming SYN packets from external IPs", "C": "Deploy a Web Application Firewall (WAF) with anomaly detection", "D": "Use DDoS mitigation services that offer multi-layer protection"}, "answer": "D"}, {"num": 131, "text": "A penetration tester identifies malware that monitors the activities of a user\nand secretly collects personal information, such as login credentials  "D": "Leverage hardware acceleration for cracking speed"}, "answer": "D"}, {"num": 157, "text": "A penetration tester detects malware on a system that secretly records all\nkeystrokes entered by the user.\nWhat type of malware is this?", "options": {"A": "Rootkit", "B": "Ransomware", "C": "Keylogger", "D": "Worm"}, "answer": "C"}, {"num": 158, "text": "During a network analysis at a mid-sized enterprise, a security engineer detects\nirregular DHCP behavior. Multiple endpoints are being assigned incorrect\ngateway and DNS settings, causing loss of connectivity and redirection to\nunauthorized servers. Packet captures show that clients are receiving IP address\noffers from more than one DHCP source. Upon further investigation, the logs\nconfirm that the access switch is forwarding DHCP responses from all connected\nports without filtering. This indicates that an unauthorized (rogue DHCP server\nhas been introduced into the network, impersonating the legitimate server and\nresponding to client DHCPDISCOVER messages.\nTo prevent this type of attack from occurring in the future, what security feature\nshould the administrator enable?", "options": {"A": "DHCP snooping on trusted interfaces", "B": "ARP inspection across VLANs", "C": "Static DHCP reservations for clients", "D": "Port security on all trunk ports"}, "answer": "A"}, {"num": 159, "text": "A system administrator observes that several machines in the network are\nrepeatedly sending out traffic to unknown IP addresses. Upon inspection, these\nmachines were part of a coordinated spam campaign.\nWhat is the most probable cause?", "options": {"A": "Keyloggers were harvesting user credentials", "B": "Devices were enslaved into a botnet network", "C": "Worms exploited zero-day vulnerabilities", "D": "Browsers were redirected to adware-injected sites"}, "answer": "B"}, {"num": 160, "text": "A hacker is analyzing a system that uses two rounds of symmetric encryption\nwith different keys. To speed up key recovery, the attacker encrypts the known\nplaintext with all possible values of the first key and stores the intermediate\nciphertexts. Then, they decrypt the final ciphertext using all possible values of the second key and compare the results to the stored values.\nWhich cryptanalytic method does this approach represent?", "options": {"A": "Flood memory with brute-forced credentials", "B": "Reverse permutations to bypass encryption", "C": "Use midpoint collision to identify key pair", "D": "Scrape electromagnetic leakage for bits"}, "answer": "C"}, {"num": 161, "text": "A penetration tester is assessing a web application that does not properly\nsanitize user input in the search field. The tester suspects the application is\nvulnerable to a SQL injection attack.\nWhich approach should the tester take to confirm the vulnerability?", "options": {"A": "Perform a brute-force attack on the login page to identify weak passwords", "B": "Input a SQL query such as ‘ OR 1=1 -- into the search field to check for SQL injection", "C": "Use directory traversal in the search field to access sensitive files on the server", "D": "Inject JavaScript into the search field to perform a Cross-Site Scripting (XSS) attack"}, "answer": "B"}, {"num": 162, "text": "An ethical hacker needs to gather detailed information about a company’s\ninternal network without initiating any direct interaction that could be logged\nor raise suspicion.\nWhich approach should be used to obtain this information covertly?", "options": {"A": "Utilize network scanning tools to map the company’s IP range", "B": "Inspect public WHOIS records for hidden network data", "C": "Examine email headers from past communications with the company", "D": "Analyze the company’s SSL certificates for internal details"}, "answer": "C"}, {"num": 163, "text": "A penetration tester is conducting an external assessment of a corporate web\nserver. They start by accessing https://www.targetcorp.com/robots.txt and\nobserve multiple Disallow entries tha
