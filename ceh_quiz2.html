<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH 312-50v13 練習題 Q1–Q249</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #00e5ff;
    --accent2: #ff6b6b;
    --success: #3fb950;
    --warn: #f78166;
    --text: #e6edf3;
    --muted: #7d8590;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    display: flex;
    gap: 0;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 120px;
    max-width: 600px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-resize {
    position: absolute;
    right: 0;
    top: 0;
    width: 5px;
    height: 100%;
    cursor: col-resize;
    background: transparent;
    z-index: 20;
    transition: background 0.15s;
  }
  #sidebar-resize:hover, #sidebar-resize.dragging {
    background: var(--accent);
    opacity: 0.5;
  }

  #sidebar-header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--border);
  }

  #reset-btn {
    margin: 8px 14px 0;
    padding: 6px 10px;
    width: calc(100% - 28px);
    background: transparent;
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: var(--radius);
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.15s, background 0.15s;
  }
  #reset-btn:hover { opacity: 1; background: rgba(255,80,80,0.08); }

  #sidebar-header h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  #sidebar-header p {
    font-size: 12px;
    color: var(--muted);
  }

  #wrong-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
  }

  #wrong-list::-webkit-scrollbar { width: 4px; }
  #wrong-list::-webkit-scrollbar-track { background: transparent; }
  #wrong-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .wrong-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }

  .wrong-item:hover { background: var(--surface2); }

  .wrong-item .qnum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    min-width: 50px;
  }

  .wrong-item .wrong-ans {
    font-size: 11px;
    color: var(--warn);
    font-family: 'JetBrains Mono', monospace;
  }

  .wrong-item .right-ans {
    font-size: 11px;
    color: var(--success);
    font-family: 'JetBrains Mono', monospace;
    margin-left: auto;
  }

  #empty-msg {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 30px 10px;
    line-height: 1.8;
  }

  #stats-bar {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  #stats-bar span { color: var(--text); }

  /* ── Main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 100vh;
  }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #topbar h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  #topbar h1 span { color: var(--accent); }

  #page-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  #progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.4s ease;
  }

  #quiz-area {
    flex: 1;
    padding: 32px 32px 20px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 24px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .question-card.answered { border-color: var(--border); }
  .question-card.correct { border-color: var(--success); }
  .question-card.wrong { border-color: var(--warn); }

  .q-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
    background: rgba(0,229,255,0.08);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(0,229,255,0.2);
  }

  .q-status-icon {
    margin-left: auto;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .question-card.correct .q-status-icon { opacity: 1; }
  .question-card.wrong .q-status-icon { opacity: 1; }

  .q-text {
    padding: 18px 20px 16px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
  }

  .options {
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    line-height: 1.5;
    user-select: text;
    -webkit-user-select: text;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.04);
    border-color: rgba(0,229,255,0.4);
    transform: translateX(2px);
  }

  .option-btn:disabled { cursor: default; }
  .option-btn.submitted-state { cursor: default; }

  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    min-width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: var(--border);
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option-btn.selected .opt-letter {
    background: rgba(0,229,255,0.2);
    color: var(--accent);
  }

  .option-btn.correct-ans .opt-letter {
    background: rgba(63,185,80,0.25);
    color: var(--success);
  }

  .option-btn.wrong-ans .opt-letter {
    background: rgba(247,129,102,0.25);
    color: var(--warn);
  }

  .option-btn.correct-ans {
    background: rgba(63,185,80,0.06);
    border-color: rgba(63,185,80,0.4);
  }

  .option-btn.wrong-ans {
    background: rgba(247,129,102,0.06);
    border-color: rgba(247,129,102,0.4);
  }

  .submit-row {
    padding: 0 16px 16px;
  }

  .submit-btn {
    padding: 9px 22px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .submit-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
  .submit-btn.submitted { background: var(--border); color: var(--muted); }

  .answer-reveal {
    margin: 0 16px 16px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    display: none;
    font-family: 'JetBrains Mono', monospace;
  }

  .answer-reveal.show { display: block; }
  .answer-reveal.ok { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
  .answer-reveal.no { background: rgba(247,129,102,0.1); color: var(--warn); border: 1px solid rgba(247,129,102,0.3); }

  /* ── Pagination ── */
  #pagination {
    padding: 24px 32px 40px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .page-btn {
    padding: 10px 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 1px;
  }

  .page-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .page-btn:disabled { opacity: 0.3; cursor: default; }

  #page-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }

  .page-dot {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-dot:hover { border-color: var(--accent); color: var(--accent); }
  .page-dot.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .page-dot.has-wrong { border-color: var(--warn); color: var(--warn); }
  .page-dot.active.has-wrong { background: var(--warn); color: #000; }
  .page-dot.all-correct { border-color: var(--success); color: var(--success); }
  .page-dot.active.all-correct { background: var(--success); color: #000; }

  /* scrollbar main */
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: transparent; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 700px) {
    #sidebar { display: none; }
    #quiz-area { padding: 16px; }
    #pagination { padding: 16px 16px 32px; }
    #topbar { padding: 12px 16px; }
    #page-dots { max-width: 260px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-resize"></div>
  <div id="sidebar-header">
    <h2>錯題紀錄</h2>
    <p>點擊可跳至該題頁面</p>
  </div>
  <button id="reset-btn" onclick="resetProgress()">🔄 重置所有進度</button>
  <div id="wrong-list">
    <div id="empty-msg">尚無錯題<br>繼續加油！✓</div>
  </div>

    已答 <span id="stat-answered">0</span> / 249 &nbsp;|&nbsp; 正確 <span id="stat-correct">0</span>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <h1>CEH 312-50v13 &nbsp;<span>Q1–Q249</span></h1>
    <span id="page-info">第 1 頁 / 26 頁</span>
  </div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <div id="quiz-area"></div>
  <div id="pagination">
    <button class="page-btn" id="btn-prev" onclick="changePage(-1)" disabled>← 上一頁</button>
    <div id="page-dots"></div>
    <button class="page-btn" id="btn-next" onclick="changePage(1)">下一頁 →</button>
  </div>
</div>

<script>
const QUESTIONS = [{"num": 1, "text": "You are a security analyst for a medium-sized e-commerce company. Recently, the\n company has been suffering from repeated incidents of session hijacking. To prevent\n future incidents, you’ve been asked to suggest a robust strategy to mitigate this disk.\n Which of the following approaches would you recommend?", "options": {"A": "Deploy a network-based intrusion prevention system (IPs) to detect and prevent session\n hijacking attempts in real-time.", "B": "Apply an IPsec VPN solution that encrypts the entire IP packet, thereby making session\n hijacking attempts more difficult.", "C": "Implement a new physical security policy to prevent unauthorized access to the company’s\n data centres.", "D": "Implement a security awareness program to educate employees on the risks and signs of\n session hijacking."}, "answer": "B"}, {"num": 2, "text": "As an IT professional, you are attending a webinar on cybersecurity. The\npresenter emphasizes the importance of ethical hacking and the different types\nof hackers involved in the cyber world. Suddenly, the term “script kiddie” is\nmentioned, piquing your curiosity.\nAccording to the presenter, who are “script kiddies” in the context of ethical\nhacking?", "options": {"A": "They are highly skilled hackers who write their scripts to breach security systems.", "B": "They are novices in the hacking world who mainly use scripts and codes developed by\nothers.", "C": "They are ethical hackers who use scripts to conduct penetration testing on their systems.", "D": "They are hackers who specialize in scripting languages to launch sophisticated cyberattacks."}, "answer": "B"}, {"num": 3, "text": "At XYZ Corporation, a multinational firm known for its digital services, the\ncybersecurity team is tasked with ensuring a robust, secure network\nenvironment. This responsibility includes maintaining a keen focus on\nvulnerability assessment and patch management strategies to guard against\npotential threats, including the increasingly prevalent zero-day attacks. Recent\nintelligence has alerted the team to a concerning issue: the primary web server\nsoftware that the corporation relies on for its critical operations has been hit\nwith a newly discovered zero-day vulnerability. Alarmingly, this vulnerability is\nnot just theoretical; active exploitations of this vulnerability have been spotted\nin the wild, making the threat immediate and real. However, the vendor of the\nsoftware, caught off guard by the discovery, has not yet released an official\npatch to mitigate this vulnerability.\nGiven these circumstances, what is the FIRST step that the cybersecurity team at\nXYZ Corporation should undertake to manage the significant risk posed by this\nunpatched zero-day vulnerability?", "options": {"A": "Proactively shut down the web server completely until an official patch is released by the\nsoftware vendor to fix the identified vulnerability.", "B": "Maintain the course of normal operations but keep a close watch on the web server for any\nunusual activities or signs of a potential attack.", "C": "Swiftly apply a virtual patch to the affected web server using a web application firewall to\ntemporarily safeguard against potential exploits.", "D": "Initiate a regimented protocol of regular backups of the web server data and ensure a\nthoroughly developed incident response plan is ready for deployment."}, "answer": "C"}, {"num": 4, "text": "A cybersecurity team at a multinational company notices unusual network\ntraffic on their Bluetooth devices. It is suspected to be a Bluesnarfing attack,\naimed at accessing unauthorized information from Bluetooth-enabled devices.\nWhich of the following would be the most effective countermeasure to prevent\nfurther unauthorized access?", "options": {"A": "Increase the complexity and length of the PIN codes on Bluetooth devices.", "B": "Implement network-level encryption on all data transmission over Bluetooth.", "C": "Disable “Discoverable Mode” and activate “Non-discoverable Mode” on all Bluetooth\ndevices.", "D": "Regularly update Bluetooth devices to the latest firmware versions."}, "answer": "C"}, {"num": 5, "text": "As an Ethical Hacker, you’ve been asked to test an application’s vulnerability to\nSQL injection. In the process, you discover an entry field that appearssusceptible. However, the backend database is unknown, and regular SQL\ninjection techniques have so far failed to elicit useful information.\nWhich advanced SQL injection technique should you apply next?", "options": {"A": "Time-Based Blind SQL Injection", "B": "Union-Based SQL Injection", "C": "Error-Based SQL Injection", "D": "Content-Based Blind SQL Injection"}, "answer": "A"}, {"num": 6, "text": "A prominent healthcare organization relies on mobile platforms to access\nelectronic health records (EHR and facilitate communication among healthcare\nprofessionals. Recently, the security team detected suspicious activities\nindicating potential vulnerabilities in the mobile platforms, raising concerns\nabout unauthorized access to sensitive patient data and potential breaches of\nmedical privacy laws. The team is tasked with identifying advanced hacking\ntechniques targeting mobile platforms and implementing robust measures to\nenhance mobile security and protect patient confidentiality.\nGiven the scenario described, which sophisticated hacking technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nsecurity of the healthcare organization’s mobile platforms?", "options": {"A": "Bluejacking Exploiting Bluetooth Connections to Send Unsolicited Messages or Malicious\nLinks to Nearby Mobile Devices, Potentially Compromising Device Security and Data Integrity", "B": "Zero-Day Exploits Leveraging Previously Unknown Vulnerabilities in Mobile Operating Systems or Applications to Gain Unauthorized Access to Healthcare Data and Patient Records", "C": "Side-Channel Attack Exploiting Physical Characteristics of Mobile Devices, such as Power\nConsumption or Electromagnetic Emissions, to Extract Sensitive Data, Such as Encryption Keys", "D": "App Spoofing Impersonating Legitimate Healthcare Apps to Trick Users into Providing\nSensitive Information, Such as Medical History or Insurance Details"}, "answer": "B"}, {"num": 7, "text": "During a red team exercise, an attacker dresses as a network technician and\ngains unchallenged access to a restricted area. Once inside, he roams freely,\nobserving employees and reviewing sensitive documents left unattended.\nWhich of the following tactics best represents this scenario?", "options": {"A": "Pretending to offer remote tech support over a call to obtain credentials.", "B": "Gaining physical access by assuming the identity of a trusted internal staff.", "C": "Collecting confidential information by digging through trash bins.", "D": "Calling the help desk and claiming to be a high-ranking executive needing urgent access."}, "answer": "B"}, {"num": 8, "text": "During an investigation, an ethical hacker discovered that a web application’s\nAPI has been compromised, leading to unauthorized access and data\nmanipulation. They identified webhooks and a webshell being used by the\nattacker.\nTo prevent further exploits, which of the following actions should be taken?", "options": {"A": "Perform regular code reviews for the webhooks and modify the API to block connections\nfrom unknown IP addresses.", "B": "Harden the web server security, add multi-factor authentication for API users, and restrict\nthe execution of scripts server-side.", "C": "Implement a Web Application Firewall (WAF) with rules to block webshell traffic and increase\nthe logging verbosity of webhooks.", "D": "Implement input validation on all API endpoints, review webhook payloads, and schedule\nregular scanning for webshells."}, "answer": "B"}, {"num": 9, "text": "You are a security analyst investigating a network compromise. The infected\nsystems are receiving external instructions, masking the control traffic using\nwidely allowed protocols like HTTP and DNS. The payloads are stealthy and\nmodify system components without saving files to disk.\nWhat would be the most effective action to detect and disrupt this kind of\nmalware communication?", "options": {"A": "Focus on updating antivirus signatures regularly to catch known malware variants.", "B": "Configure proxy servers to allow only encrypted traffic and block all plain HTTP\nrequests.", "C": "Use behavioral analytics to monitor for irregular outbound requests and abnormalapplication behavior.", "D": "Implement port blocking for common malware-associated ports like 6667 and 12345."}, "answer": "C"}, {"num": 10, "text": "While performing a vulnerability assessment for XYZ Corporation, you discover\nthat several key systems are regularly interacting with unidentified external\nentities. These interactions often involve data transfers, both incoming and\noutgoing. While some of these might be legitimate, the nature and volume of\nthis unmonitored traffic raise concerns about potential data exfiltration or\nmalware introduction.\nGiven the ambiguous nature of these interactions and the high stakes involved,\nwhich strategy would most directly identify and mitigate the vulnerabilities\nassociated with these unsanctioned exchanges?", "options": {"A": "Prioritize a behavioral analytics solution that profiles normal system behaviors and alerts\non deviations, focusing on the interaction patterns of the identified systems.", "B": "Institute a company-wide training session on the dangers of unsolicited communications,\nhoping to curtail inadvertent employee engagements with external entities.", "C": "Implement an aggressive zero-trust model across the board, cutting off all external\ninteractions until each can be individually vetted and validated.", "D": "Initiate a deep-dive forensic analysis on the systems involved, looking for signs of past\nbreaches, malware, or unauthorized data manipulations."}, "answer": "A"}, {"num": 11, "text": "As a security expert for a prominent tech company, you’ve noticed an increasing\nnumber of attacks on your web services. You’ve concluded that the best course\nof action is to enhance your patch management strategies.\nConsidering the information presented, which of the following strategies would\nbe most effective in ensuring the secure and efficient management of patches\nand hotfixes?", "options": {"A": "Only applying patches and hotfixes that are distributed outside the customer organization to\navoid vendor-specific vulnerabilities.", "B": "Implementing an automatic patch management process and using a patch management\ntool to monitor the patched systems.", "C": "Manual installation of patches and hotfixes on the live server directly from the vendors’\nwebsites.", "D": "Downloading and applying all patches and hotfixes, regardless of the source, to cover all\npossible vulnerabilities."}, "answer": "B"}, {"num": 12, "text": "A Certified Ethical Hacker (CEH is investigating a recent attack on a company’s\nweb server. The server hosts multiple domains and uses a web proxy to\nmaintain anonymity and prevent IP blocking. The CEH discovers that the\nserver’s document root directory, which stores critical HTML files, is named\n“certroot” and is stored in the directory /admin/web. The server root, which\nstores the server’s configuration, error, executable, and log files, is also\nidentified. The CEH also notes that the server uses a virtual document tree for\nadditional storage. The server was compromised via a DNS server hijacking\nattack where the attacker redirected all requests coming towards the target\nweb server to their own malicious server.\nGiven this scenario which of the following actions would most likely prevent\nsuch an attack in the future?", "options": {"A": "Implementing an open-source web server architecture such as\n LAMP", "B": "Regularly updating and patching the server software", "C": "Changing the server’s IP address regularly", "D": "Implementing DNSSEC on the DNS server"}, "answer": "D"}, {"num": 13, "text": "During a cybersecurity operation, a CEH professional discovered an unknown\nBluetooth Low Energy (BLE device actively transmitting pairing signals. The\nprofessional decided to breach the BLE device using a crackle. The device was\nseen pairing and exchanging keys, leading to the establishment of a secure\nconnection. However, the professional only managed to capture LL_ENC_REQ\nand LL_ENC_RSP packets, but not the Long-Term Key (LTK.\nWhich of the following best describes the professional’s next course of action?", "options": {"A": "Use Btlejacking to hijack the connection.", "B": "Decrypt the pcap data using the -o option.", "C": "Use the BlueZ tool hcitool inq to reveal more information about the\n device.", "D": "The operation cannot continue without the LTK."}, "answer": "D"}, {"num": 14, "text": "A multinational corporation provides its employees with mobile devices to\nsupport remote work and enhance productivity. Recently, the security team\ndetected suspicious activities indicating potential vulnerabilities in the mobile\nplatforms, raising concerns about unauthorized access and data leakage. The\nteam is tasked with identifying advanced hacking techniques targeting mobile\nplatforms and implementing robust measures to enhance mobile security and\nprevent intrusions.\nGiven the scenario described, which sophisticated hacking technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nsecurity of the multinational corporation’s mobile platforms?", "options": {"A": "Man-in-the-Middle (MitM) Attack Interfering with Communication between Mobile Devices\nand Corporate Servers to Intercept Sensitive Data, such as Corporate Emails and Documents", "B": "Clickjacking Attack Embedding Malicious Links or Buttons in Legitimate Apps to Trick Users\ninto Performing Unintended Actions, such as Providing Credentials or Authorizing Transactions", "C": "Remote Access Trojan (RAT) Implanting Malicious Software on Mobile Devices to Gain\nUnauthorized Remote Access and Monitor User Activities, such as Keystrokes and Screen\nCapture", "D": "Jailbreaking/Rooting Exploiting Vulnerabilities to Remove Software Restrictions on Mobile\nDevices, Allowing Installation of Unauthorized Apps and Access to Restricted Functions"}, "answer": "C"}, {"num": 15, "text": "In a recent penetration testing assignment, you were able to breach a servers\nweb service and install a backdoor. Your aim is to maintain access for as long as\npossible without getting detected.\nConsidering the web server countermeasures explained earlier, which of the\nfollowing actions would make your backdoor most likely to remain undetected?", "options": {"A": "Placing the backdoor in a file type that is typically excluded from resource\n maps.", "B": "Install the backdoor on a non-web file referenced in a URL.", "C": "Embedding the backdoor in a regularly updated web file.", "D": "Increasing the size of the backdoor’s code to avoid signature-based detection."}, "answer": "B"}, {"num": 16, "text": "During a cybersecurity training session at your organization, you present several\nhypothetical scenarios to the trainees to assess their understanding of social\nengineering threats. \nWhich of these scenarios best describes a social engineering attack?", "options": {"A": "Mary, an IT executive, uses a packet sniffer to monitor network traffic for unusual activity.", "B": "Alex, a system administrator, inadvertently introduces malware into the network while\nupdating the operating system on all company computers.", "C": "Sarah, a new recruit, receives a call from someone claiming to be from the IT department,\nwho asks for her login credentials to solve a non-existing issue.", "D": "John, an employee, leaves his computer unlocked while going for lunch, and a stranger takes\nthis opportunity to access sensitive data."}, "answer": "C"}, {"num": 17, "text": "As a cybersecurity professional in a growing organization, you are tasked with\nconducting comprehensive reconnaissance of your own company’s digital\npresence. In addition to using tools like WHOIS, DNS analysis, and search\nengines, you are also considering investigating the Deep Web.\nWhich of the following justifications best supports your idea to explore the\nDeep Web for potential risks related to your organization’s information?", "options": {"A": "The Deep Web is a hub for hackers and can help you understand the latest hacking\ntechniques.", "B": "Exploring the Deep Web can help you identify the physical location of potential attackers.", "C": "The Deep Web contains a lot of user-generated content which could reveal insider threats.", "D": "Search engines don’t index the Deep Web, and there could be non-indexed company\ninformation lying there."}, "answer": "D"}, {"num": 18, "text": "During an internal security audit, the cybersecurity team at a large healthcare\norganization detects abnormal patterns in DNS resolution behavior on the\ncorporate internal network. Several employees report that when they attempt\nto visit legitimate internal and external websites, they are redirected to login\npages that appear slightly altered. Upon deeper inspection, security logs reveal\nthat DNS responses are being returned from an internal IP address that is not\nan authorized DNS server. These rogue responses are consistently faster than\nthe legitimate replies from the corporate DNS server. Around the same time,\nnetwork monitoring tools register a sharp spike in ARP spoofing alerts\noriginating from a specific subnet. The organization becomes concerned that\nsensitive login credentials and personal health data may have been intercepted\nby an insider.\nGiven this scenario, what type of sniffing-based attack is most likely being\nexecuted?", "options": {"A": "Proxy-based DNS redirection over remote tunnels", "B": "DNS cache poisoning from an upstream DNS resolver", "C": "Intranet DNS poisoning via local spoofed responses", "D": "Internet DNS spoofing via altered primary DNS settings"}, "answer": "C"}, {"num": 19, "text": "The web application security team of a global firm detected a sophisticated\ninjection attack that exploited a flaw in the application’s input validation. The\nattack was carried out using a custom script that used obfuscation and evasion\ntechniques to bypass security measures. To counter such attacks in the future,\nthe security team is considering implementing additional security measures.\nWhich of the following would be the most effective?", "options": {"A": "Deploy a Web Application Firewall (WAF) with built-in evasion detection features.", "B": "Enforce Two-Factor Authentication (2FA) for all user-level application access.", "C": "Implement continuous security code review and penetration testing.", "D": "Configure Security Information and Event Management (SIEM) to monitor user activity in real\ntime."}, "answer": "A"}, {"num": 20, "text": "As the newly appointed head of IT security at a growing startup, you have been\ntasked with improving the company’s security posture. Given the rise in social\nengineering attacks, you decide to set up training sessions for employees to\nhelp them identify these threats. During a session, you ask the team to identify\nthe type of social engineering attack where an attacker impersonates a coworker or an authority figure to extract confidential information.\nWhich option correctly identifies this type of attack?", "options": {"A": "Baiting", "B": "Phishing", "C": "Quid pro quo", "D": "Pretexting"}, "answer": "D"}, {"num": 21, "text": "A multinational company is planning to integrate an IoT-based environmental\ncontrol system for its manufacturing units worldwide. They engage a\ncybersecurity team to ensure that the new system remains secure from any\npotential threats. The cybersecurity team is tasked with identifying the most\n likely method an advanced persistent threat (APT group might use to\ncompromise the new IoT-based environmental control system.\nWhat is the most plausible attack vector?", "options": {"A": "The APT group will exploit zero-day vulnerabilities present in the IoT device firmware.", "B": "The APT group will perform an encryption-based Man-in-the-Middle attack between the IoT\n devices and the control server.", "C": "The APT group will execute a DDoS attack to overload the network and gain control over the\n IoT devices.", "D": "The APT group will infiltrate the network using compromised user credentials."}, "answer": "A"}, {"num": 22, "text": "As a newly appointed ethical hacker for XYZ Corporation, you have been\nassigned your first major task. The company has been facing persistent cyber\nthreats and as a precautionary measure, you are tasked to conduct a thorough\nnetwork vulnerability assessment. Your key objective is to efficiently map out all\nopen ports and associated services in the organization’s expansive network.\nSimultaneously, it’s of paramount importance that your activities remain\nstealthy and do not trigger the advanced intrusion detection systems (IDS\nemployed by the organization.\nGiven these requirements, which scanning technique would you opt for to\nachieve your task with maximum efficacy and discretion?", "options": {"A": "Stealth Scan (SYN Sean)", "B": "ACK Scan", "C": "FIN Scan", "D": "TCP Connect Scan"}, "answer": "A"}, {"num": 23, "text": "A cybersecurity firm has deployed a comprehensive defense system, including\nIntrusion Detection Systems (IDS), firewalls, and honeypots, to protect its\nnetwork from malicious activities. Despite these measures, the security team\nhas noticed suspicious traffic patterns indicating potential attempts to evade\ndetection and breach the network perimeter. The team is tasked with identifying\nadvanced evasion techniques and strengthening the defense mechanisms to\nmitigate emerging threats effectively.\nGiven the scenario described, which sophisticated evasion technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nintegrity of the cybersecurity firm’s network?", "options": {"A": "Protocol-Level Evasion Techniques Fragmenting Packets to Evade Stateful Inspection by\nFirewalls", "B": "Polymorphic Malware Variants Generating Unique Payloads to Bypass Signature-Based\nDetection by IDS", "C": "Honeypot Spoofing Attacks Mimicking Legitimate Network Services to Avoid Detection by\nIntrusion Detection Systems", "D": "Covert Channel Communication Exploiting Unused IP Header Fields to Conceal Malicious\nTraffic and Evade Detection by Security Devices"}, "answer": "D"}, {"num": 24, "text": "As a cybersecurity analyst working for a multinational corporation, you are\ntasked with the responsibility of conducting routine vulnerability scans. This\ntime around, you decided to use a different strategy and opted to employ a FIN\nscan, which is a type of stealth scanning technique. Upon conclusion of your\nscan, you notice an interesting anomaly – a significant number of ports did not\nrespond to your FIN packets. With this unexpected result, you are now faced\nwith the challenge of correctly interpreting the findings and planning the next\ncourse of action.\nBased on your understanding of FIN scanning and TCP/IP protocols, how should\nyou interpret these findings?", "options": {"A": "Conclude that these ports are closed since they did not respond to the FIN packets.", "B": "Consider the possibility of firewall blocking the FIN packets and investigate further.", "C": "Interpret this as a sign of network congestion and prioritize network optimization.", "D": "Immediately escalate this issue to management as it indicates a potential ongoing\nbreach."}, "answer": "B"}, {"num": 25, "text": "As a cybersecurity professional conducting a network vulnerability assessment\nfor your organization, you discover a potentially critical vulnerability. This\nvulnerability arises from an outdated software component installed on a critical\nproduction server used by the financial department. The software vendor has\nacknowledged this vulnerability and promptly released a patch to fix it.\nHowever, the application of the patch has been deferred due to the\ndepartment’s operational needs, as they cannot tolerate downtime during\nbusiness hours, which would significantly impact their productivity. The\nsituation poses a significant risk due to the potential for exploitation until the\npatch is applied.\nWith these constraints in mind, as a Certified Ethical Hacker, what immediate\naction could you undertake to reduce the risk associated with this vulnerability\nwithout disrupting department operations?", "options": {"A": "Implement a strategy of Virtual Patching, providing a protective layer around the\nvulnerability until the actual patch can be applied.", "B": "Initiate a full-scale penetration test on the vulnerable server to evaluate the true potential\nimpact of the vulnerability.", "C": "Continually monitor network traffic to and from the server to detect any attempts at\nexploiting the identified vulnerability.", "D": "Insist that the financial department cease all operations and use of the server until the\npatch has been applied."}, "answer": "A"}, {"num": 26, "text": "A red team simulation reveals a malware strain that adapts its behavior based\non observed user activity and evades detection by altering its code dynamically.\nThe malware exfiltrates data only when the system is idle and uses encrypted\nchannels for communication.\nBased on these traits, what is the most probable nature of this malware?", "options": {"A": "AI-powered malware using machine learning to tailor its execution.", "B": "Polymorphic virus that changes its signature during replication.", "C": "A worm that exploits known OS vulnerabilities to propagate.", "D": "Rootkit that hides files and processes from detection."}, "answer": "A"}, {"num": 27, "text": "As a cybersecurity consultant, you have been hired by a multinational\ncorporation to identify potential security risks in their network. During the\nenumeration phase, you utilize LDAP to gather information about the network infrastructure. However, you observe that some critical information isn’t\nretrievable.\nWhat could be the primary reason for this?", "options": {"A": "The LDAP service is running on a non-standard port.", "B": "The hosts are located in a different subnet.", "C": "The company network is currently experiencing heavy traffic, leading to dropped\n requests.", "D": "The LDAP directory data is protected by Access Control Lists (ACLs)."}, "answer": "D"}, {"num": 28, "text": "A logistics company recently found that some of its fleet vehicles equipped with\nsmart locking systems were compromised, leading to vehicle thefts. The\ncybersecurity team suspects that attackers captured unique signals emitted by\nthe key fobs during regular usage.\nTo effectively confirm and prevent this attack in the future, what should the\nsecurity team prioritize?", "options": {"A": "Implement a secure firmware update on each vehicle’s onboard control system.", "B": "Increase physical surveillance around vehicle parking areas.", "C": "Deploy anti-malware systems on all company smartphones associated with vehicles.", "D": "Monitor wireless signals for abnormal jamming or interference."}, "answer": "A"}, {"num": 29, "text": "You are currently serving as a cybersecurity analyst at a global banking\ncorporation. Your team has recently identified a series of irregular incidents\nthat indicate a potential backdoor attack on the company’s intricate network\nsystem. Some of these irregularities include a significant rise in outbound\nnetwork traffic during non-working hours, unexpected and unaccounted system\nreboots, and strangely modified system files. Your primary focus now is to\ndetect any hidden backdoor in the system, neutralize it, and ensure the overall\nintegrity of the systems involved, while preventing any further security\nbreaches.\nGiven the complexity of the situation and the importance of maintaining the\nbank’s network security, what combination of measures would be most effective\nin accurately identifying the potential backdoor, neutralizing it, and ensuring\nthe system’s security?", "options": {"A": "Implement strict access control lists (ACLs), ensure regular updates of security patches, and\nconduct an extensive audit of user accounts and privileges periodically.", "B": "Implement stringent password policies, enforce multi-factor authentication (MFA) for all\nusers, and conduct regular vulnerability assessments of the system.", "C": "Perform detailed monitoring of system and file activity, incorporate anomaly detection\ntechniques in the security framework, and utilize advanced anti-malware tools for\ncomprehensive system scans.", "D": "Review the firewall logs regularly, perform a thorough analysis of network traffic during nonworking hours, and carry out an immediate system shutdown and reboot."}, "answer": "C"}, {"num": 30, "text": "A cybersecurity team is assessing an organization’s network for\nmisconfigurations. During the enumeration process, they use a tool that sends a\nrequest to UDP port 161 and receives a large list of software names installed on\nremote devices. The operation is successful due to the use of a publicly known\ncommunity string.\nWhat enabled this enumeration technique to work so effectively?", "options": {"A": "The SNMP agent was misconfigured to log trap messages in plain text.", "B": "The SNMP agent allowed anonymous bulk data queries due to default settings.", "C": "The SNMP manager had access to encrypted Windows registry keys remotely.", "D": "The organization was using unencrypted FTP services to store software data."}, "answer": "B"}, {"num": 31, "text": "While conducting a thorough reconnaissance operation on a potential threatactor’s digital footprint, an ethical hacker working for a cybersecurity firm\nstumbled upon an interesting discovery. The threat actor appeared to have left\na series of digital breadcrumbs across various internet forums and hidden web\npages, pointing to a potential future attack strategy. The ethical hacker, wanting\nto gather as much information as possible about the actor’s potential strategy\nwithout tipping them off, has to make careful tool and technique choices.\nWhich of the following approaches should the ethical hacker most likely avoid\nto maintain a low profile and avoid alerting the threat actor?", "options": {"A": "Utilizing internet archive services like the Wayback Machine to inspect any past versions of\nthe threat actor’s web pages for additional clues.", "B": "Directly interacting with the threat actor on the forums using a pseudonym to gain more\ninformation about their plans.", "C": "Using the Tor browser to anonymously browse and investigate the hidden web pages without\nleaving a trace.", "D": "Employing WHOIS and DNS lookup tools to gain information about the ownership and IP\naddresses associated with the internet forums."}, "answer": "B"}, {"num": 32, "text": "A cybersecurity analyst working for a multinational corporation is tasked with\nperforming regular surveillance of their competitors’ digital presence to identify\nany changes that could indicate strategic shifts or potential threats. To stay\nupdated on their competitors’ web content updates, the analyst has devised a\nplan to use several tools and techniques to achieve his objective efficiently.\nHowever, there is a key component in his strategy that he overlooked.\nWhich of the following is the most crucial aspect he should add to ensure the\neffective implementation of his surveillance strategy?", "options": {"A": "Engage in discussions on the competitors’ blogs and forums to obtain inside information\nabout their operations.", "B": "Use a VPN service when visiting the competitors’ websites to obscure his own IP address.", "C": "Set up Google Alerts to receive email notifications whenever new web content includes\ntheir competitors’ names or other key terms.", "D": "Hire a third-party service to hack into the competitors’ databases and gather confidential\ndata."}, "answer": "C"}, {"num": 33, "text": "A security analyst working for a large financial corporation has been assigned to\nconduct a comprehensive penetration test on the corporation’s wireless\ninfrastructure. The infrastructure relies on a secured WPA2-PSK-secured\nnetwork to ensure data protection. During the course of the examination, the\nanalyst discerned a significant vulnerability within the network that could\npotentially be exploited.\nWhich of the subsequent options most accurately delineates the procedure that\nthe analyst might have employed to pinpoint this particular vulnerability?", "options": {"A": "The analyst instigated a de-authentication attack, purposely causing a mass disconnection\nof all clients from the access point. The analyst then attentively observed the four-way\nhandshake process that occurred during the clients’ reconnection attempts.", "B": "The analyst conducted a rogue access point attack, cunningly emulating the characteristics of\nthe legitimate access point to deceive clients into unintentionally connecting to a malicious\nnetwork.", "C": "The analyst implemented a jamming attack, deliberately interfering with the wireless\nnetwork’s communication functionality, forcing the access point to inadvertently reveal the preshared key.", "D": "The analyst initiated a man-in-the-middle attack, surreptitiously intercepting and modifying\nthe communication between the client and the access point, effectively purloining the preshared key."}, "answer": "A"}, {"num": 34, "text": "As a cybersecurity analyst at a renowned software corporation, you’ve noticed\nsome peculiar activity. The company’s internal network has seen a sudden\nincrease in redundant network traffic and system crashes. Initial scans have\nfound that most affected systems run a particular version of the operating\nsystem, and the identified malicious code seems to be self-replicating and\nspreading across the network autonomously.\nConsidering the following malware types, which would you identify as the\nprobable cause of this anomalous behavior? Furthermore, how would you\nprioritize your response to counteract this malware threat and alleviate the\nsystem disruptions?", "options": {"A": "Trojan: Initiate a thorough network scan with updated anti-malware tools, isolate the\naffected systems, and patch all the systems with the latest updates.", "B": "Ransomware: Advise users to disconnect their systems from the network, back up vital data,\nand utilize a reputable decryption tool to regain access.", "C": "Worm: Quarantine the affected systems, perform an immediate network-wide sweep with\nthe latest antivirus definitions, and update the operating system on all network systems.", "D": "Rootkit: Recommend a system reboot in safe mode, followed by deployment of an advanced\nrootkit scanner and subsequent patching of the systems."}, "answer": "C"}, {"num": 35, "text": "You are a cybersecurity analyst at a financial institution. Your company has a\nstrict policy against any unencrypted protocols. You’ve noticed some data\npackets being sent via HTTP rather than HTTPS on the network. This raises your\nconcern because HTTP is a protocol that sends data in plaintext. To further\ninvestigate this matter, you decide to use a sniffing tool.\nWhich of the following would be the most appropriate choice?", "options": {"A": "Netcat", "B": "Wireshark", "C": "Nmap", "D": "Nessus"}, "answer": "B"}, {"num": 36, "text": "As part of a security audit, your team evaluates a system flagged by your\nautomated scanner. The tool outputs a vector string with a numerical range of 9.8, indicating a critical severity. However, the client is unsure about the realworld implications of this score. You are tasked with explaining what this score\nconveys and how it was derived.\nWhich of the following best explains the purpose and benefit of this type of\nrating in prioritizing remediation efforts?", "options": {"A": "It provides a qualitative baseline that supports public exploit classification based on\nbehavior.", "B": "It simplifies attack replication by generating matching exploit payloads from live memory\ndumps.", "C": "It quantifies technical impact and ease of exploitation, guiding structured risk response\nbased on impact and environment.", "D": "It measures authentication errors in binary protocols to align patching with service\nconfiguration."}, "answer": "C"}, {"num": 37, "text": "A red team operator is conducting reconnaissance on a financial organization’s\ninfrastructure. While probing UDP port 123, they send NTP queries and receive a\n list of internal IP addresses and connected hostnames. The organization is\nunaware that sensitive network details are exposed externally.\nWhat is the most likely reason for this information disclosure?", "options": {"A": "The DNS resolver for the organization has been poisoned to leak internal names.", "B": "The NTP daemon is configured to accept queries from external sources without\n restriction.", "C": "The firewall is rerouting NTP traffic to a honeypot that simulates internal hosts.", "D": "The NTP service is using TCP fallback, allowing enumeration through TCP 443."}, "answer": "B"}, {"num": 38, "text": "In a healthcare organization, the network security team detects unusual\nnetwork activity, indicating advanced sniffing techniques used by a potential\nattacker. Upon investigation, it’s found that the attacker exploits vulnerabilities\nin medical imaging protocols to intercept patient data. The security team must\nidentify the specific sniffing technique being used and take action to protect\npatient privacy.\nConsidering the scenario, which sophisticated sniffing technique poses the\ngreatest challenge for the security team, potentially compromising patient data\nsecurity?", "options": {"A": "Injecting malicious code into ultrasound machine software to capture patient records.", "B": "Creating a covert channel within hospital administrative messages for data\nexfiltration.", "C": "Manipulating radiology report formats to embed patient data within CT scan images.", "D": "Exploiting MRI machine firmware vulnerabilities to intercept real-time patient scans."}, "answer": "B"}, {"num": 39, "text": "A penetration tester intercepts HTTP requests between a user and a vulnerable\nweb server. The tester observes that the session ID is embedded in the URL, and\nthe web application does not regenerate the session upon login.\nWhich session hijacking technique is most likely to succeed in this scenario?", "options": {"A": "Session fixation by pre-setting the token in a URL.", "B": "DNS cache poisoning to redirect users to fake sites.", "C": "Injecting JavaScript to steal session cookies via cross-site scripting.", "D": "Cross-site request forgery exploiting user trust in websites."}, "answer": "A"}, {"num": 40, "text": "As a Certified Ethical Hacker, you have been contracted by a leading technology\ncompany to test the vulnerabilities in its web application. The application\nintegrates various third-party services and employs multiple APIs. During your\nadvanced testing, you discover a particularly robust Web API that is designed to\nwork with several webhooks. Additionally, you find that the server has a web\nshell planted for legitimate administrative tasks. Your objective is to exploit\nvulnerabilities related to the Web API, webhooks, and web shell.\nWhat technique would best allow you to compromise the system effectively\nwhile leaving minimal traces?", "options": {"A": "Exploit the web shell by uploading malicious scripts disguised as routine administrative\ntasks.", "B": "Manipulate the webhook to trigger an unintended data transfer between the application and\nthird-party services.", "C": "Execute Insecure Direct Object Reference (IDOR) on the Web API to access unauthorized\nresources.", "D": "Utilize SSRF (Server-Side Request Forgery) to make unauthorized API calls from the server\n itself."}, "answer": "D"}, {"num": 41, "text": "Following an attack on its mobile infrastructure, an e-commerce company is\nreconsidering its mobile security strategies. In an event where an attacker has\nbeen able to gain partial root access to the mobile application, which of these\ntactics will offer the most effective barrier to additional exploitation?", "options": {"A": "Conducting regular vulnerability assessments and penetration testing on the mobile\napplication.", "B": "Leveraging secure coding practices and automated code review processes in the\ndevelopment stage.", "C": "Implementation of certificate pinning to protect against Man-In-The-Middle (MITM)\nattacks.", "D": "Implementing a mobile application management solution to control access rights and user\npermissions."}, "answer": "C"}, {"num": 42, "text": "A cybersecurity analyst notices that a large number of plaintext-ciphertext pairs\nwere used in an attempted attack against a block cipher. The attacker applied\nstatistical analysis to XOR combinations of specific plaintext and ciphertext bits.\nWhich technique is the attacker likely using?", "options": {"A": "Analyzing grouped input differences in cipher output", "B": "Trying every possible key combination", "C": "Deriving linear patterns from cipher behavior", "D": "Exploiting physical leaks during encryption"}, "answer": "C"}, {"num": 43, "text": "During a routine security audit at a large financial services organization, the IT\nteam detects severe network latency and recurring bandwidth exhaustion\nacross its corporate WAN links. Upon deeper investigation, they discover that\nseveral employee workstations and IoT-connected devices are unknowingly\ntransmitting enormous volumes of traffic to numerous external IP addresses.\nThese devices, all exhibiting similar traffic patterns and command-response\nbehaviors, are found to be under the control of a remote botnet operator. The\nincident raises serious concerns about insider-originated denial-of-service\nactivity that is also affecting external entities.\nWhich type of denial-of-service attack best describes the organization’s current\nsituation?", "options": {"A": "An attack where botnets directly send large volumes of traffic to the target without spoofing\nintermediary services.", "B": "An attack where compromised internal devices participate in a botnet and flood external\ntargets with traffic.", "C": "An attack that relies on spoofed IP addresses to trick external servers into flooding the\nvictim.", "D": "An attack that originates internally and amplifies traffic through spoofed DNS responses to\ntarget systems."}, "answer": "B"}, {"num": 44, "text": "As a recent graduate, you’ve landed your first job as a junior cybersecurity\nanalyst for a local company. Your team leader is explaining the different types\nof hackers and their motivations. He mentions the term “hacktivist”.\nAccording to the information you recall from your CEH v12 study material, which\nof the following best describes a hacktivist?", "options": {"A": "A hacker who is hired by an organization to deliberately seek out and fix security\nvulnerabilities in their systems.", "B": "A hacker who uses their skills to promote a political agenda or a social cause, often by\nlaunching attacks against systems to draw attention to their cause.", "C": "A hacker who is not associated with any organization and hacks systems out of curiosity or to\ngain knowledge.", "D": "A hacker who is primarily motivated by financial gain and often engages in illegal activities\nsuch as identity theft."}, "answer": "B"}, {"num": 45, "text": "As a certified ethical hacker, you have been tasked to exploit a security\nvulnerability on an Android device that uses the latest version of the OS. You\nfound that there’s an unpatched weakness in the handling of user permissions\nin the device, but the device has a fully updated anti-virus application installed.\nWhat would be the most effective approach to exploit this vulnerability without\nbeing detected by the anti-virus application?", "options": {"A": "Use an SMS phishing method to trick the user into granting unwanted permissions.", "B": "Use a rootkit to gain control over the device and manipulate its software.", "C": "Deploy a payload using well-known exploit frameworks like Metasploit.", "D": "Develop a custom exploit code that uses obfuscation techniques to avoid\ndetection."}, "answer": "D"}, {"num": 46, "text": "As a Certified Ethical Hacker, you have been approached by a leading\ninternational corporation to assess and enhance their cloud-based security\nframework. The corporation recently transitioned to a serverless computing\narchitecture for its e-commerce application and experienced significant\nimprovements in scalability and cost efficiency. However, they fell victim to an\nintricate attack where an unauthorized user manipulated their cloud service’s\nfunction-as-a-service (FaaS component to execute malicious commands. Your\ninvestigation revealed that the attack originated from an insecure third-party\nAPI used within one of the serverless functions.\nGiven the attack’s complexity, what would be your recommended\ncountermeasure for strengthening the security posture?", "options": {"A": "Using a cloud access security broker (CAS", "B": "to enforce security policies for third-party cloud\nservices.\nB) Deploying a cloud-native security platform (CNSP) that provides comprehensive protection\nacross all cloud resources.", "C": "Regularly update the serverless functions to patch vulnerabilities and reduce the attack\nsurface.", "D": "Implementing a function-level permission model and enforcing the principle of least\nprivilege."}, "answer": "D"}, {"num": 47, "text": "As a cybersecurity analyst, you were assigned the task of analyzing the traffic\npatterns of your company’s network. You started noticing irregularities that\nsuggested a potential scanning attempt. The attacker appears to be quite\nsophisticated, operating slowly and meticulously, making it a challenge to\ndetect or trace.\nGiven the stealthiness of this approach, which of the following scenarios best\ndescribes the scanning technique the attacker might be using?", "options": {"A": "The attacker is sending FIN packets, assuming that the target system will respond differently\nto these packets depending on the state of the ports.", "B": "The attacker is directly establishing a TCP connection with every port on the system to\nidentify open ones, risking immediate detection.", "C": "The attacker is sending packets with all flags set, hoping that closed ports will respond\ndifferently than open ones.", "D": "The attacker is utilizing a ‘zombie’ machine to transmit the scan, thus making the true\nsource of the scan difficult to determine."}, "answer": "D"}, {"num": 48, "text": "You work as a network security officer for a large corporation. Recently, you’ve\nnoticed that certain confidential files are being accessed by unauthorized users\nwithin the network. You suspect that a Man-in-the- Middle (MitM attack is\nbeing carried out.\nWhich of the following network activities would help you confirm this?", "options": {"A": "A sudden increase in network traffic.", "B": "Multiple login attempts from the same IP address.", "C": "Detection of abnormal amounts of DNS requests.", "D": "IP addresses being resolved to multiple MAC addresses."}, "answer": "D"}, {"num": 49, "text": "A leading online retailer has been experiencing a series of security incidents\ninvolving unauthorized access to customer accounts and fraudulent\ntransactions. Upon investigation, it is suspected that attackers are employing\nsophisticated session-hijacking techniques to compromise user sessions and\ncarry out illicit activities. The security team is tasked with implementing robust\nmeasures to prevent further breaches and protect customer trust.\nGiven the scenario described, which advanced session hijacking technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nsecurity of online transactions on the retailer’s website?", "options": {"A": "Clickjacking Attack Embedding Malicious Iframes to Trick Users into Performing Unintended\n Actions on the Retailer’s Website", "B": "Credential Stuffing Attack Using Stolen Credentials to Hijack Active User Sessions and\nPerform Fraudulent Activities", "C": "Cross-Site Request Forgery (CSRF) Attack Manipulating User Requests to Initiate Unauthorized\n Transactions", "D": "Session Replay Attack Capturing and Replaying Encrypted Session Tokens to Gain\nUnauthorized Access"}, "answer": "D"}, {"num": 50, "text": "As a cybersecurity analyst for a leading multinational company, you have\nunearthed evidence suggesting a breach. Analysis indicates that sophisticated\nsteganography techniques are in play, allowing the hacker to exfiltrate data by\ncleverly embedding it within image files.\nConfronted with the deceptive nature of steganography and its potential\nimplications, which course of action offers the best chance to detect and\ncounteract this clandestine threat?", "options": {"A": "Implement a robust firewall to intercept all outgoing network traffic from your servers,\naiming to disrupt any data exfiltration attempts.", "B": "Roll out an Intrusion Prevention System (IPS) geared towards identifying and neutralizing\nfurther unauthorized server activities.", "C": "Engage a specialized steganalysis tool to scrutinize questionable files, decode the\nobscured data, and reveal the hacker’s exfiltration methodology.", "D": "Leverage a network traffic analyzer, keenly observing the nuances of outbound traffic for any\nirregularities suggestive of data exfiltration."}, "answer": "C"}, {"num": 51, "text": "As a newly appointed cybersecurity analyst in a financial firm, you are tasked\nwith performing network scanning to maintain the organization’s network\nsecurity posture. You decide to conduct a SYN scan, sometimes referred to as\nhalf-open scanning, using a popular tool like Nmap.\n If you initiate a SYN scan against a target IP address and receive a SYN/ACK\npacket in response, how would you interpret this result?", "options": {"A": "The target IP address is not reachable, as the receipt of a SYN/ACK packet is a common\nresponse to an unsuccessful attempt to connect.", "B": "The scanned port on the target IP address is filtered, as the receipt of a SYN/ACK packet\nindicates that a firewall or filtering device is intercepting and responding to the scan.", "C": "The scanned port on the target IP address is open, as the receipt of a SYN/ACK packet\nindicates that the port is prepared to establish a connection.", "D": "The scanned port on the target IP address is closed, as the receipt of a SYN/ACK packet\nindicates that the port has acknowledged but not accepted the connection."}, "answer": "C"}, {"num": 52, "text": "You have been hired by a government agency to evaluate Android smartphones’\nresistance against covert surveillance. During your assessment, you want to\ndemonstrate whether attackers could eavesdrop on sensitive conversations\nconducted through the loudspeaker without special permissions by exploiting\nbuilt-in smartphone sensors.\nWhich specific attack technique should you implement to effectively\ndemonstrate this privacy risk?", "options": {"A": "Tap ‘n Ghost attack leveraging NFC and touchscreen vulnerabilities.", "B": "Man-in-the-disk (MITD) attack by manipulating application updates.", "C": "Spearphone attack exploiting accelerometer-based vulnerabilities.", "D": "Malicious APK installation and exploitation through Metasploit Framework."}, "answer": "C"}, {"num": 53, "text": "You are a new IT intern at a local tech company. The company has a strong focus on cybersecurity and regularly hires ethical hackers to maintain its security\nposture. You come across the term ‘black box testing’ in a company document.\nUncertain about its meaning, you decide to ask your supervisor. She explains\nthat it refers to a type of testing in cybersecurity.\nIn the context of ethical hacking, what is ‘black box testing’?", "options": {"A": "It involves the ethical hacker trying to break into a system without any prior knowledge\nabout the system.", "B": "It refers to testing in which the ethical hacker has full knowledge of the system under\n test.", "C": "It refers to testing where the ethical hacker only knows the system’s inputs and outputs.", "D": "It involves the ethical hacker testing the system using only publicly available information."}, "answer": "A"}, {"num": 54, "text": "An ethical hacker is auditing a hospital’s wireless network, which is currently\nsecured with WPA encryption using TKIP. The hacker successfully demonstrates\npacket-injection and decryption attacks on the network.\nWhich vulnerability in WPA most likely allowed these attacks to succeed?", "options": {"A": "Lack of AES-based encryption.", "B": "Predictable group temporal key (GTK).", "C": "Use of weak Initialization Vectors (IV).", "D": "Dependence on weak passwords."}, "answer": "C"}, {"num": 55, "text": "As a security analyst, you’re investigating an incident where an attacker was\nable to gain access to your network. Upon initial examination of the log files,\nyou noticed a large number of TCP SYN packets sent to various ports on the\nnetwork but with no corresponding ACKs.\nWhat type of scanning technique do you think the attacker may have used?", "options": {"A": "The attacker has used a SYN/ACK scan to trick the firewall into allowing the packets to pass\nthrough.", "B": "The attacker has used an XMAS scan to determine the open and closed ports on the\nnetwork.", "C": "The attacker has used a TCP Connect scan to establish a full TCP connection with the\ntarget.", "D": "The attacker has used a SYN scan, also known as half-open scanning, which involves\nsending SYN packets and waiting for SYN/ACK responses."}, "answer": "D"}, {"num": 56, "text": "An organization uses SHA-256 for data integrity checks but is still experiencing \nunauthorized data modification.\nWhich cryptographic tool can help resolve this issue?", "options": {"A": "Asymmetric encryption", "B": "Symmetric encryption", "C": "Digital signatures", "D": "SSL/TLS certificates"}, "answer": "C"}, {"num": 57, "text": "In a comprehensive penetration testing scenario, you are charged with the task\nof gaining detailed insights into a target organization’s network configuration,\nstructure, and security posture. To accomplish this task, you plan to employ a\nmultitude of reconnaissance techniques, including an in-depth DNS\ninterrogation. DNS interrogation can reveal various pieces of information that\nare invaluable to a penetration tester. However, there are certain limitations to\nthe kind of data you can obtain directly through this method.\nConsidering these restrictions, which among the following pieces of information\nCANNOT be directly obtained from an extensive DNS interrogation?", "options": {"A": "The estimated geographical location of the organization’s servers derived from their IP\naddresses.", "B": "The specific usernames and passwords used by the organization’s employees.", "C": "The IP addresses associated with the organization’s multiple mail servers.", "D": "The subdomains that are linked with the organization’s primary internet domain."}, "answer": "B"}, {"num": 58, "text": "A corporation has transitioned to a public cloud service. The security team\nfound a critical flaw in the API of the cloud service provider.\nWhat is the potential threat they are most likely to face?", "options": {"A": "DDoS attack on cloud servers", "B": "Compromise of encrypted data at rest", "C": "Unauthorized access to cloud resources", "D": "Vulnerability to physical security breaches"}, "answer": "C"}, {"num": 59, "text": "As a cybersecurity analyst at XYZ Corp., you’re examining system logs and notice\nan array of activities that suggest the presence of an elusive rootkit. Given the\nstealthy nature of rootkits, their detection and eradication are pivotal to\nmaintaining system security and preventing data compromise. Assessing the\nsystem, you find the rootkit has been embedded deeply within the operating system kernel.\nIn this critical situation, which strategy should you follow to remediate the\nrootkit effectively while minimizing potential damage?", "options": {"A": "Take the extreme measure of initiating a complete system format, followed by reinstalling\nthe operating system from a trusted source.", "B": "Immediately opt for the radical approach, which includes powering down the system and\ndisconnecting it from the network, to cease the rootkit’s activities.", "C": "Employ a systematic, multi-layered strategy, starting with the deployment of a specialized\nrootkit detection tool to verify the presence and type of rootkit, followed by an appropriately\ntailored removal procedure, specific to the identified rootkit.", "D": "Implement a proactive defensive strategy by running a variety of high-interaction honeypots\non the network, aiming to lure the attacker and reveal their tactics."}, "answer": "C"}, {"num": 60, "text": "A red team operator is assessing the resilience of a corporate network’s\nauthentication infrastructure. They input valid usernames with specifically\nstructured guesses based on prior intel about naming conventions, such as\nbirthdates or favorite sports teams. The guesses are tailored and automated\nwith logic-based iterations.\nWhich technique best describes this targeted approach?", "options": {"A": "Strategic pattern-based input using known logic.", "B": "Combining fragments from two lists without rules.", "C": "Exhaustive character testing without context.", "D": "Watching users type their keys in public places."}, "answer": "A"}, {"num": 61, "text": "An attacker performs DNS cache snooping using the dig command with the\n+norecurse flag against a known DNS server. The server returns NOERROR but\nprovides no answer to the query.\nWhat does this most likely suggest?", "options": {"A": "No client from the DNS server’s network has recently accessed the domain.", "B": "The queried domain has expired and no longer exists.", "C": "The DNS server failed to resolve the request.", "D": "The requested record was found in the cache and returned."}, "answer": "A"}, {"num": 62, "text": "In her role as a cybersecurity analyst for an established technology firm, Maria\nis assigned a crucial task. She’s instructed to perform a thorough passive\nreconnaissance of a major competitor’s online environment to understand theirdigital strategies better. The challenge, however, is to gather as much relevant\ninformation as she can without directly interacting with the competitor’s\nsystems or alerting them to her activities, to avoid any potential legal\nimplications.\nGiven these constraints and the sensitive nature of her assignment, which of\nthe following tools or methods would be least appropriate and potentially risky\nfor Maria to employ in her task?", "options": {"A": "Running an intensive port scan against the competitor’s public IP addresses to gain\ninformation on their internal network and server structure.", "B": "Leveraging the Wayback Machine to delve into the past and view archived versions of the\ncompetitor’s website to study their evolution over time.", "C": "Meticulously examining patent databases and public records for any technology or\ninnovation recently patented by the competitor to predict their future moves.", "D": "Exploring online forums, bulletin boards, and social media discussions to gather insights on\nthe competitor’s products, customer feedback, and potential business strategies."}, "answer": "A"}, {"num": 63, "text": "During a red team exercise, a certified ethical hacker (CEH is working on\nexploiting a potential vulnerability in the target’s web server. The CEH has\ncompleted the information gathering and footprinting stages and mirrored the\nwebsite for offline analysis. They have also discovered the server is prone to\nsession hijacking.\nWhich next step is most likely to be part of a successful attack methodology,\nkeeping in mind the requirement to minimize the possibility of detection?", "options": {"A": "Perform vulnerability scanning with automated tools to find additional weaknesses.", "B": "Hijack a session and immediately modify server configuration files.", "C": "Attempt SQL Injection to extract database information.", "D": "Directly apply brute force attack to crack the server’s password."}, "answer": "B"}, {"num": 64, "text": "A globally-operating bank recently encountered a severe security breach within\nits Android OS-based mobile banking application. Cybercriminals managed to\nexploit the bank’s Mobile Device Management (MDM system and successfully\ncarried out a series of remote commands, creating significant havoc. Upon\nthorough investigation of this incident, it emerged that the attackers might\nhave leveraged the Android Debug Bridge (ADB as a conduit for unauthorized\naccess.\nAs a Certified Ethical Hacker tasked with developing countermeasures to this\nissue, which action would you consider the most potent response in this\nsituation?", "options": {"A": "Recommending frequent and consistent updates to the MDM system to stay abreast of the\nmost recent security patches and improvements.", "B": "Promoting the adoption of more robust personal identification methodologies, including, but\nnot limited to, biometric systems.", "C": "Establishing and enforcing a rigorous policy that unequivocally mandates the disabling of\nADB, except when absolutely necessary and only within strictly regulated environments.", "D": "Instigating the configuration of a Virtual Private Network (VPN) to secure all transactions and\nactivities conducted via the mobile banking platform."}, "answer": "C"}, {"num": 65, "text": "As a cybersecurity consultant, you are helping a small startup strengthen its\ninformation security awareness. During an internal audit, an employee reports\nfinding a USB drive labeled “Employee Salary Info 2024” in the company parking\nlot. Curious, they plugged it into their office computer, after which the system\nbegan behaving erratically.\nWhat kind of social engineering attack does this scenario represent?", "options": {"A": "Impersonating a senior staff member to extract login credentials.", "B": "Tempting the victim to engage with a malicious device using curiosity.", "C": "Using a discarded document to retrieve sensitive corporate information.", "D": "Attempt to bypass physical security by closely following an authorized employee."}, "answer": "B"}, {"num": 66, "text": "A major financial institution is experiencing persistent Denial-of-Service (DoS\nattacks targeting its online banking services, causing significant disruption to customer transactions and eroding trust in the institution. The security team is\nunder immense pressure to identify and mitigate the sophisticated tactics\nemployed by the attackers to ensure uninterrupted access to banking services.\n \nConsidering the scenario described, which sophisticated Denial-of-Service (DoS\ntechnique, resembling a scenario-based attack, poses the greatest challenge for\nthe security team to detect and mitigate effectively, potentially jeopardizing the\navailability of online banking services?", "options": {"A": "A synchronized Layer 3 Smurf attack targeting the institution's internet-facing routers,\nflooding their interfaces with ICMP echo requests to exhaust bandwidth and disrupt network\nconnectivity.", "B": "A coordinated UDP flood attack exploiting vulnerabilities in the institution’s DNS\ninfrastructure, flooding authoritative DNS servers to disrupt domain resolution services.", "C": "A distributed SQL injection attack targeting the institution’s online banking database servers,\ncausing resource exhaustion and database downtime. https:// reurl.cc/v5o6vN", "D": "A zero-day exploit targeting the institution’s web server software, causing buffer overflow\nand service unavailability through remote code execution."}, "answer": "D"}, {"num": 67, "text": "At DEF Corporation, as you dive deeper into the vulnerability analysis of their\nmulti-tiered web applications, you observe an anomaly. Some encrypted user\nsession tokens appear to be much longer than others, hinting at possible\nvariable encryption strength based on user roles. This inconsistency could\nexpose certain user sessions, especially those with elevated privileges, to\ncryptographic attacks.\nGiven the intricate nature of the system and the potential implications of a\nbreach, what would be the most appropriate step to mitigate this specific\nvulnerability?", "options": {"A": "Implement uniform encryption strength across all user roles, eliminating disparities in\nsession token lengths.", "B": "Rotate encryption keys frequently, ensuring that old keys become obsolete rapidly.", "C": "Integrate a centralized logging mechanism to detect and alert on any irregular access\npatterns based on session tokens.", "D": "Adopt Multi-Factor Authentication (MFA) for users with elevated privileges to strengthen\naccess control."}, "answer": "A"}, {"num": 68, "text": "You are conducting a vulnerability assessment in a segmented internal network.\nWhen scanning a set of IPs using the nbtscan tool, you discover multiple\ndevices responding with NetBIOS names, but only one of them has the entry in\nits response.\nWhat does this indicate about that specific host?", "options": {"A": "It is the domain master browser or Primary Domain Controller (PDC).", "B": "It is a rogue DHCP server impersonating a legitimate host.", "C": "It has disabled NetBIOS over TCP/IP, resulting in limited response.", "D": "It is the local system from which the scan is being run."}, "answer": "A"}, {"num": 69, "text": "A global media streaming platform is experiencing periodic traffic surges every\n10 minutes, severely degrading performance and leading to widespread\nbuffering issues. Traffic analysis reveals intermittent spikes exceeding 300 Gbps,\nfollowed by quiet intervals. The security team suspects the attacker is using a\ntechnique designed to disrupt services without maintaining a continuous flood.\nWhat type of DDoS attack best explains this scenario?", "options": {"A": "A recursive HTTP GET flood mimicking user page views.", "B": "A Pulse Wave attack leveraging high-volume short bursts to overwhelm network\nresources.", "C": "A permanent DoS (PDoS) attack damaging backend hardware components.", "D": "A UDP flood-sustained attack targeting random high-numbered ports."}, "answer": "B"}, {"num": 70, "text": "You are a cybersecurity trainer and are planning a course on ethical hacking forsome newcomers in your organization. While creating the content, you recall\nfrom the CEH vl2 study material that there are different types of penetration\ntests.\nWhich of the following best describes a black box penetration test?", "options": {"A": "The tester has some knowledge of the system to be tested, such as user IDs and passwords.", "B": "The tester has no prior knowledge of the system to be tested.", "C": "The tester is given a copy of the system to test so that the actual system remains\n unaffected.", "D": "The tester has complete knowledge of the system to be tested."}, "answer": "B"}, {"num": 71, "text": "You are a Certified Ethical Hacker hired by a financial institution to assess the\nrobustness of its web application security. In your penetration testing,
