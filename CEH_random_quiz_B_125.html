ue is the attacker likely using?", "options": {"A": "Analyzing grouped input differences in cipher output", "B": "Trying every possible key combination", "C": "Deriving linear patterns from cipher behavior", "D": "Exploiting physical leaks during encryption"}, "answer": "C"}, {"num": 409, "text": "At Horizon Legal Services in Boston, Massachusetts, ethical hacker Daniel Price\nis tasked with assessing the security of the firm’s mobile case-tracking app.\nDuring testing, he finds that confidential case notes and client records are kept\nlocally on the device without encryption. By browsing the file system with a\nstandard explorer tool, he can open sensitive information without any\nauthentication.\n\nWhich OWASP Top 10 Mobile Risk is most clearly present in the app?", "options": {"A": "Insecure Communication", "B": "Inadequate Privacy Controls", "C": "Improper Credential Usage", "D": "Insecure Data Storage"}, "answer": "D"}, {"num": 393, "text": "During a penetration test at Cascade Financial in Raleigh, ethical hacker Ethan\nBrooks evaluates the security of the company’s authentication system. He\nobserves that the application accepts a high volume of repeated credential\nsubmissions without introducing any additional challenge, allowing automated\nscripts to cycle rapidly through large password lists. Ethan advises the IT team\nto deploy a control that forces interaction steps designed to disrupt\nautomation.\n\nWhich countermeasure should the IT team adopt in this scenario?", "options": {"A": "Use CAPTCHA challenges on login and registration pages", "B": "Use strong hashing algorithms", "C": "Force periodic password changes", "D": "Implement 2FA/MFA"}, "answer": "A"}, {"num": 106, "text": "A cloud provider faced a situation where one customer’s malicious activity\naffected the organization’s reputation and service delivery.\n\nWhich security control would have most effectively prevented this issue?", "options": {"A": "Assessing multi-tenant isolation techniques", "B": "Implementing secure log management", "C": "Using strong encryption algorithms", "D": "Enforcing robust authentication methods"}, "answer": "A"}, {"num": 517, "text": "A state benefits processing platform in Sacramento, California, implemented a\nmulti-step identity verification process before granting access to sensitive\ncitizen records, During a controlled assessment, security analyst Daniel Kim\nobserved that by altering specific request parameters within the transaction\nsequence, it was possible to bypass an intermediate verification stage and\nretrieve restricted account data. Further analysis revealed that the\nauthentication workflow advanced through sequential client-driven\ninteractions, but the server did not enforce strict validation of completion for\neach required stage before granting access. Based on the scenario, which\nvulnerability classification best describes the issue identified?", "options": {"A": "Application Flaws", "B": "Poor Patch Management", "C": "Misconfigurations / Weak Configurations", "D": "Design Flaws"}, "answer": "D"}, {"num": 394, "text": "At Bayview University in San Francisco, California, ethical hacker Sofia Patel is\nevaluating security controls on Android 11 tablets used by staff. To simulate an\nattack, she installs KingoRoot.apk directly on one of the devices. The\napplication leverages system vulnerabilities to elevate privileges without\nrequiring a computer connection. Based on the module, which feature of this\nrooting approach makes the attack effective?", "options": {"A": "It exploits Bluetooth pairing flaws to gain device-level privileges", "B": "It uses a tethered jailbreak to restart the device with patched kernel functions", "C": "It relies on weak SSL validation to bypass application controls", "D": "It is an APK that can run directly on the device without a PC"}, "answer": "D"}, {"num": 301, "text": "In the heart of Silicon Valley, California, network administrator Jake Henderson\noversees the web infrastructure for TechTrend Innovations, a startup\nspecializing in cloud solutions. During a routine architecture review, Jake\nevaluates the setup of their web server, which handles high-traffic API requests.\nHe notes that the server’s primary module processes incoming requests and\nworks with additional modules to manage encryption, URL rewriting, and\nauthentication. Curious about the server’s design, Jake consults the\ndocumentation to ensure optimal performance and security.\n\nWhich web server component is Jake analyzing as part of TechTrend\nInnovations’ architecture?", "options": {"A": "Virtual Document Tree", "B": "Application Server", "C": "Document Root", "D": "HTTP Server (Core)"}, "answer": "D"}, {"num": 325, "text": "You are Ava Mitchell, an ethical hacker at Sentinel Cyberworks, hired to test the\nwireless defenses of Horizon Financial, a bank in Boston, Massachusetts. During\na covert nighttime assessment, your objective is to simulate an attacker\nattempting to breach the bank’s WPA-protected Wi-Fi network. You deploy a tool\nthat allows you to capture wireless packets, send de-authentication packets to\nforce client reconnections, and attempt to recover the encryption key, all within\na single graphical interface. Based on the described functionality, which Wi-Fi\nsecurity auditing tool are you using?", "options": {"A": "Fern WiFi Cracker", "B": "RFProtect", "C": "Cisco Adaptive Wireless IPS", "D": "WatchGuard Wi-Fi Cloud WIPS"}, "answer": "A"}, {"num": 498, "text": "During a red team exercise for a global insurance provider in Chicago, ethical\nhacker Maria tests the effectiveness of the company’s endpoint defenses. She\nlaunches an attack by injecting malicious PowerShell commands into a trusted\nprocess without dropping any executables on disk. The code executes entirely\nin memory, generating abnormal spikes in resource usage. After a reboot, Maria\nnotes that the system returns to normal and traditional antivirus logs show no\nevidence of infection.\n\nWhich type of malware technique did Maria most likely use in this test?", "options": {"A": "Rootkit", "B": "Ransomware", "C": "Fileless Malware", "D": "Trojan"}, "answer": "C"}, {"num": 230, "text": "A penetration tester is testing a web application’s product search feature, which\ntakes user input and queries the database. The tester suspects the input is not\nproperly sanitized.\n\nWhat is the best approach to confirm the presence of SQL injection?", "options": {"A": "Input ‘; DROP TABLE products; -- to see if the table is deleted", "B": "Inject a script like to test for Cross-Site Scripting (XSS)", "C": "Enter 1’ OR ‘1’=‘1 to check if all products are returned", "D": "Use directory traversal syntax to access restricted files on the server"}, "answer": "C"}, {"num": 261, "text": "During a routine software update at Horizon Solutions, a mid-sized IT firm in\nRaleigh, North Carolina, an employee downloads a free utility from a popular\nthird-party site to streamline document processing. During the installation, the\nuser is prompted to install an optional ‘productivity toolbar’ and a ‘system\noptimization tool,’ which are bundled with vague descriptions. Shortly after, the\nemployee notices intermittent pop-up ads, an altered browser homepage, and\nsluggish PC performance, though network logs also show occasional\nunexplained data transfers during off-hours. A security scan flags the additional\nprograms as potentially harmful, but a deeper analysis reveals no immediate\nfile encryption or self-replicating code.\n\nWhat type of threat are these unwanted programs most likely classified as?", "options": {"A": "Potentially Unwanted Applications (PUAs)", "B": "Worms", "C": "Botnet agents", "D": "Logic bombs"}, "answer": "A"}, {"num": 288, "text": "A cybersecurity team at a regional healthcare provider is conducting an internal\nred team exercise to assess their exposure to service enumeration attacks.\nAmanda, a senior penetration tester, is assigned to probe the ": {"A": "Traffic IQ Professional", "B": "Metasploit", "C": "Colasoft Packet Builder", "D": "Nmap"}, "answer": "C"}, {"num": 88, "text": "In your role as a cybersecurity analyst at a large e-commerce company, you\nhave been tasked with reinforcing the firm’s defenses against potential Denial-\nof-Service (DoS attacks. During a recent review, you noticed several IP\naddresses generating excessive traffic, causing an unnaturally high load on the\nserver. An inspection of these packets revealed that the TCP three-way\nhandshake was never completed, leaving multiple connections in a\nSYN_RECEIVED state. The intent appears to be the saturation of server resources\nwithout any genuine intent to establish a full connection.\n\nGiven these details, what type of DoS attack is most likely being executed\nagainst the company’s servers?", "options": {"A": "Smurf Attack: In this type of attack, a perpetrator uses a network’s broadcast addressing to\namplify the ICMP echo-request packets. However, this doesn't align with the incomplete TCP\nhandshakes noted.", "B": "SYN Flood: This attack floods a target with SYN requests in an attempt to consume enough\nserver resources to make the system unresponsive, aligning with the high volume of\nincomplete TCP handshakes.", "C": "UDP Flood: This attack overwhelms random ports on a remote host with IP packets\ncontaining UDP datagrams, but this doesn't explain the high volume of incomplete TCP\nhandshakes observed.", "D": "Ping of Death: This attack sends malformed or oversized ping packets to crash, freeze, or\nreboot the targeted system, which isn't consistent with the incomplete TCP handshake\nobserved."}, "answer": "B"}, {"num": 226, "text": "During a red team assessment, an ethical hacker is assigned the task of\nmapping a large multinational enterprise’s external attack surfaces. The target\norganization operates multiple regional websites and cloud-hosted\nenvironments under different subdomains. Due to strict rules of engagement,\nthe hacker must avoid any active scans or probes that could alert the\norganization’s security monitoring systems. The goal is to uncover as many\npublicly exposed subdomains as possible to identify potential unpatched or\nmisconfigured services that may exist under obscure or forgotten subdomains.\n\nWhich method should the ethical hacker use to passively enumerate the\norganization’s subdomains?", "options": {"A": "Conduct a brute-force DNS subdomain enumeration.", "B": "Leverage tools like Netcraft or DNSdumpster to gather subdomain information.", "C": "Request internal DNS records using spoofed credentials.", "D": "Attempt to guess admin credentials and access the company’s DNS portal."}, "answer": "B"}, {"num": 258, "text": "During a red team assessment of a multinational financial firm, you’re tasked\nwith identifying key personnel across various departments and correlating their\ndigital footprints to evaluate exposure risk. Your objective includes mapping\nuser aliases across platforms, identifying geotagged media, and pinpointing\npotential insider threats based on social posting behavior. The team has\nshortlisted multiple tools for the task.\n\nConsidering the technical capabilities and limitations described in the approved\nreconnaissance toolkit, which tool provides cross platform username\ncorrelation by scanning hundreds of social networking sites, but does not\nnatively support geolocation tracking or visualizing identity relationships?", "options": {"A": "Creepy", "B": "Social Searcher", "C": "Maltego", "D": "Sherlock"}, "answer": "D"}, {"num": 304, "text": "In a security assessment conducted in New York, Sarah, an ethical hacker, is\nevaluating a corporate network to enhance its protection against potential\nthreats. She aims to gather essential data about available access points to\nguide her analysis. Which scanning technique should Sarah apply to meet this\nobjective while adhering to the organization’s ethical guidelines?", "options": {"A": "Vulnerability Scanning", "B": "Port Scanning", "C": "Topology Mapping", "D": "Network Scanning"}, "answer": "D"}, {"num": 219, "text": "An ethical hacker needs to gather sensitive information about a company’s\ninternal network without engaging directly with the organization's systems to\navoid detection.\n\nWhich method should be employed to obtain this information discreetly?", "options": {"A": "Exploit a public vulnerability in the company’s web server", "B": "Analyze the organization’s job postings for technical details", "C": "Perform a WHOIS lookup on the company’s domain registrar", "D": "Use port scanning tools to probe the company’s firewall"}, "answer": "B"}, {"num": 448, "text": "During a penetration test at Sunshine Media’s streaming platform in Miami,\nethical hacker Sofia Alvarez examines whether the company’s web server\nexposes sensitive resources through poor configuration. She finds that a crawler\ndirective at the server’s root allows unintended indexing of restricted areas.\nThis oversight reveals internal paths that may expose hidden links, confidential\nfiles, or other sensitive information. Which technique is Sofia most likely using\nin this assessment?", "options": {"A": "Directory Brute Forcing", "B": "Information Gathering from Robots.txt File", "C": "Vulnerability Scanning", "D": "Web Server Footprinting/Banner Grabbing"}, "answer": "B"}, {"num": 524, "text": "During an authorized wireless security assessment, an ethical hacker captures\ntraffic between client devices and a corporate access point to evaluate the\nstrength of the implemented encryption mechanism. Packet analysis reveals\nthat before protected data exchange begins, the client and access point\ncomplete a structured four-message key negotiation process. Subsequent traffic\nis encrypted using an AES-based counter mode protocol that integrates\nmessage authentication for integrity protection. Based on these observations,\nidentify the wireless encryption standard deployed on the can", "B": "NULL Scan", "C": "TCP Connect Scan", "D": "ACK Scan"}, "answer": "B"}, {"num": 257, "text": "During an internal red team engagement at Orion Tech Labs, a leading software\nfirm in Austin, Texas, ethical hacker Emily Carter was tasked with evaluating the\nresilience of the organization’s software deployment processes. Knowing that\nthe finance team frequently downloaded utility tools for generating PDFs, she\nrepackaged a trusted PDF converter installer with a secondary payload. When\nan employee executed the installer, the converter installed and functioned\nnormally, but in the background, a hidden executable silently initiated\noutbound network communication. The user remained unaware of any\nsuspicious activity.\n\nWhich technique did Emily most likely use to ensure the malware executed\nalongside the legitimate application?", "options": {"A": "Downloader", "B": "Packer", "C": "Dropper", "D": "Wrapper"}, "answer": "D"}, {"num": 247, "text": "A Certified Ethical Hacker (CEH is auditing a company’s web server that employs\nvirtual hosting. The server hosts multiple domains and uses a web proxy to\nmaintain anonymity and prevent IP blocking. The CEH discovers that the\nserver’s document root directory, which stores critical HTML files, is named\n“certroot” and is stored in the directory /admin/web. The server root, which\nstores the server’s configuration, error, executable, and log files, is also\nidentified. The CEH also notes that the server uses a virtual document tree for\nadditional storage.\n\nGiven this scenario which of the following actions would most likely increase\nthe security of the web server?", "options": {"A": "Regularly updating and patching the server software", "B": "Implementing an open-source web server architecture such as LAMP", "C": "Changing the server’s IP address regularly", "D": "Moving the document root directory to a different disk"}, "answer": "A"}, {"num": 51, "text": "As a newly appointed cybersecurity analyst in a financial firm, you are tasked\nwith performing network scanning to maintain the organization’s network\nsecurity posture. You decide to conduct a SYN scan, sometimes referred to as\nhalf-open scanning, using a popular tool like Nmap.\n\nIf you initiate a SYN scan against a target IP address and receive a SYN/ACK\npacket in response, how would you interpret this result?", "options": {"A": "The target IP address is not reachable, as the receipt of a SYN/ACK packet is a common\nresponse to an unsuccessful attempt to connect.", "B": "The scanned port on the target IP address is filtered, as the receipt of a SYN/ACK packet\nindicates that a firewall or filtering device is intercepting and responding to the scan.", "C": "The scanned port on the target IP address is open, as the receipt of a SYN/ACK packet\nindicates that the port is prepared to establish a connection.", "D": "The scanned port on the target IP address is closed, as the receipt of a SYN/ACK packet\nindicates that the port has acknowledged but not accepted the connection."}, "answer": "C"}, {"num": 95, "text": "You are a cybersecurity consultant at a large healthcare organization. As part of\nyour responsibilities, you are tasked with making sure the company’s systems\nare secure from various attacks. Recently, you’ve noticed some unusual traffic\npatterns that suggest someone might be trying to evade the company’s\nIntrusion Detection System (IDS.\n\nWhich of the following techniques would most likely be used by an attacker in\nan attempt to evade detection by the IDS?", "options": {"A": "The attacker splits malicious data packets into smaller segments to avoid detection.", "B": "The attacker repeatedly pings the IDS to overwhelm it with traffic and cause a denial of\nservice.", "C": "The attacker uses advanced malware that can self-replicate and spread throughout the\nnetwork.", "D": "The attacker sends phishing emails to employees, hoping to trick them into revealing their\nlogin credentials."}, "answer": "A"}, {"num": 39, "text": "A penetration tester intercepts HTTP requests between a user and a vulnerable\nweb server. The tester observes that the session ID is embedded in the URL, and\nthe web application does not regenerate the session upon login.\n\nWhich session hijacking technique is most likely to succeed in this scenario?", "options": {"A": "Session fixation by pre-setting the token in a URL.", "B": "DNS cache poisoning to redirect users to fake sites.", "C": "Injecting JavaScript to steal session cookies via cross-site scripting.", "D": "Cross-site request forgery exploiting user trust in websites."}, "answer": "A"}, {"num": 384, "text": "You are an ethical hacker at HarborLine Assessments, engaged to audit the Wi-\nFi at Portside Freight in Tacoma, Washington. During an overnight\nreconnaissance, you enable your wireless interface’s monitor mode and run a\ncommand that silently records beacon frames, probe responses and\nauthentication frames from nearby APs and clients into a capture file for later\noffline analysis – you do not transmit any frames from your laptop. Based on\nthe described activity, which Wi-Fi security auditing tool are you most likely\nusing?", "options": {"A": "Airbase-ng", "B": "Aireplay-ng", "C": "Airodump-ng", "D": "Aircrack-ng"}, "answer": "C"}, {"num": 56, "text": "An organization uses SHA-256 for data integrity checks but is still experiencing\nunauthorized data modification.\n\nWhich cryptographic tool can help resolve this issue?", "options": {"A": "Asymmetric encryption", "B": "Symmetric encryption", "C": "Digital signatures", "D": "SSL/TLS certificates"}, "answer": "C"}, {"num": 147, "text": "During a security assessment of a cloud-hosted application using SOAP-based\nweb services, a red team operator intercepts a legitimate SOAP request sent by\na user. The operator duplicates the body of the message along with its digital\nsignature, inserts the duplicate into the same SOAP envelope, and forwards it to\nthe server. Due to improper validation of the message structure, the server\naccepts the duplicated body as authentic and processes it, resulting in\nunauthorized code execution. This behavior reveals a vulnerability in how the\nserver handles signed SOAP messages.\n\nWhat type of attack does this scenario illustrate?", "options": {"A": "Wrapping attack", "B": "Cryptanalysis attack", "C": "IMDS abuse", "D": "Cloud snooper attack"}, "answer": "A"}, {"num": 505, "text": "A financial clearinghouse in Newark, New Jersey, initiated a structured\nvulnerability review across its enterprise servers. The scanning platform was\nconfigured to collect detailed information about installed updates, local\nsecurity configurations, and system policy settings on each target machine. The\nresulting report contained granular host-level findings, including configuration\ninconsistencies and patch gaps that required direct system-level inspection to\nobtain. Based on the activity described, what type of vulnerability scanning is\nbeing performed?", "options": {"A": "Credentialed Scanning", "B": "Application Scanning", "C": "Automated Scanning", "D": "Non-Credentialed Scanning"}, "answer": "A"}, {"num": 371, "text": "You are conducting a security audit at a government agency. During your\nwalkthrough, you observe a temporary contractor sitting in an open office area\nusing their smartphone to discreetly record employees as they enter passwords\ninto their systems. Upon further investigation, you find discarded documents in\na nearby trash bin containing sensitive project information. What type of attack\nis most likely being performed?", "options": {"A": "Close-in attack", "B": "Insider attack", "C": "Distribution attack", "D": "Passive attack"}, "answer": "D"}, {"num": 198, "text": "A penetration tester performs a vulnerability scan on a company’s web server\nand identifies several medium-risk vulnerabilities related to misconfigured\nsettings.\n\nWhat should the tester do to verify the vulnerabilities?", "options": {"A": "Conduct a denial-of-service (DoS) attack to test the server’s resilience", "B": "Ignore the vulnerabilities since they are medium-risk", "C": "Perform a brute-force attack on the web server’s login page", "D": "Use publicly available tools to exploit the vulnerabilities and confirm their impact"}, "answer": "D"}];
const PER_PAGE = 10;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PER_PAGE);

let currentPage = 0;
// State: { [qIndex]: { selected: 'A'|null, submitted: bool } }
const state = {};

(function() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('ceh_quiz_state_random_125_B')); } catch(e) {}
  for (let i = 0; i < QUESTIONS.length; i++) {
    state[i] = (saved && saved[i]) ? saved[i] : { selected: null, submitted: false };
  }
})();

function saveState() {
  try { localStorage.setItem('ceh_quiz_state_random_125_B', JSON.stringify(state)); } catch(e) {}
}

function getPageQuestions(page) {
  const start = page * PER_PAGE;
  return QUESTIONS.slice(start, Math.min(start + PER_PAGE, QUESTIONS.length));
}

function render() {
  const qs = getPageQuestions(currentPage);
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';

  qs.forEach((q, localIdx) => {
    const globalIdx = currentPage * PER_PAGE + localIdx;
    const s = state[globalIdx];
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + globalIdx;

    if (s.submitted) {
      if (s.selected === q.answer) card.classList.add('correct');
      else card.classList.add('wrong');
    }

    const optLetters = Object.keys(q.options);

    let optionsHtml = '';
    optLetters.forEach(letter => {
      let cls = 'option-btn';
      if (s.submitted) {
        if (letter === q.answer) cls += ' correct-ans';
        else if (letter === s.selected && s.selected !== q.answer) cls += ' wrong-ans';
      } else if (letter === s.selected) {
        cls += ' selected';
      }
      const clickHandler = s.submitted ? '' : `onclick="selectOption(${globalIdx}, '${letter}')"`;
      const pointerStyle = s.submitted ? 'style="cursor:default"' : '';
      optionsHtml += `<div class="${cls}" ${clickHandler} ${pointerStyle}>
        <span class="opt-letter">${letter}</span>
        <span>${escHtml(q.options[letter])}</span>
      </div>`;
    });

    const isCorrect = s.submitted && s.selected === q.answer;
    const isWrong = s.submitted && s.selected !== q.answer;
    const revealCls = s.submitted ? (isCorrect ? 'answer-reveal ok show' : 'answer-reveal no show') : 'answer-reveal';
    const revealMsg = isCorrect
      ? '✓ 正確！'
      : isWrong
        ? `✗ 錯誤，正確答案是 ${q.answer}`
        : '';

    const statusIcon = isCorrect ? '✅' : isWrong ? '❌' : '';
    const submitDisabled = (!s.selected && !s.submitted) ? 'disabled' : '';
    const submitCls = s.submitted ? 'submit-btn submitted' : 'submit-btn';
    const submitLabel = s.submitted ? '已提交' : '提交';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q #${q.num}</span>
        <span class="q-status-icon">${statusIcon}</span>
      </div>
      <div class="q-text">${escHtml(q.text)}</div>
      <div class="options">${optionsHtml}</div>
      <div class="${revealCls}">${revealMsg}</div>
      <div class="submit-row">
        <button class="${submitCls}" id="sub-${globalIdx}" onclick="submitQuestion(${globalIdx})" ${s.submitted ? 'disabled' : submitDisabled}>${submitLabel}</button>
      </div>
    `;

    area.appendChild(card);
  });

  // Update pagination
  document.getElementById('page-info').textContent = `第 ${currentPage + 1} 頁 / ${TOTAL_PAGES} 頁`;
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage === TOTAL_PAGES - 1;

  renderPageDots();
  updateStats();
  updateSidebar();
  updateProgress();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g, '<br>');
}

function selectOption(globalIdx, letter) {
  if (state[globalIdx].submitted) return;
  state[globalIdx].selected = letter;
  saveState();
  render();
}

function submitQuestion(globalIdx) {
  if (!state[globalIdx].selected) return;
  if (state[globalIdx].submitted) return;
  state[globalIdx].submitted = true;
  saveState();
  render();
}

function changePage(dir) {
  const newPage = currentPage + dir;
  if (newPage < 0 || newPage >= TOTAL_PAGES) return;
  currentPage = newPage;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToPage(page) {
  currentPage = page;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToQuestionPage(globalIdx) {
  const page = Math.floor(globalIdx / PER_PAGE);
  currentPage = page;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
  requestAnimationFrame(() => {
    const card = document.getElementById('card-' + globalIdx);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
}
function renderPageDots() {
  const container = document.getElementById('page-dots');
  container.innerHTML = '';
  for (let p = 0; p < TOTAL_PAGES; p++) {
    const start = p * PER_PAGE;
    const end = Math.min(start + PER_PAGE, QUESTIONS.length);
    let hasWrong = false, hasAnswered = false, allCorrect = true;
    for (let i = start; i < end; i++) {
      if (state[i].submitted) {
        hasAnswered = true;
        if (state[i].selected !== QUESTIONS[i].answer) { hasWrong = true; allCorrect = false; }
      } else {
        allCorrect = false;
      }
    }
    const dot = document.createElement('button');
    dot.className = 'page-dot';
    if (p === currentPage) dot.classList.add('active');
    if (hasWrong) dot.classList.add('has-wrong');
    else if (hasAnswered && allCorrect) dot.classList.add('all-correct');
    dot.textContent = p + 1;
    dot.onclick = () => goToPage(p);
    container.appendChild(dot);
  }
}

function updateStats() {
  let answered = 0, correct = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) {
      answered++;
      if (state[i].selected === QUESTIONS[i].answer) correct++;
    }
  }
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
}

function updateProgress() {
  let answered = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) answered++;
  }
  const pct = (answered / QUESTIONS.length * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSidebar() {
  const list = document.getElementById('wrong-list');
  const wrongItems = [];
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted && state[i].selected !== QUESTIONS[i].answer) {
      wrongItems.push({ i, q: QUESTIONS[i], selected: state[i].selected });
    }
  }

  if (wrongItems.length === 0) {
    list.innerHTML = '<div id="empty-msg">尚無錯題<br>繼續加油！✓</div>';
  } else {
    list.innerHTML = wrongItems.map(({ i, q, selected }) => `
      <div class="wrong-item" onclick="goToQuestionPage(${i})">
        <span class="qnum">Q #${q.num}</span>
        <span class="wrong-ans">答 ${selected || '—'}</span>
        <span class="right-ans">正 ${q.answer}</span>
      </div>
    `).join('');
  }
}

// Sidebar resize
(function() {
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebar-resize');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const newW = Math.max(120, Math.min(600, startW + (e.clientX - startX)));
    sidebar.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

function resetProgress() {
  if (!confirm('確定要清除所有答題紀錄，重新開始嗎？')) return;
  try { localStorage.removeItem('ceh_quiz_state_random_125_B'); } catch(e) {}
  location.reload();
}

// Initial render
render();
</script>
</body>
</html>
