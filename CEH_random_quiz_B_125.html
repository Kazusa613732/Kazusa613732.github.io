<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隨機練習卷 B（125題）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #00e5ff;
    --accent2: #ff6b6b;
    --success: #3fb950;
    --warn: #f78166;
    --text: #e6edf3;
    --muted: #7d8590;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    display: flex;
    gap: 0;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 120px;
    max-width: 600px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-resize {
    position: absolute;
    right: 0;
    top: 0;
    width: 5px;
    height: 100%;
    cursor: col-resize;
    background: transparent;
    z-index: 20;
    transition: background 0.15s;
  }
  #sidebar-resize:hover, #sidebar-resize.dragging {
    background: var(--accent);
    opacity: 0.5;
  }

  #sidebar-header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--border);
  }

  #reset-btn {
    margin: 8px 14px 0;
    padding: 6px 10px;
    width: calc(100% - 28px);
    background: transparent;
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: var(--radius);
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.15s, background 0.15s;
  }
  #reset-btn:hover { opacity: 1; background: rgba(255,80,80,0.08); }

  #sidebar-header h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  #sidebar-header p {
    font-size: 12px;
    color: var(--muted);
  }

  #wrong-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
  }

  #wrong-list::-webkit-scrollbar { width: 4px; }
  #wrong-list::-webkit-scrollbar-track { background: transparent; }
  #wrong-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .wrong-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }

  .wrong-item:hover { background: var(--surface2); }

  .wrong-item .qnum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    min-width: 50px;
  }

  .wrong-item .wrong-ans {
    font-size: 11px;
    color: var(--warn);
    font-family: 'JetBrains Mono', monospace;
  }

  .wrong-item .right-ans {
    font-size: 11px;
    color: var(--success);
    font-family: 'JetBrains Mono', monospace;
    margin-left: auto;
  }

  #empty-msg {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 30px 10px;
    line-height: 1.8;
  }

  #stats-bar {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  #stats-bar span { color: var(--text); }

  /* ── Main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 100vh;
  }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #topbar h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  #topbar h1 span { color: var(--accent); }

  #page-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  #progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.4s ease;
  }

  #quiz-area {
    flex: 1;
    padding: 32px 32px 20px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 24px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .question-card.answered { border-color: var(--border); }
  .question-card.correct { border-color: var(--success); }
  .question-card.wrong { border-color: var(--warn); }

  .q-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
    background: rgba(0,229,255,0.08);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(0,229,255,0.2);
  }

  .q-status-icon {
    margin-left: auto;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .question-card.correct .q-status-icon { opacity: 1; }
  .question-card.wrong .q-status-icon { opacity: 1; }

  .q-text {
    padding: 18px 20px 16px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
  }

  .options {
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    line-height: 1.5;
    user-select: text;
    -webkit-user-select: text;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.04);
    border-color: rgba(0,229,255,0.4);
    transform: translateX(2px);
  }

  .option-btn:disabled { cursor: default; }
  .option-btn.submitted-state { cursor: default; }

  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    min-width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: var(--border);
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option-btn.selected .opt-letter {
    background: rgba(0,229,255,0.2);
    color: var(--accent);
  }

  .option-btn.correct-ans .opt-letter {
    background: rgba(63,185,80,0.25);
    color: var(--success);
  }

  .option-btn.wrong-ans .opt-letter {
    background: rgba(247,129,102,0.25);
    color: var(--warn);
  }

  .option-btn.correct-ans {
    background: rgba(63,185,80,0.06);
    border-color: rgba(63,185,80,0.4);
  }

  .option-btn.wrong-ans {
    background: rgba(247,129,102,0.06);
    border-color: rgba(247,129,102,0.4);
  }

  .submit-row {
    padding: 0 16px 16px;
  }

  .submit-btn {
    padding: 9px 22px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .submit-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
  .submit-btn.submitted { background: var(--border); color: var(--muted); }

  .answer-reveal {
    margin: 0 16px 16px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    display: none;
    font-family: 'JetBrains Mono', monospace;
  }

  .answer-reveal.show { display: block; }
  .answer-reveal.ok { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
  .answer-reveal.no { background: rgba(247,129,102,0.1); color: var(--warn); border: 1px solid rgba(247,129,102,0.3); }

  /* ── Pagination ── */
  #pagination {
    padding: 24px 32px 40px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .page-btn {
    padding: 10px 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 1px;
  }

  .page-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .page-btn:disabled { opacity: 0.3; cursor: default; }

  #page-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }

  .page-dot {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-dot:hover { border-color: var(--accent); color: var(--accent); }
  .page-dot.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .page-dot.has-wrong { border-color: var(--warn); color: var(--warn); }
  .page-dot.active.has-wrong { background: var(--warn); color: #000; }
  .page-dot.all-correct { border-color: var(--success); color: var(--success); }
  .page-dot.active.all-correct { background: var(--success); color: #000; }

  /* scrollbar main */
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: transparent; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 700px) {
    #sidebar { display: none; }
    #quiz-area { padding: 16px; }
    #pagination { padding: 16px 16px 32px; }
    #topbar { padding: 12px 16px; }
    #page-dots { max-width: 260px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-resize"></div>
  <div id="sidebar-header">
    <h2>錯題紀錄</h2>
    <p>點擊可跳至該題頁面</p>
  </div>
  <button id="reset-btn" onclick="resetProgress()">🔄 重置所有進度</button>
  <div id="wrong-list">
    <div id="empty-msg">尚無錯題<br>繼續加油！✓</div>
  </div>
  <div id="stats-bar">
    已答 <span id="stat-answered">0</span> / 125 &nbsp;|&nbsp; 正確 <span id="stat-correct">0</span>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <h1>CEH 312-50v13 &nbsp;<span>隨機練習卷 B（125題）</span></h1>
    <span id="page-info">第 1 頁 / 13 頁</span>
  </div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <div id="quiz-area"></div>
  <div id="pagination">
    <button class="page-btn" id="btn-prev" onclick="changePage(-1)" disabled>← 上一頁</button>
    <div id="page-dots"></div>
    <button class="page-btn" id="btn-next" onclick="changePage(1)">下一頁 →</button>
  </div>
</div>

<script>
const QUESTIONS = [{"num": 10, "text": "While performing a vulnerability assessment for XYZ Corporation, you discover\nthat several key systems are regularly interacting with unidentified external\nentities. These interactions often involve data transfers, both incoming and\noutgoing. While some of these might be legitimate, the nature and volume of\nthis unmonitored traffic raise concerns about potential data exfiltration or\nmalware introduction.\n\nGiven the ambiguous nature of these interactions and the high stakes involved,\nwhich strategy would most directly identify and mitigate the vulnerabilities\nassociated with these unsanctioned exchanges?", "options": {"A": "Prioritize a behavioral analytics solution that profiles normal system behaviors and alerts\non deviations, focusing on the interaction patterns of the identified systems.", "B": "Institute a company-wide training session on the dangers of unsolicited communications,\nhoping to curtail inadvertent employee engagements with external entities.", "C": "Implement an aggressive zero-trust model across the board, cutting off all external\ninteractions until each can be individually vetted and validated.", "D": "Initiate a deep-dive forensic analysis on the systems involved, looking for signs of past\nbreaches, malware, or unauthorized data manipulations."}, "answer": "A"}, {"num": 127, "text": "During a red team assessment of an enterprise LAN environment, the tester\ndiscovers an access switch that connects multiple internal workstations. The\nswitch has no port security measures in place. To silently intercept\ncommunication between different hosts without deploying ARP poisoning or\nmodifying the routing table, the tester launches a MAC flooding attack using the\nmacof utility from the dsniff suite. This command sends thousands of Ethernet\nframes per minute, each with a random, spoofed source MAC addresses. Soon\nafter the flooding begins, the tester puts their network interface into\npromiscuous mode and starts capturing packets. They observe unicast traffic\nbetween different internal machines appearing in their packet sniffer – traffic\nthat should have only reached specific destinations on the network.\n\nWhat internal switch behavior is responsible for this sudden exposure of\nisolated traffic?", "options": {"A": "The interface performed DHCP starvation to capture broadcasts.", "B": "The switch disabled MAC filtering due to duplicate address conflicts.", "C": "The switch performed ARP spoofing to misroute packets.", "D": "The switch entered hub-like behavior due to a full CAM table."}, "answer": "D"}, {"num": 490, "text": "During a compliance review at a law firm in Chicago, an ethical hacker tests the\nfirm’s secure email gateway. She observes that sensitive legal documents are\nbeing transmitted in clear text over the Internet, allowing anyone intercepting\nthe traffic to read the contents. The firm is concerned about unauthorized\nindividuals being able to view these communications. Which principle of\ninformation security is being violated?", "options": {"A": "Confidentiality", "B": "Integrity", "C": "Availability", "D": "Non-Repudiation"}, "answer": "A"}, {"num": 374, "text": "Michael, an ethical hacker at a New York-based e-commerce company, is\nevaluating the security of their online payment system after a recent incident\nwhere fraudulent transactions went undetected. His investigation reveals that\nthe system uses an asymmetric encryption algorithm to ensure the authenticity\nof payment confirmations. He finds that the algorithm employs a public-key\ncryptosystem, where the sender signs the transaction with a private key, and\nthe recipient verifies it using a corresponding public key located in a directory.\nDuring his test, Michael intercepts a signed message and notices that the\nalgorithm supports modular exponentiation for generating digital signatures, a\nprocess critical to verifying the identity of the signatory. He aims to assess if the\nalgorithm’s configuration could be vulnerable to a meet-in-the-middle attack\ndue to its key structure.\n\nWhich asymmetric encryption algorithm should Michael identify as the one\nused by the payment system?", "options": {"A": "Diffie-Hellman", "B": "RSA", "C": "ElGamal", "D": "DSA"}, "answer": "B"}, {"num": 390, "text": "Noah Kim, an ethical hacker at Quantum Cyber Solutions in Austin, Texas, is\nassessing iPhones used for proprietary development. On one device, he\ndemonstrates a technique that allows it to boot normally without a computer,\nbut the elevated access is temporarily lost after restart until the user launches\na special on-device app to reapply the modifications. Which jailbreaking\nmethod is this?", "options": {"A": "Semi-untethered Jailbreaking", "B": "Untethered Jailbreaking", "C": "Semi-tethered Jailbreaking", "D": "Tethered Jailbreaking"}, "answer": "A"}, {"num": 211, "text": "A penetration tester is evaluating a web application that does not properly\nvalidate the authenticity of HTTP requests. The tester suspects the application\nis vulnerable to Cross-Site Request Forgery (CSRF.\n\nWhich approach should the tester use to exploit this vulnerability?", "options": {"A": "Inject a SQL query into the input fields to perform SQL injection", "B": "Perform a brute-force attack on the application’s login page to guess weak credentials", "C": "Create a malicious website that sends a crafted request on behalf of the user when visited", "D": "Execute a directory traversal attack to access restricted server files"}, "answer": "C"}, {"num": 383, "text": "During a post-exploitation phase on a compromised finance department\nworkstation, ethical hacker Anika uses her Meterpreter session to extract\nsensitive credential data. After running a command, she receives a long list of\nalphanumeric strings representing LM and NTLM values. These outputs are later\ntransferred to a cracking rig for offline password recovery, allowing the red team\nto simulate credential theft across multiple systems. Which Meterpreter\ncommand most likely produced these results?", "options": {"A": "screenshot", "B": "keyscan_start", "C": "hashdump", "D": "getsystem"}, "answer": "C"}, {"num": 117, "text": "During an ethical hacking exercise, a security analyst is testing a web\napplication that manages confidential information. The analyst suspects the\napplication may be susceptible to SQL injection attacks.\n\nWhich of the following payloads will most likely reveal if the application is\nvulnerable to time-based blind SQL injection attacks?", "options": {"A": "‘ AND BENCHMARK(5000000,ENCODE(‘test’,‘test’)); --", "B": "‘ UNION SELECT NULL, NULL, NULL; --", "C": "‘ AND 1=0 UNION ALL SELECT ‘admin’,‘admin’; --", "D": "‘ OR ‘1’=‘1’; --"}, "answer": "A"}, {"num": 265, "text": "In the sunlit tech oasis of Phoenix, Arizona, ethical hacker Nadia Patel explores\nthe inner workings of LearnSphere, a US-based e-learning platform serving\nthousands of students. Tasked with evaluating the application’s resource-\nsharing mechanisms, Nadia crafts HTTP requests to interact with the platform’s\ncontent delivery endpoint. Her tests uncover a serious flaw: improperly\nconfigured access-control headers permit cross-origin requests from\nunauthorized domains, allowing access to protected course materials.\nDetermined to strengthen the platform, Nadia documents her findings to\nprovide LearnSphere’s security team with clear, actionable guidance.\n\nWhich vulnerability is Nadia most likely exploiting in LearnSphere’s web\napplication?", "options": {"A": "Directory Listing", "B": "Default Credential Exposure", "C": "CORS Misconfiguration", "D": "Verbose Error Messages"}, "answer": "C"}, {"num": 407, "text": "During a penetration test at a shipping company in Miami, ethical hacker Daniel\ndelivers a disguised email attachment containing a hidden payload. Once\nexecuted by employees, the compromised workstations begin to silently\ncommunicate with a remote server under Daniel’s control. Over the following\nweek, he confirms that multiple infected endpoints can receive synchronized\ncommands and perform background tasks simultaneously, including sending\nbursts of outbound traffic on demand.\n\nWhich type of malicious component is Daniel most likely simulating in this\nassessment?", "options": {"A": "Botnet Agents", "B": "Scareware", "C": "Spyware", "D": "Potentially Unwanted Applications (PUAs)"}, "answer": "A"}, {"num": 8, "text": "During an investigation, an ethical hacker discovered that a web application’s\nAPI has been compromised, leading to unauthorized access and data\nmanipulation. They identified webhooks and a webshell being used by the\nattacker.\n\nTo prevent further exploits, which of the following actions should be taken?", "options": {"A": "Perform regular code reviews for the webhooks and modify the API to block connections\nfrom unknown IP addresses.", "B": "Harden the web server security, add multi-factor authentication for API users, and restrict\nthe execution of scripts server-side.", "C": "Implement a Web Application Firewall (WAF) with rules to block webshell traffic and increase\nthe logging verbosity of webhooks.", "D": "Implement input validation on all API endpoints, review webhook payloads, and schedule\nregular scanning for webshells."}, "answer": "B"}, {"num": 47, "text": "As a cybersecurity analyst, you were assigned the task of analyzing the traffic\npatterns of your company’s network. You started noticing irregularities that\nsuggested a potential scanning attempt. The attacker appears to be quite\nsophisticated, operating slowly and meticulously, making it a challenge to\ndetect or trace.\n\nGiven the stealthiness of this approach, which of the following scenarios best\ndescribes the scanning technique the attacker might be using?", "options": {"A": "The attacker is sending FIN packets, assuming that the target system will respond differently\nto these packets depending on the state of the ports.", "B": "The attacker is directly establishing a TCP connection with every port on the system to\nidentify open ones, risking immediate detection.", "C": "The attacker is sending packets with all flags set, hoping that closed ports will respond\ndifferently than open ones.", "D": "The attacker is utilizing a ‘zombie’ machine to transmit the scan, thus making the true\nsource of the scan difficult to determine."}, "answer": "D"}, {"num": 330, "text": "A multinational corporation deploys a major internal tool built on a PowerShell-\nbased automation framework. Shortly after a scheduled rollout, the IT team\nnotices intermittent system slowdowns and unexplained bandwidth spikes.\nDespite running updated endpoint protection and restrictive firewall rules,\ntraditional scanning tools report no malicious files on disk. However, internal\ntelemetry flags a trusted process repeatedly executing obfuscated PowerShell\ncommands in memory. The anomalous activity vanishes upon reboot and\nappears to leave no footprint behind on the system.\n\nWhich type of malware is most likely responsible for this behavior?", "options": {"A": "Worm", "B": "Trojan", "C": "Rootkit", "D": "Fileless Malware"}, "answer": "D"}, {"num": 253, "text": "Emma, an ethical hacker at a Chicago-based healthcare provider, is performing\na penetration test on the organization’s patient record system following a\nrecent data breach. During her investigation, she discovers that attackers\ngained access to a large volume of encrypted patient records but had no\nknowledge of the original data or encryption keys. Emma observes that the\nsystem uses a block cipher and suspects the attackers may have applied a\ncryptanalytic method that examines encrypted outputs in bulk to detect\nstructural or statistical patterns in the encrypted data.\n\nWhich cryptanalysis technique should Emma investigate to assess the system’s\nvulnerability in this scenario?", "options": {"A": "Chosen-plaintext attack", "B": "Known plaintext attack", "C": "Chosen-ciphertext attack", "D": "Ciphertext-only attack"}, "answer": "D"}, {"num": 241, "text": "Which of the following is the primary goal of ethical hacking?", "options": {"A": "To identify and fix security vulnerabilities in a system", "B": "To steal sensitive information from a company’s network", "C": "To spread malware to compromise multiple systems", "D": "To disrupt services by launching denial-of-service attacks"}, "answer": "A"}, {"num": 339, "text": "In a tense red team exercise at a mid-sized university in Austin, Texas, an ethical\nhacker named Jake targeted a legacy Linux server in the engineering\ndepartment. Late one afternoon, he discovered TCP port 2049 was open during\nhis port sweep, suggesting hidden file-sharing capabilities. Intrigued, Jake used\na standard utility to request a list of remote file systems shared across the\nnetwork, aiming to map accessible resources. Meanwhile, he idly checked for\nTelnet access and probed a time-sync service out of routine, but both proved\nfruitless on this host.\n\nWhich enumeration method is actively demonstrated in this scenario?", "options": {"A": "NFS Enumeration", "B": "SNMP Enumeration", "C": "NetBIOS Enumeration", "D": "NTP Enumeration"}, "answer": "A"}, {"num": 432, "text": "During a penetration test at Cascade Financial in Seattle, ethical hacker Elena\nVasquez probes the input handling of the company’s web server. She discovers\nthat a single crafted request is processed as two separate ones, allowing her to\ninject malicious data into the server’s communication. This type of attack falls\ninto the same category of input validation flaws as cross-site scripting (XSS),\ncross-site request forgery (CSRF), and SQL injection.\n\nWhich type of web server attack is Elena most likely demonstrating?", "options": {"A": "HTTP Response Splitting Attack", "B": "Password Cracking Attack", "C": "Web Cache Poisoning Attack", "D": "Directory Traversal Attack"}, "answer": "A"}, {"num": 173, "text": "A penetration tester gains access to a target system through a vulnerability in a\nthird-party software application.\n\nWhat is the most effective next step to take to gain full control over the system?", "options": {"A": "Execute a Cross-Site Request Forgery (CSRF) attack to steal session data", "B": "Conduct a denial-of-service (DoS) attack to disrupt the system’s services", "C": "Perform a brute-force attack on the system’s root password", "D": "Use a privilege escalation exploit to gain administrative privileges on the system"}, "answer": "D"}, {"num": 329, "text": "As part of an insider threat simulation at a multinational insurance firm, lead\nred teamer John is asked to assess whether internal directory services are\nexposing sensitive user data. Gaining limited VPN access, he begins probing\nport 389 on a staging environment connected to the main domain\ninfrastructure. After discovering that anonymous binds are accepted by the\ndirectory service, John launches a utility from his Kali machine that allows\ncommand-line interaction with directory entries. He structures his query to\nsearch for user objects with associated organizational units. Moments later,\nJohn reviews the output which includes usernames, group memberships, and\ndepartmental hierarchies – all retrieved without authentication.\n\nWhich tool is John MOST likely using to perform this enumeration?", "options": {"A": "smtp-user-enum", "B": "nbtstat -A", "C": "dig AXFR", "D": "ldapsearch"}, "answer": "D"}, {"num": 427, "text": "At a Chicago-based healthcare provider, security engineer Emily reviews the\nmigration of critical applications to a cloud service. During her evaluation, she\nnotes that administrators can provision new servers, increase storage, and\nexpand compute power instantly through a web dashboard without any manual\ninvolvement from the cloud provider. Which NIST-defined characteristic of cloud\ncomputing best explains this capability?", "options": {"A": "Measured service", "B": "Resource pooling", "C": "Broad network access", "D": "On-demand self-service"}, "answer": "D"}, {"num": 399, "text": "You are Evelyn, an ethical hacker at LoneStar Health in Austin, Texas, engaged to\ninvestigate a recent compromise of archived patient records. During the\ninvestigation you recover a large set of encrypted records from a compromised\nbackup and, separately, obtain several original template records (standard\nheaders and form fields) that correspond to some entries in the encrypted set.\nYou plan to use these paired examples (the original templates and their\nencrypted counterparts) to attempt to recover keys or deduce other plaintext\nvalues. Which cryptanalytic approach is most appropriate for this situation?", "options": {"A": "Ciphertext-only attack", "B": "Chosen-plaintext attack", "C": "Chosen-ciphertext attack", "D": "Known-plaintext attack"}, "answer": "D"}, {"num": 299, "text": "You are Olivia Chen, an ethical hacker at CyberGuardians Inc., hired to test the\nwireless network of Skyline Media, a broadcasting company in Chicago, Illinois.\nYour mission is to breach their WPA2-protected Wi-Fi during a late-night\npenetration test. Using a laptop in monitor mode, you execute a command to\ntransmit packets that force client devices to disconnect and reconnect, enabling\nyou to capture a four-way handshake for cracking. Based on the described\naction, which tool are you using?", "options": {"A": "Aircrack-ng", "B": "Airbase-ng", "C": "Aireplay-ng", "D": "Airodump-ng"}, "answer": "C"}, {"num": 513, "text": "A regional healthcare provider in Portland, Oregon, recently migrated its patient\nscheduling portal to a new cloud platform. Within days, multiple patients\nreported that when searching online for the clinic's appointment system, they\nwere directed to a website that looked identical to the official portal. The\nfraudulent page appeared prominently in search engine results and prompted\nusers to log in using their patient credentials. The URL closely resembled the\nlegitimate domain name, and no internal DNS servers had been altered within\nthe organization's infrastructure. Security analysts later determined that the\nattacker had created a convincing replica of the portal and manipulated search\nvisibility so that unsuspecting users would voluntarily navigate to the malicious\nsite. Which type of social engineering technique best explains this attack?", "options": {"A": "Whaling", "B": "Spimming", "C": "Spear Phishing", "D": "Pharming"}, "answer": "D"}, {"num": 74, "text": "Your role as a cybersecurity analyst at XYZ Corporation requires you to perform\na thorough security assessment of the company’s online presence. You initiate\nthe process with a passive reconnaissance phase, trying to gather as much\ninformation as possible without interacting directly with the target system.\n\nWhich of the following techniques or tools is least likely to assist you in this\nendeavor?", "options": {"A": "Using a tool like Nmap to scan the company’s public IP range.", "B": "Inspecting the WHOIS database for domain registration details.", "C": "Utilizing search engines and associated services (Google, Bing, Google Earth, etc.).", "D": "Monitoring public posts and profiles on social media platforms and professional networking\nsites."}, "answer": "A"}, {"num": 310, "text": "In Miami, Florida, Sarah Thompson, a security analyst at Apex Cyber Defense, is\ntasked with monitoring the wireless infrastructure at Coastal Healthcare, a busy\nurban hospital. One morning, nurse Emily Carter reports that her tablet used for\naccessing patient records is unexpectedly connecting to an access point\nbroadcasting a name and signal similar to the hospital’s secure Wi-Fi. Upon\ninvestigation, Sarah’s log analysis reveals an unauthorized device on the\nnetwork capturing sensitive traffic from connected systems. Suspecting a\nbreach, she identifies that the attacker has deployed an access point to mimic\nthe hospital’s legitimate network. Based on this behavior, which wireless threat\nis the attacker executing?", "options": {"A": "Misconfigured AP", "B": "Rogue AP", "C": "Evil Twin AP", "D": "Honeypot AP"}, "answer": "C"}, {"num": 344, "text": "During a network security audit at Jefferson National Bank in Richmond,\nVirginia, ethical hacker Thomas Reed is tasked with identifying vulnerabilities in\nemployee login processes on VLAN 20, which connects client services\nworkstations to the customer account database server. He sets up a Wireshark\ninstance on a monitoring workstation configured in mirror mode behind a\nmanaged switch to capture traffic. His goal is to detect unencrypted\nauthentication credentials transmitted over HTTP during login sessions. Which\nWireshark feature should Thomas use to isolate and analyze these credentials\nin real time, and how does it assist him?", "options": {"A": "Use the “Display Filtering by Protocol” to isolate HTTP traffic and view packet details", "B": "Use the “Follow TCP Stream” to reconstruct and read HTTP session data", "C": "Use the “Monitoring the Specific Ports” to generate a traffic summary and identify HTTP\npackets", "D": "Use the “Filtering by IP Address” to set a filter for HTTP traffic before capturing"}, "answer": "B"}, {"num": 320, "text": "You are Noah Kim, an ethical hacker at Quantum Cyber Solutions, hired to test\nthe mobile device security of TechTrend Innovations, a tech firm in Austin,\nTexas. During a covert assessment, your objective is to simulate an attacker\nattempting to gain privileged access to an iPhone 12 running iOS 14.5 used for\nproprietary app development. You apply a jailbreaking technique that allows\nthe device to fully restart without requiring a computer, maintaining a patched\nkernel and enabling access to sensitive app data in the file system. Based on\nthis method, which iOS jailbreaking technique are you using?", "options": {"A": "Semi-tethered Jailbreaking", "B": "Untethered Jailbreaking", "C": "Semi-untethered Jailbreaking", "D": "Tethered Jailbreaking"}, "answer": "B"}, {"num": 130, "text": "A company’s online service is under a multi-vector DoS attack using both SYN\nfloods and HTTP GET floods from a botnet. Standard firewalls and IDS are\nunable to prevent the outages.\n\nTo mitigate the attack without disrupting legitimate traffic, which advanced\ndefense should the company implement?", "options": {"A": "Increase server bandwidth and apply basic rate limiting", "B": "Configure the firewall to block all incoming SYN packets from external IPs", "C": "Deploy a Web Application Firewall (WAF) with anomaly detection", "D": "Use DDoS mitigation services that offer multi-layer protection"}, "answer": "D"}, {"num": 100, "text": "A company’s customer data stored in a cloud environment has been exposed\ndue to an unknown vulnerability.\n\nWhich of the following types of attack most likely led to this incident?", "options": {"A": "Brute force attack on user passwords", "B": "Denial of Service (DoS) attack on cloud servers", "C": "Side-channel attack on the hypervisor", "D": "Exploitation of misconfigured security groups"}, "answer": "C"}, {"num": 13, "text": "During a cybersecurity operation, a CEH professional discovered an unknown\nBluetooth Low Energy (BLE device actively transmitting pairing signals. The\nprofessional decided to breach the BLE device using a crackle. The device was\nseen pairing and exchanging keys, leading to the establishment of a secure\nconnection. However, the professional only managed to capture LL_ENC_REQ\nand LL_ENC_RSP packets, but not the Long-Term Key (LTK.\n\nWhich of the following best describes the professional’s next course of action?", "options": {"A": "Use Btlejacking to hijack the connection.", "B": "Decrypt the pcap data using the -o option.", "C": "Use the BlueZ tool hcitool inq to reveal more information about the\ndevice.", "D": "The operation cannot continue without the LTK."}, "answer": "D"}, {"num": 401, "text": "During a penetration test at a manufacturing company in Detroit, Amanda, a\nsenior security consultant, scans several legacy Linux servers. On one host, she\ndiscovers an open port used for file transfer that allows anonymous login. Once\nconnected, she is able to view the directory structure and check available files,\nwhich helps her identify potential sensitive information exposure. She also\nnotices background traffic on a UDP service related to NetBIOS name lookups,\nbut she continues probing the file transfer service to confirm user access\nweaknesses.\n\nWhich ports and services should Amanda prioritize for this enumeration\nactivity?", "options": {"A": "TCP 21 and UDP 137", "B": "TCP 139 and UDP 137, 138", "C": "TCP 23 and UDP 137, 138", "D": "TCP 25 and UDP 138"}, "answer": "A"}, {"num": 103, "text": "Your role as a network administrator in a mid-sized company involves\nprotecting the company's web servers from potential security threats. Recently,\nyour company’s web server experienced a Distributed Denial of Service (DDoS\nattack. In explaining the situation to your team, you mention the attack\nspecifically targeted the web server's application layer.\n\nWhich type of DDoS attack was most likely used against your company’s web\nserver?", "options": {"A": "HTTP flood attack", "B": "SYN flood attack", "C": "ICMP flood attack", "D": "UDP flood attack"}, "answer": "A"}, {"num": 210, "text": "A penetration tester is assessing a company’s executive team for vulnerability\nto sophisticated social engineering attacks by impersonating a trusted vendor\nand leveraging internal communications.\n\nWhat is the most effective social engineering technique to obtain sensitive\nexecutive credentials without being detected?", "options": {"A": "Create a targeted spear-phishing email that references recent internal projects and\nrequests credential verification", "B": "Develop a fake social media profile to connect with executives and request private\ninformation", "C": "Conduct a phone call posing as the CEO to request immediate password changes from\nexecutives", "D": "Send a mass phishing email with a malicious link disguised as a company-wide update"}, "answer": "A"}, {"num": 186, "text": "A penetration tester is attempting to gain access to a wireless network that is\nsecured with WPA2 encryption. The tester successfully captures the WPA2\nhandshake but now needs to crack the pre-shared key.\n\nWhat is the most effective method to proceed?", "options": {"A": "Conduct a de-authentication attack to disconnect all clients from the network", "B": "Execute a SQL injection attack on the router’s login page", "C": "Use a dictionary attack against the captured WPA2 handshake to crack the key", "D": "Perform a brute-force attack using common passwords against the captured handshake"}, "answer": "C"}, {"num": 14, "text": "A multinational corporation provides its employees with mobile devices to\nsupport remote work and enhance productivity. Recently, the security team\ndetected suspicious activities indicating potential vulnerabilities in the mobile\nplatforms, raising concerns about unauthorized access and data leakage. The\nteam is tasked with identifying advanced hacking techniques targeting mobile\nplatforms and implementing robust measures to enhance mobile security and\nprevent intrusions.\n\nGiven the scenario described, which sophisticated hacking technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nsecurity of the multinational corporation’s mobile platforms?", "options": {"A": "Man-in-the-Middle (MitM) Attack Interfering with Communication between Mobile Devices\nand Corporate Servers to Intercept Sensitive Data, such as Corporate Emails and Documents", "B": "Clickjacking Attack Embedding Malicious Links or Buttons in Legitimate Apps to Trick Users\ninto Performing Unintended Actions, such as Providing Credentials or Authorizing Transactions", "C": "Remote Access Trojan (RAT) Implanting Malicious Software on Mobile Devices to Gain\nUnauthorized Remote Access and Monitor User Activities, such as Keystrokes and Screen\nCapture", "D": "Jailbreaking/Rooting Exploiting Vulnerabilities to Remove Software Restrictions on Mobile\nDevices, Allowing Installation of Unauthorized Apps and Access to Restricted Functions"}, "answer": "C"}, {"num": 244, "text": "A security analyst investigates unusual east-west traffic on a corporate network.\nA previously unknown MAC address is found actively communicating from a port\nconnected to a trusted desktop. On closer inspection, a small computing device\n(Raspberry Pi was physically inserted between the switch and the legitimate\nmachine. This setup allows the rogue device to piggyback onto the network\nusing the identity and privileges of the authenticated workstation without\ntriggering any authentication processes or alarms.\n\nWhich evasion technique is being used to blend unauthorized traffic with\nlegitimate access?", "options": {"A": "Exploiting a wireless rogue access point to tunnel through the firewall", "B": "VLAN double tagging to shift between network segments", "C": "NAC bypass using a pre-authenticated device for network bridging", "D": "Spoofing ARP responses from a dynamic IP allocation pool"}, "answer": "C"}, {"num": 92, "text": "As a security analyst, you are testing your company’s network for potential\nvulnerabilities. During your investigation, you suspect that an attacker might be\nusing MAC flooding to compromise the switches and sniff network traffic.\n\nWhich of the following indicators would most likely confirm your suspicions?", "options": {"A": "The existence of multiple MAC addresses assigned to a single IP address.", "B": "The presence of multiple IP addresses assigned to a single MAC address.", "C": "An increased number of ARP requests in the network traffic.", "D": "Numerous MAC addresses that correspond to a single switch port."}, "answer": "D"}, {"num": 352, "text": "In Denver, Colorado, ethical hacker Rachel Nguyen is conducting a network\nsecurity assessment for Apex Logistics, a transportation firm with a complex\ninternal network. During her test, Rachel observes a client-server\ncommunication and injects specially crafted packets into the exchange,\ndisrupting the client’s session. As a result, the server continues interacting with\nRachel’s system while the legitimate client’s connection becomes unresponsive.\nShe uses this setup in a controlled environment to demonstrate vulnerabilities\nto the company’s IT team.\n\nWhat network-level session hijacking technique is Rachel employing in this\nassessment?", "options": {"A": "Blind hijacking", "B": "UDP hijacking", "C": "RST hijacking", "D": "TCP/IP hijacking"}, "answer": "D"}, {"num": 532, "text": "A retail brand based in San Diego, California, authorized a controlled mobile\nsecurity exercise to evaluate risks associated with third-party application\ndistribution channels. Testers acquired a version of the company's customer\nrewards application from an unofficial marketplace frequently used by overseas\ncustomers. The application's visual layout and functionality were\nindistinguishable from the officially released version available in mainstream\napp stores. Behavioral monitoring conducted in a sandbox environment\nrevealed that, in addition to its normal operations, the application initiated\noutbound connections unrelated to its documented features. A binary\ncomparison against the vendor-supplied build confirmed structural differences\nbetween the two versions. What mobile-based social engineering technique\ndoes this scenario most accurately represent?", "options": {"A": "Deploying Fake Security Applications disguised as protection tools", "B": "Publishing Malicious Apps designed to mimic trusted brands", "C": "Repackaging Legitimate Apps after modifying their internal structure", "D": "Conducting SMiShing campaigns through fraudulent text messages"}, "answer": "C"}, {"num": 499, "text": "During a penetration test at a healthcare provider in Phoenix, ethical hacker\nSofia crafts a stream of IP packets with manipulated offset fields and\noverlapping payload offsets so that the records server’s protocol stack\nrepeatedly attempts to reconstruct the original datagrams. The repeated\nreconstruction attempts consume CPU and memory, causing the system to crash\nintermittently and disrupt patient portal access, even though overall bandwidth\nremains normal. Packet analysis shows deliberately malformed offsets that\ntrigger processing errors rather than a simple flood of traffic.\n\nWhich type of attack is Sofia most likely simulating?", "options": {"A": "ICMP Flood", "B": "Ping of Death", "C": "Fragmentation Attack", "D": "Teardrop Attack"}, "answer": "D"}, {"num": 23, "text": "A cybersecurity firm has deployed a comprehensive defense system, including\nIntrusion Detection Systems (IDS), firewalls, and honeypots, to protect its\nnetwork from malicious activities. Despite these measures, the security team\nhas noticed suspicious traffic patterns indicating potential attempts to evade\ndetection and breach the network perimeter. The team is tasked with identifying\nadvanced evasion techniques and strengthening the defense mechanisms to\nmitigate emerging threats effectively.\n\nGiven the scenario described, which sophisticated evasion technique,\nresembling a scenario-based attack, poses the greatest challenge for the\nsecurity team to detect and mitigate effectively, potentially compromising the\nintegrity of the cybersecurity firm’s network?", "options": {"A": "Protocol-Level Evasion Techniques Fragmenting Packets to Evade Stateful Inspection by\nFirewalls", "B": "Polymorphic Malware Variants Generating Unique Payloads to Bypass Signature-Based\nDetection by IDS", "C": "Honeypot Spoofing Attacks Mimicking Legitimate Network Services to Avoid Detection by\nIntrusion Detection Systems", "D": "Covert Channel Communication Exploiting Unused IP Header Fields to Conceal Malicious\nTraffic and Evade Detection by Security Devices"}, "answer": "D"}, {"num": 361, "text": "On a busy Monday morning at Horizon Financial Services in Chicago, accounts\nassistant Clara Nguyen receives an email that appears to come from the\ncompany’s IT department. The email, addressed specifically to Clara and\nmentioning her role in the accounts team, warns of a critical system\nvulnerability requiring immediate action. It includes a link to a login page\nresembling the company’s internal portal, urging her to update her credentials\nto prevent account suspension. The email’s sender address looks legitimate, but\nClara notices a slight misspelling in the domain name.\n\nWhat social engineering technique is being attempted against Clara?", "options": {"A": "Spear Phishing", "B": "Impersonation", "C": "Quid Pro Quo", "D": "Vishing"}, "answer": "A"}, {"num": 495, "text": "As part of a red team campaign against a pharmaceutical company in Boston,\nethical hacker Alex begins with a successful spear-phishing attack that delivers\nan initial payload to a manager’s laptop. After gaining access, Alex pivots to\nharvesting cached credentials and using them to move laterally across the\ninternal network. Soon, routers, printers, and several file servers are\ncompromised, expanding the red team’s control beyond the original host. At\nthis point, Alex has not yet targeted sensitive research data, but the team has\nbuilt a broader foothold within the environment.\n\nWhich phase of the Advanced Persistent Threat (APT) lifecycle is Alex\nsimulating?", "options": {"A": "Search & Exfiltration", "B": "Initial Intrusion", "C": "Persistence", "D": "Expansion"}, "answer": "D"}, {"num": 303, "text": "You are Emma Rodriguez, an ethical hacker at SecurePath Solutions, hired to\ntest the mobile application security of Sterling & Associates, a law firm in New\nYork City. During a covert assessment, your objective is to simulate an attacker\nattempting to exploit vulnerabilities in the firm’s client case management app.\nYou discover that the app stores user credentials in plain text on the device,\nenabling you to extract sensitive client login information using a rooted device.\nBased on this finding, which OWASP Top 10 Mobile Risk are you identifying in\nthe app?", "options": {"A": "Insecure Communication", "B": "Improper Credential Usage", "C": "Inadequate Privacy Controls", "D": "Insecure Data Storage"}, "answer": "D"}, {"num": 87, "text": "A system analyst wants to implement an encryption solution that allows safe\nkey distribution.\n\nWhich encryption method should the analyst consider?", "options": {"A": "Asymmetric encryption", "B": "Hash functions", "C": "Disk encryption", "D": "Symmetric encryption"}, "answer": "A"}, {"num": 520, "text": "An ethical hacker conducting an authorized assessment of a multinational\nadvisory firm begins collecting intelligence exclusively from publicly accessible\nonline platforms where employees share professional background details and\nengage in industry related discussions. By correlating individual role\ndescriptions, publicly endorsed technical competencies, collaborative\nconversations referencing internal initiatives, and recurring terminology used to\ndescribe projects and departments, the tester develops a structured view of\nreporting relationships, identifies commonly deployed technologies, and infers\ninternal naming conventions.\n\nFrom a reconnaissance methodology perspective, which technique is being\napplied?", "options": {"A": "Footprinting through Social Networking Sites", "B": "Footprinting through Internet Research Services", "C": "Footprinting through Search Engines", "D": "Footprinting through Social Engineering"}, "answer": "A"}, {"num": 194, "text": "A penetration tester evaluates the security of an iOS mobile application that\nhandles sensitive user information. The tester discovers that the application is\nvulnerable to insecure data transmission.\n\nWhat is the most effective method to exploit this vulnerability?", "options": {"A": "Perform a man-in-the-middle attack to intercept unencrypted data transmitted over the\nnetwork", "B": "Use a Cross-Site Request Forgery (CSRF) attack to steal user session tokens", "C": "Execute a SQL injection attack to retrieve data from the backend server", "D": "Conduct a brute-force attack on the app’s authentication system"}, "answer": "A"}, {"num": 287, "text": "At a cybersecurity consultancy firm in Boston, senior analyst Amanda Liu is\ncalled in to assess a malware outbreak affecting a regional healthcare provider.\nDespite using updated antivirus tools, the security team notices inconsistent\ndetection across infected endpoints. Amanda discovers that while the malicious\nbehavior is consistent system file tampering and suspicious outbound traffic\neach malware sample has a slightly different code structure and fails traditional\nhash-based comparison. Static analysis reveals that the underlying logic\nremains unchanged, but the code patterns vary unpredictably across infections.\n\nWhat type of virus is most likely responsible for this behavior?", "options": {"A": "Cavity virus", "B": "Macro virus", "C": "Polymorphic virus", "D": "Stealth virus"}, "answer": "C"}, {"num": 373, "text": "Jake, a cybersecurity investigator at a Miami-based cryptocurrency exchange,\nuncovers a sinister plot during a late-night breach response. Attackers have\ninfiltrated the company’s cloud environment, leveraging a technique to siphon\ncomputing power from misconfigured AWS instances. The breach, traced\nthrough compromised secrets and unauthorized API calls, has triggered a surge\nin resource consumption, threatening the platform’s integrity during a high-\nstakes trading surge. As Jake races against time to pinpoint the attack method,\nhe must identify the primary cloud hacking technique at play.\n\nWhat cloud hacking technique should Jake identify as the primary method used\nby attackers to siphon computing power in the cloud environment?", "options": {"A": "Cryptojacking", "B": "Wrapping attack", "C": "Enumerating S3 buckets", "D": "Compromising secrets"}, "answer": "A"}, {"num": 522, "text": "A regional healthcare provider in Minneapolis, Minnesota, began experiencing\nintermittent connectivity issues across a newly activated access-layer network\nsegment. Shortly after a contractor connected a diagnostic device to an unused\nswitch port, multiple employee workstations failed to receive valid network\nconfigurations. System logs showed repeated address negotiation attempts\nfrom affected hosts, while monitoring tools recorded a rapid sequence of\nconfiguration requests originating from a single switch interface. Within\nminutes, additional clients on the segment encountered similar assignment\nfailures. From a sniffing standpoint, which technique most accurately explains\nthis behavior?", "options": {"A": "MAC Spoofing", "B": "DHCP Starvation", "C": "IRDP Spoofing", "D": "Rogue DHCP Server"}, "answer": "B"}, {"num": 235, "text": "During a security assessment of a company’s internal web application, a\npenetration tester examines how the application processes input values passed\nin the web address query string. The application includes a feature that\ndynamically fetches documents based on a filename value provided in the web\naddress (e.g., By altering this\ninput to include sequences like ../../../../etc/passwd, the tester successfully\nnavigates beyond the intended storage location and accesses restricted files.\nFurther manipulation reveals access to sensitive configuration files, source\ncode, and internal scripts, confirming that the application lacks proper input\nsanitization and isolation of file access paths.\n\nWhich attack method does this scenario illustrate?", "options": {"A": "Conduct a brute-force attack to obtain administrative credentials.", "B": "Exploit buffer overflow issues by injecting oversized data in HTTP request headers.", "C": "Inject malicious scripts into web pages to manipulate content via XSS vulnerabilities.", "D": "Use directory traversal sequences in URL parameters to retrieve unauthorized system\ncontent."}, "answer": "D"}, {"num": 122, "text": "In your role as a cybersecurity specialist for a growing tech company, you are\ntasked with performing a regular network scan to check for any potential\nvulnerabilities. Your manager has specifically asked you to use a NULL scan for\nthis round.\n\nIn the context of TCP NULL scanning, what response (or lack thereof would\nindicate that a particular port on a target machine is closed?", "options": {"A": "The target machine does not send any response.", "B": "The target machine responds with a TCP RST packet.", "C": "The target machine responds with an ICMP error message.", "D": "The target machine responds with a TCP SYN/ACK packet."}, "answer": "B"}, {"num": 353, "text": "You are an ethical hacker at Vanguard Cyber Defense, hired by Sunrise Logistics,\na freight management company in Houston, Texas, to evaluate the security of\ntheir shipment tracking portal. During your engagement, you analyze how the\napplication handles user-submitted data. You observe the behavior of the\nshipment search feature and monitor the HTTP GET requests being sent to the\nserver. Your objective is to determine how user input is processed by the\nbackend system and whether those parameters can be used to manipulate SQL\nqueries. Based on this activity, which step of the SQL injection methodology are\nyou performing?", "options": {"A": "Advanced SQL Injection", "B": "Launching SQL Injection Attacks", "C": "Database Enumeration", "D": "Identifying Data Entry Paths"}, "answer": "D"}, {"num": 124, "text": "A cybersecurity research team identifies suspicious behavior on a user’s\nAndroid device. Upon investigation, they discover that a seemingly harmless\napp, downloaded from a third-party app store, has silently overwritten several\nlegitimate applications such as WhatsApp and SHAREit. These fake replicas\nmaintain the original icon and user interface but serve intrusive advertisements\nand covertly harvest credentials and personal data in the background. The\nattackers achieved this by embedding malicious code in utility apps like video\neditors and photo filters, which users were tricked into installing. The\nreplacement occurred without user consent, and the malicious code\ncommunicates with a command-and-control (C&C) server to execute further\ninstructions.\n\nWhat type of attack is being carried out in this scenario?", "options": {"A": "Agent Smith attack", "B": "Man-in-the-Disk attack", "C": "Simjacker attack", "D": "Camfecting attack"}, "answer": "A"}, {"num": 531, "text": "An energy infrastructure company in Tulsa, Oklahoma, initiated a controlled\nphishing simulation targeting multiple operational departments.\n\nThe test email claimed to originate from the corporate compliance office and\ninstructed employees to \"complete a mandatory regulatory update within the\nnext 30 minutes to avoid account suspension.\" The message used a broad\nsalutation instead of employee names and lacked the standard corporate\nsignature footer normally appended to official communications.\n\nAdditionally, security analysts observed that the embedded Hyperlink displayed\nthe organization's domain in the message body; however, when examined more\nclosely, the actual destination resolved to a shortened external URL redirecting\nto an unrelated host.\n\nFrom a defensive analysis standpoint, which indicator provides the strongest\ntechnical validation that the message is malicious?", "options": {"A": "Use of Generic Greetings rather than individualized addressing", "B": "Identification of Hover Mismatch URLs in the embedded link", "C": "Absence of a formal corporate Missing Signature", "D": "Presence of aggressive Urgency Language"}, "answer": "B"}, {"num": 475, "text": "During a penetration test at TechTrend Innovations in California, ethical hacker\nJake Henderson reviews the company’s web server exposure to network-based\nthreats. He finds that the server is running with multiple open services and\nprotocols that are not required for its operation, such as NetBIOS and SMB. Jake\nexplains to the IT team that attackers could exploit these unnecessary services\nto gain unauthorized access to the server.\n\nWhich hardening measure should the IT team implement to mitigate this risk?", "options": {"A": "Use a dedicated machine as a web server", "B": "Block all unnecessary ports, ICMP traffic, and protocols", "C": "Eliminate unnecessary files", "D": "Conduct risk assessment for patching"}, "answer": "B"}, {"num": 72, "text": "You’ve recently been hired as a cybersecurity intern for a growing tech startup.\nDuring your onboarding, the company’s chief information security officer (CISO\nexplains the various types of hackers you need to be aware of as part of your\nrole. The term “script kiddie” comes up during this discussion.\n\nBased on your CEH v12 study material, which of the following descriptions best\ndefines a script kiddie?", "options": {"A": "A hacker who writes their own complex scripts and exploits them to carry out attacks.", "B": "A hacker who uses pre-existing scripts and tools to carry out attacks without fully\nunderstanding how they work.", "C": "A young hacker who is still learning the basics of ethical hacking and cybersecurity.", "D": "A hacker who only targets systems that use JavaScript and similar scripting languages."}, "answer": "B"}, {"num": 335, "text": "Sarah, a cybersecurity analyst at a US-based e-commerce company in New York,\nis tasked with evaluating the company’s transition to a cloud-based\ninfrastructure to support its growing online platform. The company aims to\noptimize resource allocation to handle fluctuating customer demand during\npeak shopping seasons, such as Black Friday. Sarah must recommend a key\ncharacteristic of cloud computing that ensures resources are efficiently shared\nacross multiple users while maintaining scalability.\n\nWhich cloud computing characteristic should Sarah recommend ensuring\nefficient resource sharing and scalability for the e-commerce platform?", "options": {"A": "Measured service", "B": "Broad network access", "C": "Resource pooling", "D": "On-demand self-service"}, "answer": "C"}, {"num": 434, "text": "You are Riley, an incident responder at NovaEx Crypto in San Antonio, Texas,\ntasked with investigating a recent double-spend reported by a retail merchant\nthat accepts the exchange’s token. Your telemetry shows that a reseller node\nused by the merchant received blocks only from a small, fixed set of peers for\nseveral hours and accepted a conflicting history that later allowed the attacker\nto reverse a confirmed payment. The attacker appears to have controlled which\npeers that node communicated with and supplied it a private chain until they\nwere ready to reveal it.\n\nWhich blockchain attack does this behavior most closely describe?", "options": {"A": "DeFi Sandwich Attack", "B": "Finney Attack", "C": "51% Attack", "D": "Eclipse Attack"}, "answer": "D"}, {"num": 503, "text": "A defense contractor in Arlington, Virginia, initiated an internal awareness\nexercise to test employee susceptibility to human-based manipulation. During\nthe assessment, an individual posing as an external recruitment consultant\nbegan casually engaging several engineers at a nearby industry networking\nevent. Over multiple conversations, the individual gradually steered discussions\ntoward current research initiatives, development timelines, and internal project\ncode names. No direct requests for credentials or system access were made.\nInstead, the information was obtained incrementally through carefully crafted\nquestions embedded within informal dialogue. Which social engineering\ntechnique is most accurately demonstrated in this scenario?", "options": {"A": "Quid Pro Quo", "B": "Baiting", "C": "Elicitation", "D": "Honey Trap"}, "answer": "C"}, {"num": 464, "text": "In the financial hub of Charlotte, North Carolina, ethical hacker Raj Patel is\ncontracted by TrustBank, a regional U.S. bank, to evaluate their online loan\napplication portal. During testing, Raj submits crafted input into the portal’s\nform fields and notices that the server’s HTTP responses are unexpectedly\naltered. His payloads cause additional headers to appear and even inject\nunintended content into the output, creating opportunities for attackers to\nmanipulate web page behavior and deliver malicious data to users. Which type\nof vulnerability is Raj most likely exploiting in TrustBank’s online loan\napplication portal?", "options": {"A": "Server-Side Request Forgery (SSRF)", "B": "XML External Entity (XXE) Injection", "C": "HTTP Response Splitting", "D": "XML Poisoning"}, "answer": "C"}, {"num": 43, "text": "During a routine security audit at a large financial services organization, the IT\nteam detects severe network latency and recurring bandwidth exhaustion\nacross its corporate WAN links. Upon deeper investigation, they discover that\nseveral employee workstations and IoT-connected devices are unknowingly\ntransmitting enormous volumes of traffic to numerous external IP addresses.\nThese devices, all exhibiting similar traffic patterns and command-response\nbehaviors, are found to be under the control of a remote botnet operator. The\nincident raises serious concerns about insider-originated denial-of-service\nactivity that is also affecting external entities.\n\nWhich type of denial-of-service attack best describes the organization’s current\nsituation?", "options": {"A": "An attack where botnets directly send large volumes of traffic to the target without spoofing\nintermediary services.", "B": "An attack where compromised internal devices participate in a botnet and flood external\ntargets with traffic.", "C": "An attack that relies on spoofed IP addresses to trick external servers into flooding the\nvictim.", "D": "An attack that originates internally and amplifies traffic through spoofed DNS responses to\ntarget systems."}, "answer": "B"}, {"num": 419, "text": "During a penetration test at Greenview Credit Union in Chicago, Illinois, ethical\nhacker Rebecca Hayes simulates an attacker who contacts employees using a\nvoice channel. The number displayed on their devices appears identical to the\ninstitution’s official line, convincing staff that the request is legitimate. Rebecca\nthen asks for account credentials under the pretense of a mandatory security\ncheck.\n\nWhich mobile attack vector is she demonstrating?", "options": {"A": "Call Spoofing", "B": "SMiShing", "C": "OTP Hijacking", "D": "Bluebugging"}, "answer": "A"}, {"num": 321, "text": "Lily, a network security analyst at a regional healthcare provider, is preparing\ndefenses ahead of a scheduled external vulnerability assessment. During\ninternal simulation drills, she observes that scanners are successfully\nidentifying open ports and service banners across critical systems. Tasked with\nreducing exposure to such reconnaissance efforts, Lily is instructed to apply\nmeasures that specifically hinder port scanning activity without disrupting\nlegitimate traffic.\n\nWhich of the following actions should Lily implement?", "options": {"A": "Block unwanted services running on the ports and update the service versions", "B": "Use a custom rule set to lock down the network, block unwanted ports at the firewall, and\nfilter specific ports", "C": "Configure firewall and IDS rules to detect and block probes", "D": "Block inbound ICMP message types and all outbound ICMP type-3 unreachable messages"}, "answer": "D"}, {"num": 215, "text": "A penetration tester is tasked with uncovering historical content from a\ncompany’s website, including previously exposed login portals or sensitive\ninternal pages. Direct interaction with the live site is prohibited due to strict\nmonitoring policies. To stay undetected, the tester decides to explore\npreviously indexed snapshots of the organization’s web content saved by\nexternal sources.\n\nWhich approach would most effectively support this passive information-\ngathering objective?", "options": {"A": "Apply the cache: operator to view Google’s stored versions of target pages.", "B": "Use the intitle: login operator to list current login pages.", "C": "Search with intext: “login” site:target.com to retrieve login data.", "D": "Use the link: operator to find backlinks to login portals."}, "answer": "A"}, {"num": 460, "text": "During a penetration test at a retail company in Seattle, Washington, an ethical\nhacker needs to disguise her scans so they appear to originate from a specific\nhardware vendor. The organization uses MAC-based logging, and by assigning a\nvendor-associated identifier, she can make her traffic blend in with legitimate\ndevices on the network. Which Nmap command should she use to achieve this?", "options": {"A": "nmap -sT -Pn --spoof-mac Dell 10.10.1.11", "B": "nmap -sT -Pn --spoof-mac 0 10.10.1.11", "C": "nmap -sT -Pn --spoof-mac 00:11:22 10.10.1.11", "D": "nmap -sT -Pn --spoof-mac 00:01:02:25:56:AE 10.10.1.11"}, "answer": "A"}, {"num": 483, "text": "While conducting a red team exercise at a corporate office in San Diego,\nCalifornia, you observe employees working in an open-plan area. By discreetly\nwatching their screens and hand movements as they log into internal systems,\nyou are able to capture several usernames and partial passwords without\ntouching any devices or interacting with the staff. Which social engineering\ntechnique does this scenario best illustrate?", "options": {"A": "Impersonation", "B": "Shoulder Surfing", "C": "Dumpster Diving", "D": "Tailgating"}, "answer": "B"}, {"num": 408, "text": "During a penetration test at Pacific Trust Bank in Seattle, ethical hacker Mia\nChen suspects that a server hosting customer transaction data may be a\nhoneypot. To investigate, she repeatedly sends crafted queries and observes\nhow quickly the system responds. She notices that responses are consistently\nfaster and more uniform than those of other production servers, raising her\nsuspicion that the environment is designed to lure attackers.\n\nWhich technique is Mia most likely using to determine if the server is a\nhoneypot?", "options": {"A": "Fingerprinting the Running Service", "B": "Analyzing System Configuration and Metadata", "C": "Analyzing MAC Address", "D": "Analyzing Response Time"}, "answer": "D"}, {"num": 470, "text": "During a red team assessment at a banking client in Chicago, ethical hacker\nDavid gains access to the internal LAN. He sets up a test machine and injects\ncrafted messages into the network. Soon, all traffic between a finance\nworkstation and the authentication server is silently routed through his system\nwithout changing switch configurations. He observes usernames and passwords\npassing through his interface, even though no proxy or VPN is in use.\n\nWhich sniffing technique did David most likely use?", "options": {"A": "Switch Port Stealing", "B": "ARP Spoofing", "C": "STP Attack", "D": "IRDP Spoofing"}, "answer": "B"}, {"num": 331, "text": "As part of a passive reconnaissance engagement for a university research\nnetwork, you’re asked to map potential administrative exposure points\nacross .edu domains. You aim to identify pages that might allow privileged\nbackend access such as misconfigured interfaces using only publicly indexed\ninformation. To ensure efficiency and compliance, you decide to use Google’s\nadvanced search syntax. Your goal is to locate URLs across educational domains\nthat may contain restricted backend functionality.\n\nWhich of the following search strings would most effectively support this goal?", "options": {"A": "site:.edu filetype:pdf intitle:”admin”", "B": "intitle:”admin login” site:.edu", "C": "site:.edu inurl:admin", "D": "inanchor:”backend access” site:.edu"}, "answer": "C"}, {"num": 38, "text": "In a healthcare organization, the network security team detects unusual\nnetwork activity, indicating advanced sniffing techniques used by a potential\nattacker. Upon investigation, it’s found that the attacker exploits vulnerabilities\nin medical imaging protocols to intercept patient data. The security team must\nidentify the specific sniffing technique being used and take action to protect\npatient privacy.\n\nConsidering the scenario, which sophisticated sniffing technique poses the\ngreatest challenge for the security team, potentially compromising patient data\nsecurity?", "options": {"A": "Injecting malicious code into ultrasound machine software to capture patient records.", "B": "Creating a covert channel within hospital administrative messages for data\nexfiltration.", "C": "Manipulating radiology report formats to embed patient data within CT scan images.", "D": "Exploiting MRI machine firmware vulnerabilities to intercept real-time patient scans."}, "answer": "B"}, {"num": 102, "text": "You are a security administrator for a medium-sized company. Your manager\nhas asked you to conduct an audit of the organization’s security infrastructure.\nWhile reviewing the logs from the Intrusion Detection System (IDS, you notice\nthat there have been several instances of alerts being triggered by regular user\nactivities.\n\nWhich of the following is the most likely reason for this?", "options": {"A": "The company’s firewall is failing to filter out malicious traffic.", "B": "The IDS is outdated and needs to be updated with the latest patches.", "C": "The IDS is configured with very high sensitivity settings, leading to many false\npositives.", "D": "Regular users are unintentionally triggering security protocols."}, "answer": "C"}, {"num": 182, "text": "What is the main difference between ethical hacking and malicious hacking?", "options": {"A": "Ethical hackers use different tools than malicious hackers", "B": "Ethical hacking is illegal, while malicious hacking is legal", "C": "Ethical hacking is performed with permission, while malicious hacking is unauthorized", "D": "Ethical hackers always work alone, while malicious hackers work in teams"}, "answer": "C"}, {"num": 34, "text": "As a cybersecurity analyst at a renowned software corporation, you’ve noticed\nsome peculiar activity. The company’s internal network has seen a sudden\nincrease in redundant network traffic and system crashes. Initial scans have\nfound that most affected systems run a particular version of the operating\nsystem, and the identified malicious code seems to be self-replicating and\nspreading across the network autonomously.\n\nConsidering the following malware types, which would you identify as the\nprobable cause of this anomalous behavior? Furthermore, how would you\nprioritize your response to counteract this malware threat and alleviate the\nsystem disruptions?", "options": {"A": "Trojan: Initiate a thorough network scan with updated anti-malware tools, isolate the\naffected systems, and patch all the systems with the latest updates.", "B": "Ransomware: Advise users to disconnect their systems from the network, back up vital data,\nand utilize a reputable decryption tool to regain access.", "C": "Worm: Quarantine the affected systems, perform an immediate network-wide sweep with\nthe latest antivirus definitions, and update the operating system on all network systems.", "D": "Rootkit: Recommend a system reboot in safe mode, followed by deployment of an advanced\nrootkit scanner and subsequent patching of the systems."}, "answer": "C"}, {"num": 170, "text": "A penetration tester is trying to attack a wireless network that uses WPA3\nencryption. The tester wants to exploit the handshake to obtain the password\nbut realizes WPA3 has stronger protections.\n\nWhat would be the most effective approach to compromise the network?", "options": {"A": "Perform a brute-force attack directly on the WPA3 handshake", "B": "Execute a dictionary attack on the WPA3 handshake using common passwords", "C": "Perform a SQL injection attack on the router’s login page", "D": "Downgrade the connection to WPA2 and capture the handshake to crack the key"}, "answer": "D"}, {"num": 453, "text": "As part of a cybersecurity assessment for a healthcare provider in Denver,\nColorado, you are asked to recommend a framework that addresses how\norganizations should identify, assess, and treat information security risks as\npart of their ISMS. Which international standard best meets this requirement?", "options": {"A": "ISO/IEC 27002:2022", "B": "ISO/IEC 27701:2019", "C": "ISO/IEC 27005:2022", "D": "ISO/IEC 27001:2022"}, "answer": "C"}, {"num": 21, "text": "A multinational company is planning to integrate an IoT-based environmental\ncontrol system for its manufacturing units worldwide. They engage a\ncybersecurity team to ensure that the new system remains secure from any\npotential threats. The cybersecurity team is tasked with identifying the most\nlikely method an advanced persistent threat (APT group might use to\ncompromise the new IoT-based environmental control system.\n\nWhat is the most plausible attack vector?", "options": {"A": "The APT group will exploit zero-day vulnerabilities present in the IoT device firmware.", "B": "The APT group will perform an encryption-based Man-in-the-Middle attack between the IoT\ndevices and the control server.", "C": "The APT group will execute a DDoS attack to overload the network and gain control over the\nIoT devices.", "D": "The APT group will infiltrate the network using compromised user credentials."}, "answer": "A"}, {"num": 221, "text": "A penetration tester is assessing a web application that employs secure, HTTP-\nonly cookies, regenerates session IDs upon login and uses strict session\ntimeout policies.\n\nTo hijack a user’s session without triggering the application's security defenses,\nwhich advanced technique should the tester utilize?", "options": {"A": "Execute a Cross-Site Request Forgery (CSRF) attack to manipulate session states", "B": "Implement a session fixation strategy by pre-setting a session ID before user\nauthentication", "C": "Conduct a network-level man-in-the-middle attack to intercept and reuse session tokens", "D": "Perform a session token prediction by analyzing session ID entropy and patterns"}, "answer": "C"}, {"num": 212, "text": "An attacker extracts the initial bytes from an encrypted file container and uses a\ntool to iterate through numeric combinations.\n\nWhat type of cryptanalytic technique is being utilized?", "options": {"A": "Force encryption key through quantum solving", "B": "Seek identical digests across hash outputs", "C": "Test every possible password through automation", "D": "Analyze output length to spot anomalies"}, "answer": "C"}, {"num": 420, "text": "During a stealth penetration test at a defense research facility, ethical hacker\nDaniel installs a payload that survives even after multiple operating system\nreinstalls. The implant resides deep inside the system hardware and executes\nbefore the OS is loaded, ensuring that forensic scans and antivirus tools at the\nOS level cannot detect or remove it. Administrators notice unusual activity on\nnetwork cards and storage devices, but repeated scans show no malware traces\nwithin the file system. Which type of rootkit most likely enabled this level of\npersistence?", "options": {"A": "Hypervisor-Level Rootkit", "B": "Hardware/Firmware Rootkit", "C": "Kernel-Level Rootkit", "D": "Boot-Loader-Level Rootkit"}, "answer": "B"}, {"num": 225, "text": "A penetration tester finds that a web application does not properly validate\nuser input and is vulnerable to reflected Cross-Site Scripting (XSS.\n\nWhat is the most appropriate approach to exploit this vulnerability?", "options": {"A": "Embed a malicious script in a URL and tricked a user into clicking the link", "B": "Use directory traversal to access sensitive files on the server", "C": "Perform a brute-force attack on the user login form to steal credentials", "D": "Inject a SQL query into the search form to attempt SQL injection"}, "answer": "A"}, {"num": 451, "text": "You are an ethical hacker at HorizonSec Consulting, hired by Liberty Insurance\nin Philadelphia, Pennsylvania, to test the resilience of their online claim\nsubmission portal. During testing, you modify the claim ID parameter in the URL\nwith conditions such as AND 1=1 and AND 1=2. When the first condition is used,\nthe portal displays claim details as normal; when the second condition is used,\nthe page displays no results. You repeat this process to determine how the\napplication responds to true and false conditions without error messages or\ndelays.\n\nBased on the observed behavior, which SQL injection technique are you\nemploying?", "options": {"A": "Time-based Blind SQL Injection", "B": "Boolean Exploitation", "C": "Error-based SQL Injection", "D": "UNION SQL Injection"}, "answer": "B"}, {"num": 465, "text": "During a code review at a defense technology contractor in Virginia, penetration\ntester Lucas identifies that a newly deployed payroll application encrypts\nsensitive employee data using a weak custom algorithm. In addition, its session\nvalidation logic allows certain requests to bypass access controls altogether.\nThese oversights are traced back to flawed system logic and poor encryption\ndesign decisions made during the development phase.\n\nWhich vulnerability category BEST describes the issue Lucas discovered?", "options": {"A": "Application Flaws", "B": "Design Flaws", "C": "Poor Patch Management", "D": "Misconfigurations/Weak Configurations"}, "answer": "B"}, {"num": 42, "text": "A cybersecurity analyst notices that a large number of plaintext-ciphertext pairs\nwere used in an attempted attack against a block cipher. The attacker applied\nstatistical analysis to XOR combinations of specific plaintext and ciphertext bits.\n\nWhich techniq
