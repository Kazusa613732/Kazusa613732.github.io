r\nseveral hours and accepted a conflicting history that later allowed the attacker\nto reverse a confirmed payment. The attacker appears to have controlled which\npeers that node communicated with and supplied it a private chain until they\n\nwere ready to reveal it.\n\nWhich blockchain attack does this behavior most closely describe?", "options": {"A": "DeFi Sandwich Attack", "B": "Finney Attack", "C": "51% Attack", "D": "Eclipse Attack"}, "answer": "D"}, {"num": 435, "text": "During a penetration test for a U.S.-based retail company, John gains access to a\nsecondary server that responds unusually to structured queries. By sending a\nspecially crafted request, he receives a full list of subdomains, MX records, and\naliases belonging to the target organization. The response exposes sensitive\ninternal mappings that could be leveraged for further attacks.\n\nWhich tool was MOST likely used to perform this enumeration?", "options": {"A": "dig @ axfr", "B": "nbtstat -A", "C": "ldapsearch -h -x", "D": "smtp-user-enum.pl -u user -t host"}, "answer": "A"}, {"num": 436, "text": "You are a wireless auditor at SeaFront Labs in San Diego, California, engaged to\nreview the radio-layer protections used by a biotech research facility. While\ncapturing traffic in monitor mode, you observe frames that include a CCMP-like\nheader and AES-based encryption, and you note the use of a four-way\nhandshake with a packet number (PN) for replay protection – features that were\nintroduced to replace older TKIP/RC4 approaches. Based on these observed\ncharacteristics, which wireless encryption protocol is the access point most\nlikely using?", "options": {"A": "WPA2", "B": "WPA", "C": "WEP", "D": "WPA3"}, "answer": "A"}, {"num": 437, "text": "During a red team engagement at a law firm in Dallas, ethical hacker Sarah\n\nconnects a compromised workstation to a core switch. Within minutes, the\nswitch begins experiencing instability, and multiple VLANs report traffic leakage\nacross isolated departments. Sarah observes that her machine is now receiving\npackets not originally destined for it, giving her visibility into multiple active\nsessions. Logs show the switch’s CAM table was overwhelmed during the attack.\n\nWhich sniffing technique did Sarah most likely use?", "options": {"A": "ARP Poisoning", "B": "MAC Flooding", "C": "VLAN Hopping", "D": "DNS Poisoning"}, "answer": "B"}, {"num": 438, "text": "At Apex Financial Services in Houston, Texas, ethical hacker Javier Ruiz\nevaluates mobile security practices under the company’s BYOD policy. He\ndemonstrates that employees often install applications that request access to\ncontact lists, cameras, and messaging services, even though these functions are\nunrelated to the apps’ intended purpose. This behavior allows a malicious\nprogram to harvest sensitive corporate information. Which security guideline\nwould most directly prevent this issue?", "options": {"A": "Review permissions requested by apps before installing them", "B": "Use encryption mechanisms to store data", "C": "Set passwords for apps to restrict others from accessing them", "D": "Enforce automatic device locking or implement biometric authentication"}, "answer": "A"}, {"num": 439, "text": "During a red team engagement at a technology startup in Austin, ethical hacker\nPriya simulates an internal attacker by connecting a laptop to the corporate\nLAN. Within minutes, nearby workstations begin receiving incorrect network\nsettings such as altered gateways and DNS servers. Employees trying to access\nthe intranet are redirected to fake login portals hosted on Priya’s machine.\nSecurity tools record temporary IP conflicts, but no alerts are triggered against\nthe altered traffic paths.\n\nWhich attack technique did Priya most likely use?", "options": {"A": "Rogue DHCP Server Attack", "B": "DNS Cache Poisoning", "C": "Packet Sniffing", "D": "DHCP Starvation Attack"}, "answer": "A"}, {"num": 440, "text": "During a red team simulation at a bank in Chicago, Illinois, the SOC team\n\nsuspects that some of the incoming traffic may be spoofed. To verify this, an\nanalyst begins monitoring the sequence values assigned to packets, looking for\nirregularities that indicate they were not generated by the legitimate source.\nWhich spoofing detection technique is the analyst using?", "options": {"A": "TCP Flow Control Method", "B": "Direct TTL Probes", "C": "IP Identification Number (IPID) Monitoring", "D": "Packet Filtering"}, "answer": "C"}, {"num": 441, "text": "During a penetration test at Cascade Biotech in Portland, Oregon, ethical hacker\nOlivia Harper installs a monitoring agent on a single test workstation inside the\nresearch subnet. The system records local events such as file access,\nconfiguration changes, and unauthorized process execution. Olivia explains to\nthe security team that attackers often attempt to disable or evade this type of\nmonitoring to avoid being detected at the host level.\n\nWhich security system is Olivia most likely demonstrating?", "options": {"A": "Network-Based Intrusion Detection System", "B": "Network-Based Firewall", "C": "Host-Based Intrusion Detection System", "D": "Host-Based Firewall"}, "answer": "C"}, {"num": 442, "text": "During a red team assessment at Sunshine Credit Union in Miami, ethical hacker\nLaura demonstrates a weakness in the company’s session handling process. She\nshows that once a user logs in, the same authentication token assigned before\nlogin continues to be valid without being refreshed. Laura explains that an\nattacker could exploit this flaw by tricking a victim into authenticating with a\nvalue already known to the attacker, gaining access afterward. To mitigate this\nrisk, the IT team agrees to apply a countermeasure focused on proper session\nlifecycle management.\n\nWhich countermeasure should the IT team implement?", "options": {"A": "Regenerate the session ID after a successful login to prevent session fixation attacks", "B": "Do not create sessions for unauthenticated users unless necessary", "C": "Use restrictive cache directives for all the web traffic through HTTP and HTTPS", "D": "Implement SSL to encrypt all information in transit via the network"}, "answer": "A"}, {"num": 443, "text": "You are a security analyst at Sentinel Cyber Group, monitoring the web portal of\nAspen Valley Bank in Salt Lake City, Utah. During log review, you notice repeated\nattempts by attackers to inject malicious strings into the login fields. However,\ndespite these attempts, the application executes queries safely without altering\n\ntheir logic, since user inputs are kept separate from the SQL statements and\nbound as fixed values before execution. Based on the observed defense\n\nmechanism, which SQL injection countermeasure is the application employing?", "options": {"A": "Perform user input validation", "B": "Encoding the single quote", "C": "Use parameterized queries or prepared statements", "D": "Restrict database access"}, "answer": "C"}, {"num": 444, "text": "A financial institution in San Francisco suffers a breach where attackers install\nmalware that captures customer account credentials. The stolen data is then\nsold on underground forums for profit. No political or social statements are\nmade, and the attackers remain anonymous while continuing to target similar\norganizations for financial gain. Based on this activity, what category of hacker\nis most likely responsible?", "options": {"A": "Black Hat hackers", "B": "Hacktivists", "C": "Script Kiddies", "D": "White Hat hackers"}, "answer": "A"}, {"num": 445, "text": "In the vibrant startup scene of Austin, Texas, ethical hacker Daniel Ruiz is hired\n\nby TechNexus, a U.S.-based logistics software provider, to evaluate their internal\nadministration portal. During testing, Daniel observes that certain input fields\nforward user-supplied data directly to underlying system functions. By carefully\ncrafting his entries, he is able to trigger execution of unexpected system\ncommands, resulting in unauthorized control over the operating environment.\nHis findings reveal that the flaw stems from poor validation of input processed\nby system-level functions.", "options": {"A": "Cross-Site Scripting (XSS)", "B": "LDAP Injection", "C": "SQL Injection", "D": "Shell Injection"}, "answer": "D"}, {"num": 446, "text": "During a red team assessment at New England Insurance in Boston, ethical\nhacker Daniel sends a series of spoofed TCP packets carrying the reset flag to a\nserver hosting client applications. As a result, several active sessions between\n\nemployees and the server are abruptly terminated, causing temporary\ndisruption of legitimate work. Daniel uses this demonstration to highlight how\nattackers can forcibly tear down sessions without completing a full hijack.\nWhich type of network-level session hijacking technique is Daniel simulating?", "options": {"A": "RST Hijacking", "B": "UDP Hijacking", "C": "Blind Hijacking", "D": "TCP/IP Hijacking"}, "answer": "A"}, {"num": 447, "text": "At a financial headquarters in Denver, Colorado, ethical hacker Jordan Lee\nmoves beyond cataloging IoT devices and begins testing them for weaknesses.\nHe runs specialized tools against smart lighting and HVAC systems to check for\noutdated firmware, default passwords, and open service ports. Which step of\nthe IoT hacking methodology is Jordan carrying out?", "options": {"A": "Gain remote access", "B": "Information gathering", "C": "Launch attacks", "D": "Vulnerability scanning"}, "answer": "D"}, {"num": 448, "text": "During a penetration test at Sunshine Media’s streaming platform in Miami,\n\nethical hacker Sofia Alvarez examines whether the company’s web server\n\nexposes sensitive resources through poor configuration. She finds that a crawler\ndirective at the server’s root allows unintended indexing of restricted areas.\nThis oversight reveals internal paths that may expose hidden links, confidential\nfiles, or other sensitive information. Which technique is Sofia most likely using\nin this assessment?", "options": {"A": "Directory Brute Forcing", "B": "Information Gathering from Robots.txt File", "C": "Vulnerability Scanning", "D": "Web Server Footprinting/Banner Grabbing"}, "answer": "B"}, {"num": 449, "text": "During a red team engagement at a manufacturing company in Dallas,\npenetration tester Tyler gains access to a Windows workstation. Later in the\nexercise, he reviews his exfiltrated logs and finds detailed records of employee\n\nlogins, email drafts, and sensitive data entered into desktop applications. The\ncollection occurred without requiring browser injection or physical device\naccess, and no kernel drivers were installed. Which type of keylogger did Tyler\nmost likely deploy?", "options": {"A": "JavaScript Keylogger", "B": "Hardware Keylogger", "C": "Kernel Keylogger", "D": "Application Keylogger"}, "answer": "D"}, {"num": 450, "text": "At a Los Angeles-based online gaming company, penetration tester John\ninvestigates a recent cloud breach that caused downtime and delayed alerts. He\nfinds that the root issue was management’s lack of defined responsibilities for\nmonitoring, auditing, and securing serverless services, which left critical\nfunctions unmanaged. Which cloud computing threat does this scenario best\nillustrate?", "options": {"A": "Privilege escalation", "B": "Insufficient logging and monitoring", "C": "Side-channel attacks", "D": "Loss of governance"}, "answer": "D"}, {"num": 451, "text": "You are an ethical hacker at HorizonSec Consulting, hired by Liberty Insurance\n\nin Philadelphia, Pennsylvania, to test the resilience of their online claim\nsubmission portal. During testing, you modify the claim ID parameter in the URL\nwith conditions such as AND 1=1 and AND 1=2. When the first condition is used,\nthe portal displays claim details as normal; when the second condition is used,\nthe page displays no results. You repeat this process to determine how the\napplication responds to true and false conditions without error messages or\ndelays.\n\nBased on the observed behavior, which SQL injection technique are you\nemploying?", "options": {"A": "Time-based Blind SQL Injection", "B": "Boolean Exploitation", "C": "Error-based SQL Injection", "D": "UNION SQL Injection"}, "answer": "B"}, {"num": 452, "text": "During a simulated attack against a university’s IT network in California, ethical\nhacker Sophia deploys custom malicious code onto one lab workstation.\nWithout requiring further user interaction, she observes the malware\nautomatically copying itself into shared folders and spreading through weak\nadmin credentials. Within a short time, dozens of computers across multiple\ndepartments are infected with the same payload, even though only one\n\nmachine was initially targeted. Which type of malware is Sophia most likely\ndemonstrating?", "options": {"A": "Logic Bomb", "B": "Worm", "C": "Backdoor", "D": "Fileless Malware"}, "answer": "B"}, {"num": 453, "text": "As part of a cybersecurity assessment for a healthcare provider in Denver,\nColorado, you are asked to recommend a framework that addresses how\norganizations should identify, assess, and treat information security risks as\npart of their ISMS. Which international standard best meets this requirement?", "options": {"A": "ISO/IEC 27002:2022", "B": "ISO/IEC 27701:2019", "C": "ISO/IEC 27005:2022", "D": "ISO/IEC 27001:2022"}, "answer": "C"}, {"num": 454, "text": "You are Alex, a forensic responder at HarborHealth in Seattle, Washington.\nDuring a live incident response you must secure an enterprise Windows server’s\n\nsystem partition and attached data volumes without rebooting user machines\n\nor disrupting domain authentication. The IT team prefers a solution that\nintegrates with Windows platform features (including hardware-backed startup\nprotection and centralized key escrow via Active Directory/management\npolicies) and provides transparent full-disk protection for the OS volume. Which\ndisk-encryption solution should you deploy?", "options": {"A": "FileVault", "B": "VeraCrypt", "C": "BitLocker Drive Encryption", "D": "Rohos Disk Encryption"}, "answer": "C"}, {"num": 455, "text": "You are an ethical hacker at Sentinel Cyberworks, engaged to assess the\nwireless defenses of HarborTrust Bank in Portland, Oregon. During your\nassessment the security team shows you a production system that continuously\n\nplaces selected APs into a passive scan mode, aggregates alarms from multiple\nwireless controllers into a central engine for forensic storage, and can\nautomatically apply countermeasures (for example, time-sliced channel\nscanning and remote configuration changes) across the campus when it\nclassifies a nearby device as malicious. Based on the described capabilities,\n\nwhich Wi-Fi security solution is this most consistent with?", "options": {"A": "WatchGuard Wi-Fi Cloud WIPS", "B": "RFProtect", "C": "Cisco Adaptive Wireless IPS", "D": "Fern WiFi Cracker"}, "answer": "C"}, {"num": 456, "text": "In Pittsburgh, Pennsylvania, a major steel manufacturer operates a production\nplant with numerous automated loops that regulate temperature, pressure, and\nconveyor speed. During an audit, ethical hacker Marcus Reed observes that\nthese loops are coordinated by a centralized supervisory network that links\nmultiple controllers across the facility. Based on this design, which OT system\nconcept is being applied?", "options": {"A": "Distributed Control System (DCS)", "B": "Manual loop", "C": "Open loop", "D": "Closed loop"}, "answer": "A"}, {"num": 457, "text": "You are Jordan, a cryptographic assessor at Cascade Data in Portland, Oregon,\n\nreviewing the protection applied to telemetry logs. Your review finds an\nalgorithm that operates on 128-bit blocks, accepts keys up to 256 bits, and the\ndocumentation notes it was one of the finalists in the AES selection process\nthat aimed to replace legacy DES. Which symmetric encryption algorithm should\nyou identify as being used?", "options": {"A": "Blowfish", "B": "RC4", "C": "AES", "D": "Twofish"}, "answer": "C"}, {"num": 458, "text": "You are performing a security audit for a regional hospital in Dallas, Texas.\nWhile monitoring the network, you discover that an unknown actor has been\nsilently capturing clear-text credentials and analyzing unencrypted traffic\n\nflowing across the internal Wi-Fi network. No modifications have been made to\nthe data, and the attack remained undetected until your assessment. Based on\nthis activity, what type of attack is most likely being conducted?", "options": {"A": "Passive attack", "B": "Close-in attack", "C": "Distribution attack", "D": "Insider attack"}, "answer": "A"}, {"num": 459, "text": "During a red team assessment at a retail bank in New York, ethical hacker Aisha\nlaunches a flood of TCP connection initiation packets against the bank’s online\nportal. The target accepts each initial handshake packet but never receives the\nfinal ACK to complete the three-way handshake, exhausting the server’s backlog\nof half-open connections and preventing legitimate users from establishing new\nsessions.\n\nWhich type of DoS attack is Aisha most likely simulating?", "options": {"A": "TCP SACK Panic", "B": "RST Attack", "C": "ACK Flood", "D": "SYN Flood Attack"}, "answer": "D"}, {"num": 460, "text": "During a penetration test at a retail company in Seattle, Washington, an ethical\nhacker needs to disguise her scans so they appear to originate from a specific\nhardware vendor. The organization uses MAC-based logging, and by assigning a\nvendor-associated identifier, she can make her traffic blend in with legitimate\ndevices on the network. Which Nmap command should she use to achieve this?", "options": {"A": "nmap -sT -Pn --spoof-mac Dell 10.10.1.11", "B": "nmap -sT -Pn --spoof-mac 0 10.10.1.11", "C": "nmap -sT -Pn --spoof-mac 00:11:22 10.10.1.11", "D": "nmap -sT -Pn --spoof-mac 00:01:02:25:56:AE 10.10.1.11"}, "answer": "A"}, {"num": 461, "text": "During an internal red team engagement at a software company in Boston,\nethical hacker Meera gains access to a developer’s workstation. To ensure long-\nterm persistence, she plants a lightweight binary in a hidden directory and\n\nconfigures it to automatically launch every time the system is restarted. Days\nlater, even after the host was rebooted during patching, the binary executed\nagain without requiring user interaction, giving Meera continued access.\nWhich technique most likely enabled this persistence?", "options": {"A": "creating a new service", "B": "Startup Folder", "C": "Registry run keys", "D": "Scheduled Tasks"}, "answer": "D"}, {"num": 462, "text": "During a penetration test at a healthcare facility in Baltimore, Maryland, an\nethical hacker demonstrates how attackers are mapping active hosts and open\nports using ICMP-based techniques. To reduce the organization’s exposure, the\nsecurity team decides to implement a countermeasure that specifically disrupts\nICMP discovery traffic by preventing error messages from being returned. Which\naction should they take?", "options": {"A": "Use a custom rule set to lock down the network, block unwanted ports at the firewall, and filter specific ports", "B": "Configure firewall and IDS rules to detect and block probes", "C": "Block unwanted services running on the ports and update the service versions", "D": "Block inbound ICMP message types and all outbound ICMP type-3 unreachable messages"}, "answer": "D"}, {"num": 463, "text": "In the crisp mountain air of Denver, Colorado, ethical hacker Lila Chen\ninvestigates the security framework of MediVault, a U.S.-based healthcare\nplatform used by regional clinics to manage patient data. During her review, Lila\ndiscovers that sensitive records are weakly protected, allowing attackers to\nintercept and manipulate the information in transit. She warns that such\nweaknesses could be exploited to commit credit-card fraud, identity theft, or\nsimilar crimes. Further analysis reveals that MediVault is vulnerable to well-\ndocumented flaws such as cookie snooping and downgrade attacks.", "options": {"A": "Broken Access Control", "B": "Security Misconfiguration", "C": "Identification and Authentication Failures", "D": "Cryptographic Failures"}, "answer": "D"}, {"num": 464, "text": "In the financial hub of Charlotte, North Carolina, ethical hacker Raj Patel is\n\ncontracted by TrustBank, a regional U.S. bank, to evaluate their online loan\napplication portal. During testing, Raj submits crafted input into the portal’s\nform fields and notices that the server’s HTTP responses are unexpectedly\naltered. His payloads cause additional headers to appear and even inject\nunintended content into the output, creating opportunities for attackers to\nmanipulate web page behavior and deliver malicious data to users. Which type\n\nof vulnerability is Raj most likely exploiting in TrustBank’s online loan\napplication portal?", "options": {"A": "Server-Side Request Forgery (SSRF)", "B": "XML External Entity (XXE) Injection", "C": "HTTP Response Splitting", "D": "XML Poisoning"}, "answer": "C"}, {"num": 465, "text": "During a code review at a defense technology contractor in Virginia, penetration\ntester Lucas identifies that a newly deployed payroll application encrypts\nsensitive employee data using a weak custom algorithm. In addition, its session\nvalidation logic allows certain requests to bypass access controls altogether.\nThese oversights are traced back to flawed system logic and poor encryption\ndesign decisions made during the development phase.\n\nWhich vulnerability category BEST describes the issue Lucas discovered?", "options": {"A": "Application Flaws", "B": "Design Flaws", "C": "Poor Patch Management", "D": "Misconfigurations/Weak Configurations"}, "answer": "B"}, {"num": 466, "text": "In sunny San Diego, California, security consultant Maya Ortiz is engaged by\nPacificGrid, a regional utilities provider, to analyze suspicious access patterns\non their employee portal. While reviewing authentication logs, Maya notices\nmany accounts each receive only a few login attempts before the attacker\nmoves on to other targets; the attempts reuse a very small set of likely\ncredentials across a large number of accounts and are spread out over several\ndays and IP ranges to avoid triggering automated lockouts. Several low-\nprivilege accounts were successfully accessed before the pattern was detected.\nMaya prepares a forensic timeline to help PacificGrid contain the incident.", "options": {"A": "Cross-Site Request Forgery (CSRF)", "B": "Session Hijacking", "C": "Password Spraying", "D": "Brute Force Attack"}, "answer": "C"}, {"num": 467, "text": "During a red team assessment at a university in Chicago, Jake, a penetration\ntester, scans a group of older Windows workstations in the administration\ndepartment. On several hosts, he notices traffic on UDP ports 137 and 138 as\nwell as an open TCP port 139. Curious, he uses a utility to query the name table\nand session services. Within moments, he collects information including\nmachine names, logged-in usernames, and available shared folders without\n\nauthentication.\n\nWhich enumeration method is being demonstrated in this scenario?", "options": {"A": "SMB Enumeration", "B": "NetBIOS Enumeration", "C": "NFS Enumeration", "D": "SNMP Enumeration"}, "answer": "B"}, {"num": 468, "text": "During a penetration test at Pacific Shipping Co. in Seattle, ethical hacker Mia\nChen evaluates the defenses protecting the company’s web-facing servers. She\nobserves that the security system is not only checking basic packet headers but\nalso validating session state and performing some application-level analysis.\nThis multilayer approach makes it more difficult for Mia to bypass the firewall\nusing simple fragmentation or tunneling attacks.\n\nWhich type of firewall is Mia most likely facing?", "options": {"A": "Stateful Multilayer Inspection Firewall", "B": "Packet Filtering Firewall", "C": "Circuit-Level Gateway Firewall", "D": "Application-Level Firewall"}, "answer": "A"}, {"num": 469, "text": "During a red team exercise at a technology consulting firm in San Francisco,\nanalyst Evelyn deploys a malicious payload disguised within a software update\ninstaller. When the target runs the installer, the main application functions\nnormally, but behind the scenes, additional malware components are silently\nplaced on the system without the user’s knowledge. These hidden components\nlater activate to establish remote access for the red team.\n\nWhich technique was most likely used to deliver the hidden malware?", "options": {"A": "Dropper", "B": "Downloader", "C": "Wrapper", "D": "Injector"}, "answer": "C"}, {"num": 470, "text": "During a red team assessment at a banking client in Chicago, ethical hacker\n\nDavid gains access to the internal LAN. He sets up a test machine and injects\ncrafted messages into the network. Soon, all traffic between a finance\nworkstation and the authentication server is silently routed through his system\nwithout changing switch configurations. He observes usernames and passwords\npassing through his interface, even though no proxy or VPN is in use.\n\nWhich sniffing technique did David most likely use?", "options": {"A": "Switch Port Stealing", "B": "ARP Spoofing", "C": "STP Attack", "D": "IRDP Spoofing"}, "answer": "B"}, {"num": 471, "text": "During a red team engagement at a healthcare organization in Chicago, ethical\nhacker Devon intercepts Kerberos authentication material from a compromised\nworkstation. Instead of cracking the data, he reuses the stolen tickets to\nauthenticate directly to other systems within the domain. This allows him to\naccess shared resources and servers without needing the users’ plaintext\ncredentials. No NTLM hashes or broadcast poisoning were involved.\n\nWhich attack technique did Devon most likely perform?", "options": {"A": "Pass-the-Hash", "B": "LLMNR/NBT-NS Poisoning", "C": "Kerberoasting", "D": "Pass-the-Ticket Attack"}, "answer": "D"}, {"num": 472, "text": "A biotech research firm in Boston, Massachusetts, migrates its laboratory\nmanagement platform to the cloud. The vendor provides an environment where\ndevelopers can deploy and test custom applications without managing the\nunderlying servers, operating systems, or storage. The firm controls the\napplication logic but not the runtime infrastructure. Which cloud service model\nis the company using?", "options": {"A": "Infrastructure as a Service (IaaS)", "B": "Anything as a Service (XaaS)", "C": "Software as a Service (SaaS)", "D": "Platform as a Service (PaaS)"}, "answer": "D"}, {"num": 473, "text": "During an external assessment of a healthcare insurance company in Houston, a\npenetration tester identifies a service running on TCP port 389. When queried,\nthe service accepts anonymous binds and reveals directory data. By structuring\n\nhis search filter, the tester is able to obtain usernames, departmental details,\nand organizational units. This information could potentially be used for\ntargeted password attacks or privilege escalation.\nWhich classification best describes this enumeration activity?", "options": {"A": "NTP Enumeration", "B": "DNS Enumeration", "C": "LDAP Enumeration", "D": "SMTP Enumeration"}, "answer": "C"}, {"num": 474, "text": "During a penetration test at an e-commerce company in Boston, ethical hacker\nSophia launches an HTTP flood against the checkout page of the site. The\nsimulated traffic consists of repeated GET and POST requests designed to\noverload application-layer resources. In response, the IT team activates a\nsecurity tool that inspects and filters malicious HTTP traffic while allowing\nlegitimate customer requests to pass, ensuring service continuity during the\nexercise. Which DoS/DDoS protection tool is most likely being used in this\nscenario?", "options": {"A": "Web Application Firewall", "B": "Firewall", "C": "Intrusion Prevention System", "D": "Load Balancer"}, "answer": "A"}, {"num": 475, "text": "During a penetration test at TechTrend Innovations in California, ethical hacker\nJake Henderson reviews the company’s web server exposure to network-based\nthreats. He finds that the server is running with multiple open services and\nprotocols that are not required for its operation, such as NetBIOS and SMB. Jake\nexplains to the IT team that attackers could exploit these unnecessary services\nto gain unauthorized access to the server.\n\nWhich hardening measure should the IT team implement to mitigate this risk?", "options": {"A": "Use a dedicated machine as a web server", "B": "Block all unnecessary ports, ICMP traffic, and protocols", "C": "Eliminate unnecessary files", "D": "Conduct risk assessment for patching"}, "answer": "B"}, {"num": 476, "text": "At a smart retail outlet in San Diego, California, ethical hacker Sophia Bennett\n\nassesses IoT-based inventory sensors that synchronize with a cloud dashboard.\nShe discovers that sensitive business records are sent across the network\nwithout encryption and are also stored in a retrievable format on the provider’s\ncloud platform. Which IoT attack surface area is most directly demonstrated in\nthis finding?", "options": {"A": "Insecure data transfer and storage", "B": "Insecure ecosystem interfaces", "C": "Insecure network services", "D": "Insecure default settings"}, "answer": "A"}, {"num": 477, "text": "During a red team exercise at Orion Tech Systems in San Jose, ethical hacker\nNadia creates a campaign of fraudulent messages targeting employees. She\nuses compromised social media accounts to distribute bulk invitations that\ncontain links to a fake cloud collaboration site. Several employees click the\nlinks and are prompted to log in with their corporate credentials, which Nadia\ncaptures. Although the lure appears to be a professional networking\nopportunity, the tactic relies on unsolicited deceptive messages delivered at\nscale.\n\nWhich social engineering threat is Nadia simulating in this campaign?", "options": {"A": "Angler Phishing", "B": "Spam and Phishing", "C": "Catfishing", "D": "Involuntary Data Leakage"}, "answer": "B"}, {"num": 478, "text": "During a penetration test at Lone Star Healthcare in Austin, ethical hacker Liam\nevaluates the hospital’s perimeter defenses by generating controlled traffic\nflows through the firewall. He uses a tool that can create and replay diverse\ntraffic patterns to test how well the firewall enforces its rules against both\nlegitimate and malicious traffic types. This allows him to demonstrate whether\nthe device properly identifies evasion attempts under simulated attack\nconditions.\n\nWhich tool is Liam most likely using in this test?", "options": {"A": "Traffic IQ Professional", "B": "Metasploit", "C": "Colasoft Packet Builder", "D": "Nmap"}, "answer": "C"}, {"num": 479, "text": "At TechTrend Innovations in Silicon Valley, network administrator Jake\nHenderson reviews the configuration of their web infrastructure. While\ninspecting the web server setup, he identifies the directory that stores the\npublicly accessible website content such as HTML files, images, and client-side\nscripts. Jake highlights this area as a frequent target for attackers, since\nimproper permissions could expose sensitive files to unauthorized users.\n\nWhich web server component is Jake analyzing in this scenario?", "options": {"A": "Application Server", "B": "Virtual Document Tree", "C": "Document Root", "D": "HTTP Server (Core)"}, "answer": "C"}, {"num": 480, "text": "At a power distribution facility in Phoenix, Arizona, ethical hacker Sameer Das is\nperforming an OT security assessment. He demonstrates that a programmable\ncontroller accepts modifications delivered over the network without checking\nthe origin or cryptographic validity of the package. By uploading altered\ninstructions, he changes how the controller processes commands during\noperations. Which IoT/OT threat best represents this technique?", "options": {"A": "Remote access using backdoor", "B": "Firmware update attack", "C": "Exploit kits", "D": "Forged malicious device"}, "answer": "B"}, {"num": 481, "text": "In the bustling city of Chicago, Illinois, ethical hacker Sophia Nguyen is\ncontracted by TaskFlow Systems, a U.S.-based project management provider, to\nreview the security of its template upload feature. During testing, Sophia\ndiscovers that by modifying the input parameters in an upload request, she can\ntrick the application into retrieving sensitive files from the server’s local\ndirectories. This flaw allows her to view internal configuration files that should\nnever be exposed through the web interface. She records her findings in a\nreport for TaskFlow’s security team.", "options": {"A": "File Injection", "B": "Cookie Poisoning", "C": "Insecure Deserialization", "D": "Local File Inclusion"}, "answer": "D"}, {"num": 482, "text": "During a social engineering simulation at BrightPath Consulting in Denver,\nethical hacker Liam emails employees a message that appears to come from the\ncompany’s security team. The email urgently warns that “all systems will shut\ndown within 24 hours” unless staff download a patch from a provided link. The\nmessage is deliberately false and contains no actual malware, but it causes\nconfusion and prompts several employees to call IT for clarification.\n\nWhich social engineering technique is Liam demonstrating?", "options": {"A": "Pretexting", "B": "Baiting", "C": "Hoax", "D": "Spam"}, "answer": "C"}, {"num": 483, "text": "While conducting a red team exercise at a corporate office in San Diego,\n\nCalifornia, you observe employees working in an open-plan area. By discreetly\nwatching their screens and hand movements as they log into internal systems,\nyou are able to capture several usernames and partial passwords without\ntouching any devices or interacting with the staff. Which social engineering\ntechnique does this scenario best illustrate?", "options": {"A": "Impersonation", "B": "Shoulder Surfing", "C": "Dumpster Diving", "D": "Tailgating"}, "answer": "B"}, {"num": 484, "text": "During an authorized penetration test of an organization’s Operational\nTechnology (OT) environment, the tester has already identified exposed\nindustrial assets and now begins actively probing controllers, services, and\ninterfaces to identify exploitable weaknesses. No exploitation attempts or\npersistence mechanisms have been performed yet. According to the OT hacking\nmethodology, which phase is currently being carried out?", "options": {"A": "Gain Remote Access", "B": "Information Gathering", "C": "Launch Attacks", "D": "Vulnerability Scanning"}, "answer": "D"}, {"num": 485, "text": "During a controlled red team engagement at a financial institution in New\n\nJersey, ethical hacker Ryan tests the bank’s resilience against stealth-based\nmalware. He plants a custom malicious program on an employee workstation.\nAfter execution, he observes that the infected files continue to function\nnormally, but his malware conceals its modifications by intercepting operating\nsystem calls. Antivirus scans repeatedly return “no threats detected,” even\nthough the malicious code remains active and hidden on the system.\n\nWhich type of virus did Ryan most likely deploy in this assessment?", "options": {"A": "Cavity Virus", "B": "Macro Virus", "C": "Stealth Virus", "D": "Polymorphic Virus"}, "answer": "C"}, {"num": 486, "text": "At a fast-growing startup in Austin, Texas, an ethical hacker is asked to simulate\n\nhow attackers might gather information to gain initial access. During the\nassessment, she poses as a recruiter on a professional networking site and\nconvinces several employees to share details about the company’s internal\nsoftware and VPN setup.\nWhich type of threat best represents this adversary’s method of information\n\ngathering?", "options": {"A": "Information Leakage", "B": "System and Network Attacks", "C": "Corporate Espionage", "D": "Social Engineering"}, "answer": "D"}, {"num": 487, "text": "During a penetration test at a technology startup in Austin, Texas, an ethical\nhacker is tasked with evaluating defenses against stealthy scanning techniques.\nShe selects an approach that involves sending TCP packets with no flags, relying\non the way target systems respond to infer whether ports are open or closed.\nThis allows her to remain less visible to intrusion detection systems compared\nto a full handshake. Which scanning method is she using?", "options": {"A": "FIN Scan", "B": "NULL Scan", "C": "TCP Connect Scan", "D": "ACK Scan"}, "answer": "B"}, {"num": 488, "text": "During a red team exercise at Horizon Financial Services in Chicago, ethical\n\nhacker Clara crafts an email designed to trick the company’s CEO. The message,\ndisguised as an urgent memo from the legal department, warns of a pending\nlawsuit and includes a link to a fake internal portal requesting the executive’s\ncredentials. Unlike generic phishing, this attack is tailored specifically toward a\nhigh-ranking individual with decision-making authority.\n\nWhich social engineering technique is Clara demonstrating in this scenario?", "options": {"A": "Clone Phishing", "B": "Spear Phishing", "C": "Consent Phishing", "D": "Whaling"}, "answer": "D"}, {"num": 489, "text": "During a forensic investigation of an attack on a media company in New York,\nanalysts discovered that a non-privileged process loaded a malicious library\ninstead of the intended library because the attacker placed the rogue file in a\n\ndirectory Windows searched before the legitimate location. When the trusted\napplication started, the attacker’s code executed with the application’s\nprivileges. No registry changes or kernel exploits were involved. Which\ntechnique most likely enabled the privilege escalation?", "options": {"A": "Privilege Escalation by Exploiting Vulnerabilities", "B": "Privilege Escalation Using DLL Hijacking", "C": "Privilege Escalation by Bypassing User Account Control", "D": "Access Token Manipulation"}, "answer": "B"}, {"num": 490, "text": "During a compliance review at a law firm in Chicago, an ethical hacker tests the\nfirm’s secure email gateway. She observes that sensitive legal documents are\nbeing transmitted in clear text over the Internet, allowing anyone intercepting\nthe traffic to read the contents. The firm is concerned about unauthorized\nindividuals being able to view these communications. Which principle of\ninformation security is being violated?", "options": {"A": "Confidentiality", "B": "Integrity", "C": "Availability", "D": "Non-Repudiation"}, "answer": "A"}, {"num": 491, "text": "During a red team exercise at a financial services firm in Phoenix, Arizona, an\n\nethical hacker sends a phishing email with a disguised attachment to\nemployees. The purpose is to transmit the payload into the environment so\nlater attack steps can proceed. In the cyber kill chain model, which phase does\nthis represent?", "options": {"A": "Exploitation", "B": "Reconnaissance", "C": "Delivery", "D": "Weaponization"}, "answer": "C"}, {"num": 492, "text": "At Norwest Freight Services, Simon, a junior analyst, is tasked with running a\nvulnerability scan on several departmental servers. This time, he is provided\nwith administrator-level credentials to input into the scanner. The scan takes\nsignificantly longer than usual but returns detailed results, including weak\nregistry permissions, outdated patches, and insecure configuration files that\nwould not have been visible to an outsider. SIEM logs confirm that successful\nlogins occurred during the scanning process.\n\nWhich type of vulnerability scan BEST explains the behavior observed in\nSimon’s assessment?                          5o", "options": {"A": "External Scanning", "B": "Internal Scanning", "C": "Credentialed Scanning", "D": "Non-Credentialed Scanning"}, "answer": "C"}, {"num": 493, "text": "During a red team exercise at a financial institution in New York, penetration\ntester Bob investigates irregularities in time synchronization across critical\nservers. While probing one server, he decides to use a diagnostic command that\nallows him to directly interact with the NTP daemon and query its internal state.\nThis command enables him to perform monitoring and retrieve statistics, but it\nis primarily focused on controlling and checking the operation of the NTP\nservice rather than listing peers with delay, offset, and jitter values.\n\nWhich command should Bob use to accomplish this?", "options": {"A": "ntptrace [-n] [-m maxhosts] [servername/IP_address]", "B": "ntpq [-inp] [-c command] [host] [...]", "C": "ntpdc [-ilnps] [-c command] [host] [...]", "D": "ntpq -p [host]"}, "answer": "C"}, {"num": 494, "text": "While reviewing exposed infrastructure for a logistics company in Denver, Joe, a\nsecurity analyst, identifies that one host is synchronizing time using UDP port\n123. Probing further, he issues queries to extract details about peers, offsets,\nand delays. This allows him to gather internal hostnames and client IP\naddresses connected to the time server. Such information leakage could\nprovide insight into the company’s internal network structure.\n\nWhich technique was most likely used to obtain this information?", "options": {"A": "VoIP Enumeration", "B": "NetBIOS Enumeration", "C": "NTP Enumeration", "D": "DNS Zone Transfer Enumeration"}, "answer": "C"}, {"num": 495, "text": "As part of a red team campaign against a pharmaceutical company in Boston,\nethical hacker Alex begins with a successful spear-phishing attack that delivers\nan initial payload to a manager’s laptop. After gaining access, Alex pivots to\nharvesting cached credentials and using them to move laterally across the\ninternal network. Soon, routers, printers, and several file servers are\ncompromised, expanding the red team’s control beyond the original host. At\n\nthis point, Alex has not yet targeted sensitive research data, but the team has\nbuilt a broader foothold within the environment.\n\nWhich phase of the Advanced Persistent Threat (APT) lifecycle is Alex\n\nsimulating?", "options": {"A": "Search & Exfiltration", "B": "Initial Intrusion", "C": "Persistence", "D": "Expansion"}, "answer": "D"}, {"num": 496, "text": "You are part of a red team hired to assess the cybersecurity posture of a large\nretail chain headquartered in New York. The client wants to know whether their\ndefenses can anticipate future attack patterns before they occur. To meet this\nobjective, your team deploys an AI-enabled platform that analyzes previous\nbreaches and anomaly data to forecast potential attack vectors. Which benefit\nof AI-driven ethical hacking is most critical in this case?", "options": {"A": "Scalability", "B": "Predictive analysis", "C": "Enhanced reporting", "D": "Simulation and testing"}, "answer": "B"}, {"num": 497, "text": "During a penetration test for a global e-commerce platform in Dallas, ethical\n\nhacker Maria simulates a large-scale DoS campaign. Instead of sending attack\ntraffic directly, she forges requests to multiple open services across the\ninternet. These services unknowingly reply to the victim system, multiplying the\namount of traffic hitting the target. Within minutes, the victim’s server is\noverwhelmed by a flood of responses, even though Maria’s own machine\ngenerated only a small amount of traffic. Which attack technique is Maria most\nlikely demonstrating?", "options": {"A": "Smurf Attack", "B": "Distributed Reflection Denial-of-Service (DRDoS)", "C": "NTP Amplification Attack", "D": "Botnet"}, "answer": "B"}, {"num": 498, "text": "During a red team exercise for a global insurance provider in Chicago, ethical\nhacker Maria tests the effectiveness of the company’s endpoint defenses. She\nlaunches an attack by injecting malicious PowerShell commands into a trusted\n\nprocess without dropping any executables on disk. The code executes entirely\nin memory, generating abnormal spikes in resource usage. After a reboot, Maria\nnotes that the system returns to normal and traditional antivirus logs show no\nevidence of infection.\n\nWhich type of malware technique did Maria most likely use in this test?", "options": {"A": "Rootkit", "B": "Ransomware", "C": "Fileless Malware", "D": "Trojan"}, "answer": "C"}, {"num": 499, "text": "During a penetration test at a healthcare provider in Phoenix, ethical hacker\nSofia crafts a stream of IP packets with manipulated offset fields and\noverlapping payload offsets so that the records server’s protocol stack\nrepeatedly attempts to reconstruct the original datagrams. The repeated\nreconstruction attempts consume CPU and memory, causing the system to crash\nintermittently and disrupt patient portal access, even though overall bandwidth\nremains normal. Packet analysis shows deliberately malformed offsets that\ntrigger processing errors rather than a simple flood of traffic.\n\nWhich type of attack is Sofia most likely simulating?", "options": {"A": "ICMP Flood", "B": "Ping of Death", "C": "Fragmentation Attack", "D": "Teardrop Attack"}, "answer": "D"}, {"num": 500, "text": "A penetration tester runs a vulnerability scan and identifies an outdated version\n\nof a web application running on the company’s server. The scan flags this as a\nmedium-risk vulnerability. What is the best next step for the tester?", "options": {"A": "Perform a denial-of-service (DoS) attack to crash the web application", "B": "Brute-force the admin login page to gain unauthorized access", "C": "Research the vulnerability to check for any available patches or known exploits", "D": "Ignore the vulnerability since it is only flagged as medium-risk"}, "answer": "C"}];
const PER_PAGE = 10;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PER_PAGE);

let currentPage = 0;
// State: { [qIndex]: { selected: 'A'|null, submitted: bool } }
const state = {};

for (let i = 0; i < QUESTIONS.length; i++) {
  state[i] = { selected: null, submitted: false };
}

function getPageQuestions(page) {
  const start = page * PER_PAGE;
  return QUESTIONS.slice(start, Math.min(start + PER_PAGE, QUESTIONS.length));
}

function render() {
  const qs = getPageQuestions(currentPage);
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';

  qs.forEach((q, localIdx) => {
    const globalIdx = currentPage * PER_PAGE + localIdx;
    const s = state[globalIdx];
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + globalIdx;

    if (s.submitted) {
      if (s.selected === q.answer) card.classList.add('correct');
      else card.classList.add('wrong');
    }

    const optLetters = Object.keys(q.options);

    let optionsHtml = '';
    optLetters.forEach(letter => {
      let cls = 'option-btn';
      if (s.submitted) {
        if (letter === q.answer) cls += ' correct-ans';
        else if (letter === s.selected && s.selected !== q.answer) cls += ' wrong-ans';
      } else if (letter === s.selected) {
        cls += ' selected';
      }
      const clickHandler = s.submitted ? '' : `onclick="selectOption(${globalIdx}, '${letter}')"`;
      const pointerStyle = s.submitted ? 'style="cursor:default"' : '';
      optionsHtml += `<div class="${cls}" ${clickHandler} ${pointerStyle}>
        <span class="opt-letter">${letter}</span>
        <span>${escHtml(q.options[letter])}</span>
      </div>`;
    });

    const isCorrect = s.submitted && s.selected === q.answer;
    const isWrong = s.submitted && s.selected !== q.answer;
    const revealCls = s.submitted ? (isCorrect ? 'answer-reveal ok show' : 'answer-reveal no show') : 'answer-reveal';
    const revealMsg = isCorrect
      ? '✓ 正確！'
      : isWrong
        ? `✗ 錯誤，正確答案是 ${q.answer}`
        : '';

    const statusIcon = isCorrect ? '✅' : isWrong ? '❌' : '';
    const submitDisabled = (!s.selected && !s.submitted) ? 'disabled' : '';
    const submitCls = s.submitted ? 'submit-btn submitted' : 'submit-btn';
    const submitLabel = s.submitted ? '已提交' : '提交';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q #${q.num}</span>
        <span class="q-status-icon">${statusIcon}</span>
      </div>
      <div class="q-text">${escHtml(q.text)}</div>
      <div class="options">${optionsHtml}</div>
      <div class="${revealCls}">${revealMsg}</div>
      <div class="submit-row">
        <button class="${submitCls}" id="sub-${globalIdx}" onclick="submitQuestion(${globalIdx})" ${s.submitted ? 'disabled' : submitDisabled}>${submitLabel}</button>
      </div>
    `;

    area.appendChild(card);
  });

  // Update pagination
  document.getElementById('page-info').textContent = `第 ${currentPage + 1} 頁 / ${TOTAL_PAGES} 頁`;
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage === TOTAL_PAGES - 1;

  renderPageDots();
  updateStats();
  updateSidebar();
  updateProgress();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g, '<br>');
}

function selectOption(globalIdx, letter) {
  if (state[globalIdx].submitted) return;
  state[globalIdx].selected = letter;
  render();
}

function submitQuestion(globalIdx) {
  if (!state[globalIdx].selected) return;
  if (state[globalIdx].submitted) return;
  state[globalIdx].submitted = true;
  render();
}

function changePage(dir) {
  const newPage = currentPage + dir;
  if (newPage < 0 || newPage >= TOTAL_PAGES) return;
  currentPage = newPage;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToPage(page) {
  currentPage = page;
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
  render();
}

function goToQuestionPage(globalIdx) {
  const page = Math.floor(globalIdx / PER_PAGE);
  goToPage(page);
}

function renderPageDots() {
  const container = document.getElementById('page-dots');
  container.innerHTML = '';
  for (let p = 0; p < TOTAL_PAGES; p++) {
    const start = p * PER_PAGE;
    const end = Math.min(start + PER_PAGE, QUESTIONS.length);
    let hasWrong = false, hasAnswered = false, allCorrect = true;
    for (let i = start; i < end; i++) {
      if (state[i].submitted) {
        hasAnswered = true;
        if (state[i].selected !== QUESTIONS[i].answer) { hasWrong = true; allCorrect = false; }
      } else {
        allCorrect = false;
      }
    }
    const dot = document.createElement('button');
    dot.className = 'page-dot';
    if (p === currentPage) dot.classList.add('active');
    if (hasWrong) dot.classList.add('has-wrong');
    else if (hasAnswered && allCorrect) dot.classList.add('all-correct');
    dot.textContent = p + 1;
    dot.onclick = () => goToPage(p);
    container.appendChild(dot);
  }
}

function updateStats() {
  let answered = 0, correct = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) {
      answered++;
      if (state[i].selected === QUESTIONS[i].answer) correct++;
    }
  }
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
}

function updateProgress() {
  let answered = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted) answered++;
  }
  const pct = (answered / QUESTIONS.length * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSidebar() {
  const list = document.getElementById('wrong-list');
  const wrongItems = [];
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state[i].submitted && state[i].selected !== QUESTIONS[i].answer) {
      wrongItems.push({ i, q: QUESTIONS[i], selected: state[i].selected });
    }
  }

  if (wrongItems.length === 0) {
    list.innerHTML = '<div id="empty-msg">尚無錯題<br>繼續加油！✓</div>';
  } else {
    list.innerHTML = wrongItems.map(({ i, q, selected }) => `
      <div class="wrong-item" onclick="goToQuestionPage(${i})">
        <span class="qnum">Q #${q.num}</span>
        <span class="wrong-ans">答 ${selected || '—'}</span>
        <span class="right-ans">正 ${q.answer}</span>
      </div>
    `).join('');
  }
}

// Sidebar resize
(function() {
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebar-resize');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const newW = Math.max(120, Math.min(600, startW + (e.clientX - startX)));
    sidebar.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

// Initial render
render();
</script>
</body>
</html>
