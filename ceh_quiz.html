mental hierarchies – all retrieved without authentication.\n\nWhich tool is John MOST likely using to perform this enumeration?", "options": {"A": "smtp-user-enum", "B": "nbtstat -A", "C": "dig AXFR", "D": "ldapsearch"}, "answer": "D"}, {"num": 330, "text": "A multinational corporation deploys a major internal tool built on a PowerShell-\nbased automation framework. Shortly after a scheduled rollout, the IT team\nnotices intermittent system slowdowns and unexplained bandwidth spikes.\nDespite running updated endpoint protection and restrictive firewall rules,\ntraditional scanning tools report no malicious files on disk. However, internal\ntelemetry flags a trusted process repeatedly executing obfuscated PowerShell\ncommands in memory. The anomalous activity vanishes upon reboot and\nappears to leave no footprint behind on the system.\n\nWhich type of malware is most likely responsible for this behavior?", "options": {"A": "Worm", "B": "Trojan", "C": "Rootkit", "D": "Fileless Malware"}, "answer": "D"}, {"num": 331, "text": "As part of a passive reconnaissance engagement for a university research\nnetwork, you’re asked to map potential administrative exposure points\nacross .edu domains. You aim to identify pages that might allow privileged\nbackend access such as misconfigured interfaces using only publicly indexed\ninformation. To ensure efficiency and compliance, you decide to use Google’s\nadvanced search syntax. Your goal is to locate URLs across educational domains\nthat may contain restricted backend functionality.\n\nWhich of the following search strings would most effectively support this goal?", "options": {"A": "site:.edu filetype:pdf intitle:”admin”", "B": "intitle:”admin login” site:.edu", "C": "site:.edu inurl:admin", "D": "inanchor:”backend access” site:.edu"}, "answer": "C"}, {"num": 332, "text": "You are an ethical hacker at Nexus Cybersecurity, contracted to perform a\npenetration test for BlueRidge Retail, a U.S.-based e-commerce company in\nAtlanta, Georgia. While testing their online store’s product search page, you\nattempt to inject a malicious query into the URL to extract customer data. The\napplication is protected by a web application firewall (WAF) that blocks\nstandard SQL injection attempts. To bypass this, you modify your input to split\nthe query into multiple parts, ensuring the malicious instructions are not\ndetected as a single signature. For example, you craft the URL as /products.php?\nid=1+U+NION+SE+LECT+1,2, which successfully retrieves unauthorized data.\nBased on the observed behavior, which SQL injection evasion technique are you\nemploying?", "options": {"A": "Hex Encoding", "B": "String Concatenation", "C": "In-line Comment", "D": "Null Byte"}, "answer": "B"}, {"num": 333, "text": "Bob, a seasoned security analyst at XYZ Aerospace, was investigating a series of\nmisaligned transaction timestamps coming from one of the data archival\nsystems. Suspecting that the server might be syncing with an unstable time\nsource, Bob decided to extract a detailed list of all peer servers associated with\nthe target machine, including metrics such as delay, offset, and jitter, to\ndetermine whether the issue stemmed from time synchronization drift.\n\nWhich of the following commands should Bob use to retrieve this information?", "options": {"A": "ntptrace [-n] [-m maxhosts] [servername/IP_address]", "B": "ntpq -p [host]", "C": "ntpdc [-ilnps] [-c command] [host] [...]", "D": "ntpq [-inp] [-c command] [host] [...]"}, "answer": "B"}, {"num": 334, "text": "During a quarterly security audit at a multinational logistics firm, network\nsecurity manager Priya initiates a scheduled vulnerability assessment across\nthe organization’s hybrid infrastructure. Her team begins by identifying all\nactive IT assets and assigning them risk scores based on business criticality. The\nfollowing week, they deploy scanning tools to detect security weaknesses,\nvalidate the findings manually, and classify vulnerabilities based on severity\nand exploitability.\nAfter coordinating with the IT operations team, they develop a structured\ntimeline to address the confirmed vulnerabilities, giving priority to high-risk\nfindings affecting mission-critical systems. Finally, after the vulnerabilities are\naddressed, Priya ensures that the affected systems are rescanned to confirm\n\nresolution and generates a compliance report for executive review.\n\nBased on this workflow, which phase of the Vulnerability-Management Life Cycle\nis Priya executing?", "options": {"A": "Remediation", "B": "Vulnerability Analysis", "C": "Verification", "D": "Risk Assessment"}, "answer": "A"}, {"num": 335, "text": "Sarah, a cybersecurity analyst at a US-based e-commerce company in New York,\nis tasked with evaluating the company’s transition to a cloud-based\ninfrastructure to support its growing online platform. The company aims to\noptimize resource allocation to handle fluctuating customer demand during\npeak shopping seasons, such as Black Friday. Sarah must recommend a key\ncharacteristic of cloud computing that ensures resources are efficiently shared\nacross multiple users while maintaining scalability.\n\nWhich cloud computing characteristic should Sarah recommend ensuring\nefficient resource sharing and scalability for the e-commerce platform?", "options": {"A": "Measured service", "B": "Broad network access", "C": "Resource pooling", "D": "On-demand self-service"}, "answer": "C"}, {"num": 336, "text": "As the cybersecurity lead for an international news agency, you are alerted by\nyour threat intelligence team that confidential communications between\njournalists and whistleblowers have been posted to an online activist forum.\nFurther forensic analysis reveals that no financial transactions were tampered\nwith, and no ransomware was deployed. However, the agency’s internal systems\nwere accessed and selectively leaked emails were published alongside a\nmanifesto accusing the organization of biased reporting. The attackers also\nposted on social media claiming responsibility and justifying their actions as a\nfight against misinformation.\n\nBased on this behavior, what category of hacker are you most likely dealing\n\nwith?", "options": {"A": "Script Kiddies", "B": "Hacktivists", "C": "Black Hat hackers", "D": "White Hat hackers"}, "answer": "B"}, {"num": 337, "text": "In a controlled testing environment in Houston, Sarah, an ethical hacker, is\ntasked with evaluating the security posture of a financial firm’s network using\nthe cyber kill chain methodology. She begins by simulating an attack, starting\nwith gathering publicly available data about the company’s employees and\ninfrastructure. Next, she plans to craft a mock phishing email to test employee\nresponses, followed by deploying a harmless payload to assess system\nvulnerabilities. As part of her authorized penetration test, what phase of the\ncyber kill chain should Sarah prioritize to simulate the adversary’s approach\neffectively?", "options": {"A": "Exploitation", "B": "Reconnaissance", "C": "Weaponization", "D": "Delivery"}, "answer": "B"}, {"num": 338, "text": "At a government research lab, cybersecurity officer Nikhil is compiling a\nvulnerability assessment report after scanning the internal subnet. As part of\nhis documentation, he lists the IP addresses of all scanned hosts and specifies\nwhich machines are affected. He includes tables categorizing discovered\nvulnerabilities by type – such as outdated software, default credentials, and\nopen ports. Which section of the vulnerability assessment report is Nikhil\nworking on?", "options": {"A": "Findings", "B": "Risk Assessment", "C": "Supporting Information", "D": "Assessment Overview"}, "answer": "A"}, {"num": 339, "text": "In a tense red team exercise at a mid-sized university in Austin, Texas, an ethical\n\nhacker named Jake targeted a legacy Linux server in the engineering\ndepartment. Late one afternoon, he discovered TCP port 2049 was open during\nhis port sweep, suggesting hidden file-sharing capabilities. Intrigued, Jake used\na standard utility to request a list of remote file systems shared across the\nnetwork, aiming to map accessible resources. Meanwhile, he idly checked for\nTelnet access and probed a time-sync service out of routine, but both proved\n\nfruitless on this host.\n\nWhich enumeration method is actively demonstrated in this scenario?", "options": {"A": "NFS Enumeration", "B": "SNMP Enumeration", "C": "NetBIOS Enumeration", "D": "NTP Enumeration"}, "answer": "A"}, {"num": 340, "text": "At Liberty Mutual’s cybersecurity operations center in Boston, network engineer\nMarcus is troubleshooting a critical issue during peak transaction hours.\nMultiple VLANs are experiencing intermittent access delays, and several\nendpoints including those on isolated VLANs are receiving network traffic not\nintended for them, raising concerns about data exposure. Marcus notices that\nthe issue began after a newly imaged workstation, used by an intern named\nLisa, was connected to a trunk port in the server room. Switch logs indicate\nabnormal traffic patterns overwhelming the network.\n\nWhich sniffing technique is Lisa’s workstation most likely using to cause this\nbehavior?", "options": {"A": "DNS Cache Poisoning", "B": "ARP Poisoning", "C": "MAC Flooding", "D": "Switch Port Stealing"}, "answer": "C"}, {"num": 341, "text": "During a red team assessment at Alpine Manufacturing Corp., network security\nconsultant Marcus Lee is instructed to evaluate the security of internal\ncommunications within their switched LAN environment. Without altering any\nswitch configurations, Marcus manages to intercept credentials being\ntransmitted between a payroll administrator’s workstation and the backend\nauthentication server. His setup reroutes the communication path through his\ntesting machine, though no proxy or VPN was involved. Analysis shows the\nredirection was achieved by injecting crafted messages that silently altered how\nthe two hosts identified each other on the local network.\n\nWhich sniffing technique did Marcus most likely use?", "options": {"A": "DNS Spoofing", "B": "Switch Port Stealing", "C": "ARP Spoofing", "D": "MAC Flooding"}, "answer": "C"}, {"num": 342, "text": "During a scheduled security review in a high-tech lab in Austin, Texas,\npenetration tester Lucas Bennett was assessing a state government’s new\npayroll system hosted in a private cloud. One humid afternoon, while fuzz\ntesting the input validation logic of the TaxCalcEngine.dll module, he triggered a\nbuffer overflow by submitting malformed taxpayer ID strings. The crash led to\nunintended disclosure of payroll data due to unchecked data boundaries. Lucas\ntraced the issue to a coding oversight in a core processing module. Applying a\nstructured analysis approach, which category best describes the vulnerability\nhe discovered?", "options": {"A": "Application Flaws", "B": "Poor Patch Management", "C": "Misconfigurations/Weak Configuration", "D": "Design Flaws"}, "answer": "A"}, {"num": 343, "text": "In the industrial heart of Detroit, Michigan, a steel plant’s production line halts\nunder mysterious circumstances, prompting an urgent cybersecurity\ninvestigation. As Marcus Reed, an ethical hacker, you audit the system and\nnotice the plant’s control process uses a feedback mechanism to continuously\nadjust operations based on output conditions. Your review reveals that this\nself-regulating behavior is central to the plant’s automation design. Based on\nyour findings, which OT system concept is being employed?", "options": {"A": "Distributed Control System (DCS)", "B": "Open loop", "C": "Manual loop", "D": "Closed loop"}, "answer": "D"}, {"num": 344, "text": "During a network security audit at Jefferson National Bank in Richmond,\n\nVirginia, ethical hacker Thomas Reed is tasked with identifying vulnerabilities in\nemployee login processes on VLAN 20, which connects client services\nworkstations to the customer account database server. He sets up a Wireshark\ninstance on a monitoring workstation configured in mirror mode behind a\nmanaged switch to capture traffic. His goal is to detect unencrypted\nauthentication credentials transmitted over HTTP during login sessions. Which\n\nWireshark feature should Thomas use to isolate and analyze these credentials\nin real time, and how does it assist him?", "options": {"A": "Use the “Display Filtering by Protocol” to isolate HTTP traffic and view packet details", "B": "Use the “Follow TCP Stream” to reconstruct and read HTTP session data", "C": "Use the “Monitoring the Specific Ports” to generate a traffic summary and identify HTTP packets", "D": "Use the “Filtering by IP Address” to set a filter for HTTP traffic before capturing"}, "answer": "B"}, {"num": 345, "text": "In Raleigh, North Carolina, ethical hacker Ethan Brooks is conducting a\npenetration test for Triangle FinTech, a rising financial startup. During his\nassessment, Ethan aims to bypass the company’s network security to access a\nrestricted internal server. He crafts network packets to disguise his traffic as\nlegitimate, forcing some TCP header information into subsequent packets to\nevade the firewall’s checks. His aim is to demonstrate how an attacker could\nslip past the security perimeter undetected, alerting the IT team to potential\nweaknesses.\n\nWhich technique is Ethan employing to bypass Triangle FinTech’s firewall during\nhis penetration test?", "options": {"A": "Source Routing", "B": "Tiny Fragments", "C": "HTTP Tunneling", "D": "IP Address Spoofing"}, "answer": "B"}, {"num": 346, "text": "Noah, a security analyst at a Seattle-based healthcare provider, is responding to\na real-time data breach where attackers accessed patient records stored on a\ncompromised server. During incident response, he must quickly secure sensitive\nfiles located on the system’s primary storage to prevent further exfiltration. The\ndata resides in a mounted partition that needs full-volume encryption, but\nstandard file encryption isn’t sufficient. Noah selects a solution that supports\nencrypted containers, strong key lengths like 256-bit AES, and can conceal\nsecure volumes within standard ones to reduce detection. His goal is to ensure\nconfidentiality while forensic operations continue without disrupting system\nfunctionality.\n\nWhich disk encryption tool should Noah deploy to meet these objectives?", "options": {"A": "BitLocker Drive Encryption", "B": "FileVault", "C": "Rohos Disk Encryption", "D": "VeraCrypt"}, "answer": "D"}, {"num": 347, "text": "Liam, an ethical hacker at a Miami-based cryptocurrency exchange, is assessing\nthe security of their blockchain network after a recent incident where users\nreported double-spending of digital assets. His investigation reveals that the\nattackers gained significant control over the network’s computational\nresources, allowing them to manipulate transaction validations. Liam notes that\nthe blockchain is a public ledger, like Bitcoin, where anyone can access\ntransaction data without permissions. During his analysis, he finds that the\nattackers likely controlled a dominant share of the network’s computing\nresources, enabling them to rewrite transaction history.\n\nWhich blockchain attack should Liam identify to strengthen the exchange’s\n\ndefenses?", "options": {"A": "51% Attack", "B": "Eclipse Attack", "C": "DeFi Sandwich Attack", "D": "Finney Attack"}, "answer": "A"}, {"num": 348, "text": "In Miami, Florida, cybersecurity analyst Laura Bennett is responding to a series\nof unauthorized access attempts targeting Sunshine Credit Union’s online\nbanking platform. She observes unusual network activity that suggests\nattackers may be intercepting session IDs transmitted over unsecured\nconnections to hijack active user sessions. To prevent further compromise,\nLaura works with the network team to apply a control that secures session-\nrelated communications throughout the entire portal, ensuring sensitive tokens\nare no longer exposed to interception during user interactions.\n\nWhat countermeasure should Laura implement to prevent session hijacking in\nthis scenario?", "options": {"A": "Regenerate the session ID after a successful login", "B": "Implement SSL to encrypt all information in transit via the network", "C": "Use restrictive cache directives such as “Cache-Control: no-cache”", "D": "Do not create sessions for unauthenticated users"}, "answer": "B"}, {"num": 349, "text": "You are working as a threat intelligence analyst for a fintech startup that\nrecently discovered a spike in credential stuffing attempts against its admin\npanel. The security team believes this may be due to leaked internal files\ncirculating on underground forums. You’re tasked with investigating potential\nexposure on the dark web without directly interacting with any service or forum.\n\nYou decide to use advanced search filters to identify documents hosted on\nhidden services that may contain sensitive access details. The team suspects\nthese documents might include account-related keywords in their titles.\n\nWhich of the following search queries would best support this investigation?", "options": {"A": "filetype:pdf intitle:”admin access” site:onion", "B": "filetype:docx intitle:”login credentials”", "C": "filetype:pdf intitle:”secure login” site:onion", "D": "filetype:docx intitle:”user accounts” site:onion"}, "answer": "A"}, {"num": 350, "text": "During an internal red team engagement at a financial services firm, an ethical\nhacker named Anika tests persistence mechanisms after successfully gaining\naccess to a junior employee’s workstation. As part of her assessment, she\ndeploys a lightweight binary into a low-visibility system folder. To maintain\nlong-term access, she configures it to launch automatically on every system\nreboot without requiring user interaction.\n\nWhich of the following techniques has most likely been used to ensure the\npersistence of the attacker’s payload?", "options": {"A": "Installing a keylogger", "B": "Creating scheduled tasks", "C": "Modifying file attributes", "D": "Injecting into the startup folder"}, "answer": "B"}, {"num": 351, "text": "Maya Patel from SecureHorizon Consulting is called to investigate a security\nbreach at Dallas General Hospital in Dallas, Texas, where a lost employee\nsmartphone was used to access sensitive patient records. During her analysis,\nMaya finds that the hospital’s mobile security policy failed to include a\ncontingency to remotely secure compromised devices, allowing continued\naccess to confidential data even after the device was lost. Based on this gap,\nwhich mobile security guideline should Maya recommend preventing similar\nincidents?", "options": {"A": "Utilize a secure VPN connection while accessing public Wi-Fi networks", "B": "Install device tracking software that allows the device to be located remotely", "C": "Register devices with a remote locate and wipe facility", "D": "Use anti-virus and data loss prevention (DLP) solutions"}, "answer": "C"}, {"num": 352, "text": "In Denver, Colorado, ethical hacker Rachel Nguyen is conducting a network\nsecurity assessment for Apex Logistics, a transportation firm with a complex\ninternal network. During her test, Rachel observes a client-server\ncommunication and injects specially crafted packets into the exchange,\ndisrupting the client’s session. As a result, the server continues interacting with\nRachel’s system while the legitimate client’s connection becomes unresponsive.\n\nShe uses this setup in a controlled environment to demonstrate vulnerabilities\nto the company’s IT team.\n\nWhat network-level session hijacking technique is Rachel employing in this\n\nassessment?", "options": {"A": "Blind hijacking", "B": "UDP hijacking", "C": "RST hijacking", "D": "TCP/IP hijacking"}, "answer": "D"}, {"num": 353, "text": "You are an ethical hacker at Vanguard Cyber Defense, hired by Sunrise Logistics,\na freight management company in Houston, Texas, to evaluate the security of\ntheir shipment tracking portal. During your engagement, you analyze how the\napplication handles user-submitted data. You observe the behavior of the\nshipment search feature and monitor the HTTP GET requests being sent to the\nserver. Your objective is to determine how user input is processed by the\nbackend system and whether those parameters can be used to manipulate SQL\nqueries. Based on this activity, which step of the SQL injection methodology are\nyou performing?", "options": {"A": "Advanced SQL Injection", "B": "Launching SQL Injection Attacks", "C": "Database Enumeration", "D": "Identifying Data Entry Paths"}, "answer": "D"}, {"num": 354, "text": "While conducting a security review for a public healthcare data center, Jason, a\nsenior penetration tester, is asked to gather system descriptions, contact\ndetails, and interface metrics from a set of legacy network devices running\nSNMPv2. These devices respond on UDP port 161 and use default community\nstrings. Jason must retrieve this structured SNMP data in a format that can be\nfed into a reporting script without requiring GUI-based tools or raw packet\ncaptures.\n\nWhich of the following methods should Jason use?", "options": {"A": "Use Nmap to identify SNMP ports and collect basic SNMP service banners", "B": "Use SoftPerfect Network Scanner to scan for SNMP-enabled systems", "C": "Use SnmpWalk to query and retrieve structured SNMP data from the devices", "D": "Use Wireshark to inspect SNMP packets on the wire for useful fields"}, "answer": "C"}, {"num": 355, "text": "At Pinnacle Financial Services in Chicago, Illinois, ethical hacker Sarah\nThompson is conducting a penetration test to evaluate the security of the\ncompany’s online banking portal. During her assessment, Sarah positions\nherself on the internal network and uses a sniffer to capture traffic between a\n\nuser’s browser and the banking server. She quietly collects session data,\nincluding user IDs and authentication tokens, without interfering with the\n\nongoing communication. Later, she plans to use this information to impersonate\n\na legitimate user in a controlled test environment to demonstrate potential\nrisks to the bank’s IT team.\n\nWhat type of session hijacking is Sarah performing during this phase of her\npenetration test?", "options": {"A": "Session Fixation Attack", "B": "Active Session Hijacking", "C": "Man-in-the-browser Attack", "D": "Passive Session Hijacking"}, "answer": "D"}, {"num": 356, "text": "You are Sofia Patel, an ethical hacker at Nexus Security Labs, hired to test the\nmobile device security of Bayview University in San Francisco, California. During\nyour assessment, you are given an Android 11-based Samsung Galaxy Tab S6\nwith USB debugging disabled and OEM unlock restrictions in place. To simulate\nan attacker attempting to gain privileged access, you install a mobile\napplication that exploits a system vulnerability to gain root access directly on\nthe device – without requiring a PC. This allows you to bypass OS restrictions\nand retrieve sensitive research data. Based on this method, which Android\n\nrooting tool are you using?", "options": {"A": "Magisk Manager", "B": "One Click Root", "C": "KingoRoot", "D": "RootMaster"}, "answer": "C"}, {"num": 357, "text": "During a stealth penetration test for a multinational shipping company, ethical\nhacker Daniel Reyes gains local access to an engineering workstation and\ndeploys a specialized payload that installs below the operating system. On\nsubsequent reboots, the payload executes before any system-level drivers or\nservices are active, giving Daniel covert control over the machine without\ntriggering antivirus or endpoint detection tools. Weeks later, system\nadministrators report suspicious network activity, but repeated forensic scans\nfail to locate any malicious processes or user-level traces.\n\nWhich type of rootkit did Daniel most likely use to maintain this level of stealth\nand persistence?", "options": {"A": "Hypervisor Rootkit", "B": "Firmware Rootkit", "C": "Kernel-mode Rootkit", "D": "Bootkit"}, "answer": "D"}, {"num": 358, "text": "Javier Ruiz from CyberFortress Solutions is tasked with auditing the mobile\nsecurity practices of Apex Financial Services, a financial firm in Houston, Texas.\nDuring a covert penetration test, Javier targets employees’ personal\nsmartphones used to access corporate financial systems. He exploits a\nvulnerability by installing a malicious app that bypasses access controls,\ngranting him unauthorized entry to sensitive financial data because the devices\nlack a specific security measure to restrict app access. Based on this\nvulnerability, which BYOD security guideline is most likely missing in Apex\nFinancial Services’ policy?", "options": {"A": "Review permissions requested by apps before installing them", "B": "Set passwords for apps to restrict others from accessing them", "C": "Enforce automatic device locking or implement biometric authentication", "D": "Use encryption mechanisms to store data"}, "answer": "B"}, {"num": 359, "text": "In Seattle, Washington, ethical hacker Mia Chen is hired by Pacific Trust Bank to\ntest the security of their corporate network, which stores sensitive customer\nfinancial data. During her penetration test, Mia conducts a thorough\nreconnaissance, targeting a server that appears to host a critical database of\ntransaction records. As she interacts with the server, she notices it responds\npromptly to her queries but occasionally returns error messages that seem\ninconsistent with a production system’s behavior, such as unexpected protocol\nresponses. Suspicious that this server might be a decoy designed to monitor\nher actions, Mia applies a technique to detect inconsistencies that may reveal\nthe system as a honeypot.\n\nWhich technique is Mia most likely using to determine if the server at Pacific\nTrust Bank is a honeypot?", "options": {"A": "Analyzing Response Time", "B": "Analyzing MAC Address", "C": "Fingerprinting the Running Service", "D": "Analyzing System Configuration and Metadata"}, "answer": "C"}, {"num": 360, "text": "In the bustling tech hub of Boston, Massachusetts, ethical hacker Zara Nguyen\ndives into the digital fortifications of CloudCrafter, a US-based platform hosting\nweb applications for small businesses. Tasked with probing the application’s\ninput processing, Zara submits specially crafted inputs to a server\nadministration panel. Her tests uncover a severe vulnerability: the system\nperforms unintended operations at the system level, enabling access to\nrestricted server resources. Further scrutiny reveals the flaw lies in the\napplication’s failure to sanitize user input passed to system-level execution, not\nin altering directory service queries, injecting newline characters, or targeting\nshell-specific environments. Dedicated to strengthening the platform, Zara\ndrafts a precise report to guide CloudCrafter’s security team toward urgent fixes.\n\nWhich injection attack type is Zara most likely exploiting in CloudCrafter’s web\napplication?                                5o", "options": {"A": "Shell Injection", "B": "CRLF Injection", "C": "LDAP Injection", "D": "Command Injection"}, "answer": "D"}, {"num": 361, "text": "On a busy Monday morning at Horizon Financial Services in Chicago, accounts\nassistant Clara Nguyen receives an email that appears to come from the\ncompany’s IT department. The email, addressed specifically to Clara and\nmentioning her role in the accounts team, warns of a critical system\nvulnerability requiring immediate action. It includes a link to a login page\nresembling the company’s internal portal, urging her to update her credentials\nto prevent account suspension. The email’s sender address looks legitimate, but\nClara notices a slight misspelling in the domain name.\n\nWhat social engineering technique is being attempted against Clara?", "options": {"A": "Spear Phishing", "B": "Impersonation", "C": "Quid Pro Quo", "D": "Vishing"}, "answer": "A"}, {"num": 362, "text": "While simulating a reconnaissance phase against a cloud-hosted retail\napplication, your team attempts to gather DNS records to map the\ninfrastructure. You avoid brute-forcing subdomains and instead aim to collect\nspecific details such as the domain’s mail server, authoritative name servers,\nand potential administrative information like serial number and refresh\ninterval.\n\nGiven these goals, which DNS record type should you query to extract both\nadministrative and technical metadata about the target zone?", "options": {"A": "MX", "B": "SOA", "C": "TXT", "D": "NS"}, "answer": "B"}, {"num": 363, "text": "As part of a quarterly security review at EvoTrans Logistics, a global freight\noptimization firm, you’ve been brought in as a senior cybersecurity analyst to\naudit perimeter firewall configurations across cloud-hosted application\nclusters. During your investigation, you notice that TCP port 1433 is open on a\nvirtual machine tagged as svc-node-east-14, which was provisioned by a now-\ndefunct third-party vendor.\nThe node is not referenced in any current infrastructure diagrams, yet live traffic\nlogs suggest it’s still handling requests during peak hours. No documentation\nexists regarding its service role, but you’re tasked with flagging\nmisconfigurations that may violate policy or expose critical services\nunnecessarily. Based on your understanding of standardized port assignments,\n\nyou must determine what service this port likely represents and whether its\nexposure warrants escalation.\nWhich of the following services is most likely running on this port and requires\nimmediate review?", "options": {"A": "sqlsrv", "B": "sql*net", "C": "ms-sql-s", "D": "ms-sql-m"}, "answer": "C"}, {"num": 364, "text": "As part of an annual security awareness program at BrightPath Consulting in\nDenver, Colorado, the cybersecurity team conducts an ethical hacking\nexperiment to test employee vigilance against physical social engineering\nthreats. During a simulated attack, ethical hacker Liam Carter strategically\nplaces a USB drive labeled “Confidential 2025 Budget Plans” in the company’s\nparking lot, designed to look like it was accidentally dropped. The USB is\nprogrammed to install a harmless tracking script when plugged into a\nworkstation, alerting the security team. Sarah, a project coordinator, finds the\nUSB and considers plugging it into her office laptop to identify its owner.\n\nWhat social engineering technique is being tested in this experiment?", "options": {"A": "Phishing", "B": "Hoax", "C": "Pretexting", "D": "Baiting"}, "answer": "D"}, {"num": 365, "text": "During a security assessment in San Francisco, an ethical hacker is tasked with\nevaluating a network’s resilience against stealthy reconnaissance attempts. The\nhacker needs to employ a scanning technique that leverages TCP flags to evade\ndetection by intrusion detection systems, relying on the target’s response\nbehavior to infer port states without completing a full connection. Which\napproach best aligns with this strategy, ensuring minimal visibility during the\nassessment?", "options": {"A": "TCP Connect Scan", "B": "Network Scanning", "C": "FIN Scan", "D": "NULL Scan"}, "answer": "C"}, {"num": 366, "text": "Ethical hacker Ryan Brooks, a skilled penetration tester from Austin, Texas, was\nhired by Skyline Aeronautics, a leading aerospace firm in Denver, to conduct a\nsecurity assessment. One sunny morning, Ryan noticed an unexpected lag in the\nroutine system update process while running his tests, sparking his curiosity.\nDuring a late-night session, he observed a junior analyst, Chris Miller, cautiously\n\nmodifying a legacy server’s configuration, including a scheduled task tied to a\nspecific date. The lead developer, Jessica Hayes, casually mentioned receiving\n\nan odd email from an unfamiliar source, which she ignored as clutter. As Ryan\n\nprobed deeper, he detected a faint increase in network activity only after the\nscheduled date passed, and a systems admin, Mark Thompson, quietly pointed\n\nout some unusual code traces on a dormant workstation.\n\nWhich type of threat best characterizes this attack?", "options": {"A": "Logic Bomb", "B": "Fileless Malware", "C": "Advanced Persistent Threat (APT)", "D": "Ransomware"}, "answer": "A"}, {"num": 367, "text": "In Portland, Oregon, ethical hacker Olivia Harper is hired by Cascade Biotech to\ntest the security of their research network. During her penetration test, she\nsimulates an attack by sending malicious packets to a server hosting sensitive\ngenetic data. To evade detection, she needs to understand the monitoring\nsystem deployed near the network’s firewall, which analyzes incoming and\noutgoing traffic for suspicious patterns across the entire subnet. Olivia’s goal is\nto bypass this system to highlight vulnerabilities for the security team. Which\nsecurity system is Olivia attempting to bypass during her penetration test of\n\nCascade Biotech’s network?", "options": {"A": "Network-Based Intrusion Detection System", "B": "Host-Based Firewalls", "C": "Network-Based Firewalls", "D": "Host-Based Intrusion Detection System"}, "answer": "A"}, {"num": 368, "text": "You are leading an internal red team assessment for a multinational bank with a\nhighly complex and distributed IT infrastructure. Your team is required to\nsimulate attacks across cloud services, servers, and remote endpoints. Due to\nthe sheer scale of the environment, you deploy an AI-based platform that\nautomatically scans the entire network, flags anomalies based on prior breach\ndata, and adjusts its threat detection models as new attack behaviors are\nencountered. What key benefit of AI-driven ethical hacking is most critical to\nyour success in this scenario?", "options": {"A": "Predictive analysis", "B": "Simulation and testing", "C": "Scalability", "D": "Enhanced reporting"}, "answer": "C"}, {"num": 369, "text": "At Norwest Freight Services, a rotating audit team is asked to evaluate host\nexposure across multiple departments following a suspected misconfiguration\nincident. Simon, a junior analyst working from a trusted subnet, initiates a\nnetwork-wide scan using the default configuration profile of his assessment\ntool. The tool completes quickly but returns only partial insights such as open\nservice ports and version banners while deeper registry settings, user policies,\nand missing patches remain unreported.\nMidway through the report review, Simon notices that system login prompts\nwere never triggered during scanning, and no credential failures were logged in\nthe SIEM.\n\nWhich type of vulnerability scan BEST explains the behavior observed in\nSimon’s assessment?", "options": {"A": "Unauthenticated Scanning", "B": "Authenticated Scanning", "C": "Internal Scan", "D": "Credentialed Scanning"}, "answer": "A"}, {"num": 370, "text": "You are an ethical hacker at SecurePath Technologies, hired to conduct a\npenetration test for Horizon Financial, a U.S.-based credit union in Denver,\nColorado. While testing their online banking portal, you enter a crafted input\ninto the login form’s username field. The application unexpectedly returns a full\nlist of customer account details, including names and account numbers,\nappended to the intended login response. The behavior suggests that your\ninput was used to append a malicious query to the requested query, altering\nthe original SQL statement to retrieve additional data beyond the expected\nresult. Based on the observed behavior, which type of SQL injection attack are\nyou exploiting?", "options": {"A": "UNION SQL Injection", "B": "Error-Based SQL Injection", "C": "Second-Order SQL Injection", "D": "Blind SQL Injection"}, "answer": "A"}, {"num": 371, "text": "You are conducting a security audit at a government agency. During your\nwalkthrough, you observe a temporary contractor sitting in an open office area\nusing their smartphone to discreetly record employees as they enter passwords\ninto their systems. Upon further investigation, you find discarded documents in\na nearby trash bin containing sensitive project information. What type of attack\nis most likely being performed?", "options": {"A": "Close-in attack", "B": "Insider attack", "C": "Distribution attack", "D": "Passive attack"}, "answer": "D"}, {"num": 372, "text": "During a red team operation for XYZ Financial Services, security analyst Lily\n\nJensen is assigned to scan a critical subnet that is protected by an IDS. Her\ninitial scan attempt is immediately flagged and blocked. To evade detection\nwhile continuing reconnaissance, she adjusts the scanning configuration to\ninclude multiple spoofed IP addresses alongside her own. This makes it difficult\nfor network defenses to isolate her real scanning activity, while still allowing\nher to receive accurate results.\n\nWhich scanning technique is Lily using?", "options": {"A": "SYN/FIN Scanning", "B": "Source Routing", "C": "IP Spoofing", "D": "Decoy Scanning"}, "answer": "D"}, {"num": 373, "text": "Jake, a cybersecurity investigator at a Miami-based cryptocurrency exchange,\nuncovers a sinister plot during a late-night breach response. Attackers have\ninfiltrated the company’s cloud environment, leveraging a technique to siphon\ncomputing power from misconfigured AWS instances. The breach, traced\nthrough compromised secrets and unauthorized API calls, has triggered a surge\nin resource consumption, threatening the platform’s integrity during a high-\nstakes trading surge. As Jake races against time to pinpoint the attack method,\nhe must identify the primary cloud hacking technique at play.\n\nWhat cloud hacking technique should Jake identify as the primary method used\nby attackers to siphon computing power in the cloud environment?", "options": {"A": "Cryptojacking", "B": "Wrapping attack", "C": "Enumerating S3 buckets", "D": "Compromising secrets"}, "answer": "A"}, {"num": 374, "text": "Michael, an ethical hacker at a New York-based e-commerce company, is\nevaluating the security of their online payment system after a recent incident\nwhere fraudulent transactions went undetected. His investigation reveals that\nthe system uses an asymmetric encryption algorithm to ensure the authenticity\nof payment confirmations. He finds that the algorithm employs a public-key\ncryptosystem, where the sender signs the transaction with a private key, and\nthe recipient verifies it using a corresponding public key located in a directory.\nDuring his test, Michael intercepts a signed message and notices that the\nalgorithm supports modular exponentiation for generating digital signatures, a\nprocess critical to verifying the identity of the signatory. He aims to assess if the\nalgorithm’s configuration could be vulnerable to a meet-in-the-middle attack\n\ndue to its key structure.\n\nWhich asymmetric encryption algorithm should Michael identify as the one\nused by the payment system?", "options": {"A": "Diffie-Hellman", "B": "RSA", "C": "ElGamal", "D": "DSA"}, "answer": "B"}, {"num": 375, "text": "During a red team engagement at Apex Biotech in Dallas, ethical hacker Rachel\ncalls the company’s HR desk pretending to be Mark Stevens, a senior finance\nmanager. She pressures the HR staffer by citing his “upcoming presentation for\nthe CFO” and insists he urgently needs a copy of the updated employee benefits\nspreadsheet. The staffer feels compelled to help due to Rachel’s convincing\nmanner and authoritative tone.\n\nWhich social engineering technique is Rachel demonstrating in this exercise?", "options": {"A": "Vishing", "B": "Quid Pro Quo", "C": "Impersonation", "D": "Reverse Social Engineering"}, "answer": "C"}, {"num": 376, "text": "During a penetration test at Pinnacle Bank in Chicago, ethical hacker Sarah\ninjects crafted TCP packets into an active communication between a customer’s\nbrowser and the online banking server. The victim’s connection becomes\nunstable, allowing Sarah’s system to maintain communication with the server in\nplace of the legitimate client. She later demonstrates to the IT team how\nattackers could forcibly take control of live sessions through this approach.\n\nWhich type of session hijacking is Sarah performing in this scenario?", "options": {"A": "Passive Session Hijacking", "B": "Blind Hijacking", "C": "Active Session Hijacking", "D": "Man-in-the-Browser Attack"}, "answer": "C"}, {"num": 377, "text": "During a penetration test at Horizon Tech in Austin, ethical hacker Michael sets\n\nup a man-in-the-middle attack to intercept traffic between employees and the\ncompany’s internal web applications. He uses a lightweight tool capable of\nperforming ARP spoofing, DNS manipulation, and packet injection while\nproviding an interactive interface for real-time monitoring. This allows him to\ncapture and manipulate session tokens in transit, which he later presents to the\nsecurity team as proof of risk.\n\nWhich tool is Michael most likely using in this exercise?", "options": {"A": "Bettercap", "B": "Hetty", "C": "Caido", "D": "Wireshark"}, "answer": "A"}, {"num": 378, "text": "During a red team engagement at a healthcare provider in Miami, ethical hacker\nRachel suspects that a compromised workstation is running a sniffer in\npromiscuous mode. To confirm her suspicion, she sends specially crafted ICMP\npackets with a mismatched MAC address but a correct IP destination. Minutes\nlater, the suspected machine responds to the probe even though ordinary\nsystems would ignore it.\n\nWhich detection technique is Rachel most likely using to validate the presence\nof a sniffer?", "options": {"A": "DNS Method", "B": "Nmap sniffer-detect (NSE)", "C": "Ping Method", "D": "ARP Method"}, "answer": "C"}, {"num": 379, "text": "During a penetration test at a telecom provider in Denver, Colorado, Maria, a\nsenior ethical hacker, notices that her scans are immediately flagged by\nintrusion detection systems. She modifies her technique, and as a result, the\nIDS devices are unable to reassemble the packets correctly, allowing her probes\nto slip through without detection. Which scanning evasion technique is Maria\napplying in this case?", "options": {"A": "Source Routing", "B": "IP Spoofing", "C": "Packet Fragmentation", "D": "Decoy Scanning"}, "answer": "C"}, {"num": 380, "text": "During a penetration test at a financial services company in Denver, ethical\n\nhacker Jason demonstrates how employees could be tricked by a rogue DHCP\nserver. To help the client prevent such attacks in the future, Jason shows the\nadministrators how to configure their Cisco switches to reject DHCP responses\nfrom untrusted ports. He explains that this global setting must be activated\nbefore more granular controls can be applied.\n\nWhich switch command should Jason recommend to implement this defense?", "options": {"A": "Switch(config)# ip dhcp snooping", "B": "Switch(config)# ip dhcp snooping vlan 10", "C": "Switch(config-if)# ip dhcp snooping trust", "D": "Switch(config)# ip arp inspection vlan 10"}, "answer": "A"}, {"num": 381, "text": "While auditing legacy network devices at a public hospital in Miami, Jason, a\npenetration tester, needs to verify what SNMP traffic is leaking across the\ninternal segment. Instead of running structured queries, he decides to capture\nlive network traffic and manually review the protocol fields. This method allows\nhim to see SNMP requests and responses in transit but requires manual parsing\nof OIDs, community strings, and variable bindings.\n\nWhich method should Jason use in this situation?", "options": {"A": "SoftPerfect Network Scanner", "B": "Wireshark", "C": "Nmap", "D": "SnmpWalk"}, "answer": "B"}, {"num": 382, "text": "You are an ethical hacker at Northpoint Assessments, engaged to map the\nwireless footprint around Harborview Plaza in San Francisco, California. To\nenumerate nearby networks and prompt devices to reveal SSIDs and\ncapabilities, you actively send crafted management frames from your laptop\nand log each AP’s immediate responses (including probe responses and\ncapability information), rather than only listening for broadcasts. Based on the\ndescribed activity, which Wi-Fi discovery technique are you performing?", "options": {"A": "Network Discovery Software", "B": "Wash Command", "C": "Passive Footprinting", "D": "Active Footprinting"}, "answer": "D"}, {"num": 383, "text": "During a post-exploitation phase on a compromised finance department\n\nworkstation, ethical hacker Anika uses her Meterpreter session to extract\nsensitive credential data. After running a command, she receives a long list of\nalphanumeric strings representing LM and NTLM values. These outputs are later\ntransferred to a cracking rig for offline password recovery, allowing the red team\nto simulate credential theft across multiple systems. Which Meterpreter\ncommand most likely produced these results?", "options": {"A": "screenshot", "B": "keyscan_start", "C": "hashdump", "D": "getsystem"}, "answer": "C"}, {"num": 384, "text": "You are an ethical hacker at HarborLine Assessments, engaged to audit the Wi-\nFi at Portside Freight in Tacoma, Washington. During an overnight\nreconnaissance, you enable your wireless interface’s monitor mode and run a\ncommand that silently records beacon frames, probe responses and\nauthentication frames from nearby APs and clients into a capture file for later\noffline analysis – you do not transmit any frames from your laptop. Based on\nthe described activity, which Wi-Fi security auditing tool are you most likely\nusing?", "options": {"A": "Airbase-ng", "B": "Aireplay-ng", "C": "Airodump-ng", "D": "Aircrack-ng"}, "answer": "C"}, {"num": 385, "text": "At a Miami-based cryptocurrency exchange, investigator Jake uncovers that\nattackers exploited exposed API keys to issue unauthorized cloud commands,\nleading to resource abuse and lateral movement inside the cloud environment.\nWhich cloud hacking technique is most directly demonstrated in this incident?", "options": {"A": "Cryptojacking", "B": "Enumerating S3 buckets", "C": "Compromising secrets", "D": "Wrapping attack"}, "answer": "C"}, {"num": 386, "text": "During a penetration test at Rocky Mountain Insurance in Denver, ethical hacker\nSophia Nguyen attempts to evade detection by fragmenting malicious traffic\ninto smaller packets. The IT security team counters her strategy with a system\n\nthat monitors traffic for deviations from established baselines, flagging\nbehavior that does not match normal network activity. This allows them to stop\nSophia’s evasion attempts in real time. Which detection technique is the IT team\nmost likely using in this case?", "options": {"A": "Deep Packet Inspection", "B": "Stateful Packet Inspection", "C": "Signature-Based Detection", "D": "Anomaly-Based Detection"}, "answer": "D"}, {"num": 387, "text": "During a penetration test at a regional bank in Richmond, ethical hacker\nThomas is tasked with identifying weaknesses in how employee credentials are\ntransmitted. He sets up Wireshark on a mirrored port and captures HTTP login\nsessions from the customer services VLAN. To quickly reconstruct entire\nconversations between browsers and the server, Thomas uses a feature that\nreassembles packet data into a readable stream, allowing him to view\nusernames and passwords directly in plain text.\n\nWhich Wireshark feature is Thomas most likely using in this case?", "options": {"A": "Follow TCP Stream", "B": "Display Filtering by Protocol", "C": "Filtering by IP Address", "D": "Monitoring the Specific Ports"}, "answer": "A"}, {"num": 388, "text": "During a quarterly security audit at a financial services company in Charlotte,\nNorth Carolina, you are tasked with reviewing exposed services on legacy\nservers inherited from a third-party vendor. While scanning, you discover that\nTCP port 1434 is open on a database node that is not listed in the company’s\nactive inventory. The IT team has no records explaining why this service is\nrunning, and you are asked to determine whether the exposure of this port\ncould indicate an unnecessary database-related risk. Based on standardized\nport assignments, which service is most likely running on this port and requires\nfurther review?", "options": {"A": "sql*net", "B": "ms-sql-m", "C": "ms-sql-s", "D": "sqlsrv"}, "answer": "C"}, {"num": 389, "text": "During a quarterly vulnerability management review at RedCore Motors, Priya\nfinalizes the deployment of Nessus Essentials across the company’s IT\ninfrastructure. The solution is selected for its ability to support diverse\ntechnologies including operating systems, databases, web servers, and virtual\nenvironments. While preparing a training session for junior analysts, Priya asks\n\nthem to identify a capability that Nessus Essentials is specifically designed to\nprovide as part of its scanning process.", "options": {"A": "High-speed asset discovery", "B": "Agent-based detection", "C": "Checks for outdated versions of over 1250 servers", "D": "Patch management for operating systems and third-party applications"}, "answer": "C"}, {"num": 390, "text": "Noah Kim, an ethical hacker at Quantum Cyber Solutions in Austin, Texas, is\nassessing iPhones used for proprietary development. On one device, he\ndemonstrates a technique that allows it to boot normally without a computer,\nbut the elevated access is temporarily lost after restart until the user launches\na special on-device app to reapply the modifications. Which jailbreaking\nmethod is this?", "options": {"A": "Semi-untethered Jailbreaking", "B": "Untethered Jailbreaking", "C": "Semi-tethered Jailbreaking", "D": "Tethered Jailbreaking"}, "answer": "A"}, {"num": 391, "text": "During a covert assessment at a logistics company in Dallas, penetration tester\n\nEmily delivers a disguised attachment to test employee awareness. When a staff\nmember opens the file, normal content appears, but behind the scenes the\nattacker quietly gains full access to the workstation. Over the following week,\nEmily monitors emails, keystrokes, and local files without alerting the user,\nconfirming long-term stealthy control of the machine.\n\nWhich type of malware is most likely responsible for this activity?", "options": {"A": "Remote Access Trojan (RAT)", "B": "Adware", "C": "Botnet", "D": "Spyware"}, "answer": "A"}, {"num": 392, "text": "Maya Patel from SecureHorizon Consulting is investigating a breach at Dallas\nGeneral Hospital in Texas after a nurse misplaced a smartphone containing\npatient management software. Although the device remained active on the\n\nnetwork, administrators had no way to identify its physical whereabouts,\ndelaying incident response and allowing sensitive medical records to be\nexposed for hours. Which mobile security guideline would have most directly\nreduced the impact of this incident?", "options": {"A": "Install device tracking software that allows the device to be located remotely", "B": "Use anti-virus and data loss prevention (DLP) solutions", "C": "Utilize a secure VPN connection while accessing public Wi-Fi networks", "D": "Register devices with a remote locate and wipe facility"}, "answer": "D"}, {"num": 393, "text": "During a penetration test at Cascade Financial in Raleigh, ethical hacker Ethan\nBrooks evaluates the security of the company’s authentication system. He\nobserves that the application accepts a high volume of repeated credential\nsubmissions without introducing any additional challenge, allowing automated\nscripts to cycle rapidly through large password lists. Ethan advises the IT team\nto deploy a control that forces interaction steps designed to disrupt\nautomation.\n\nWhich countermeasure should the IT team adopt in this scenario?", "options": {"A": "Use CAPTCHA challenges on login and registration pages", "B": "Use strong hashing algorithms", "C": "Force periodic password changes", "D": "Implement 2FA/MFA"}, "answer": "A"}, {"num": 394, "text": "At Bayview University in San Francisco, California, ethical hacker Sofia Patel is\nevaluating security controls on Android 11 tablets used by staff. To simulate an\nattack, she installs KingoRoot.apk directly on one of the devices. The\napplication leverages system vulnerabilities to elevate privileges without\nrequiring a computer connection. Based on the module, which feature of this\nrooting approach makes the attack effective?", "options": {"A": "It exploits Bluetooth pairing flaws to gain device-level privileges", "B": "It uses a tethered jailbreak to restart the device with patched kernel functions", "C": "It relies on weak SSL validation to bypass application controls", "D": "It is an APK that can run directly on the device without a PC"}, "answer": "D"}, {"num": 395, "text": "You are Maya, a security engineer at HarborPoint Cloud Services in Chicago,\n\nIllinois, performing a post-incident hardening review after an internal audit\nflagged multiple services that rely on legacy public-key algorithms. The\nengineering team must prioritize actions company-wide to reduce long-term\nrisk from future quantum-capable adversaries while development continues on\na large refactor of several services. Which proactive control should Maya\nrecommend as the highest-priority change to embed into the organization’s\n\ndevelopment lifecycle to improve future resistance to quantum-based attacks?", "options": {"A": "Use quantum-specific firewalls to protect quantum communication channels", "B": "Include quantum-resistance checks in SDLC and code review processes", "C": "Break data into fragments and distribute it across multiple locations", "D": "Encrypt stored data with quantum-resistant algorithms"}, "answer": "B"}, {"num": 396, "text": "During an external security review of a manufacturing firm in Detroit, Michigan,\nyou’re asked to prioritize patch baselines for internet-facing servers without\nlogging in or establishing full sessions. To achieve this, you analyze network-\nlevel responses and capture application output in order to determine the\nunderlying system and its software release. Which technique best fits this\nobjective?", "options": {"A": "Service Version Discovery", "B": "Vulnerability Scanning", "C": "Port Scanning", "D": "OS Discovery"}, "answer": "A"}, {"num": 397, "text": "A financial startup in Chicago hires an ethical hacker to evaluate its exposure on\n\nhidden networks. The client is particularly concerned that confidential\nadministrative documents might be circulating on .onion sites. To remain\npassive, the hacker relies on advanced search filters to look for files with\nheaders suggesting management-related content. Which of the following\nqueries would best meet this objective?", "options": {"A": "filetype:pdf intitle:”admin access” site:onion", "B": "filetype:docx intitle:”user accounts” site:onion", "C": "filetype:docx intitle:”login credentials”", "D": "filetype:pdf intitle:”secure login” site:onion"}, "answer": "A"}, {"num": 398, "text": "You are a cybersecurity consultant at FortiSec, advising DesertTech Innovations\nin Phoenix, Arizona. The company wants to modernize its Wi-Fi so that even if\nan attacker obtains a captured handshake or a weak passphrase, they cannot\n\nperform offline dictionary attacks or recover session keys; management also\nwants stronger, per-session encryption and protection for IoT devices without\nrelying on a single shared password.           5o\nWhich wireless security measure should DesertTech implement to meet these\n\ngoals?", "options": {"A": "Disable TKIP", "B": "Upgrade to WPA3", "C": "Use 802.1X Authentication", "D": "MAC Address Filtering"}, "answer": "B"}, {"num": 399, "text": "You are Evelyn, an ethical hacker at LoneStar Health in Austin, Texas, engaged to\ninvestigate a recent compromise of archived patient records. During the\ninvestigation you recover a large set of encrypted records from a compromised\nbackup and, separately, obtain several original template records (standard\nheaders and form fields) that correspond to some entries in the encrypted set.\nYou plan to use these paired examples (the original templates and their\nencrypted counterparts) to attempt to recover keys or deduce other plaintext\nvalues. Which cryptanalytic approach is most appropriate for this situation?", "options": {"A": "Ciphertext-only attack", "B": "Chosen-plaintext attack", "C": "Chosen-ciphertext attack", "D": "Known-plaintext attack"}, "answer": "D"}, {"num": 400, "text": "During a penetration test at a financial services firm in Boston, ethical hacker\nDaniel simulates a DDoS against the customer portal. To handle the surge, the\nIT team sets a rule that caps the number of requests a single user can make per\nsecond; aggressive connections are delayed or dropped while most legitimate\ncustomers continue to use the service. Which countermeasure strategy is the IT\nteam primarily using?", "options": {"A": "Shutting Down Services", "B": "Rate Limiting", "C": "Degrading Services", "D": "Absorb the Attack"}, "answer": "B"}, {"num": 401, "text": "During a penetration test at a manufacturing company in Detroit, Amanda, a\nsenior security consultant, scans several legacy Linux servers. On one host, she\ndiscovers an open port used for file transfer that allows anonymous login. Once\n\nconnected, she is able to view the directory structure and check available files,\nwhich helps her identify potential sensitive information exposure. She also\nnotices background traffic on a UDP service related to NetBIOS name lookups,\nbut she continues probing the file transfer service to confirm user access\nweaknesses.\n\nWhich ports and services should Amanda prioritize for this enumeration\n\nactivity?", "options": {"A": "TCP 21 and UDP 137", "B": "TCP 139 and UDP 137, 138", "C": "TCP 23 and UDP 137, 138", "D": "TCP 25 and UDP 138"}, "answer": "A"}, {"num": 402, "text": "In Miami, Florida, a luxury resort deploys smart climate control units in guest\nrooms. During a red team engagement, ethical hacker Sophia Bennett discovers\nthat once a compromised device is restarted, it continues running altered\ninstructions without any integrity check before the operating system loads. This\nallows tampered firmware to run as if it were legitimate.\n\nWhich secure development practice would most directly prevent this weakness?", "options": {"A": "Utilize secure communication protocols", "B": "Allow code signing", "C": "Secure firmware or software updates", "D": "Ensure secure boot"}, "answer": "D"}, {"num": 403, "text": "During a penetration test at IntelliCore Systems in Raleigh, North Carolina,\nethical hacker Javier directs a wave of repetitive web requests against the\ncompany’s portal that overload backend scripts which process search queries\nand form submissions. As a result, legitimate customers experience long delays\nand occasional timeouts while attempting to log in or complete transactions.\n\nWhich DoS/DDoS technique is Javier most likely demonstrating?", "options": {"A": "UDP Flood", "B": "Slowloris", "C": "Peer-to-Peer Attack", "D": "HTTP GET/POST Attack"}, "answer": "D"}, {"num": 404, "text": "You are an ethical hacker at Apex Cyber Defense contracted to audit Coastal\nHealthcare’s wireless estate in Miami, Florida. During a network sweep, your\nlogs show a previously unknown access point physically connected to the\n\nhospital’s internal switch and issuing IP addresses to devices on the corporate\nVLAN – it was neither provisioned by IT nor listed in the asset inventory. The\ndevice is relaying internal traffic and providing remote connectivity back to an\nexternal host. Based on the observed behavior, which wireless threat has the\nattacker most likely introduced?", "options": {"A": "Misconfigured AP", "B": "Honeypot AP", "C": "Rogue AP", "D": "Evil Twin AP"}, "answer": "C"}, {"num": 405, "text": "During a penetration test at a logistics company in Atlanta, Georgia, you\nexamine the configuration of network devices and discover that they rely on\nlegacy communication mechanisms lacking encryption and integrity checks.\nThese mechanisms allow neighboring systems to exchange operational data\nwithout verification, exposing the infrastructure to potential manipulation.\nWhat type of vulnerability is most clearly present?", "options": {"A": "Lack of password protection", "B": "Insecure routing protocols", "C": "Lack of authentication", "D": "Firewall vulnerabilities"}, "answer": "C"}, {"num": 406, "text": "During a red team assessment at Apex Technologies in Austin, ethical hacker\n\nRyan tests whether employees can be tricked into disclosing sensitive data over\nthe phone. He poses as a vendor requesting payment details and reaches out to\nseveral staff members. To evaluate defenses, the security team emphasizes that\nbeyond general training, there is a practical step employees must apply in every\ninteraction to avoid being deceived by such calls.\n\nWhich countermeasure should Apex Technologies prioritize to directly prevent\nthis type of social engineering attempt?", "options": {"A": "Conduct security awareness programs", "B": "Use two-factor authentication", "C": "Employees must verify the identity of individuals requesting information", "D": "Establish policies and procedures"}, "answer": "C"}, {"num": 407, "text": "During a penetration test at a shipping company in Miami, ethical hacker Daniel\n\ndelivers a disguised email attachment containing a hidden payload. Once\nexecuted by employees, the compromised workstations begin to silently\ncommunicate with a remote server under Daniel’s control. Over the following\nweek, he confirms that multiple infected endpoints can receive synchronized\ncommands and perform background tasks simultaneously, including sending\nbursts of outbound traffic on demand.\n\nWhich type of malicious component is Daniel most likely simulating in this\n\nassessment?", "options": {"A": "Botnet Agents", "B": "Scareware", "C": "Spyware", "D": "Potentially Unwanted Applications (PUAs)"}, "answer": "A"}, {"num": 408, "text": "During a penetration test at Pacific Trust Bank in Seattle, ethical hacker Mia\nChen suspects that a server hosting customer transaction data may be a\nhoneypot. To investigate, she repeatedly sends crafted queries and observes\nhow quickly the system responds. She notices that responses are consistently\nfaster and more uniform than those of other production servers, raising her\nsuspicion that the environment is designed to lure attackers.\n\nWhich technique is Mia most likely using to determine if the server is a\nhoneypot?", "options": {"A": "Fingerprinting the Running Service", "B": "Analyzing System Configuration and Metadata", "C": "Analyzing MAC Address", "D": "Analyzing Response Time"}, "answer": "D"}, {"num": 409, "text": "At Horizon Legal Services in Boston, Massachusetts, ethical hacker Daniel Price\nis tasked with assessing the security of the firm’s mobile case-tracking app.\nDuring testing, he finds that confidential case notes and client records are kept\nlocally on the device without encryption. By browsing the file system with a\nstandard explorer tool, he can open sensitive information without any\nauthentication.\n\nWhich OWASP Top 10 Mobile Risk is most clearly present in the app?", "options": {"A": "Insecure Communication", "B": "Inadequate Privacy Controls", "C": "Improper Credential Usage", "D": "Insecure Data Storage"}, "answer": "D"}, {"num": 410, "text": "At a New York-based e-commerce company preparing for Black Friday sales,\nanalyst Sarah evaluates cloud billing practices. She notices that the provider\ntracks compute hours, storage usage, and bandwidth consumption in detail,\nenabling the company to pay only for what is consumed while also supporting\naudits. Which cloud computing characteristic best explains this feature?", "options": {"A": "On-demand self-service", "B": "Broad network access", "C": "Measured service", "D": "Resource pooling"}, "answer": "C"}, {"num": 411, "text": "During a red team engagement at a retail company in Atlanta, ethical hacker\nJames crafts a session with the company’s shopping portal and deliberately\nshares that session ID with an unsuspecting employee by embedding it in a link.\nWhen the employee clicks and logs in, their activity is bound to the attacker’s\npre-assigned session. Later, James retrieves the employee’s input from that\nsame session to demonstrate the flaw to management.\n\nWhich session hijacking technique is James most likely using?", "options": {"A": "Session Prediction", "B": "Session Fixation Attack", "C": "Session Replay Attack", "D": "Session Donation Attack"}, "answer": "B"}, {"num": 412, "text": "During a security review for a healthcare provider in Denver, Colorado, Ava\nexamines the header of a suspicious message to map the sender’s outbound\nemail infrastructure. Her goal is to identify which specific system on the\nsender’s side processed the message so the team can understand where the\ntransmission originated within that environment. Which detail from the email\nheader should she examine to determine this?", "options": {"A": "Authentication system used by sender’s mail server", "B": "Sender’s IP address", "C": "Sender’s mail server", "D": "Date and time of message sent"}, "answer": "C"}, {"num": 413, "text": "During a quarterly vulnerability management cycle at a multinational logistics\nfirm, Priya’s team has already applied patches and fixes to address confirmed\nvulnerabilities. Now, she directs the analysts to run follow-up scans and review\n\nthe attack surface to confirm that the applied remedies have effectively\neliminated the risks. Only after this step will she prepare a compliance report\nfor the executive board.                    5o\nWhich phase of the Vulnerability-Management Life Cycle is Priya executing?", "options": {"A": "Remediation", "B": "Monitoring", "C": "Risk Assessment", "D": "Verification"}, "answer": "D"}, {"num": 414, "text": "At a federal research agency, cybersecurity officer Nikhil is drafting a\nvulnerability assessment report. In this section, he documents the scanning\nmethodology used, the information about the targets, the type and scope of\nscans performed, and the tools involved. He does not yet include specific\nvulnerabilities or affected assets, as this portion of the report is meant to\nprovide context for how the assessment was conducted. Which section of the\nvulnerability assessment report is Nikhil working on?", "options": {"A": "Risk Assessment", "B": "Assessment Overview", "C": "Supporting Information", "D": "Findings"}, "answer": "B"}, {"num": 415, "text": "During an assessment for a tech company in Seattle, Washington, an ethical\nhacker seeks to uncover details about the organization’s domain ownership to\nidentify potential points of contact. She uses an online service to retrieve\npublicly available records without direct interaction with the target. Which\nmethod is she most likely employing to achieve this?", "options": {"A": "Email footprinting", "B": "DNS interrogation", "C": "Network footprinting", "D": "Whois lookup"}, "answer": "D"}, {"num": 416, "text": "You are an ethical hacker at Titan Cyber Defense, hired by BrightWave\nPublishing in New York City to assess the security of their content management\nsystem (CMS). While testing the article search function, you input malformed\n\nstrings such as multiple single quotes. The application responds with system\nfeedback that unexpectedly reveals the database type and internal query\nstructure, including table and column information. You use these disclosures to\nbetter understand how the backend query is built.\n\nWhich of the following methods to detect SQL injection are you employing?", "options": {"A": "Fuzz Testing", "B": "Testing String", "C": "Dynamic Testing", "D": "Function Testing"}, "answer": "B"}, {"num": 417, "text": "You are an ethical hacker at ShieldPoint Security, hired by Pinecrest Travel\nAgency in Orlando, Florida, to perform a penetration test on their flight booking\nportal. During testing, you notice that normal SQL injection attempts are\nblocked by a security filter. To bypass it, you adjust your input so that key SQL\nkeywords are broken apart with unexpected symbols, allowing the database to\ninterpret them correctly while evading the filter. This manipulation allows you\nto retrieve hidden booking records despite the filter’s restrictions. Based on the\nobserved behavior, which SQL injection evasion technique are you employing?", "options": {"A": "Null Byte", "B": "Hex Encoding", "C": "In-line Comment", "D": "String Concatenation"}, "answer": "C"}, {"num": 418, "text": "During a physical penetration test at Sterling Electronics in Cleveland, ethical\nhacker Priya waits near the employee entrance during a shift change. When a\ngroup of staff enters the building using their access cards, Priya closely follows\nbehind without swiping her own badge. None of the employees confront her,\nassuming she belongs there. Once inside, Priya proceeds to the break area\nwhere she documents the success of the exercise.\n\nWhich social engineering technique is Priya demonstrating?", "options": {"A": "Dumpster Diving", "B": "Tailgating", "C": "Shoulder Surfing", "D": "Piggybacking"}, "answer": "B"}, {"num": 419, "text": "During a penetration test at Greenview Credit Union in Chicago, Illinois, ethical\n\nhacker Rebecca Hayes simulates an attacker who contacts employees using a\nvoice channel. The number displayed on their devices appears identical to the\ninstitution’s official line, convincing staff that the request is legitimate. Rebecca\nthen asks for account credentials under the pretense of a mandatory security\ncheck.\n\nWhich mobile attack vector is she demonstrating?", "options": {"A": "Call Spoofing", "B": "SMiShing", "C": "OTP Hijacking", "D": "Bluebugging"}, "answer": "A"}, {"num": 420, "text": "During a stealth penetration test at a defense research facility, ethical hacker\nDaniel installs a payload that survives even after multiple operating system\nreinstalls. The implant resides deep inside the system hardware and executes\nbefore the OS is loaded, ensuring that forensic scans and antivirus tools at the\nOS level cannot detect or remove it. Administrators notice unusual activity on\nnetwork cards and storage devices, but repeated scans show no malware traces\nwithin the file system. Which type of rootkit most likely enabled this level of\npersistence?", "options": {"A": "Hypervisor-Level Rootkit", "B": "Hardware/Firmware Rootkit", "C": "Kernel-Level Rootkit", "D": "Boot-Loader-Level Rootkit"}, "answer": "B"}, {"num": 421, "text": "During a penetration test at Triangle FinTech in Raleigh, North Carolina, ethical\nhacker Ethan attempts to bypass the company’s perimeter firewall. Instead of\nsending obvious malicious payloads, he encapsulates his traffic inside standard\nweb requests on port 80, blending in with normal browsing activity. This\nmethod allows his packets to slip past perimeter defenses that are not\nperforming deep application inspection.\n\nWhich firewall evasion technique is Ethan most likely using?", "options": {"A": "Tiny Fragments", "B": "Source Routing", "C": "DNS Tunneling", "D": "HTTP Tunneling"}, "answer": "D"}, {"num": 422, "text": "You are an ethical hacker at SilverRock Security, engaged by BayState Credit\n\nUnion in Boston, Massachusetts, to evaluate their online loan application\nportal. While testing the customer dashboard, you inject crafted input into a\nnumeric parameter. Instead of returning only the expected loan details, the\nresponse also displays sensitive employee information from another table,\nmerged into the same page results. This behavior indicates that the attacker’s\ninput successfully combined multiple datasets into a single output. Based on\n\nthe observed behavior, which type of SQL injection attack are you exploiting?", "options": {"A": "Second-Order SQL Injection", "B": "Blind SQL Injection", "C": "UNION SQL Injection", "D": "Error-Based SQL Injection"}, "answer": "C"}, {"num": 423, "text": "During a red team exercise at Apex Logistics in Denver, ethical hacker Rachel\nlaunches controlled packet injection attacks to simulate session hijacking\nattempts. The client’s IT team wants a way to automatically detect such\nabnormal behaviors across the network in real time, instead of relying on\nmanual analysis. They decide to deploy a monitoring system capable of flagging\nsuspicious session activity based on predefined rules and traffic signatures.\n\nWhich detection method best fits the IT team’s requirement?", "options": {"A": "Use an Intrusion Detection System (IDS)", "B": "Monitor for ACK storms", "C": "Perform manual packet analysis using sniffing tools", "D": "Check for predictable session tokens"}, "answer": "A"}, {"num": 424, "text": "During a reconnaissance engagement at a law firm in Houston, Texas, you are\ntasked with analyzing the physical movement of employees through their\npublicly shared media. By examining geotagged images and mapping them to\nspecific locations, you aim to evaluate whether staff are unintentionally\ndisclosing sensitive information about office routines. Which tool from the\nreconnaissance toolkit would best support this task?", "options": {"A": "Social Searcher", "B": "Sherlock", "C": "Creepy", "D": "Maltego"}, "answer": "C"}, {"num": 425, "text": "Joe, a cybersecurity analyst at Norwest Freight Services, has been assigned to\nrun a vulnerability scan across the organization’s infrastructure. He is\nspecifically tasked with detecting weaknesses such as missing patches,\n\nunnecessary services, weak encryption, and authentication flaws across\nmultiple servers. His scan identifies open ports and active services throughout\nthe environment, providing a clear map of potential entry points for attackers.\nWhich type of vulnerability scanning BEST matches Joe’s assignment?", "options": {"A": "Application Scanning", "B": "Host-based Scanning", "C": "External Scanning", "D": "Network-based Scanning"}, "answer": "D"}, {"num": 426, "text": "You are Michael, an ethical hacker at a New York-based e-commerce company\nperforming a security review of their payment-signing service. While observing\nthe signing process (without access to private keys), you note the service\ngenerates a fresh random value for each signature operation, the signature\nalgorithm uses modular arithmetic in a subgroup defined by public domain\nparameters, and signatures are verified with a public verification key rather\nthan by decrypting the message. Which asymmetric algorithm best matches the\nsigning mechanism you observed?", "options": {"A": "ElGamal", "B": "Diffie-Hellman", "C": "RSA", "D": "DSA"}, "answer": "D"}, {"num": 427, "text": "At a Chicago-based healthcare provider, security engineer Emily reviews the\nmigration of critical applications to a cloud service. During her evaluation, she\nnotes that administrators can provision new servers, increase storage, and\nexpand compute power instantly through a web dashboard without any manual\ninvolvement from the cloud provider. Which NIST-defined characteristic of cloud\ncomputing best explains this capability?", "options": {"A": "Measured service", "B": "Resource pooling", "C": "Broad network access", "D": "On-demand self-service"}, "answer": "D"}, {"num": 428, "text": "During a security assessment for an e-commerce company in Boston,\nMassachusetts, your team conducts a reconnaissance phase to identify\npotential entry points into the organization’s communication infrastructure. You\n\nfocus on gathering details about the systems responsible for handling incoming\nemail traffic, avoiding active network probing, and relying on passive DNS data\ncollection. Given this objective, which DNS record type should you query to\nextract information about the target’s mail server configuration?", "options": {"A": "TXT", "B": "MX", "C": "NS", "D": "SOA"}, "answer": "B"}, {"num": 429, "text": "In the sunlit tech oasis of Phoenix, Arizona, ethical hacker Nadia Patel explores\nthe security posture of LearnSphere, a U.S.-based e-learning platform serving\nthousands of students. During her testing, Nadia intentionally submits invalid\ninputs to the platform’s content delivery system. Instead of returning a generic\nfailure notice, the application responds with detailed system information,\nincluding database query strings and directory paths. Such responses provide\nattackers with valuable insights into the application’s internal workings, which\ncould be used to craft more precise and damaging attacks.", "options": {"A": "Verbose Error Messages", "B": "CORS Misconfiguration", "C": "Directory Traversal", "D": "Improper Error Handling"}, "answer": "A"}, {"num": 430, "text": "You are an ethical hacker at RedOak Cyber Solutions, contracted to perform a\npenetration test for MetroHealth Hospital in Cleveland, Ohio. While assessing\nthe hospital’s appointment booking portal, you craft and submit multiple\nmalicious inputs into the patient search field. One of your payloads successfully\nmanipulates the backend query, returning additional appointment data that\nwas not intended to be displayed.\n\nBased on the observed behavior, which step of the SQL injection methodology\nare you performing?", "options": {"A": "Launching SQL Injection Attacks", "B": "Database Enumeration", "C": "Information Gathering and Vulnerability Detection", "D": "Identifying Data Entry Paths"}, "answer": "A"}, {"num": 431, "text": "During a security assessment of a fintech startup in San Francisco, ethical\nhacker Michael analyzes the company’s cloud platform. He observes that the\nsystem automates deployment, scaling, service discovery, and workload\nmanagement across multiple nodes, ensuring smooth operation of critical\nservices without requiring manual coordination. Which Kubernetes capability is\nprimarily responsible for these functions?", "options": {"A": "Self-healing", "B": "Kube-controller-manager", "C": "Container orchestration", "D": "Container vulnerabilities"}, "answer": "C"}, {"num": 432, "text": "During a penetration test at Cascade Financial in Seattle, ethical hacker Elena\nVasquez probes the input handling of the company’s web server. She discovers\nthat a single crafted request is processed as two separate ones, allowing her to\ninject malicious data into the server’s communication. This type of attack falls\ninto the same category of input validation flaws as cross-site scripting (XSS),\ncross-site request forgery (CSRF), and SQL injection.\n\nWhich type of web server attack is Elena most likely demonstrating?", "options": {"A": "HTTP Response Splitting Attack", "B": "Password Cracking Attack", "C": "Web Cache Poisoning Attack", "D": "Directory Traversal Attack"}, "answer": "A"}, {"num": 433, "text": "During a penetration test at Windy City Enterprises in Chicago, ethical hacker\nMia Torres targets the company’s public-facing site. By exploiting an unpatched\nvulnerability in the web server, she manages to alter visible content on the\nhomepage, replacing it with unauthorized messages. Mia explains to the IT team\nthat this kind of attack can damage the company’s reputation and erode\ncustomer trust, even if sensitive data is not directly stolen.\n\nWhich type of web server attack is Mia most likely demonstrating?", "options": {"A": "Frontjacking", "B": "File Upload Exploits", "C": "Website Defacement", "D": "DNS Hijacking"}, "answer": "C"}, {"num": 434, "text": "You are Riley, an incident responder at NovaEx Crypto in San Antonio, Texas,\n\ntasked with investigating a recent double-spend reported by a retail merchant\nthat accepts the exchange’s token. Your telemetry shows that a reseller node\nused by the merchant received blocks only from a small, fixed set of peers fo
