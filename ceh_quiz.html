<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH 312-50v13 練習題 Q250–Q500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #00e5ff;
    --accent2: #ff6b6b;
    --success: #3fb950;
    --warn: #f78166;
    --text: #e6edf3;
    --muted: #7d8590;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    display: flex;
    gap: 0;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 120px;
    max-width: 600px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-resize {
    position: absolute;
    right: 0;
    top: 0;
    width: 5px;
    height: 100%;
    cursor: col-resize;
    background: transparent;
    z-index: 20;
    transition: background 0.15s;
  }
  #sidebar-resize:hover, #sidebar-resize.dragging {
    background: var(--accent);
    opacity: 0.5;
  }

  #sidebar-header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  #sidebar-header p {
    font-size: 12px;
    color: var(--muted);
  }

  #wrong-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
  }

  #wrong-list::-webkit-scrollbar { width: 4px; }
  #wrong-list::-webkit-scrollbar-track { background: transparent; }
  #wrong-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .wrong-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }

  .wrong-item:hover { background: var(--surface2); }

  .wrong-item .qnum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    min-width: 50px;
  }

  .wrong-item .wrong-ans {
    font-size: 11px;
    color: var(--warn);
    font-family: 'JetBrains Mono', monospace;
  }

  .wrong-item .right-ans {
    font-size: 11px;
    color: var(--success);
    font-family: 'JetBrains Mono', monospace;
    margin-left: auto;
  }

  #empty-msg {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 30px 10px;
    line-height: 1.8;
  }

  #stats-bar {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  #stats-bar span { color: var(--text); }

  /* ── Main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 100vh;
  }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #topbar h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  #topbar h1 span { color: var(--accent); }

  #page-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  #progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.4s ease;
  }

  #quiz-area {
    flex: 1;
    padding: 32px 32px 20px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 24px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .question-card.answered { border-color: var(--border); }
  .question-card.correct { border-color: var(--success); }
  .question-card.wrong { border-color: var(--warn); }

  .q-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
    background: rgba(0,229,255,0.08);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(0,229,255,0.2);
  }

  .q-status-icon {
    margin-left: auto;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .question-card.correct .q-status-icon { opacity: 1; }
  .question-card.wrong .q-status-icon { opacity: 1; }

  .q-text {
    padding: 18px 20px 16px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
  }

  .options {
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    line-height: 1.5;
    user-select: text;
    -webkit-user-select: text;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.04);
    border-color: rgba(0,229,255,0.4);
    transform: translateX(2px);
  }

  .option-btn:disabled { cursor: default; }
  .option-btn.submitted-state { cursor: default; }

  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    min-width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: var(--border);
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option-btn.selected .opt-letter {
    background: rgba(0,229,255,0.2);
    color: var(--accent);
  }

  .option-btn.correct-ans .opt-letter {
    background: rgba(63,185,80,0.25);
    color: var(--success);
  }

  .option-btn.wrong-ans .opt-letter {
    background: rgba(247,129,102,0.25);
    color: var(--warn);
  }

  .option-btn.correct-ans {
    background: rgba(63,185,80,0.06);
    border-color: rgba(63,185,80,0.4);
  }

  .option-btn.wrong-ans {
    background: rgba(247,129,102,0.06);
    border-color: rgba(247,129,102,0.4);
  }

  .submit-row {
    padding: 0 16px 16px;
  }

  .submit-btn {
    padding: 9px 22px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .submit-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
  .submit-btn.submitted { background: var(--border); color: var(--muted); }

  .answer-reveal {
    margin: 0 16px 16px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    display: none;
    font-family: 'JetBrains Mono', monospace;
  }

  .answer-reveal.show { display: block; }
  .answer-reveal.ok { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
  .answer-reveal.no { background: rgba(247,129,102,0.1); color: var(--warn); border: 1px solid rgba(247,129,102,0.3); }

  /* ── Pagination ── */
  #pagination {
    padding: 24px 32px 40px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .page-btn {
    padding: 10px 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 1px;
  }

  .page-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .page-btn:disabled { opacity: 0.3; cursor: default; }

  #page-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }

  .page-dot {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-dot:hover { border-color: var(--accent); color: var(--accent); }
  .page-dot.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .page-dot.has-wrong { border-color: var(--warn); color: var(--warn); }
  .page-dot.active.has-wrong { background: var(--warn); color: #000; }
  .page-dot.all-correct { border-color: var(--success); color: var(--success); }
  .page-dot.active.all-correct { background: var(--success); color: #000; }

  /* scrollbar main */
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: transparent; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 700px) {
    #sidebar { display: none; }
    #quiz-area { padding: 16px; }
    #pagination { padding: 16px 16px 32px; }
    #topbar { padding: 12px 16px; }
    #page-dots { max-width: 260px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-resize"></div>
  <div id="sidebar-header">
    <h2>錯題紀錄</h2>

  </div>

  </div>
</div>

<script>
const QUESTIONS = [{"num": 250, "text": "In the bustling digital marketplace of Miami’s tech corridor, ethical hacker Sofia\nAlvarez probes the virtual defenses of RetailRush, a US-based online retailer\nhosting thousands of daily transactions. Tasked with exposing weaknesses in\nthe web server’s URL processing, Sofia submits crafted requests to manipulate\nresource paths. Her tests uncover a severe flaw: the server grants access to\nrestricted system files, exposing sensitive configuration data. Further scrutiny\nreveals the issue stems from the server’s failure to validate input paths, not\nfrom header manipulation, cached content tampering, or credential\ncompromise. Committed to hardening the platform, Sofia drafts a precise report\nto direct the security team toward immediate fixes. Which web server attack\n\ntype is Sofia most likely exploiting in Retail Rush’s web server?", "options": {"A": "Directory Traversal Attack", "B": "Web Cache Poisoning Attack", "C": "FTTP Response Splitting Attack", "D": "Password Cracking Attack"}, "answer": "A"}, {"num": 251, "text": "In downtown Chicago, Illinois, security analyst Mia Torres investigates a breach\nat Windy City Enterprises, a logistics firm running an Apache HTTP Server. The\nattacker exploited a known vulnerability in an outdated version, gaining\nunauthorized access to customer shipment data. Mia’s analysis reveals the\nserver lacked recent security updates, leaving it susceptible to remote code\nexecution. Determined to prevent future incidents, Mia recommends a strategy\nto the IT team to address this exposure.\n\nWhich approach should Mia recommend to secure Windy City Enterprises’\nApache HTTP Server against such vulnerabilities?", "options": {"A": "Eliminate unnecessary flies within the jar files", "B": "Block all unnecessary ports, ICMP traffic, and unnecessary protocols such as NetBIOS and SMB", "C": "Use a dedicated machine as a web server", "D": "Conduct an extensive risk assessment to determine which segments of the network are most vulnerable or at high risk that need to be patched first"}, "answer": "D"}, {"num": 252, "text": "You are part of the red team assigned to evaluate the physical and social\nvulnerabilities of a government contractor’s office located in a metropolitan\nbusiness hub. During your pretexting phase, you decide to simulate the role of a\nthird-party IT technician. Upon arrival, the receptionist allows you entry without\nverification, assuming you’re there for scheduled printer maintenance. While\nmoving through the workspace, you casually observe open terminals,\nunattended printouts, and discarded sticky notes at workstations. You later\nreport several user credentials and partial access details acquired during this\nvisit.\n\nWhich social engineering technique does this scenario best illustrate?", "options": {"A": "Shoulder Surfing", "B": "Eavesdropping", "C": "Impersonation", "D": "Dumpster Diving"}, "answer": "C"}, {"num": 253, "text": "Emma, an ethical hacker at a Chicago-based healthcare provider, is performing\na penetration test on the organization’s patient record system following a\nrecent data breach. During her investigation, she discovers that attackers\ngained access to a large volume of encrypted patient records but had no\nknowledge of the original data or encryption keys. Emma observes that the\nsystem uses a block cipher and suspects the attackers may have applied a\ncryptanalytic method that examines encrypted outputs in bulk to detect\nstructural or statistical patterns in the encrypted data.\n\nWhich cryptanalysis technique should Emma investigate to assess the system’s\nvulnerability in this scenario?", "options": {"A": "Chosen-plaintext attack", "B": "Known plaintext attack", "C": "Chosen-ciphertext attack", "D": "Ciphertext-only attack"}, "answer": "D"}, {"num": 254, "text": "During a post-exploitation phase in a network compromise simulation, ethical\nhacker Devon Hughes gains a Meterpreter session on a manager’s Windows 10\nworkstation. To maintain stealth, he avoids actions that generate obvious signs\nof tampering such as privilege escalation or file system changes. Instead, he\nwants to monitor the user’s live activity over time without their knowledge,\nfocusing specifically on input patterns and active sessions.\n\nWhich Meterpreter command should he use to achieve this objective with\nminimal visibility?", "options": {"A": "keyscan_start", "B": "hashdump", "C": "persistence", "D": "getsystem"}, "answer": "A"}, {"num": 255, "text": "You are Ethan Brooks, an ethical hacker at Vanguard Security Solutions, hired to\nperform a wireless penetration test for Pacific Logistics, a shipping company in\nSeattle, Washington. Your task is to identify all Wi-Fi networks in range without\nalerting the network administrators. Using a laptop with a Wi-Fi card, you\nmonitor radio channels to detect access points and their BSSiDs without\nsending any probe requests or injecting data packets. Based on the described\nmethod, which Wi-Fi discovery technique are you employing?", "options": {"A": "Network Discovery Software", "B": "Passive Footprinting", "C": "Wash Command", "D": "Active Footprinting"}, "answer": "B"}, {"num": 256, "text": "During a penetration testing engagement at First Union Bank in Chicago, ethical\n\nhacker Rachel Morgan is assigned to assess the internal network for potential\nsniffing activity that could compromise sensitive customer data. While\ninspecting traffic in the loan processing department, Rachel observes that a\nworkstation is receiving packets not addressed to it, raising suspicion of a\nsniffing tool operating in promiscuous mode. To validate her hypothesis, she\nprepares to conduct an active verification using a classic detection approach.\n\nWhich detection technique should Rachel use to confirm the presence of a\n\nsniffer in this case?", "options": {"A": "Sniffer detection using an NSE script to check for promiscuous mode", "B": "DNS method by monitoring reverse DNS lookup traffic", "C": "ARP method by sending non-broadcast ARP requests", "D": "Ping method by sending packets with an incorrect MAC address"}, "answer": "C"}, {"num": 257, "text": "During an internal red team engagement at Orion Tech Labs, a leading software\nfirm in Austin, Texas, ethical hacker Emily Carter was tasked with evaluating the\nresilience of the organization’s software deployment processes. Knowing that\nthe finance team frequently downloaded utility tools for generating PDFs, she\nrepackaged a trusted PDF converter installer with a secondary payload. When\nan employee executed the installer, the converter installed and functioned\nnormally, but in the background, a hidden executable silently initiated\noutbound network communication. The user remained unaware of any\nsuspicious activity.\n\nWhich technique did Emily most likely use to ensure the malware executed\n\nalongside the legitimate application?", "options": {"A": "Downloader", "B": "Packer", "C": "Dropper", "D": "Wrapper"}, "answer": "D"}, {"num": 258, "text": "During a red team assessment of a multinational financial firm, you’re tasked\nwith identifying key personnel across various departments and correlating their\ndigital footprints to evaluate exposure risk. Your objective includes mapping\nuser aliases across platforms, identifying geotagged media, and pinpointing\npotential insider threats based on social posting behavior. The team has\nshortlisted multiple tools for the task.\n\nConsidering the technical capabilities and limitations described in the approved\nreconnaissance toolkit, which tool provides cross platform username\ncorrelation by scanning hundreds of social networking sites, but does not\nnatively support geolocation tracking or visualizing identity relationships?", "options": {"A": "Creepy", "B": "Social Searcher", "C": "Maltego", "D": "Sherlock"}, "answer": "D"}, {"num": 259, "text": "Olivia, a cybersecurity architect at a Boston-based fintech company, is tasked\nwith upgrading the organization’s cryptographic infrastructure in preparation\nfor future quantum computing threats. A recent internal audit flagged that\nsensitive customer data stored in the company’s cloud environment could be\nvulnerable if quantum decryption methods become practically viable. To\nstrengthen their post-quantum defense, Olivia must recommend a proactive\ncryptographic control that ensures long-term confidentiality of stored data,\neven against advanced quantum attackers.\n\nWhich cryptographic defense should Olivia prioritize to mitigate the risk of\nfuture quantum-based decryption?", "options": {"A": "Break data into fragments and distribute it across multiple locations", "B": "Encrypt stored data with quantum-resistant algorithms", "C": "Use quantum-specific firewalls to protect quantum communication channels", "D": "Include quantum-resistance checks in SDLC and code review processes."}, "answer": "B"}, {"num": 260, "text": "Sarah, an ethical hacker at a San Francisco-based financial firm, is testing the\nsecurity of their customer database after a recent data exposure incident. Her\nanalysis reveals that the sensitive client information is safeguarded using a\nsymmetric encryption algorithm. She observes that the algorithm processes\ndata in 64-bit blocks and supports a variable key size from 32 to 448 bits. During\nher penetration test, Sarah intercepts a ciphertext transmission and notes that\nthe encryption was developed as a replacement for DES, an older algorithm.\nShe aims to determine if the algorithm’s flexible key size could be susceptible\nto brute-force attacks. The algorithm is also noted for its use in secure storage,\na critical application for the firm’s data protection. Which symmetric encryption\nalgorithm should Sarah identify as the one used by the firm?", "options": {"A": "RC4", "B": "Twofish", "C": "AES", "D": "Blowfish"}, "answer": "D"}, {"num": 261, "text": "During a routine software update at Horizon Solutions, a mid-sized IT firm in\nRaleigh, North Carolina, an employee downloads a free utility from a popular\nthird-party site to streamline document processing. During the installation, the\nuser is prompted to install an optional ‘productivity toolbar’ and a ‘system\noptimization tool,’ which are bundled with vague descriptions. Shortly after, the\nemployee notices intermittent pop-up ads, an altered browser homepage, and\nsluggish PC performance, though network logs also show occasional\nunexplained data transfers during off-hours. A security scan flags the additional\nprograms as potentially harmful, but a deeper analysis reveals no immediate\nfile encryption or self-replicating code.\n\nWhat type of threat are these unwanted programs most likely classified as?", "options": {"A": "Potentially Unwanted Applications (PUAs)", "B": "Worms", "C": "Botnet agents", "D": "Logic bombs"}, "answer": "A"}, {"num": 262, "text": "You are an ethical hacker at CyberShield Analytics, hired by Coastal Education\nServices, a tutoring platform in Miami, Florida, to test the security of their\nstudent portal. While probing the portal’s course enrollment page, you input a\ncrafted value into the course ID field, appending a condition that checks if the\nfirst character of the database name is a specific value. The application does\nnot display error messages or additional data, but the page takes significantly\nlonger to load when the condition evaluates to true, indicating a deliberate\ndelay. Based on the observed behavior, which SQL injection technique are you\nemploying?", "options": {"A": "Boolean exploitation", "B": "Time-based blind SQL injection", "C": "UNION SQL injection", "D": "Error-based SQL injection"}, "answer": "B"}, {"num": 263, "text": "In the bustling financial hub of Charlotte, North Carolina, ethical hacker Raj\nPatel is contracted by TrustBank, a regional US bank, to evaluate their online\nloan application portal. On April 22, 2025, Raj tests a feature allowing customers\nto upload structured financial documents for loan processing. By submitting a\nspecially crafted document, he triggers a response that exposes internal server\nfile paths and sensitive configuration data, including database connection\nstrings. The issue arises from the portal’s handling of external references in\ndocument parsing, not from response manipulation, authentication weaknesses,\nor undetected attack attempts. Raj compiles a detailed report to assist\nTrustBank’s security team in mitigating the vulnerability.\n\nWhich type of vulnerability is Raj most likely exploiting in TrustBank’s online\nloan application portal?", "options": {"A": "Identification and Authentication Failures", "B": "HTTP Response Splitting", "C": "XML External Entity (XXE) Injection", "D": "Security Legg ng and Monitoring Failures"}, "answer": "C"}, {"num": 264, "text": "During a security assessment at Apex Technologies in Austin, Texas, the\ncybersecurity team identifies a high risk of social engineering attacks. Including\nphishing, vishing, and baiting, targeting employees across departments. To\nstrengthen defenses, the team plans to implement a countermeasure to reduce\nthe likelihood of employees disclosing sensitive information.\n\nWhich of the following countermeasures should Apex Technologies prioritize to\nmitigate the risk of social engineering attacks?", "options": {"A": "Conduct security awareness and training programs", "B": "Employees must verify identity of individuals requesting information", "C": "Use two-factor authentication", "D": "Establish policies and procedures for handling sensitive information"}, "answer": "A"}, {"num": 265, "text": "In the sunlit tech oasis of Phoenix, Arizona, ethical hacker Nadia Patel explores\nthe inner workings of LearnSphere, a US-based e-learning platform serving\nthousands of students. Tasked with evaluating the application’s resource-\nsharing mechanisms, Nadia crafts HTTP requests to interact with the platform’s\ncontent delivery endpoint. Her tests uncover a serious flaw: improperly\nconfigured access-control headers permit cross-origin requests from\nunauthorized domains, allowing access to protected course materials.\nDetermined to strengthen the platform, Nadia documents her findings to\nprovide LearnSphere’s security team with clear, actionable guidance.\n\nWhich vulnerability is Nadia most likely exploiting in LearnSphere’s web\n\napplication?", "options": {"A": "Directory Listing", "B": "Default Credential Exposure", "C": "CORS Misconfiguration", "D": "Verbose Error Messages"}, "answer": "C"}, {"num": 266, "text": "Dr. Evelyn Reed, a cybersecurity expert, was called in to investigate a series of\nunusual activities at “Global Innovations Inc.” The first red flag was a surge in\nspear-phishing emails targeting senior management, disguised as urgent\ninternal memos. Soon after, the company’s web server showed unexpected\noutbound traffic to unfamiliar IP addresses. A network audit revealed that\nmultiple underutilized printers and routers had unauthorized firmware\ninstalled. Further review uncovered inconsistencies in file access logs linked to\nthe R&D department, including unusually large data transfers occurring during\nnon-business hours. Dr. Reed also noted the attackers appeared to have\nintimate knowledge of the organization’s internal data structure.\n\nWhich phase of the Advanced Persistent Threat (APT) lifecycle is Global\nInnovations Inc. most likely experiencing, given the combination of these\nincidents?", "options": {"A": "Initial Intrusion", "B": "Expansion", "C": "Search and Exfiltration", "D": "Persistence"}, "answer": "C"}, {"num": 267, "text": "Alice, a software developer, digitally signs an email contract and sends it to Bob.\nLater, a dispute arises and Alice claims she never sent the agreement. However,\nBob produces the email with Alice’s unique digital signature, which\nunequivocally links the message to her. In information security terms, what\nprinciple is illustrated by Bob’s ability to prove Alice’s authorship of the email?", "options": {"A": "Confidentiality", "B": "Integrity", "C": "Non-Repudiation", "D": "Availability"}, "answer": "C"}, {"num": 268, "text": "During a red team engagement for a client in the financial sector, ethical hacker\n\nTyler Brooks conducts a phishing campaign using a crafted internal web page\n\ndisguised as a company VPN login. After several users enter their credentials,\nTyler confirms that the payload successfully recorded input without triggering\nantivirus or requiring local installation privileges. The captured keystrokes\ncame exclusively from a web-based form embedded in the fake login page.\n\nBased on the technique used, which type of keylogger did Tyler most likely\ndeploy?", "options": {"A": "Keylogger Keyboard", "B": "Hypervisor-based Keylogger", "C": "Application Keylogger", "D": "JavaScript-based Keylogger"}, "answer": "D"}, {"num": 269, "text": "Amid the vibrant buzz of Miami’s digital scene, ethical hacker Sofia Alvarez\nembarks on a mission to fortify the web server of Sunshine Media’s streaming\nplatform. Diving into her security assessment, Sofia sends a meticulously\n\ncrafted GET / HTTP/1.0 request to the server, scrutinizing its response. The\nserver obligingly returns headers exposing its software version and operating\nsystem, a revelation that could empower malicious actors to tailor their attacks.\nCommitted to bolstering the platform’s defenses, Sofia documents her findings\nto urge the security team to address this exposure.\n\nWhat approach is Sofia using to expose the vulnerability in Sunshine Media’s\n\nweb server?", "options": {"A": "Informal on Gathering from Robots.txt File", "B": "Vulnerability Scanning", "C": "Directory Brute Forcing", "D": "Web Server Footprinting/Banner Grabbing"}, "answer": "D"}, {"num": 270, "text": "After responding to an alert involving unauthorized access to payroll data,\nforensic analyst Jason Miller traces the breach to a Windows workstation\npreviously used by a temporary staff member in Chicago. While analyzing the\nevent timeline, Jason identifies a non-elevated process that launched a signed\nMicrosoft binary – one of several auto-elevating executables such as\nfodhelper.exe, eventvwr.exe. or sdclt.exe – which resulted in execution of\nunauthorized code without prompting the user. Registry analysis reveals\nmanipulation of shell-related keys under the current user hive, redirecting the\ntrusted binary to invoke a malicious payload. Which technique most likely\nenabled the privilege escalation?", "options": {"A": "Kernel Exploitation", "B": "Scheduled Task", "C": "UAC Bypass", "D": "DLL Hijacking"}, "answer": "C"}, {"num": 271, "text": "During a security compliance audit at Nexus Tech Solutions in Boston,\nMassachusetts, the ethical hacking team launches a controlled social\nengineering exercise to assess help desk vulnerabilities. Ethical hacker Rachel\nKim calls the company’s help desk, posing as a stressed employee named Laura\nBennett from the marketing department. Rachel claims her laptop is running\nslowly and offers to share her login credentials if the help desk can provide a\nquick fix to meet a tight project deadline. The call is designed to test whether\nhelp desk staff follow proper verification protocols or fall for the offer of\ncredentials in exchange for assistance.\n\nWhat social engineering technique is Rachel employing in this exercise?", "options": {"A": "Shoulder Surfing", "B": "Vishing", "C": "Impersonation", "D": "Quid Pro Quo"}, "answer": "D"}, {"num": 272, "text": "During a late-night shift at IronWave Logistics in Seattle, cybersecurity analyst\nMarcus Chen notices a pattern of high-port outbound traffic from over a dozen\ninternal machines to a previously unseen external IP. Each system had recently\nreceived a disguised shipping report, which, when opened, initiated a process\nthat spread autonomously to other workstations using shared folders and\nstolen credentials. Upon investigation, Marcus discovers that the machines now\ncontain hidden executables that silently accept remote instructions and\noccasionally trigger coordinated background tasks. The compromised endpoints\nare behaving like zombies, and malware analysts confirm that the payload used\nworm-like propagation to deliver a backdoor component across the network.\n\nWhich is the most likely objective behind this attack?", "options": {"A": "To exfiltrate sensitive information and tracking data", "B": "To execute a ransomware payload and encrypt all data", "C": "To establish a botnet for remote command and control", "D": "To deploy a Remote Access Trojan (RAT) for stealthy surveillance"}, "answer": "C"}, {"num": 273, "text": "In a high-stakes cybersecurity exercise in Boston, Emily, an ethical hacker, is\ntasked with tracing a mock phishing email sent to a healthcare provider’s staff.\nUsing the email header, she identifies a series of IP addresses and server\ndetails, including multiple timestamps and server names. Her objective is to\npinpoint the exact moment the email was processed by the sender’s system. As\npart of her reconnaissance, what specific detail from the email header should\nEmily examine to determine this information?", "options": {"A": "Date and time of message sent", "B": "Sender’s mail server", "C": "Date and time received by the originator’s email servers", "D": "Authentication system used by sender’s mail server"}, "answer": "C"}, {"num": 274, "text": "You’ve recently joined an international software firm as part of the\ncybersecurity governance team. While preparing for an internal compliance\nreview, your supervisor asks you to identify the ISO/IEC standard that serves as\na comprehensive framework for managing an organization’s information\nsecurity. You examine several standards, including those focusing on risk\nmanagement, cybersecurity, and control implementation. However, you need to\nselect the one that defines the overarching structure for managing information\nsecurity programs across the organization.\n\nWhich of the following standards should you choose?", "options": {"A": "ISO/IEC 27002:2022", "B": "ISO/IEC 27005:2022", "C": "ISO/IEC 27001:2022", "D": "ISO/IEC 27701:2019"}, "answer": "C"}, {"num": 275, "text": "In Dallas, Texas, Alex, a cloud security specialist at a logistics company, is\ndesigning a cloud infrastructure to deploy containerized web applications for\nreal-time shipment tracking. To ensure the applications remain accessible even\nif one node fails, with minimal downtime, Alex plans to run several nodes as a\ngroup so that, if one node goes down, another node in the cluster can\nautomatically continue handling its workload. This setup will leverage cloud\n\nclustering for enhanced scalability by distributing container instances across\nnodes in different zones.\n\nWhich type of cluster computing should Alex implement to achieve these\n\ncapabilities in the cloud environment?", "options": {"A": "Load Balancing", "B": "Resource Pooling", "C": "Highly Available [HA] or Fail-over", "D": "High-Performance Computing"}, "answer": "C"}, {"num": 276, "text": "During an external assessment of a regional retail company’s digital\ninfrastructure, security analyst Joe is assigned to map internal services without\nactive intrusion. While testing the behavior of a publicly exposed resolution\nsystem, he discovers that a secondary system responds unusually to structured\nqueries. When he issues a specific request format, the server replies with a full\nlist of internal mappings, including subdomains, mall hosts, and system aliases\nwithout requiring credentials or triggering alerts.\n\nWhich technique was most likely used to obtain this information?", "options": {"A": "DAP Enumeration", "B": "NTP Enumeration", "C": "DNS Zone Transfer Enumeration", "D": "NetBIOS Enumeration"}, "answer": "C"}, {"num": 277, "text": "Joe, a cybersecurity analyst at XYZ-FinTech, has been assigned to perform a\nquarterly vulnerability assessment across the organization’s Windows-based\nservers and employee workstations. His objective is to detect issues such as\nsoftware configuration errors, incorrect registry or file permissions, native\nconfiguration table problems, and other system-level misconfigurations. He is\ninstructed to log into each system using valid credentials to ensure\ncomprehensive data collection. Based on this assignment, which type of\nvulnerability scanning should Joe perform?", "options": {"A": "External Scanning", "B": "Application Scanning", "C": "Host-based Scanning", "D": "Network-based Scanning"}, "answer": "C"}, {"num": 278, "text": "During a penetration test in Dallas, Texas, ethical hacker Jason is attempting to\nbypass MAC-based filtering rules enforced by a network firewall. To avoid having\nhis real MAC address logged and to increase stealth while scanning the internal\nhost at 10.10.1.11, he decides to randomize his MAC address. Which of the\nfollowing Nmap commands should he use?", "options": {"A": "nmap -sT -Pn --spoof-mac Dell 10.10.1.11", "B": "nmap -sT - Pn --spoof-mac 00:01:02:25:56:AE 10.10.1.11", "C": "nmap -sT - Pn 10.10.1.11", "D": "nmap -sT -Pn --spoof-mac 0 10.10.1.11"}, "answer": "D"}, {"num": 279, "text": "In the rainy streets of Portland, Oregon, ethical hacker Ethan Brooks delves into\nthe security layers of ShopSwift, a US-based e-commerce platform reeling from\na recent data breach. Tasked with uncovering the method behind unauthorized\naccount takeovers, Ethan examines login patterns across the platform’s user\nbase. His investigation reveals a surge of automated login activity across\nmultiple accounts, with a suspiciously high success rate. Determined to trace\nthe root cause, Ethan compiles a detailed log to assist ShopSwift’s security\nteam in restoring trust.\n\nWhich attack method is Ethan most likely uncovering in ShopSwift’s\nauthentication system?", "options": {"A": "Password Spraying", "B": "Brute Force Attack", "C": "Credential Stuffing", "D": "Phishing Attacks"}, "answer": "C"}, {"num": 280, "text": "In the bustling tech hub of Silicon Valley, cybersecurity investigator Elena\nMartinez found herself deep into a late-night investigation at Horizon Tech\nSolutions on July 7.2025. The company had reported sporadic network\ndisruptions affecting their research team’s access to critical project files. Elena,\nworking under the cover of a maintenance window from midnight to 3 AM PDT,\nbegan monitoring the internal network, focusing on a subnet reserved for the\nR&D department. She noticed a pattern of failed connection attempts logged\njust before each disruption, with multiple hosts reporting temporary IP address\nconflicts. Suspecting foul play, Elena deployed a discreet test to simulate an\ninternal threat scenario. Shortly afterward, several workstations began showing\nunfamiliar gateway settings and redirected users to misleading login portals\n\nduring routine access attempts. Despite these anomalies, no security alerts\nwere triggered.\nWhat type of attack technique did Elena most likely simulate?", "options": {"A": "DHCP Starvation Attack", "B": "Packet Sniffing", "C": "MAC Flooding", "D": "Rogue DHCP Server Attack"}, "answer": "D"}, {"num": 281, "text": "John, a penetration tester at a Los Angeles-based online gaming company, is\nanalyzing the company’s cloud infrastructure after a recent security breach\ncaused unexpected downtime and delayed alerts. His investigation reveals that\nthe attackers remained undetected, due to the absence of mechanisms that\ntrack function-level activity and capture anomalous events. The backend\narchitecture for matchmaking and in-game purchases is serverless, increasing\nthe importance of robust security measures.\n\nSo, which cloud computing threat should John prioritize to prevent similar\nbreaches?", "options": {"A": "Insufficient logging and monitoring", "B": "Privilege escalation", "C": "Loss of governance", "D": "Side-channel attacks"}, "answer": "A"}, {"num": 282, "text": "During a security penetration test at Sterling Manufacturing in Cleveland, Ohio,\nthe ethical hacking team evaluates the company’s physical security controls. On\na chilly evening in July 2025, ethical hacker Priya Desai, posing as a facilities\ncontractor, accesses the company’s loading dock area after regular business\nhours. Behind the employee entrance, she comes across an unsecured\nmaintenance container with discarded packaging, shipping labels, and\nshredded office material. Among the clutter, Priya retrieves a crumpled\ndocument listing temporary access codes for the employee break room, along\nwith a partially shredded memo referencing an upcoming audit. The exercise\ntests whether sensitive information discarded improperly can be exploited. The\nnext day, Priya uses the recovered access codes to enter the break room\n\nundetected during a shift change, logging her entry on a controlled test system\nto simulate a breach.\nWhat social engineering technique is Priya’s exercise primarily simulating?", "options": {"A": "Tailgating", "B": "Eavesdropping", "C": "Dumpster Diving", "D": "Shoulder Surfing"}, "answer": "C"}, {"num": 283, "text": "In Boston, Massachusetts, network administrator Daniel Carter is monitoring the\nIT infrastructure of New England Insurance, a prominent firm, after receiving\nalerts about sluggish system performance. While reviewing traffic patterns,\nDaniel observes an unusual volume of concurrent requests overwhelming\ncritical servers. To validate his suspicion of a session hijacking attempt, he\nbegins capturing and reviewing live network traffic to identify unauthorized\nsession behaviors before escalating to the security team.\n\nWhat detection method should Daniel use to confirm the session hijacking\nattack in this scenario?", "options": {"A": "Use an intrusion detection system (IDS)", "B": "Check for predictable session tokens", "C": "Monitor for ACK storms", "D": "Perform manual packet analysis using packet sniffing tools"}, "answer": "D"}, {"num": 284, "text": "In Seattle, Washington, ethical hacker Mia Chen is tasked with testing the\nnetwork defenses of Pacific Shipping Co., a major logistics firm. During her\npenetration test, Mia targets the company’s external-facing web server, which\nhandles customer tracking requests. She observes that the security system\nfiltering traffic to this server analyzes incoming SSH and DNS requests to block\nunauthorized access attempts. Mia plans to craft specific payloads to bypass\nthis system to expose vulnerabilities to the IT department.\n\nWhich security system is Mia attempting to bypass during her penetration test\nof Pacific Shipping Co.’s web server?", "options": {"A": "Stateful Multilayer Inspection Firewall", "B": "Application-Level Firewall", "C": "Packet Filtering Firewall", "D": "Circuit-Level Gateway Firewall"}, "answer": "B"}, {"num": 285, "text": "During an internal red team simulation at a global insurance provider, Joe, a\nsenior SOC analyst, is assigned to verify if a surge in anomalous SYN packets\ntargeting the perimeter firewall is the result of spoofed IP traffic. The\norganization has ruled out DNS poisoning and malformed header issues. Joe\nmust now analyze packet behavior in real-time to determine authenticity\nwithout relying on host-level authentication.\n\nTo identify spoofed traffic using techniques aligned with best practices taught in\nthe organization, which approach should Joe take?", "options": {"A": "TCP Flow Control Method", "B": "IP Address Decoy", "C": "Direct TTL Probes", "D": "IP Identification Number (IPID) Monitoring"}, "answer": "D"}, {"num": 286, "text": "In a bustling tech firm in Seattle, Michael, an ethical hacker, is conducting a\nsecurity assessment to identify potential risks. During his evaluation, he notices\nthat sensitive employee details and system configurations have been exposed\nthrough public forums, likely due to careless online behavior. His manager\nsuspects this could lead to unauthorized access or data theft. As part of his\ntesting, what type of threat should Michael focus on to simulate the adversary’s\nmethod of gathering this exposed information?", "options": {"A": "Corporate Espionage", "B": "Social Engineering", "C": "System and Network Attacks", "D": "Information Leakage"}, "answer": "D"}, {"num": 287, "text": "At a cybersecurity consultancy firm in Boston, senior analyst Amanda Liu is\n\ncalled in to assess a malware outbreak affecting a regional healthcare provider.\nDespite using updated antivirus tools, the security team notices inconsistent\ndetection across infected endpoints. Amanda discovers that while the malicious\nbehavior is consistent system file tampering and suspicious outbound traffic\neach malware sample has a slightly different code structure and fails traditional\nhash-based comparison. Static analysis reveals that the underlying logic\n\nremains unchanged, but the code patterns vary unpredictably across infections.\n\nWhat type of virus is most likely responsible for this behavior?", "options": {"A": "Cavity virus", "B": "Macro virus", "C": "Polymorphic virus", "D": "Stealth virus"}, "answer": "C"}, {"num": 288, "text": "A cybersecurity team at a regional healthcare provider is conducting an internal\nred team exercise to assess their exposure to service enumeration attacks.\nAmanda, a senior penetration tester, is assigned to probe the internal network\nfor services that may reveal usernames, group information, or system details\nwithout requiring prior authentication. She decides to target common services\nrunning on specific ports that are often misconfigured or loosely monitored.\n\nDuring her reconnaissance, Amanda identifies several open ports across various\nhosts and must now prioritize which ones to probe first for maximum\ninformation gain related to enumeration. Which of the following services should\nAmanda target as a priority to enumerate usernames and group information\n\nwithout authentication?", "options": {"A": "TCP 139 and UDP 137, 138", "B": "TCP 21 and UDP 137", "C": "TCP 23 and UDP 137, 138", "D": "TCP 25 and UDP 138"}, "answer": "A"}, {"num": 289, "text": "Under the neon glow of Seattle’s skyline, ethical hacker Elena Vasquez slips into\nher role as a cybersecurity consultant for Cascade Financial’s online banking\nplatform. Tasked with probing the web server’s defenses, Elena simulates a\nseries of rapid login attempts to the admin portal. She notes that the system\nallows unlimited tries without locking the account, exposing a gap that could\ninvite relentless password guessing attacks. Determined to shield the bank’s\nassets, Elena drafts a recommendation to fortify the server’s authentication\nprocess against such threats.\n\nWhat countermeasure should Elena recommend to strengthen Cascade\nFinancial’s web server against the vulnerability she identified?", "options": {"A": "Implement 2FA or MFA", "B": "Force users to periodically change passwords", "C": "Use CAPTCHA challenges on login and registration pages", "D": "Use strong, one-way hashing algorithms such as bcrypt, scrypt, or Argon2"}, "answer": "C"}, {"num": 290, "text": "In Denver, Colorado, ethical hacker Sophia Nguyen is hired by Rocky Mountain\nInsurance to assess the effectiveness of their network security controls. During\nher penetration test, she attempts to evade the company’s firewall by\nfragmenting malicious packets to avoid detection. The IT team, aware of such\ntechniques, has implemented a security measure to analyze packet contents\nbeyond standard headers. Sophia’s efforts are thwarted as the system identifies\nand blocks her fragmented packets.\n\nWhich security measure is the IT team most likely using to counter Sophia’s\nfirewall evasion attempt?", "options": {"A": "Deep Packet Inspection", "B": "Anomaly-Based Detection", "C": "Signature-Based Detection", "D": "Stateful Packet Inspection"}, "answer": "A"}, {"num": 291, "text": "On July 25, 2025, during a security assessment at Apex Technologies in Boston,\nMassachusetts, ethical hacker Sophia Patel conducts a penetration test to\nevaluate the company’s defenses against a simulated DDoS attack targeting\ntheir e-commerce platform. The simulated attack floods the platform with traffic\nfrom multiple sources, attempting to overwhelm server resources. The IT team\nactivates a specific tool that successfully mitigates the attack by distributing\ntraffic across multiple servers and filtering malicious requests. Sophia’s test\naims to verify the effectiveness of this tool in maintaining service availability.\n\nWhich DoS/DDoS protection tool is most likely being utilized by the IT team in\nthis scenario?", "options": {"A": "Web Application Firewall (WAF)", "B": "Load Balancer", "C": "Intrusion Prevention System (IPS)", "D": "Firewall"}, "answer": "B"}, {"num": 292, "text": "As part of a penetration test for a financial firm’s smart headquarters in Denver,\nColorado, ethical hacker Jordan Lee begins evaluating the IoT infrastructure\nresponsible for lighting, HVAC, and badge-controlled access. Jordan documents\ndetails such as device models, manufacturer names, firmware versions, and\nsupported protocols like Zigbee and BLE. This information is used to\nunderstand the device ecosystem. Which step of the IoT hacking methodology is\nbeing carried out in this phase?", "options": {"A": "Information gathering", "B": "Launch attacks", "C": "Vulnerability scanning", "D": "Gain remote access"}, "answer": "A"}, {"num": 293, "text": "On 10th of July this year, during a security penetration test at IntelliCore\nSystems in Raleigh, North Carolina, the ethical hacking team evaluates the\nstability of the company’s file-sharing server. Sofia crafts and transmits a\nsequence of oversized, malformed packets designed to test how the server\nhandles unexpected input. Shortly after, the system begins crashing\n\nintermittently due to processing failures triggered by these anomalous network\nrequests. The security team onsite is tasked with identifying the root cause\n\nbehind the packet-induced instability and attributing it to a known DoS tactic.\n\nWhich of the following best explains the technique Sofia used to trigger the\n\nserver crashes?", "options": {"A": "ICMP Flood Attack", "B": "Ping of Death (PoD)", "C": "Smurf Attack", "D": "ACK Flood Attack"}, "answer": "B"}, {"num": 294, "text": "On July 25, 2025, during a penetration test at Horizon Financial Services in\nChicago, Illinois, cybersecurity specialist Laura Bennett is analyzing an attack\nsimulation targeting the company’s online banking portal. The system logs\nreveal a coordinated barrage of traffic from multiple compromised systems,\norchestrated through a central command-and-control server, flooding the\nportal and rendering it unavailable to legitimate users. The attack leverages a\nnetwork of infected devices, likely recruited via malicious links on social media.\n\nWhat is the structure or concept most likely used to launch this coordinated\nattack?", "options": {"A": "Smurf Attack", "B": "Distributed Reflection Denial-of-Service (DRDoS)", "C": "Botnet", "D": "Central Source Propagation"}, "answer": "C"}, {"num": 295, "text": "Emily, a security engineer at a Chicago-based healthcare provider, is auditing\nthe organization’s new cloud environment after a breach where sensitive\npatient records were exposed. Her investigation reveals that the root cause was\nthe lack of encryption during data transmission between end-user devices and\ncloud storage. To mitigate this issue and align with HIPAA compliance\nrequirements, Emily must prioritize addressing the correct cloud computing\nsecurity risk.\n\nWhich cloud computing threat should Emily address to mitigate the risk of\nsensitive data being exposed during transmission?", "options": {"A": "Multi-Tenancy and Physical Security", "B": "Incidence Analysis and Forensic Support", "C": "Service and Data Integration", "D": "Infrastructure Security"}, "answer": "D"}, {"num": 296, "text": "During a security penetration test at ABC Financial Services in Miami, Florida, on\nJuly 9, 2025, ethical hacker Javier Morales targets the company’s online banking\nportal to assess its resilience. Over several hours, the portal’s web server begins\nto falter, with legitimate users reporting inability to log in or complete\ntransactions. The IT team notices the server is struggling to accept new\nconnections, as its maximum connection limit is nearly reached, despite no\nsignificant spike in overall network traffic. Javier’s controlled test, run from a\nsecure system, logs interactions to simulate a real attack, aiming to evaluate\nthe IT team’s ability to identify the threat. What DoS/DDoS attack technique is\nJavier’s exercise primarily simulating?", "options": {"A": "Slowloris Attack", "B": "UDP Flood Attack", "C": "Peer-to-Peer Attack", "D": "SYN Flood Attack"}, "answer": "A"}, {"num": 297, "text": "In Dallas, Texas, ethical hacker Ethan Brooks is hired by Lone Star Credit Union\nto assess the security of their online banking portal, which processes customer\ntransactions. During his penetration test, Ethan probes the web server hosting\nthe portal, experimenting with crafted URL requests. He notices that by altering\nthe URL parameters in a specific way, the server returns data from areas of the\nsystem that should be restricted, revealing configuration files not intended for\npublic access. Suspecting this behavior indicates a vulnerability, Ethan\ndocuments the issue to help the security team strengthen their defenses\nagainst potential unauthorized access.\n\nWhich technique is Ethan most likely using to uncover the vulnerability in Lone\n\nStar Credit Union’s web server?", "options": {"A": "Password Cracking", "B": "Web Cache Poisoning", "C": "HTTP Response Splitting", "D": "Directory Traversal"}, "answer": "D"}, {"num": 298, "text": "During a cybersecurity awareness drill at Quantum Analytics in San Francisco,\nCalifornia, the ethical hacking team tests the company’s defenses against social\nmedia-based threats. Nadia creates a fake LinkedIn profile posing as a senior\nHR manager from Quantum Analytics, using a stolen company logo and publicly\navailable employee details. Nadia sends connection requests to several\nemployees, including data analyst Priya Sharma, inviting them to join a private\ngroup called “Quantum Analytics Innovation Hub.” The group’s page prompts\nmembers to share their work email and department role for “exclusive project\nupdates.”\n\nWhat social engineering threat to corporate networks is Nadia’s exercise\n\nprimarily simulating?", "options": {"A": "Loss of Productivity", "B": "Involuntary Data Leakage", "C": "Spam and Phishing", "D": "Network Vulnerability Exploitation"}, "answer": "B"}, {"num": 299, "text": "You are Olivia Chen, an ethical hacker at CyberGuardians Inc., hired to test the\nwireless network of Skyline Media, a broadcasting company in Chicago, Illinois.\nYour mission is to breach their WPA2-protected Wi-Fi during a late-night\npenetration test. Using a laptop in monitor mode, you execute a command to\ntransmit packets that force client devices to disconnect and reconnect, enabling\nyou to capture a four-way handshake for cracking. Based on the described\naction, which tool are you using?", "options": {"A": "Aircrack-ng", "B": "Airbase-ng", "C": "Aireplay-ng", "D": "Airodump-ng"}, "answer": "C"}, {"num": 300, "text": "In the crisp mountain air of Denver, Colorado, ethical hacker Lila Chen\ninvestigates the security framework of MediVault, a US-based healthcare\nplatform used by regional clinics to manage patient data. During her\nassessment, Lila manipulates session parameters while navigating the patient\nportal’s dashboard. Her tests reveal a critical flaw: the system allows users to\naccess sensitive medical records not associated with their own account,\nenabling unauthorized changes to private health data. Upon deeper inspection,\nLila determines that the issue stems from the application allowing users to\nperform actions beyond their assigned roles – rather than failures in encryption,\nunsafe object handling, or server configuration.\n\nWhich OWASP Top 10 2021 vulnerability is Lila most likely exploiting in\nMediVault’s web application?", "options": {"A": "Security Misconfiguration", "B": "Insecure Deserialization", "C": "Cryptographic Failures", "D": "Broken Access Control"}, "answer": "D"}, {"num": 301, "text": "In the heart of Silicon Valley, California, network administrator Jake Henderson\noversees the web infrastructure for TechTrend Innovations, a startup\nspecializing in cloud solutions. During a routine architecture review, Jake\nevaluates the setup of their web server, which handles high-traffic API requests.\nHe notes that the server’s primary module processes incoming requests and\nworks with additional modules to manage encryption, URL rewriting, and\nauthentication. Curious about the server’s design, Jake consults the\ndocumentation to ensure optimal performance and security.\n\nWhich web server component is Jake analyzing as part of TechTrend\nInnovations’ architecture?", "options": {"A": "Virtual Document Tree", "B": "Application Server", "C": "Document Root", "D": "HTTP Server (Core)"}, "answer": "D"}, {"num": 302, "text": "In the humid air of Houston, Texas, a chemical plant is preparing to deploy a\nnew production automation module. As part of a red team engagement, you\nEthan Brooks, a cybersecurity specialist are tasked with identifying industrial\ncontrol devices that communicate with SCADA systems. To proactively uncover\ndevices that may expose critical functions, you launch a focused Nmap sweep\ntargeting TCP port 102, known to be associated with industrial controllers used\nin critical infrastructure. Your scan detects specific PLC models used in the\nautomation process. Which OT reconnaissance step are you performing?", "options": {"A": "Scanning Omron PLC devices", "B": "Scanning Modbus devices", "C": "Capturing Modbus/TCP traffic using Wireshark", "D": "Scanning Siemens SIMATIC S7 PLCs"}, "answer": "D"}, {"num": 303, "text": "You are Emma Rodriguez, an ethical hacker at SecurePath Solutions, hired to\ntest the mobile application security of Sterling & Associates, a law firm in New\nYork City. During a covert assessment, your objective is to simulate an attacker\nattempting to exploit vulnerabilities in the firm’s client case management app.\nYou discover that the app stores user credentials in plain text on the device,\nenabling you to extract sensitive client login information using a rooted device.\nBased on this finding, which OWASP Top 10 Mobile Risk are you identifying in\nthe app?", "options": {"A": "Insecure Communication", "B": "Improper Credential Usage", "C": "Inadequate Privacy Controls", "D": "Insecure Data Storage"}, "answer": "D"}, {"num": 304, "text": "In a security assessment conducted in New York, Sarah, an ethical hacker, is\n\nevaluating a corporate network to enhance its protection against potential\nthreats. She aims to gather essential data about available access points to\nguide her analysis. Which scanning technique should Sarah apply to meet this\nobjective while adhering to the organization’s ethical guidelines?", "options": {"A": "Vulnerability Scanning", "B": "Port Scanning", "C": "Topology Mapping", "D": "Network Scanning"}, "answer": "D"}, {"num": 305, "text": "In Atlanta, Georgia, ethical hacker James Patel is hired by Southern Retail, a\nmajor e-commerce chain, to test the security of their online shopping platform.\nDuring his penetration test, James aims to simulate a session hijacking attack\nby setting up a proxy to intercept HTTP traffic between customers and the\nplatform, log the requests, and perform advanced searches on the captured\ndata to identify session tokens. He needs a lightweight tool specifically\ndesigned for security research that can handle these tasks in a controlled\nenvironment to demonstrate vulnerabilities to the company’s security team.\n\nWhich tool should James use to perform this session hijacking simulation?", "options": {"A": "Caido", "B": "Hetty", "C": "Bettercap", "D": "Wireshark"}, "answer": "B"}, {"num": 306, "text": "In Austin, Texas, ethical hacker Michael Reyes is conducting a red team exercise\nfor Horizon Tech, a software development firm. During his assessment, Michael\ncrafts a malicious link that appears to lead to the company’s internal project\nmanagement portal. When an unsuspecting employee clicks the link, it redirects\nthem to a login session that Michael has already initialized with the server. After\nthe employee logs in, Michael uses that session to access the portal in a\ncontrolled test, demonstrating a vulnerability to the IT team.\n\nWhich session hijacking technique is Michael using in this red team exercise?", "options": {"A": "Session donation attack", "B": "Session replay attack", "C": "Session sniffing", "D": "Session fixation attack"}, "answer": "D"}, {"num": 307, "text": "You are a penetration tester hired to evaluate the security posture of a regional\nmanufacturing company’s network devices. During your assessment, you\ndiscover that one of the core routers allows external administrative access\nwithout requiring a password. Additionally, the router communicates with other\ndevices using a protocol that does not provide encryption or validation. Based\nsolely on these observations, which of the following network device\nvulnerabilities is most clearly present?", "options": {"A": "Firewall vulnerabilities", "B": "Insecure routing protocols", "C": "Lack of password protection", "D": "Lack of authentication"}, "answer": "C"}, {"num": 308, "text": "You are an ethical hacker at SecureNet Solutions, conducting a penetration test\n\nfor BlueRidge Manufacturing in Denver, Colorado. While auditing their wireless\nnetwork, you observe that the access point uses a security protocol that\nemploys the RC4 algorithm with a 24-bit initialization vector (IV) to encrypt data\nbetween network clients. Based on the observed encryption characteristics,\nwhich wireless encryption protocol is the access point using?", "options": {"A": "WPA", "B": "WPA2", "C": "WEP", "D": "WPA3"}, "answer": "C"}, {"num": 309, "text": "You are an ethical hacker at Apex Security Consulting, hired by Riverfront Media,\na digital marketing firm in Boston, Massachusetts, to assess the security of their\ncustomer relationship management (CRM) web application. While evaluating the\napplication’s search feature, you input a long string of single quote characters\ninto the search bar. The application responds with an error suggesting that it\ncannot handle the length or structure of the input in the current SQL context.\nBased on the observed behavior, which SQL injection vulnerability detection\ntechnique are you employing?", "options": {"A": "Detecting SQL Modification", "B": "Fuzz Testing", "C": "Function Testing", "D": "Error Message Analysis"}, "answer": "D"}, {"num": 310, "text": "In Miami, Florida, Sarah Thompson, a security analyst at Apex Cyber Defense, is\ntasked with monitoring the wireless infrastructure at Coastal Healthcare, a busy\nurban hospital. One morning, nurse Emily Carter reports that her tablet used for\naccessing patient records is unexpectedly connecting to an access point\nbroadcasting a name and signal similar to the hospital’s secure Wi-Fi. Upon\ninvestigation, Sarah’s log analysis reveals an unauthorized device on the\nnetwork capturing sensitive traffic from connected systems. Suspecting a\nbreach, she identifies that the attacker has deployed an access point to mimic\nthe hospital’s legitimate network. Based on this behavior, which wireless threat\nis the attacker executing?", "options": {"A": "Misconfigured AP", "B": "Rogue AP", "C": "Evil Twin AP", "D": "Honeypot AP"}, "answer": "C"}, {"num": 311, "text": "You are Sameer Das, an ethical hacker hired by a national utilities provider to\nassess the resilience of its power grid infrastructure. During your red team\noperation, you conduct a phishing campaign targeting field engineers and\nsuccessfully gain access to the internal OT network. From there, you identify\nunsecured access to the substation’s programmable controllers and replace one\n\nof the system’s firmware components with a custom payload. This payload\nsilently processes your commands while maintaining access across reboots.\n\nBased on this action, which type of IoT/OT threat are you simulating?", "options": {"A": "Forged malicious device", "B": "Firmware update attack", "C": "Remote access using backdoor", "D": "Exploit kits"}, "answer": "B"}, {"num": 312, "text": "During a large-scale network assessment of a telecom provider in Dallas, Texas,\na cybersecurity consultant uses Recon-ng and Nmap to enumerate legacy and\ninfrastructure-level services across multiple nodes. The tools uncover open\nTelnet ports, FTP directories with anonymous login enabled, active TFTP\nservices, and exposed SMB shares. The consultant also detects a service that\nresponds to VRFY, EXPN, and RCPT commands – allowing the enumeration of\nuser identities and delivery addresses due to weak input validation. IPv6\ntunneling protocols are also detected. Concerned about information leakage,\nthe consultant flags these services for immediate remediation.\n\nWhich classification best describes this set of enumeration activities?", "options": {"A": "LDAP Enumeration", "B": "VoIP Enumeration", "C": "SMTP Enumeration", "D": "DNS Enumeration"}, "answer": "C"}, {"num": 313, "text": "In the neon-lit sprawl of Las Vegas, Nevada, a luxury hotel’s smart room control\nsystem suffered a breach, allowing an intruder to manipulate guest room\nsettings. The incident investigation revealed that the IoT devices lacked any\nmechanism to verify the integrity or authenticity of software prior to execution,\nallowing tampered instructions to run unchecked. As Emma Ruiz, a\ncybersecurity consultant brought in to assess the breach, you recommend a\nsolution that ensures only authorized, validated code is executed on the\ndevices. Which secure development practice are you advising the hotel to\nimplement?", "options": {"A": "Allow code signing", "B": "Ensure secure boot", "C": "Secure firmware or software updates", "D": "Utilize secure communication protocols"}, "answer": "B"}, {"num": 314, "text": "You are Sophia Bennett, an ethical hacker at Nexus Cyber Defense, tasked with\nevaluating the security of a smart retail store’s IoT network in San Francisco,\nCalifornia. During your assessment, you uncover a vulnerability in the store’s\nsmart inventory sensors that could allow an attacker to gain unauthorized\naccess. The flaw lies in a cloud-based communication process that lacks\nauthentication and encryption and fails to properly validate data exchange\nbetween the sensors and the cloud management platform. Based on the\ndescribed vulnerability, which IoT attack surface area are you addressing in\nyour findings?", "options": {"A": "Insecure ecosystem interfaces", "B": "Insecure data transfer and storage", "C": "Insecure default settings", "D": "Insecure network services"}, "answer": "A"}, {"num": 315, "text": "During an internal audit at a financial services firm in Mumbai, ethical hacker\nMeera was tasked with assessing lateral movement risks within the Windows-\nbased domain environment. While monitoring internal network traffic, she\nnoticed a strange broadcast from a workstation trying to resolve a non-existent\nhost. Suspecting protocol-level weakness, she responded swiftly using a pre-\n\nconfigured system. A few minutes later, she captured NTLMv2 hashes from\nseveral authenticated sessions across multiple departments. Later, her team\n\nsuccessfully cracked one of the hashes offline and used the credentials to gain\n\naccess to a sensitive internal reporting server.\n\nWhich type of attack did Meera most likely execute?", "options": {"A": "Kerberoasting", "B": "Internal Monologue Attack", "C": "LLMNR/NBT-NS Poisoning", "D": "Pass-the-Ticket Attack"}, "answer": "C"}, {"num": 316, "text": "On July 9, 2025, during a security penetration test at MedSecure Health in\nPhoenix, Arizona, the ethical hacking team evaluates the resilience of the\ncompany’s patient portal system. Ethical hacker Aisha Khan initiates a\ncontrolled test that generates sustained traffic pressure against the web\napplication servers. As system responsiveness declines, the IT operations team\nreallocates backend resources, suspending lower-priority modules such as\nsystem alerts and notification services, allowing high-priority functions like\nprescription refills and patient check-ins to remain accessible. Aisha’s\n\ncontrolled simulation is designed to assess the IT team’s ability to maintain\ncritical functionality under partial resource exhaustion.\n\nWhat DoS/DDoS countermeasure strategies is Aisha’s exercise primarily\nsimulating?", "options": {"A": "Degrading Services", "B": "Shutting Down Services", "C": "Absorbing the Attack", "D": "Rate Limiting"}, "answer": "A"}, {"num": 317, "text": "At RedCore Motors, the IT security lead, Priya, is tasked with selecting a\nvulnerability management solution for their expanding hybrid infrastructure.\nDuring the evaluation, she prioritizes tools that support agent-based detection\nacross endpoints, offer constant monitoring and alerting capabilities, and\nprovide comprehensive visibility into both on-premises and cloud-based\nsystems.\n\nAfter thorough testing, she selects a platform that promises to scan for\nvulnerabilities everywhere accurately and efficiently, aligning with her\norganization’s need for centralized visibility and real-time risk assessment.\n\nWhich vulnerability assessment tool did Priya MOST LIKELY select?", "options": {"A": "Nessus", "B": "Nikto", "C": "Qualys VM", "D": "OpenVAS"}, "answer": "C"}, {"num": 318, "text": "In Austin, Texas, ethical hacker Liam Carter is hired by Lone Star Healthcare to\nprobe the defenses of their patient data network. During his penetration test,\nLiam aims to bypass the hospital’s firewall protecting a medical records server.\nTo do so, he uses a tool to craft custom network packets, carefully designing\ntheir headers to slip past the firewall’s filtering rules. His goal is to demonstrate\nhow an attacker could infiltrate the system, exposing vulnerabilities for the\nsecurity team to address.\n\nWhich tool is Liam using to bypass Lone Star Healthcare’s firewall during his\npenetration test?", "options": {"A": "Metasploit", "B": "Colasoft Packet Builder", "C": "Nmap", "D": "Traffic IQ Professional"}, "answer": "B"}, {"num": 319, "text": "In the hushed offices of Pinecrest Solutions in Denver, network security analyst\nLisa Nguyen began a covert review of a recent spike in network access issues\nreported by the sales team. The trouble surfaced during a low-traffic period\nwhen agents couldn’t reach their CRM system, prompting Lisa to examine the\nsubnet logs. She spotted irregular IP assignment attempts linked to an\nunfamiliar device. Acting quickly, Lisa entered a series of commands on the\nCisco switches and later confirmed that connectivity issues had ceased without\nany new devices appearing in the logs.\n\nWhich command did Lisa most likely use to address the issue?", "options": {"A": "Switch(config)# ip dhcp snooping vlan 10", "B": "Switch(config)# ip arp inspection vlan 10", "C": "Switch(config)# ip dhcp snooping", "D": "Switch(config-if)# switchport port-security"}, "answer": "A"}, {"num": 320, "text": "You are Noah Kim, an ethical hacker at Quantum Cyber Solutions, hired to test\nthe mobile device security of TechTrend Innovations, a tech firm in Austin,\nTexas. During a covert assessment, your objective is to simulate an attacker\nattempting to gain privileged access to an iPhone 12 running iOS 14.5 used for\nproprietary app development. You apply a jailbreaking technique that allows\nthe device to fully restart without requiring a computer, maintaining a patched\nkernel and enabling access to sensitive app data in the file system. Based on\nthis method, which iOS jailbreaking technique are you using?", "options": {"A": "Semi-tethered Jailbreaking", "B": "Untethered Jailbreaking", "C": "Semi-untethered Jailbreaking", "D": "Tethered Jailbreaking"}, "answer": "B"}, {"num": 321, "text": "Lily, a network security analyst at a regional healthcare provider, is preparing\ndefenses ahead of a scheduled external vulnerability assessment. During\ninternal simulation drills, she observes that scanners are successfully\nidentifying open ports and service banners across critical systems. Tasked with\nreducing exposure to such reconnaissance efforts, Lily is instructed to apply\n\nmeasures that specifically hinder port scanning activity without disrupting\nlegitimate traffic.\n\nWhich of the following actions should Lily implement?", "options": {"A": "Block unwanted services running on the ports and update the service versions", "B": "Use a custom rule set to lock down the network, block unwanted ports at the firewall, and filter specific ports", "C": "Configure firewall and IDS rules to detect and block probes", "D": "Block inbound ICMP message types and all outbound ICMP type-3 unreachable messages"}, "answer": "D"}, {"num": 322, "text": "Michael, an ethical hacker at a San Francisco-based fintech startup, is\nconducting a security assessment of the company’s cloud-based payment\nprocessing platform, which uses Kubernetes, an open-source system for\nautomating the deployment, scaling, and management of containerized\napplications. During his review, Michael identifies a feature that automatically\nreplaces and reschedules containers from failed nodes to ensure high\navailability of services – a critical requirement for uninterrupted payment\noperations. Based on his study of cloud container technology principles, which\nKubernetes feature should Michael highlight as responsible for this capability?\n\nWhich Kubernetes feature should Michael highlight to ensure automatic\n\nrestarting of failed containers for the payment processing platform?", "options": {"A": "Container vulnerabilities", "B": "Kube-controller-manager", "C": "Container orchestration", "D": "Self-healing"}, "answer": "D"}, {"num": 323, "text": "In a recent cybersecurity incident, Google’s response team in the United States\ninvestigated a severe attack that briefly disrupted services and customer-facing\nplatforms for approximately 2-3 minutes. Server logs recorded a sudden surge\nin traffic, peaking at 398 million requests per second, which caused active\nconnections to drop unexpectedly. The attack was traced to numerous\ncompromised devices, likely orchestrated through malicious tools promoted on\nsocial media.\n\nBased on this information, what type of attack was most likely executed against\nGoogle’s infrastructure?", "options": {"A": "SYN Flood Attack", "B": "TCP SACK Panic Attack", "C": "RST Attack", "D": "HTTP GET/POST Attack"}, "answer": "D"}, {"num": 324, "text": "You are Michael Rivera, a cybersecurity consultant at FortiSec Solutions, hired\nto strengthen the wireless network of DesertTech Innovations, a startup in\nPhoenix, Arizona. After a recent penetration test revealed vulnerabilities, the IT\nmanager, Lisa Nguyen, asks you to recommend a defense mechanism to prevent\nunauthorized devices from connecting to the corporate Wi-Fi. You suggest a\nmethod that requires each connecting device to authenticate through a\ncentralized server using a unique username and password. Based on the\ndescribed approach, which wireless security countermeasure should DesertTech\nimplement?", "options": {"A": "Use 802.1X Authentication", "B": "Disable TKIP", "C": "MAC Address Filtering", "D": "Upgrade to WPA3"}, "answer": "A"}, {"num": 325, "text": "You are Ava Mitchell, an ethical hacker at Sentinel Cyberworks, hired to test the\nwireless defenses of Horizon Financial, a bank in Boston, Massachusetts. During\na covert nighttime assessment, your objective is to simulate an attacker\nattempting to breach the bank’s WPA-protected Wi-Fi network. You deploy a tool\nthat allows you to capture wireless packets, send de-authentication packets to\nforce client reconnections, and attempt to recover the encryption key, all within\na single graphical interface. Based on the described functionality, which Wi-Fi\nsecurity auditing tool are you using?", "options": {"A": "Fern WiFi Cracker", "B": "RFProtect", "C": "Cisco Adaptive Wireless IPS", "D": "WatchGuard Wi-Fi Cloud WIPS"}, "answer": "A"}, {"num": 326, "text": "In the heart of Silicon Valley, ethical hacker Sophia Nguyen is hired by InnoVate\nSolutions, a San Francisco-based startup, to secure their cloud-based task\nmanagement platform. On March 15, 2025, Sophia begins testing a feature that\nallows users to upload custom workflow templates to streamline project\nassignments. By carefully crafting a template file, she manipulates the\nplatform’s data processing, triggering unexpected behavior that grants her\n\nadministrative access to restricted project dashboards. The issue arises from\nthe platform’s handling of user-supplied data during object reconstruction, not\n\nfrom database queries, client-side code execution, or session manipulation.\n\nSophia documents her findings to help InnoVate’s developers strengthen their\n\napplication.\n\nWhich web application vulnerability is Sophia most likely exploiting in InnoVate\nSolutions’ task management platform?", "options": {"A": "Session Hijacking", "B": "Local File Inclusion", "C": "Verbose Error Messages", "D": "Insecure Deserialization"}, "answer": "D"}, {"num": 327, "text": "You are a security analyst at Sentinel IT Services, monitoring the web\napplication of GreenValley Credit Union in Portland, Oregon. During a log\nanalysis, you identify an SQL injection attempt on the customer login portal,\nwhere the attacker inputs a malicious string to manipulate the query logic. The\napplication mitigates this by replacing special characters with their escaped\nequivalents to prevent query manipulation before the query is executed,\nensuring the SQL statement remains unchanged.\n\nBased on the observed defense mechanism, which SQL injection\ncountermeasure is the application employing?", "options": {"A": "Perform user input validation", "B": "Encoding the single quote", "C": "Restrict database access", "D": "Use parameterized queries or prepared statements"}, "answer": "B"}, {"num": 328, "text": "You are Liam Chen, an ethical hacker at CyberGuard Analytics, hired to test the\nsocial engineering defenses of Coastal Trends, a retail chain in Los Angeles,\nCalifornia. During a covert assessment, you craft a deceptive message sent to\nemployees’ company phones, claiming a critical account update is needed and\ndirecting them to a link that installs monitoring software. Several employees\ninteract with the link, exposing a vulnerability to a specific mobile attack vector.\nBased on this approach, which mobile attack type are you simulating?", "options": {"A": "Bluebugging", "B": "SMS Phishing", "C": "Call Spoofing", "D": "OTP Hijacking"}, "answer": "B"}, {"num": 329, "text": "As part of an insider threat simulation at a multinational insurance firm, lead\nred teamer John is asked to assess whether internal directory services are\nexposing sensitive user data. Gaining limited VPN access, he begins probing\nport 389 on a staging environment connected to the main domain\ninfrastructure. After discovering that anonymous binds are accepted by the\ndirectory service, John launches a utility from his Kali machine that allows\ncommand-line interaction with directory entries. He structures his query to\nsearch for user objects with associated organizational units. Moments later,\nJohn reviews the output which includes usernames, group memberships, and\ndepart
